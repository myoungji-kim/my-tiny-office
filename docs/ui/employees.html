<title>Tiny Office · 직원</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"

<style>
  :root {
    color-scheme: light;

    --page: #edecee;
    --surface: #ffffff;
    --subtle: #f6f6f7;
    --sunk: #eeeef0;
    --line: #ebebed;
    --line-2: #e0e0e3;

    --ink: #1b1b1f;
    --solid: #17171c;
    --muted: #86868d;
    --faint: #b2b2b9;

    --brand: #5b5bd6;
    --brand-soft: #ecebfb;
    --ok: #2fae62;
    --ok-soft: #e4f6ec;
    --info: #3b82f6;
    --info-soft: #e8f0fe;
    --warn: #eaa221;
    --warn-soft: #fdf1dd;
    --bad: #e5484d;
    --bad-soft: #fdeaea;

    --r-ctl: 10px;
    --r-card: 12px;
    --r-app: 18px;

    --sans: "Noto Sans KR", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
  }

  body {
    margin: 0;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    background: var(--page);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
    padding: 22px 18px 40px;
  }
  * { box-sizing: border-box; }
  button { font: inherit; color: inherit; }

  .app {
    max-width: 1240px; margin: 0 auto;
    background: var(--surface);
    border-radius: var(--r-app);
    box-shadow: 0 1px 2px rgb(20 20 25 / .05), 0 12px 40px rgb(20 20 25 / .08);
    overflow: hidden;
    display: grid; grid-template-columns: 236px 1fr;
    min-height: 760px;
  }

  /* ═══ buttons ═══ */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    font: inherit; font-weight: 600; white-space: nowrap;
    border-radius: 999px; border: 1px solid transparent; cursor: pointer;
    transition: background .1s, border-color .1s;
  }
  .btn svg { width: 15px; height: 15px; flex: none; }
  .btn-lg { height: 42px; padding-inline: 22px; font-size: 14px; }
  .btn-md { height: 36px; padding-inline: 16px; font-size: 14px; }
  .btn-sm { height: 30px; padding-inline: 13px; font-size: 13px; }
  .btn-primary { background: var(--solid); color: #fff; }
  .btn-primary:hover { background: #2a2a31; }
  .btn-secondary { background: var(--surface); border-color: var(--line-2); color: var(--ink); }
  .btn-secondary:hover { background: var(--subtle); }
  .btn-ghost { background: none; color: var(--muted); }
  .btn-ghost:hover { background: var(--subtle); color: var(--ink); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:focus-visible, .ibtn:focus-visible, .row-item:focus-visible,
  .tab:focus-visible, .nav a:focus-visible, .tcard:focus-visible, .mem-add:focus-visible {
    outline: 2px solid var(--brand); outline-offset: 2px;
  }
  .ibtn {
    width: 32px; height: 32px; border-radius: 999px; border: none;
    background: var(--subtle); color: var(--muted);
    display: inline-grid; place-items: center; cursor: pointer;
  }
  .ibtn:hover { background: var(--sunk); color: var(--ink); }
  .ibtn svg { width: 15px; height: 15px; }

  /* ═══ sidebar ═══ */
  .side { background: var(--subtle); padding: 14px 12px; display: flex; flex-direction: column; }
  .side-top { display: flex; align-items: center; gap: 10px; padding: 2px 4px 14px; }
  .logo { width: 26px; height: 26px; border-radius: 7px; background: var(--ink); display: grid; place-items: center; flex: none; }
  .logo svg { width: 14px; height: 14px; color: #fff; }
  .side-name { display: block; font-size: 13px; font-weight: 700; letter-spacing: .03em; }
  .side-ver { display: block; font-size: 11px; color: var(--faint); }

  .nav { display: flex; flex-direction: column; gap: 1px; }
  .nav a {
    display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 10px;
    height: 34px; padding-inline: 8px; border-radius: var(--r-ctl);
    font-size: 14px; color: var(--muted); text-decoration: none;
  }
  .nav a:hover { background: var(--sunk); color: var(--ink); }
  .nav a[aria-current] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgb(20 20 25 / .06); }
  .nav svg { width: 17px; height: 17px; }
  .badge {
    min-width: 19px; height: 19px; padding-inline: 6px; border-radius: 999px;
    background: var(--bad); color: #fff; font-size: 11px; font-weight: 700;
    display: grid; place-items: center; font-variant-numeric: tabular-nums;
  }
  .rule { height: 1px; background: var(--line-2); margin: 14px 4px; }
  .ws-hd { display: flex; align-items: center; justify-content: space-between; padding: 0 8px; margin-bottom: 4px; }
  .ws-hd span { font-size: 13px; color: var(--muted); }
  .side-foot { margin-top: auto; padding-top: 12px; }

  /* ═══ main ═══ */
  .main { display: flex; flex-direction: column; min-width: 0; }
  .head { padding: 16px 22px 0; }
  .head-row { display: flex; align-items: flex-start; gap: 12px; }
  h1 { margin: 0; font-size: 23px; font-weight: 600; letter-spacing: -.01em; }
  .sub { display: block; font-size: 13px; color: var(--muted); margin-top: 1px; }
  .head-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }

  .tabs { display: flex; align-items: center; gap: 2px; margin-top: 14px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tab {
    display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
    height: 38px; padding-inline: 11px; border: none; background: none;
    font-size: 14px; color: var(--muted); cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
  .tab svg { width: 16px; height: 16px; }
  .tab .n { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }

  .body { padding: 16px 22px 24px; overflow: auto; flex: 1; }
  .view[hidden] { display: none; }

  /* ═══ status ═══ */
  .dot { width: 7px; height: 7px; border-radius: 999px; flex: none; }
  .dot.working { background: var(--warn); box-shadow: 0 0 0 1.5px #fff, 0 0 0 3px var(--warn); margin: 2px; }
  .dot.ready { background: transparent; border: 2px solid var(--info); }
  .dot.available { background: var(--ok); }
  .dot.vacation { background: var(--faint); border-radius: 1px; height: 3px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; flex: none;
    border-radius: 999px; padding: 2px 9px; font-size: 11.5px; font-weight: 600;
  }
  .chip.working { background: var(--warn-soft); color: #8a5c10; }
  .chip.ready { background: var(--info-soft); color: #2557b5; }
  .chip.available { background: var(--ok-soft); color: #1f7a48; }
  .chip.vacation { background: var(--sunk); color: var(--muted); }

  /* ═══ master / detail ═══ */
  .split { display: grid; grid-template-columns: minmax(0, 1fr) 402px; gap: 16px; align-items: start; }
  @media (max-width: 1160px) { .split { grid-template-columns: 1fr; } }

  .list { border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; }
  .row-item {
    display: grid; grid-template-columns: 40px minmax(0, 1.5fr) minmax(0, 1.1fr) minmax(0, auto) auto;
    align-items: center; gap: 12px; width: 100%;
    padding: 11px 14px; border: none; background: none; text-align: left; cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .row-item:last-child { border-bottom: none; }
  .row-item:hover { background: var(--subtle); }
  .row-item[aria-selected="true"] { background: var(--brand-soft); }
  .r-av { position: relative; width: 40px; height: 40px; border-radius: 11px; background: var(--subtle); display: grid; place-items: center; }
  .r-live { position: absolute; right: -3px; bottom: -3px; width: 13px; height: 13px; border-radius: 999px; border: 3px solid var(--surface); }
  .row-item[aria-selected="true"] .r-live { border-color: var(--brand-soft); }
  .r-name { display: block; font-size: 14.5px; font-weight: 600; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r-role { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r-dept { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r-mem { font-size: 12.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .r-mem b { color: var(--ink); font-weight: 600; }

  .area-chip {
    font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 2px 8px;
    background: var(--brand-soft); color: #4342a6; white-space: nowrap;
  }
  .areas { display: flex; gap: 4px; flex-wrap: wrap; }
  .row-item[aria-selected="true"] .area-chip { background: var(--surface); }

  /* ═══ detail ═══ */
  .detail { border: 1px solid var(--line); border-radius: var(--r-card); }
  .d-hd { display: flex; align-items: center; gap: 12px; padding: 16px 16px 14px; border-bottom: 1px solid var(--line); }
  .d-av { position: relative; width: 52px; height: 52px; border-radius: 14px; background: var(--subtle); display: grid; place-items: center; flex: none; }
  .d-name { display: block; font-size: 17px; font-weight: 600; line-height: 1.3; }
  .d-role { display: block; font-size: 13px; color: var(--muted); line-height: 1.35; }
  .d-sec { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .d-sec:last-child { border-bottom: none; }
  .k { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--faint); margin-bottom: 8px; }
  .k .kn { color: var(--ink); font-variant-numeric: tabular-nums; }
  .kv { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 3px 0; }
  .kv span:first-child { color: var(--muted); flex: none; }
  .kv b { font-weight: 600; text-align: right; }

  /* ═══ memory ═══ */
  .mem-group { margin-bottom: 12px; }
  .mem-group:last-of-type { margin-bottom: 0; }
  .mem-hd { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
  .mem-line { flex: 1; height: 1px; background: var(--line); }
  .mem {
    border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; margin-bottom: 6px;
    background: var(--surface);
  }
  .mem:last-child { margin-bottom: 0; }
  .mem-t { display: block; font-size: 13px; line-height: 1.5; }
  .mem-m { display: flex; align-items: center; gap: 6px; margin-top: 5px; font-size: 11.5px; color: var(--faint); }
  .mem-m svg { width: 12px; height: 12px; flex: none; }
  .mem-m .src { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mem-m .used { margin-left: auto; flex: none; font-variant-numeric: tabular-nums; }
  .mem-m .used.hot { color: #1f7a48; font-weight: 600; }
  .mem-m .used.cold { color: #a8322f; font-weight: 600; }
  .mem-add {
    width: 100%; margin-top: 10px; border: 1px dashed var(--line-2); background: var(--subtle);
    border-radius: 10px; padding: 9px; font-size: 12.5px; color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .mem-add:hover { border-color: var(--muted); color: var(--ink); background: var(--surface); }
  .mem-add svg { width: 14px; height: 14px; }

  .style-line {
    display: flex; align-items: flex-start; gap: 8px; font-size: 13px;
    padding: 6px 0; border-bottom: 1px solid var(--line);
  }
  .style-line:last-of-type { border-bottom: none; }
  .style-line svg { width: 14px; height: 14px; flex: none; margin-top: 5px; color: var(--faint); }

  .d-acts { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .d-acts .btn { width: 100%; }

  /* ═══ org chart ═══ */
  .org { display: flex; flex-direction: column; gap: 18px; }
  .dept { border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; }
  .dept-hd { display: flex; align-items: center; gap: 9px; padding: 12px 15px; background: var(--subtle); border-bottom: 1px solid var(--line); }
  .dept-hd h2 { margin: 0; font-size: 14.5px; font-weight: 600; }
  .cnt { font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-variant-numeric: tabular-nums; }
  .teams { padding: 14px 15px; display: flex; flex-direction: column; gap: 14px; }
  .team-hd { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
  .team-hd h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); }
  .team-line { flex: 1; height: 1px; background: var(--line); }
  .tgrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(206px, 1fr)); }
  .tcard {
    display: flex; align-items: center; gap: 10px; text-align: left;
    border: 1px solid var(--line); border-radius: var(--r-card); padding: 10px 12px;
    background: var(--surface); cursor: pointer; width: 100%;
  }
  .tcard:hover { border-color: var(--line-2); box-shadow: 0 2px 8px rgb(20 20 25 / .06); }
  .t-av { position: relative; width: 36px; height: 36px; border-radius: 10px; background: var(--subtle); display: grid; place-items: center; flex: none; }
  .t-name { display: block; font-size: 13.5px; font-weight: 600; line-height: 1.35; }
  .t-role { display: block; font-size: 12px; color: var(--muted); line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vacant {
    display: grid; place-items: center; align-content: center; gap: 7px; min-height: 60px;
    border: 1px dashed var(--line-2); border-radius: var(--r-card); background: var(--subtle);
    color: var(--faint); font-size: 12.5px; cursor: pointer;
  }
  .vacant svg { width: 16px; height: 16px; }
  .vacant:hover { border-color: var(--muted); color: var(--muted); background: var(--surface); }

  /* ═══ notice ═══ */
  .notice {
    display: flex; align-items: flex-start; gap: 11px;
    background: var(--surface); border: 1px solid var(--line-2);
    border-radius: var(--r-card); padding: 13px 14px;
  }
  .n-ic {
    width: 22px; height: 22px; border-radius: 999px; flex: none; margin-top: 1px;
    display: grid; place-items: center; background: var(--sunk); color: var(--muted);
  }
  .n-ic svg { width: 13px; height: 13px; }
  .n-tx { min-width: 0; flex: 1; }
  .n-tx b { display: block; font-size: 13.5px; font-weight: 600; line-height: 1.45; }
  .n-tx span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .n-acts { margin-left: auto; display: flex; gap: 7px; flex: none; padding-top: 1px; }
  .notice-warn { border-color: #f0d8a8; }
  .notice-warn .n-ic { background: var(--warn-soft); color: #8a5c10; }
  .notice-bad { border-color: #f4c2c3; }
  .notice-bad .n-ic { background: var(--bad-soft); color: #a8322f; }

  /* ═══ memory tab ═══ */
  .mem-cols { display: grid; grid-template-columns: minmax(0, 1fr) 402px; gap: 16px; align-items: start; }
  @media (max-width: 1160px) { .mem-cols { grid-template-columns: 1fr; } }
  .panel { border: 1px solid var(--line); border-radius: var(--r-card); }
  .panel-hd { padding: 12px 15px; border-bottom: 1px solid var(--line); }
  .panel-hd h2 { margin: 0; font-size: 14.5px; font-weight: 600; }
  .panel-hd p { margin: 1px 0 0; font-size: 12.5px; color: var(--muted); }
  .panel-bd { padding: 13px 15px; }

  .feed-row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .feed-row:last-child { border-bottom: none; }
  .f-av { width: 28px; height: 28px; border-radius: 8px; background: var(--subtle); display: grid; place-items: center; flex: none; }
  .f-tx { min-width: 0; flex: 1; font-size: 13px; line-height: 1.5; }
  .f-tx q { font-style: normal; background: var(--brand-soft); color: #4342a6; border-radius: 5px; padding: 1px 5px; }
  .f-tx q::before, .f-tx q::after { content: ""; }
  .f-meta { display: block; font-size: 11.5px; color: var(--faint); margin-top: 1px; }
  .f-time { font-size: 11.5px; color: var(--faint); flex: none; white-space: nowrap; padding-top: 2px; }

  .stack { display: flex; flex-direction: column; gap: 10px; }
</style>

    <div class="body">

  function paint(ctx, rows, scale, ox, oy, extra) {
    const pal = extra ? { ...P, ...extra } : P;
    for (let y = 0; y < rows.length; y++) {
      const row = rows[y];
      let x = 0;
      while (x < row.length) {
        const ch = row[x];
        let run = 1;
        while (x + run < row.length && row[x + run] === ch) run++;
        const color = pal[ch];
        if (color) { ctx.fillStyle = color; ctx.fillRect(ox + x * scale, oy + y * scale, run * scale, scale); }
        x += run;
      }
    }
  }

    const sp = SPECIES.get(species);
    const scale = Math.max(1, Math.floor(px / 16));
    const pad = Math.floor((px - 16 * scale) / 2);
    paint(g, sp.sprite, scale, pad, pad, skin(sp));
    return el;
  }

      task: "로그인 폼 구현", done: 33, reviews: 9,
      style: ["완성 전에 스크린샷을 남겨"],
      memories: [
        { area: "로컬라이제이션", text: "한글에는 letter-spacing을 걸지 않아요. 자소가 벌어져 보여요.", from: "사이드바 자간이 깨진 이슈", used: 18 },
        { area: "로컬라이제이션", text: "같은 문장도 영문이 한글보다 길어요. 고정 너비를 쓰지 않아요.", from: "PR #4180", used: 6 },
        { area: "프로세스", text: "버튼은 항상 pill이에요. 8px 모서리를 쓰지 않아요.", from: null, used: 12 },
      ] },
    { id: "p3", name: "단풍", species: "deer", role: "Product Manager",
      dept: "프로덕트", team: "기획팀", status: "ready", joined: "2026. 2. 20.",
      task: "API 문서 작성", done: 27, reviews: 22,
      style: ["막히면 30분 안에 물어봐"],
      memories: [
        { area: "기획", text: "업무는 30분 이내로 쪼개요. 넘으면 사실 두 개예요.", from: null, used: 15 },
        { area: "기획", text: "PR 설명에는 무엇을 했는지가 아니라 왜 했는지를 적어요.", from: null, used: 8 },
        { area: "프로세스", text: "금요일 오후에는 배포하지 않아요.", from: "금요일 배포가 말썽이던 주", used: 3 },
      ] },
    { id: "p4", name: "삐약", species: "chick", role: "DBA",
      dept: "개발본부", team: "백엔드팀", status: "available", joined: "2026. 5. 8.",
      last: "인덱스 튜닝 완료", done: 19, reviews: 6,
      style: ["마이그레이션은 두 번 확인해"],
      memories: [
        { area: "데이터베이스", text: "마이그레이션은 항상 되돌릴 수 있게 써요.", from: "스키마 롤백이 안 된 사고", used: 11 },
        { area: "데이터베이스", text: "시각은 epoch ms INTEGER로 저장해요. 문자열 날짜를 쓰지 않아요.", from: null, used: 5 },
        { area: "보안", text: "쿼리에 사용자 입력을 문자열로 이어 붙이지 않아요.", from: null, used: 0 },
      ] },
    { id: "p5", name: "완두", species: "frog", role: "DevOps Engineer",
      dept: "개발본부", team: "프론트엔드팀", status: "vacation", joined: "2026. 1. 12.",
      back: "3일 후 복귀", done: 52, reviews: 14,
      style: ["두 번 할 일이면 자동화해"],
      memories: [
        { area: "보안", text: "비밀값은 .env에 두고 절대 커밋하지 않아요.", from: null, used: 9 },
        { area: "프로세스", text: "배포 전에 typecheck · lint · test 세 개를 모두 돌려요.", from: "배포가 한 번 깨진 날", used: 21 },
      ] },
  ];

  const companyMemories = [
    { text: "커밋 메시지는 conventional prefix로 시작해요.", from: null, used: 34 },
    { text: "사용자에게 보이는 글은 i18n을 거쳐요. 플레이어가 입력한 이름은 예외예요.", from: null, used: 28 },
    { text: "문서와 코드가 어긋나면 코드가 아니라 문서를 고쳐요.", from: "스타일 가이드가 낡았던 주", used: 12 },
  ];

  const feed = [
    { who: "p1", mem: "도메인 레이어에서 Date.now()를 쓰지 않아요", on: "결제 API 에러 응답 구조 변경", when: "12분 전" },
    { who: "p2", mem: "한글에는 letter-spacing을 걸지 않아요", on: "로그인 폼 구현", when: "34분 전" },
    { who: "p1", mem: "복합 인덱스는 컬럼 순서가 중요해요", on: "결제 API 에러 응답 구조 변경", when: "1시간 전" },
    { who: "p5", mem: "배포 전에 세 개를 모두 돌려요", on: "배포 파이프라인 정리", when: "2시간 전" },
    { who: "p3", mem: "PR 설명에는 왜 했는지를 적어요", on: "API 문서 작성", when: "어제" },
  ];

  const ICON = {
    plus: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg>',
    alert: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.2l6 11H2z"/><path d="M8 6.6v3M8 11.4v.1"/></svg>',
    x: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>',
    task: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="2.6" y="2.6" width="10.8" height="10.8" rx="1.6"/><path d="M5.4 8.2l1.8 1.8 3.4-3.6"/></svg>',
    hand: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3.5 4.5h9M3.5 8h9M3.5 11.5h5"/></svg>',
  };

  const hasBatchim = (word) => {
    const c = word.charCodeAt(word.length - 1);
    return c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 !== 0;
  };
  const josa = (word, withFinal, withoutFinal) => (hasBatchim(word) ? withFinal : withoutFinal);

  const areasOf = (p) => [...new Set(p.memories.map((m) => m.area))];
  const reviewAreasOf = (p) => areasOf(p).filter((a) => REVIEW_AREAS.includes(a));
  const usedOf = (p) => p.memories.reduce((n, m) => n + m.used, 0);

  /* ── sidebar roster ──────────────────────────────────────────── */
  const members = document.getElementById("members");
  for (const p of people) {
    const b = document.createElement("button");
    b.className = "row-item";
    b.type = "button";
    b.style.cssText = "grid-template-columns:22px 1fr auto;padding:5px 8px;border-bottom:none;border-radius:8px;gap:9px";
    b.innerHTML = `<span style="width:22px;height:22px;border-radius:6px;overflow:hidden;background:var(--sunk);display:grid;place-items:center"></span>
      <span style="font-size:13px">${p.name}</span><span class="dot ${p.status}"></span>`;
    b.firstElementChild.appendChild(avatar(p.species, 22));
    b.addEventListener("click", () => { show("list"); select(p.id); });
    members.appendChild(b);
  }

  /* ── header ──────────────────────────────────────────────────── */
  const totalMem = people.reduce((n, p) => n + p.memories.length, 0) + companyMemories.length;
  document.getElementById("nList").textContent = people.length;
  document.getElementById("nMem").textContent = totalMem;
  document.getElementById("headSub").textContent =
    `${people.length}명 · 개발본부 ${people.filter((p) => p.dept === "개발본부").length} · 프로덕트 ${people.filter((p) => p.dept === "프로덕트").length}`;

  /* ── roster ──────────────────────────────────────────────────── */
  const roster = document.getElementById("roster");
  for (const p of people) {
    const areas = reviewAreasOf(p);
    const b = document.createElement("button");
    b.className = "row-item";
    b.type = "button";
    b.dataset.id = p.id;
    b.innerHTML = `
      <span class="r-av"><span class="r-live" style="background:${STATUS[p.status].color}"></span></span>
      <span><span class="r-name">${p.name}</span><span class="r-role">${p.role}</span></span>
      <span class="r-dept">${p.dept} · ${p.team}</span>
      <span class="areas">${areas.map((a) => `<span class="area-chip">${a}</span>`).join("")}</span>
      <span class="r-mem"><b>${p.memories.length}</b>개 기억</span>`;
    b.querySelector(".r-av").prepend(avatar(p.species, 40));
    b.addEventListener("click", () => select(p.id));
    roster.appendChild(b);
  }

  /* ── detail ──────────────────────────────────────────────────── */
  const detail = document.getElementById("detail");

  const memCard = (m) => {
    const cls = m.used === 0 ? "cold" : m.used >= 10 ? "hot" : "";
    return `<div class="mem">
      <span class="mem-t">${m.text}</span>
      <span class="mem-m">
        ${m.from ? ICON.task : ICON.hand}
        <span class="src">${m.from ? m.from + "에서" : "직접 알려줌"}</span>
        <span class="used ${cls}">${m.used === 0 ? "아직 안 쓰임" : m.used + "회 참조"}</span>
      </span>
    </div>`;
  };

  function select(id) {
    const p = people.find((x) => x.id === id);
    if (!p) return;
    roster.querySelectorAll("[data-id]").forEach((n) => n.setAttribute("aria-selected", String(n.dataset.id === id)));

    const grouped = areasOf(p)
      .map((a) => {
        const list = p.memories.filter((m) => m.area === a);
        const seat = REVIEW_AREAS.includes(a);
        const style = seat ? "" : ' style="background:var(--subtle);color:var(--muted)"';
        return `<div class="mem-group">
          <div class="mem-hd">
            <span class="area-chip"${style}>${a}</span>
            <span class="mem-line"></span>
            <span style="font-size:11.5px;color:var(--faint)">${list.length}</span>
          </div>
          ${list.map(memCard).join("")}
        </div>`;
      })
      .join("");

    const now = p.task
      ? `<div class="kv"><span>현재 업무</span><b>${p.task}</b></div>`
      : p.back
      ? `<div class="kv"><span>휴가</span><b>${p.back}</b></div>`
      : `<div class="kv"><span>최근 완료</span><b>${p.last}</b></div>`;

    const seats = reviewAreasOf(p);

    detail.innerHTML = `
      <div class="d-hd">
        <span class="d-av"></span>
        <span style="flex:1;min-width:0">
          <span class="d-name">${p.name}</span>
          <span class="d-role">${p.role} · ${p.team}</span>
        </span>
        <span class="chip ${p.status}"><span class="dot ${p.status}"></span>${STATUS[p.status].label}</span>
      </div>

      <div class="d-sec">
        ${now}
        <div class="kv"><span>입사</span><b>${p.joined}</b></div>
        <div class="kv"><span>완료한 업무 · 리뷰</span><b>${p.done}건 · ${p.reviews}건</b></div>
        <div class="kv"><span>기억이 쓰인 횟수</span><b>${usedOf(p)}회</b></div>
      </div>

      <div class="d-sec">
        <span class="k">리뷰할 수 있는 분야</span>
        ${
          seats.length
            ? `<span class="areas">${seats
                .map((a) => `<span class="area-chip">${a} ${p.memories.filter((m) => m.area === a).length}</span>`)
                .join("")}</span>
               <p style="margin:8px 0 0;font-size:12px;color:var(--muted)">이 분야 기억이 있어서 PR 리뷰어로 지정할 수 있어요.</p>`
            : `<p style="margin:0;font-size:12.5px;color:var(--muted)">아직 리뷰 분야가 없어요. 무엇이든 알려주면 그 분야를 맡을 수 있어요.</p>`
        }
      </div>

      <div class="d-sec">
        <span class="k">기억 <span class="kn">${p.memories.length}</span></span>
        ${grouped}
        <button class="mem-add" type="button">${ICON.plus}이 직원에게 알려주기</button>
      </div>

      <div class="d-sec">
        <span class="k">일하는 방식</span>
        ${p.style.map((s) => `<div class="style-line">${ICON.hand}<span>${s}</span></div>`).join("")}
        <button class="mem-add" type="button">${ICON.plus}방식 하나 더 정하기</button>
      </div>

      <div class="d-acts">
        <button class="btn btn-secondary btn-md">업무 할당</button>
      </div>`;
    detail.querySelector(".d-av").prepend(avatar(p.species, 52));
  }

  /* ── org chart ───────────────────────────────────────────────── */
  const org = document.getElementById("org");
  const DEPTS = [
    { name: "개발본부", teams: ["백엔드팀", "프론트엔드팀"] },
    { name: "프로덕트", teams: ["기획팀", "디자인팀"] },
  ];
  for (const d of DEPTS) {
    const inDept = people.filter((p) => p.dept === d.name);
    const box = document.createElement("div");
    box.className = "dept";
    box.innerHTML = `<div class="dept-hd"><h2>${d.name}</h2><span class="cnt">${inDept.length}</span></div>`;
    const teams = document.createElement("div");
    teams.className = "teams";
    for (const t of d.teams) {
      const inTeam = inDept.filter((p) => p.team === t);
      const wrap = document.createElement("div");
      wrap.innerHTML = `<div class="team-hd"><h3>${t}</h3><span class="cnt">${inTeam.length}</span><span class="team-line"></span></div>`;
      const grid = document.createElement("div");
      grid.className = "tgrid";
      for (const p of inTeam) {
        const c = document.createElement("button");
        c.className = "tcard";
        c.type = "button";
        c.innerHTML = `<span class="t-av"><span class="r-live" style="background:${STATUS[p.status].color}"></span></span>
          <span style="min-width:0"><span class="t-name">${p.name}</span><span class="t-role">${p.role} · 기억 ${p.memories.length}</span></span>`;
        c.querySelector(".t-av").prepend(avatar(p.species, 36));
        c.addEventListener("click", () => { show("list"); select(p.id); });
        grid.appendChild(c);
      }
      if (!inTeam.length) {
        const v = document.createElement("button");
        v.className = "vacant";
        v.type = "button";
        v.innerHTML = `${ICON.plus}<span>아직 아무도 없어요</span>`;
        grid.appendChild(v);
      }
      wrap.appendChild(grid);
      teams.appendChild(wrap);
    }
    box.appendChild(teams);
    org.appendChild(box);
  }

  /* ── memory tab ──────────────────────────────────────────────── */
  const notices = document.getElementById("memNotices");

  // A review seat nobody can take, and memory nobody ever used, are the two
  // things this screen knows that the player cannot see anywhere else.
  const uncovered = REVIEW_AREAS.filter((a) => !people.some((p) => areasOf(p).includes(a)));
  if (uncovered.length) {
    const n = document.createElement("div");
    n.className = "notice notice-warn";
    n.innerHTML = `
      <span class="n-ic">${ICON.alert}</span>
      <span class="n-tx">
        <b>${uncovered.join(" · ")}${josa(uncovered.at(-1), "을", "를")} 아는 직원이 없어요</b>
        <span>이 분야 PR이 올라오면 리뷰어를 지정할 수 없어요. 누구에게든 한 줄 알려주면 그 사람이 맡을 수 있어요.</span>
      </span>
      <span class="n-acts"><button class="btn btn-secondary btn-sm" type="button">알려줄 직원 고르기</button></span>`;
    notices.appendChild(n);
  }

  const cold = people.flatMap((p) => p.memories.filter((m) => m.used === 0).map((m) => ({ p, m })));
  if (cold.length) {
    const n = document.createElement("div");
    n.className = "notice notice-bad";
    n.innerHTML = `
      <span class="n-ic">${ICON.x}</span>
      <span class="n-tx">
        <b>한 번도 쓰이지 않은 기억이 ${cold.length}개 있어요</b>
        <span>${cold[0].p.name}의 “${cold[0].m.text}” — 이 분야 업무가 아직 없었거나, 이 직원에게는 필요 없는 기억일 수 있어요.</span>
      </span>
      <span class="n-acts"><button class="btn btn-secondary btn-sm" type="button">확인하기</button></span>`;
    notices.appendChild(n);
  }

  const feedBox = document.getElementById("feed");
  for (const f of feed) {
    const p = people.find((x) => x.id === f.who);
    const el = document.createElement("div");
    el.className = "feed-row";
    el.innerHTML = `
      <span class="f-av"></span>
      <span class="f-tx">${p.name}${josa(p.name, "이", "가")} <q>${f.mem}</q>${josa(f.mem, "을", "를")} 참고했어요<span class="f-meta">${f.on}</span></span>
      <span class="f-time">${f.when}</span>`;
    el.querySelector(".f-av").appendChild(avatar(p.species, 28));
    feedBox.appendChild(el);
  }

  document.getElementById("companyMem").innerHTML =
    companyMemories.map(memCard).join("") +
    `<button class="mem-add" type="button">${ICON.plus}회사 전체에 알려주기</button>`;

  /* ── tabs ────────────────────────────────────────────────────── */
  function show(view) {
    for (const t of document.querySelectorAll(".tab")) {
      t.setAttribute("aria-selected", String(t.dataset.view === view));
    }
    for (const v of document.querySelectorAll(".view")) {
      v.toggleAttribute("hidden", v.id !== "view-" + view);
    }
  }
  document.getElementById("tabs").addEventListener("click", (e) => {
    const t = e.target.closest(".tab");
    if (t) show(t.dataset.view);
  });

  select("p1");
</script>
