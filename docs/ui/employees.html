<style>
  /* ═══ list ═══ */

  #roster .row-item { grid-template-columns: 40px minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1.6fr) 84px; }

  .r-av { position: relative; width: 40px; height: 40px; border-radius: 11px; background: var(--subtle); display: grid; place-items: center; }

  .r-live { position: absolute; right: -3px; bottom: -3px; width: 13px; height: 13px; border-radius: 999px; border: 3px solid var(--surface); }

  .r-name { display: block; font-size: 16px; font-weight: 600; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .r-role { display: block; font-size: 15px; color: var(--muted); line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .r-team { font-size: 15px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .r-mem { font-size: 15px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }

  .r-mem b { color: var(--ink); font-weight: 600; }

  .areas { display: flex; gap: 4px; flex-wrap: wrap; }

  /* ═══ person ═══ */


  .person-hd { align-items: center; }

  .person-name { display: flex; align-items: center; gap: 10px; }

  .now-lost { margin-top: 12px; }

  .d-av { position: relative; width: 56px; height: 56px; border-radius: 14px; background: var(--subtle); display: grid; place-items: center; flex: none; }

  .p-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }

  @media (max-width: 1160px) { .p-grid { grid-template-columns: 1fr; } }

  .p-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

  .now-task { display: block; font-size: 18px; font-weight: 600; line-height: 1.4; margin-top: 8px; }

  .now-note { display: block; font-size: 15px; color: var(--muted); margin-top: 2px; }

  .panel-hd.with-link { display: flex; align-items: baseline; gap: 10px; }

  .panel-hd .link { margin-left: auto; font-size: 15px; color: var(--muted); background: none; border: none; padding: 0; cursor: pointer; }

  .panel-hd .link:hover { color: var(--ink); }

  .why { margin: 8px 0 0; font-size: 15px; color: var(--muted); }

  /* ═══ a person's memory ═══ */

  .mem-layout { display: grid; grid-template-columns: 212px minmax(0, 1fr); gap: 16px; align-items: start; }

  @media (max-width: 900px) { .mem-layout { grid-template-columns: 1fr; } }

  .rail { display: flex; flex-direction: column; gap: 2px; border: 1px solid var(--line); border-radius: var(--r-card); padding: 6px; }

  .rail-item {
    display: flex; align-items: center; gap: 8px; height: 36px; padding-inline: 10px;
    border: none; border-radius: 8px; background: none; font: inherit; font-size: 15px; color: var(--muted);
    text-align: left; cursor: pointer;
  }

  .rail-item:hover { background: var(--subtle); color: var(--ink); }

  .rail-item[aria-current="true"] { background: var(--brand-soft); color: var(--brand-ink); font-weight: 600; }

  .rail-item .n { margin-left: auto; font-size: 14px; color: var(--faint); font-variant-numeric: tabular-nums; }

  .rail-item[aria-current="true"] .n { color: var(--brand-ink); }

  .empty-line { margin: 0; font-size: 15px; color: var(--faint); padding: 6px 0; }

  .style-form { display: flex; gap: 8px; margin-top: 10px; }

  /* ═══ memory ═══ */

  .mem-group { margin-bottom: 12px; }

  .mem-group:last-of-type { margin-bottom: 0; }

  .mem-hd { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }

  .mem-line { flex: 1; height: 1px; background: var(--line); }

  .style-line {
    display: flex; align-items: flex-start; gap: 8px; font-size: 15px;
    padding: 6px 0; border-bottom: 1px solid var(--line);
  }

  .style-line:last-of-type { border-bottom: none; }

  .style-line svg { width: 14px; height: 14px; flex: none; margin-top: 5px; color: var(--faint); }

  .style-line span { flex: 1; min-width: 0; }

  .style-line .line-menu { margin: -3px 0 -3px auto; opacity: 0; }

  .style-line .line-menu svg { margin: 0; color: currentColor; }

  .style-line:hover .line-menu, .line-menu:focus-visible, .line-menu[aria-expanded="true"] { opacity: 1; }

  .style-form.in-place { margin: 4px 0; }

  /* ═══ org chart ═══ */

  .org { display: flex; flex-direction: column; gap: 18px; }

  .team-box { border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; }

  .team-box-hd { display: flex; align-items: center; gap: 9px; min-height: 50px; padding: 8px 10px 8px 15px; background: var(--subtle); border-bottom: 1px solid var(--line); }

  .team-box-hd h2 { margin: 0; font-size: 18px; font-weight: 600; }

  .team-box-hd h2.muted { color: var(--muted); }

  .team-box-hd .ibtn { margin-left: auto; }

  .team-bd { padding: 14px 15px; }

  .team-form { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; flex: 1; }

  .team-form .input { flex: 1 1 200px; }

  .team-form .hint { flex-basis: 100%; margin: 0; color: var(--bad-ink); }

  .cnt { font-size: 14px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-variant-numeric: tabular-nums; }

  .tgrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); }

  .tcard {
    display: flex; align-items: center; gap: 10px; text-align: left;
    border: 1px solid var(--line); border-radius: var(--r-card); padding: 10px 12px;
    background: var(--surface); cursor: pointer; width: 100%;
  }

  .tcard:hover { border-color: var(--line-2); box-shadow: 0 2px 8px rgb(20 20 25 / .06); }

  .tcard-wrap { position: relative; }

  .tcard-wrap .tcard { padding-right: 40px; }

  .tcard-wrap .ibtn-sm { position: absolute; top: 50%; right: 8px; margin-top: -14px; opacity: 0; }

  .tcard-wrap:hover .ibtn-sm, .tcard-wrap .ibtn-sm:focus-visible, .tcard-wrap .ibtn-sm[aria-expanded="true"] { opacity: 1; }

  .t-av { position: relative; width: 36px; height: 36px; border-radius: 10px; background: var(--subtle); display: grid; place-items: center; flex: none; }

  .t-name { display: block; font-size: 16px; font-weight: 600; line-height: 1.35; }

  .t-role { display: block; font-size: 14px; color: var(--muted); line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .vacant {
    display: grid; place-items: center; align-content: center; gap: 7px; min-height: 60px;
    border: 1px dashed var(--line-2); border-radius: var(--r-card); background: var(--subtle);
    color: var(--faint); font-size: 15px; cursor: pointer;
  }

  .vacant svg { width: 16px; height: 16px; }

  .vacant:hover { border-color: var(--muted); color: var(--muted); background: var(--surface); }

  /* ═══ memory tab ═══ */

  .feed-row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }

  .feed-row:last-child { border-bottom: none; }

  .f-av { width: 28px; height: 28px; border-radius: 8px; background: var(--subtle); display: grid; place-items: center; flex: none; }

  .f-tx { min-width: 0; flex: 1; font-size: 15px; line-height: 1.5; }

  .f-tx q { font-style: normal; background: var(--brand-soft); color: var(--brand-ink); border-radius: 5px; padding: 1px 5px; }

  .f-tx q::before, .f-tx q::after { content: ""; }

  .f-meta { display: block; font-size: 14px; color: var(--faint); margin-top: 1px; }

  .f-time { font-size: 14px; color: var(--faint); flex: none; white-space: nowrap; padding-top: 2px; }

  .stack { display: flex; flex-direction: column; gap: 10px; }

  /* ═══ memory scaling ═══ */

  .mem.cold-mem { border-color: var(--bad-line); background: var(--bad-wash); }


</style>

  const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "ko";
  const t = () => TEXT[lang];
  const dig = (o, k) => k.split(".").reduce((a, x) => a?.[x], o);
  const applyStatic = () => {
    for (const el of document.querySelectorAll("[data-t]")) {
      const v = dig(t(), el.dataset.t);
      if (typeof v === "string") el.textContent = v;
    }
    for (const el of document.querySelectorAll("[data-a]")) {
      const v = dig(t(), el.dataset.a);
      if (typeof v === "string") el.setAttribute("aria-label", v);

  };
  applyStatic();

  /* ── data ────────────────────────────────────────────────────── */

  const teamOf = (key) => TEAMS.find((x) => x.key === key);
  const teamLabel = (x) => x.label ?? t().teams[x.key];
  const teamName = (key) => (teamOf(key) ? teamLabel(teamOf(key)) : "");
  const roleLine = (p) => p.role + (teamName(p.team) ? " · " + teamName(p.team) : "");

  const backlog = [

  const people = STAFF;

  // The board's projects that take new work: active and planned ones.
  const PROJECTS = [
    { id: "pay", name: { ko: "결제 개편", en: "Payments rework" } },
    { id: "order", name: { ko: "주문 v2", en: "Orders v2" } },
    { id: "settle", name: { ko: "정산 리포트", en: "Settlement reports" } },

  // What was drawn on today, on the work the board shows.
  const feed = [
    { who: "p2", mem: { ko: "한글에는 letter-spacing을 걸지 않아요", en: "Never track Hangul" }, on: { ko: "주문 상태 타입 좁히기", en: "Narrow the order status type" }, when: { ko: "5분 전", en: "5 min ago" } },
    { who: "p1", mem: { ko: "도메인 레이어에서 Date.now()를 쓰지 않아요", en: "No Date.now() in the domain layer" }, on: { ko: "결제 내역 페이지네이션", en: "Paginate the payment history" }, when: { ko: "15분 전", en: "15 min ago" } },
    { who: "p1", mem: { ko: "복합 인덱스는 컬럼 순서가 중요해요", en: "Composite indexes care about column order" }, on: { ko: "결제 내역 페이지네이션", en: "Paginate the payment history" }, when: { ko: "20분 전", en: "20 min ago" } },
    { who: "p3", mem: { ko: "PR 설명에는 왜 했는지를 적어요", en: "A PR description says why" }, on: { ko: "결제 웹훅 서명 검증", en: "Verify the payment webhook signature" }, when: { ko: "30분 전", en: "30 min ago" } },

  ];

  const ICON = {
    plus: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg>',

  // Prose lives beside the data it belongs to, which keeps a memory and its
  // translation from drifting apart.
  const tx = (v) => (v && typeof v === "object" ? v[lang] : v);

  // In the company's order, so an area does not jump to the top when first taught.
  const areasOf = (p) => AREA_KEYS.filter((a) => p.memories.some((m) => m.area === a));
  const usedOf = (p) => p.memories.reduce((n, m) => n + m.used, 0);
  const charsOf = (p) => p.memories.reduce((n, m) => n + tx(m.text).length, 0);

  /* ── sidebar roster ──────────────────────────────────────────── */

  function renderMembers() {
    members.replaceChildren();
    mountRoster(members, (p) => { location.hash = p.id; });
  }

  /* ── header ──────────────────────────────────────────────────── */
  function renderCounts() {
    document.getElementById("nList").textContent = people.length;
    document.getElementById("nMem").textContent = people.reduce((n, p) => n + p.memories.length, 0);

  /* ── roster ──────────────────────────────────────────────────── */
  const roster = document.getElementById("roster");
  function renderRoster() {
    roster.replaceChildren();
    if (people.length === 0) roster.innerHTML = `<p class="empty-line">${t().noPeople}</p>`;
    for (const p of people) {
      const areas = areasOf(p);
      const b = document.createElement("a");
      b.className = "row-item";
      b.href = "#" + p.id;
      b.innerHTML = `
        <span class="r-av"><span class="r-live" style="background:${STATUS[p.status].color}"></span>${p.agentLost ? agentMark() : ""}</span>
        <span><span class="r-name">${p.name}</span><span class="r-role">${p.role}</span></span>
        <span class="r-team">${teamName(p.team) || t().noTeam}</span>
        <span class="areas">${areas.map((a) => `<span class="area-chip">${t().areas[a]}</span>`).join("")}</span>
        <span class="r-mem">${t().memCountShort(p.memories.length)}</span>`;
      b.querySelector(".r-av").prepend(spriteCanvas(p.species, 40));
      roster.appendChild(b);
    }
  }

  /* ── person ──────────────────────────────────────────────────── */
  const personHead = document.getElementById("personHead");
  const peopleHead = document.querySelector(".head");
  const person = document.getElementById("person");
  let shown = null;
  let tab = "overview";
  let filter = "all";

  // A memory just taught is not cold: nobody has had the chance to use it.
  const isCold = (m) => m.used === 0 && !m.fresh;
  const usedLabel = (m) => (m.fresh ? t().justTaught : m.used === 0 ? t().neverUsed : t().usedTimes(m.used));

  const memCard = (m, withMenu = false) => {
    const cls = m.fresh ? "" : m.used === 0 ? "cold" : m.used >= 10 ? "hot" : "";
    const box = ["mem", isCold(m) ? "cold-mem" : "", m.flash ? "is-new" : ""].filter(Boolean).join(" ");
    const menu = withMenu
      ? `<button class="ibtn ibtn-sm mem-menu" type="button" data-mem="${shown.memories.indexOf(m)}" aria-label="${t().memMenu}" aria-expanded="false">${ICON.more}</button>`
      : "";
    return `<div class="${box}">
      ${menu}
      <span class="mem-t">${tx(m.text)}</span>
      <span class="mem-m">
        ${m.from ? ICON.task : ICON.hand}
        <span class="src">${m.from ? t().fromWhere(tx(m.from)) : t().toldDirectly}</span>
        <span class="used ${cls}">${usedLabel(m)}</span>
      </span>
    </div>`;
  };

  const byUse = (a, b) => (b.fresh ? 1 : 0) - (a.fresh ? 1 : 0) || b.used - a.used;

  function renderHead(p) {
    document.getElementById("pAv").replaceChildren(spriteCanvas(p.species, 56));
    if (p.agentLost) document.getElementById("pAv").insertAdjacentHTML("beforeend", agentMark());
    document.getElementById("pName").textContent = p.name;
    document.getElementById("pRole").textContent = roleLine(p);
    const chip = document.getElementById("pChip");
    chip.className = "chip " + p.status;
    chip.innerHTML = `<span class="dot ${p.status}"></span>${t().status[p.status]}`;
    document.getElementById("pnMem").textContent = p.memories.length;
    document.getElementById("pnStyle").textContent = p.style.length;
    // Leave, or Claude Code stopping, forbids new work; the button stays,
    // disabled, with the reason beside it.
    const away = p.status === "leave";
    const blocked = away || RUNTIME.off;
    document.getElementById("pAssign").disabled = blocked;
    document.getElementById("pAssignWhy").hidden = !blocked;
    document.getElementById("pAssignWhy").textContent = away ? t().cannotAssign : RUNTIME.off ? t().runtime.cannotStart : "";
    for (const b of document.querySelectorAll("[data-ptab]")) b.setAttribute("aria-selected", String(b.dataset.ptab === tab));
    for (const el of document.querySelectorAll(".js-ptab")) el.hidden = el.id !== "pt-" + tab;

  }

  function renderOverview(p) {
    const now = p.task
      ? `<span class="k">${t().currentTask}</span><span class="now-task">${tx(p.task)}</span>`
      : p.review
      ? `<span class="k">${t().reviewingNow}</span><span class="now-task">${tx(p.review)}</span>`
      : p.leaveSince
      ? `<span class="k">${t().onLeave}</span><span class="now-task">${tx(p.leaveSince)}</span>`
      : `<span class="k">${t().nothingAssigned}</span><span class="now-note">${p.returned ? t().justBack : p.last ? t().lastFinished + " · " + tx(p.last) : t().justJoined}</span>`;

    const lost = p.agentLost
      ? `<div class="notice notice-bad now-lost"><span class="n-ic">${PLUG}</span>
          <span class="n-tx"><b>${WORDS[lang].agentLost}</b><span>${t().lostWhy}</span></span>

      : "";

        <div class="panel-hd"><h2>${t().now}</h2></div>

          <div class="kv"><span>${t().doneAndReviews}</span><b>${t().counts(p.done, p.reviews)}</b></div>

        </div>
      </div>`;
    document.querySelector("#ovLeft [data-reconnect]")?.addEventListener("click", () => {
      p.agentLost = false;
      renderPerson(p);
      renderMembers();

    const seats = areasOf(p);
    const top = [...p.memories].sort(byUse).slice(0, 3);
    document.getElementById("ovRight").innerHTML = `
      <div class="panel">
        <div class="panel-hd with-link"><h2>${t().often}</h2><button class="link" type="button" data-go="memory">${t().allMemory}</button></div>

        <div class="panel-bd">
          ${
            seats.length
              ? `<span class="areas">${seats
                  .map((a) => `<span class="area-chip">${t().areas[a]}</span>`)
                  .join("")}</span><p class="why">${t().expertiseWhy}</p>`
              : `<p class="why" style="margin:0">${t().noExpertise}</p>`
          }
        </div>
      </div>`;
  }

  function renderMemory(p) {
    const live = p.memories;
    const areas = areasOf(p);
    if (filter !== "all" && !areas.includes(filter)) filter = "all";

    const item = (key, label, n) =>
      `<button class="rail-item" type="button" data-filter="${key}" aria-current="${filter === key}"><span>${label}</span><span class="n">${n}</span></button>`;
    document.getElementById("rail").innerHTML =
      item("all", t().allAreas, live.length) +
      areas.map((a) => item(a, t().areas[a], live.filter((m) => m.area === a).length)).join("");

    let body;
    if (filter === "all") {
      body = live.length
        ? areas
            .map((a) => {
              const list = live.filter((m) => m.area === a).sort(byUse);
              return `<div class="mem-group">
                <div class="mem-hd">
                  <span class="area-chip">${t().areas[a]}</span>
                  <span class="mem-line"></span>
                  <span class="count">${list.length}</span>
                </div>
                ${list.map((m) => memCard(m, true)).join("")}
              </div>`;
            })
            .join("")
        : `<p class="empty-line">${t().noMemory}</p>`;
    } else {
      body = live.filter((m) => m.area === filter).sort(byUse).map((m) => memCard(m, true)).join("");
    }

    const title = filter === "all" ? t().memory : t().areas[filter];
    document.getElementById("memPanel").innerHTML = `
      <div class="panel-hd">
        <h2>${title}</h2>
        <p>${t().carried} · ${t().chars(charsOf(p))}</p>
      </div>
      <div class="panel-bd">
        ${body}
        <button class="mem-add" type="button" data-teach>${ICON.plus}${t().tellThem}</button>
      </div>`;
  }

  // a way of working brought from a session carries where it came from
  const styleText = (x) => x.text ?? tx(x);

  // editing: null, "new", or the index of the rule being corrected.
  function renderStyle(p, editing = null) {
    const panel = document.getElementById("stylePanel");
    const form = (cls) => `<form class="style-form${cls}" data-styleform>
        <input class="input" maxlength="80" autocomplete="off" placeholder="${t().stylePlaceholder}" aria-label="${t().addStyle}" />
        <button class="btn btn-primary btn-md" type="submit">${t().save}</button>
        <button class="btn btn-secondary btn-md" type="button" data-cancelstyle>${t().cancel}</button>
      </form>`;
    const line = (x, i) =>
      editing === i
        ? form(" in-place")
        : `<div class="style-line">${ICON.hand}<span>${styleText(x)}${x.from ? `<span class="src">${t().fromWhere(x.from)}</span>` : ""}</span><button class="ibtn ibtn-sm line-menu" type="button" data-style="${i}" aria-label="${t().styleMenu}" aria-expanded="false">${ICON.more}</button></div>`;
    panel.innerHTML = `
      <div class="panel-hd"><h2>${t().howTheyWork}</h2><p>${t().styleSub}</p></div>
      <div class="panel-bd">
        ${p.style.map(line).join("")}
        ${editing === "new" ? form("") : `<button class="mem-add" type="button" data-addstyle>${ICON.plus}${t().addStyle}</button>`}
      </div>`;
    panel.querySelector("[data-addstyle]")?.addEventListener("click", () => renderStyle(p, "new"));
    const f = panel.querySelector("[data-styleform]");
    if (!f) return;
    const input = f.querySelector("input");
    if (editing !== "new") input.value = styleText(p.style[editing]);
    input.focus();
    f.addEventListener("submit", (e) => {
      e.preventDefault();
      const value = input.value.trim();
      if (value && editing === "new") p.style.push(value);
      else if (value) p.style[editing] = value;
      renderPerson(p);
    });
    panel.querySelector("[data-cancelstyle]").addEventListener("click", () => renderStyle(p));
  }

  function renderPerson(p) {
    renderHead(p);
    renderOverview(p);
    renderMemory(p);
    renderStyle(p);
    for (const m of p.memories) m.flash = false;
  }

  function teach(p, area = null, then = null, from = null) {
    openTeach({
      to: p,
      from,
      area: area ?? (filter !== "all" ? filter : null),
      onSave: ({ memory }) => {
        p.memories.unshift({ ...memory, used: 0, fresh: true, flash: true });
        // What was just taught stays in view.
        if (filter !== "all") filter = memory.area;
        if (tab !== "memory" && !then) location.hash = p.id + "/memory";
        else renderPerson(p);
        then?.();
      },
    });
  }

  document.getElementById("pTeach").addEventListener("click", () => teach(shown));
  document.getElementById("pAssign").addEventListener("click", () => openAssign(shown));

  /* ── managing a person ───────────────────────────────────────── */
  // Leave and return are the domain's own transitions; letting someone go is
  // the one that cannot be undone, so it asks once more in place.
  document.getElementById("pMore").addEventListener("click", (e) => {
    const p = shown;
    const away = p.status === "leave";
    openRowMenu(e.currentTarget, [
      {
        label: t().editInfo, icon: ICON.pen,
        run: () => openHire({
          edit: p,
          teams: TEAMS.map((x) => ({ key: x.key, label: teamLabel(x) })),
          onSave: (h) => { Object.assign(p, h); rerenderPeople(); renderMembers(); },
        }),
      },
      away
        ? { label: t().comeBack, icon: ICON.undo, run: () => {
            Object.assign(p, { status: "available", leaveSince: null, returned: true });
            rerenderPeople(); renderMembers();
          } }
        : { label: t().sendOnLeave, icon: ICON.sun, confirm: p.task ? t().leaveWhy(tx(p.task)) : null, run: () => {
            Object.assign(p, { status: "leave", task: null, returned: false, leaveSince: { ko: "오늘부터", en: "Since today" } });
            rerenderPeople(); renderMembers();
          } },
      {
        label: t().dismiss, icon: ICON.trash, bad: true,
        // someone who never worked leaves nothing behind
        confirm: p.done + p.reviews === 0 && !p.task && !p.review ? t().dismissUnused : t().dismissWhy,
        run: () => {
          people.splice(people.indexOf(p), 1);
          renderMembers();
          location.hash = "";
          rerenderPeople();
        },
      },
    ], { keep: t().keepThem });
  });
  document.getElementById("pTabs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-ptab]");
    if (b) location.hash = shown.id + (b.dataset.ptab === "overview" ? "" : "/" + b.dataset.ptab);
  });
  person.addEventListener("click", (e) => {
    const go = e.target.closest("[data-go]");
    if (go) location.hash = shown.id + "/" + go.dataset.go;
    const f = e.target.closest("[data-filter]");
    if (f) {
      filter = f.dataset.filter;
      renderMemory(shown);
    }
    if (e.target.closest("[data-teach]")) teach(shown);
    const more = e.target.closest("[data-mem]");
    if (more) openMemMenu(more);
    const rule = e.target.closest("[data-style]");
    if (rule) openStyleMenu(rule);
  });

  /* ── a memory or a rule, and what the user can do about it ── */
  const editOrRemove = (btn, onEdit, onRemove) =>
    openRowMenu(btn, [
      { label: t().edit, icon: ICON.pen, run: onEdit },
      { label: t().remove, icon: ICON.trash, bad: true, confirm: t().removeWhy, run: onRemove },
    ], { keep: t().keep });

  function openMemMenu(btn) {
    const p = shown;
    const m = p.memories[Number(btn.dataset.mem)];
    editOrRemove(
      btn,
      () => openTeach({
        to: p,
        edit: m,
        onSave: ({ memory }) => {
          Object.assign(m, { area: memory.area, text: memory.text, from: memory.from, flash: true });
          renderPerson(p);
        },
      }),
      () => {
        p.memories.splice(p.memories.indexOf(m), 1);
        renderPerson(p);
      },
    );
  }

  function openStyleMenu(btn) {
    const p = shown;
    const i = Number(btn.dataset.style);
    editOrRemove(
      btn,
      () => renderStyle(p, i),
      () => {
        p.style.splice(i, 1);
        renderPerson(p);
      },
    );
  }

  /* ── org chart ───────────────────────────────────────────────── */
  // Teams are the only level. A default team speaks both languages; one the
  // user names is shown as written.
  const org = document.getElementById("org");
  let editingTeam = null;

  const teamForm = () => `<form class="team-form" data-teamform>
      <input class="input" maxlength="16" autocomplete="off" placeholder="${t().teamPlaceholder}" aria-label="${t().teamName}" />
      <button class="btn btn-primary btn-md" type="submit">${t().save}</button>
      <button class="btn btn-secondary btn-md" type="button" data-cancelteam>${t().cancel}</button>
      <p class="hint" data-taken hidden>${t().nameTaken}</p>
    </form>`;

  const personCard = (p) => {
    const wrap = document.createElement("div");
    wrap.className = "tcard-wrap";
    wrap.innerHTML = `<button class="tcard" type="button" data-open="${p.id}">
        <span class="t-av"><span class="r-live" style="background:${STATUS[p.status].color}"></span>${p.agentLost ? agentMark() : ""}</span>
        <span style="min-width:0"><span class="t-name">${p.name}</span><span class="t-role">${p.role}</span></span>
      </button>
      <button class="ibtn ibtn-sm" type="button" data-move="${p.id}" aria-label="${t().personMenu}" aria-expanded="false">${ICON.more}</button>`;
    wrap.querySelector(".t-av").prepend(spriteCanvas(p.species, 36));
    return wrap;
  };

  function renderOrg() {
    org.replaceChildren();
    const loose = people.filter((p) => !teamOf(p.team));
    if (loose.length) {
      const box = document.createElement("div");
      box.className = "team-box";
      box.innerHTML = `<div class="team-box-hd"><h2 class="muted">${t().noTeam}</h2><span class="cnt">${loose.length}</span></div><div class="team-bd"><div class="tgrid"></div></div>`;
      for (const p of loose) box.querySelector(".tgrid").append(personCard(p));
      org.append(box);
    }
    for (const team of TEAMS) {
      const inTeam = people.filter((p) => p.team === team.key);
      const box = document.createElement("div");
      box.className = "team-box";
      box.innerHTML =
        editingTeam === team.key
          ? `<div class="team-box-hd">${teamForm()}</div>`
          : `<div class="team-box-hd"><h2></h2><span class="cnt">${inTeam.length}</span>
              <button class="ibtn ibtn-sm" type="button" data-teammenu="${team.key}" aria-label="${t().teamMenu}" aria-expanded="false">${ICON.more}</button></div>`;
      box.querySelector("h2")?.append(teamLabel(team));
      const grid = document.createElement("div");
      grid.className = "tgrid";
      for (const p of inTeam) grid.append(personCard(p));
      if (!inTeam.length) {
        const v = document.createElement("button");
        v.className = "vacant";
        v.type = "button";
        v.dataset.hire = team.key;
        v.innerHTML = `${ICON.plus}<span>${t().hireInto}</span>`;
        grid.append(v);
      }
      const bd = document.createElement("div");
      bd.className = "team-bd";
      bd.append(grid);
      box.append(bd);
      org.append(box);
    }
    org.insertAdjacentHTML(
      "beforeend",
      editingTeam === "new" ? `<div class="team-box"><div class="team-box-hd">${teamForm()}</div></div>` : `<button class="mem-add" type="button" data-addteam>${ICON.plus}${t().addTeam}</button>`,
    );
    wireTeamForm();
  }

  function wireTeamForm() {
    const form = org.querySelector("[data-teamform]");
    if (!form) return;
    const team = editingTeam === "new" ? null : teamOf(editingTeam);
    const input = form.querySelector("input");
    input.value = team ? teamLabel(team) : "";
    input.focus();
    input.select();
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const label = input.value.trim();
      if (!label) return;
      const taken = TEAMS.some((x) => x !== team && teamLabel(x) === label);
      form.querySelector("[data-taken]").hidden = !taken;
      if (taken) return;
      if (team && label !== teamLabel(team)) team.label = label;
      if (!team) TEAMS.push({ key: "team-" + Date.now(), label });
      editingTeam = null;
      rerenderPeople();
    });
    form.querySelector("[data-cancelteam]").addEventListener("click", () => {
      editingTeam = null;
      renderOrg();
    });
  }

  function removeTeam(team, into) {
    for (const p of people) if (p.team === team.key) p.team = into || null;
    TEAMS.splice(TEAMS.indexOf(team), 1);
    rerenderPeople();
  }

  function teamMenu(btn) {
    const team = teamOf(btn.dataset.teammenu);
    const members = people.filter((p) => p.team === team.key).length;
    const others = TEAMS.filter((x) => x !== team);
    openRowMenu(btn, [
      { label: t().renameTeam, icon: ICON.pen, run: () => { editingTeam = team.key; renderOrg(); } },
      members
        ? {
            label: t().remove, icon: ICON.trash, bad: true,
            run: () => openMoveDialog({
              title: t().removeTeamTitle(teamLabel(team)),
              sub: t().removeTeamSub(members),
              label: t().moveToTeam,
              options: [{ value: "", label: t().noTeam }, ...others.map((x) => ({ value: x.key, label: teamLabel(x) }))],
              cancel: t().cancel,
              confirm: t().moveAndRemove,
              onConfirm: (into) => removeTeam(team, into),
            }),
          }
        : { label: t().remove, icon: ICON.trash, bad: true, confirm: t().removeWhy, run: () => removeTeam(team, null) },
    ], { keep: t().keep });
  }

  function moveMenu(btn) {
    const p = people.find((x) => x.id === btn.dataset.move);
    openRowMenu(
      btn,
      [
        ...TEAMS.filter((x) => x.key !== p.team).map((x) => ({
          label: t().moveInto(teamLabel(x)),
          icon: ICON.swap,
          run: () => { p.team = x.key; rerenderPeople(); },
        })),
        ...(teamOf(p.team) ? [{ label: t().leaveTeam, icon: ICON.x, run: () => { p.team = null; rerenderPeople(); } }] : []),
      ],
    );
  }

  org.addEventListener("click", (e) => {
    const open = e.target.closest("[data-open]");
    if (open) location.hash = open.dataset.open;
    const menu = e.target.closest("[data-teammenu]");
    if (menu) teamMenu(menu);
    const move = e.target.closest("[data-move]");
    if (move) moveMenu(move);
    if (e.target.closest("[data-addteam]")) {
      editingTeam = "new";
      renderOrg();
    }
  });

  /* ── hiring ──────────────────────────────────────────────────── */
  // The samples' today.
  const TODAY = "2026. 9. 26.";

  function rerenderPeople() {
    renderCounts();
    renderRoster();
    renderOrg();
    if (shown) renderPerson(shown);
  }

  function hire(team = null) {
    openHire({
      team,
      teams: TEAMS.map((x) => ({ key: x.key, label: teamLabel(x) })),
      career: openCareer,
      onSave: ({ career, ...h }) => {
        const p = {
          ...h, id: "p" + (people.length + 1), status: "available", joined: TODAY,
          done: 0, reviews: 0, style: career?.style ?? [], memories: career?.memories ?? [],
          career: career && { project: career.project, span: career.span, n: career.memories.length + career.style.length },
        };
        people.push(p);
        renderCounts();
        renderRoster();
        renderOrg();
        renderMembers();
        location.hash = p.id;
      },
    });
  }
  document.getElementById("hireBtn").addEventListener("click", () => hire());
  org.addEventListener("click", (e) => {
    const v = e.target.closest("[data-hire]");
    if (v) hire(v.dataset.hire);
  });

  renderMembers();
  renderCounts();
  renderRoster();
  renderOrg();

  /* ── memory tab ──────────────────────────────────────────────── */
  const notices = document.getElementById("memNotices");

  // Memory nobody ever used is something this screen knows that the user
  // cannot see anywhere else.
  const cold = people.flatMap((p) => p.memories.filter(isCold).map((m) => ({ p, m })));
  if (cold.length) {
    const n = document.createElement("div");
    n.className = "notice notice-warn";
    n.innerHTML = `
      <span class="n-ic">${ICON.x}</span>
      <span class="n-tx">
        <b>${t().coldTitle(cold.length)}</b>
        <span>${t().coldExample(cold[0].p.name, tx(cold[0].m.text))} ${t().coldWhy}</span>
      </span>
      <span class="n-acts"><button class="btn btn-secondary btn-sm" type="button">${t().review}</button></span>`;
    notices.appendChild(n);
  }

  const feedBox = document.getElementById("feed");
  for (const f of feed) {
    const p = people.find((x) => x.id === f.who);
    const el = document.createElement("div");
    el.className = "feed-row";
    el.innerHTML = `
      <span class="f-av"></span>
      <span class="f-tx">${t().referenced(p.name, tx(f.mem))}<span class="f-meta">${tx(f.on)}</span></span>
      <span class="f-time">${tx(f.when)}</span>`;
    el.querySelector(".f-av").appendChild(spriteCanvas(p.species, 28));
    feedBox.appendChild(el);
  }

  /* ── assign ──────────────────────────────────────────────────── */
  const scrim = document.getElementById("scrim");
  const modal = document.getElementById("modal");
  let assignee = null;
  let picked = null;
  // A task being made here, before it exists: the same fields as the board's
  // new-task dialog, less the assignee, who is already chosen.
  let draft = null;
  const newDraft = () => ({ title: "", desc: "", project: PROJECTS[0].id, area: AREA_KEYS[0], priority: "normal" });

  let firstPaint = true;
  const chevron = '<svg viewBox="0 0 11 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1.5l4.5 4.5L10 1.5"/></svg>';
  const options = (list, value) => list.map(([v, label]) => `<option value="${v}"${v === value ? " selected" : ""}>${label}</option>`).join("");

  function draftForm() {
    return `<div class="m-sec">
        <span class="k">${t().newTask}</span>
        <div class="field" style="margin-top:0">
          <label class="label" for="naProject">${t().fProject}</label>
          <span class="select-wrap"><select class="select" id="naProject">${options(PROJECTS.map((x) => [x.id, tx(x.name)]), draft.project)}</select>${chevron}</span>
        </div>
        <div class="field">
          <label class="label" for="naTitle">${t().fTitle} <span class="req">*</span></label>
          <input class="input" id="naTitle" placeholder="${t().fTitlePlaceholder}" autocomplete="off" />
        </div>
        <div class="field">
          <label class="label" for="naDesc">${t().fDesc}</label>
          <textarea class="textarea" id="naDesc" placeholder="${t().fDescPlaceholder}"></textarea>
        </div>
        <div class="grid2" style="gap:14px">
          <div class="field">
            <label class="label" for="naArea">${t().fArea}</label>
            <span class="select-wrap"><select class="select" id="naArea">${options(AREA_KEYS.map((a) => [a, t().areas[a]]), draft.area)}</select>${chevron}</span>
          </div>
          <div class="field">
            <label class="label" for="naPrio">${t().fPriority}</label>
            <span class="select-wrap"><select class="select" id="naPrio">${options(["low", "normal", "high"].map((k) => [k, t().priority[k]]), draft.priority)}</select>${chevron}</span>
          </div>
        </div>
      </div>`;
  }

  function renderAssign(focus = null) {
    const p = assignee;
    const task = picked === "new" ? null : backlog.find((x) => x.id === picked);
    const area = task ? task.area : draft.area;
    // The point of teaching shows up here: what this person brings to this task.
    const useful = p.memories.filter((m) => m.area === area).sort((x, y) => y.used - x.used);

    modal.innerHTML = `
      <div class="m-hd">
        <span class="m-av"></span>
        <span style="flex:1;min-width:0">
          <span class="m-t">${t().assignTitle(p.name)}</span>
          <span class="m-s">${roleLine(p)}</span>
        </span>
      </div>

      <div class="m-sec">
        <span class="k">${t().backlog}</span>
        ${backlog
          .map(
            (task_) => `<button class="pick" type="button" role="radio" data-task="${task_.id}"
                      aria-checked="${task_.id === picked}">
                <span class="radio"></span>
                <span class="pick-t">${tx(task_.title)}</span>
                <span class="area-chip">${t().areas[task_.area]}</span>
              </button>`,
          )
          .join("")}
        <button class="pick pick-new" type="button" role="radio" data-task="new" aria-checked="${picked === "new"}">
          <span class="radio"></span>
          <span class="pick-t">${t().newTask}</span>
          <span></span><span></span>
        </button>
      </div>

      ${task ? "" : draftForm()}

      <div class="m-sec">
        <span class="k">${t().broughtAlong} <span class="kn">${useful.length}</span></span>
        <p class="hint" style="margin:-2px 0 10px">${t().broughtWhy}</p>
        ${
          useful.length
            ? useful.map((m) => memCard(m)).join("")
            : `<div class="notice notice-warn">
                 <span class="n-ic">${ICON.alert}</span>
                 <span class="n-tx">
                   <b>${t().noAreaMemory(t().areas[area])}</b>
                   <span>${t().noAreaMemoryWhy(p.name)}</span>
                 </span>
                 <span class="n-acts"><button class="btn btn-secondary btn-sm" type="button" data-tellnow>${t().tellNow}</button></span>
               </div>`
        }
      </div>

      <div class="m-foot">
        <button class="btn btn-secondary btn-md" type="button" data-close>${t().cancel}</button>
        <button class="btn btn-primary btn-md" type="button" data-assignok>${task ? t().assignThis : t().createAndAssign}</button>
      </div>`;

    modal.querySelector(".m-av").appendChild(spriteCanvas(p.species, 44));
    modal.querySelectorAll("[data-task]").forEach((b) =>
      b.addEventListener("click", () => {
        picked = b.dataset.task;
        if (picked === "new" && !draft) draft = newDraft();
        renderAssign(picked === "new" ? "#naTitle" : null);
      }),
    );
    modal.querySelector("[data-close]").addEventListener("click", closeAssign);

    const ok = modal.querySelector("[data-assignok]");
    if (!task) {
      const title = modal.querySelector("#naTitle");
      const desc = modal.querySelector("#naDesc");
      title.value = draft.title;
      desc.value = draft.desc;
      ok.disabled = !draft.title.trim();
      title.addEventListener("input", () => { draft.title = title.value; ok.disabled = !draft.title.trim(); });
      desc.addEventListener("input", () => { draft.desc = desc.value; });
      modal.querySelector("#naProject").addEventListener("change", (e) => { draft.project = e.target.value; });
      modal.querySelector("#naPrio").addEventListener("change", (e) => { draft.priority = e.target.value; });
      // The area decides what they bring, so changing it redraws that part.
      modal.querySelector("#naArea").addEventListener("change", (e) => { draft.area = e.target.value; renderAssign("#naArea"); });
    }
    ok.addEventListener("click", () => {
      // A task made here goes straight to them; one from the backlog leaves it.
      if (task) backlog.splice(backlog.indexOf(task), 1);
      Object.assign(p, { task: task ? task.title : draft.title.trim(), status: "working", returned: false });
      draft = null;
      closeAssign();
      rerenderPeople();
      renderMembers();
    });

    // Teaching here returns to the same task, which now shows what was taught.
    modal.querySelector("[data-tellnow]")?.addEventListener("click", () => {
      const keep = picked;
      closeAssign();
      teach(p, area, () => openAssign(p, keep), task ? task.title : null);
    });
    // Re-rendering must not pull focus out of the list: only the first paint
    // sends it to Cancel, afterwards it returns to what was just used.
    const back = focus ? modal.querySelector(focus) : modal.querySelector(`[data-task="${picked}"]`);
    (firstPaint || !back ? modal.querySelector("[data-close]") : back).focus({ preventScroll: true });
    firstPaint = false;
  }

  function openAssign(p, keep = null) {
    assignee = p;
    picked = keep ?? backlog[0]?.id ?? "new";
    if (picked !== "new") draft = null;
    else if (!draft) draft = newDraft();
    firstPaint = true;
    scrim.hidden = false;
    renderAssign();
  }
  function closeAssign() {
    scrim.hidden = true;
    assignee = null;
  }
  scrim.addEventListener("pointerdown", (e) => { if (e.target === scrim) closeAssign(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !scrim.hidden) closeAssign(); });

  /* ── tabs ────────────────────────────────────────────────────── */
  let view = "list";
  function show(next) {
    view = next;
    for (const t of document.querySelectorAll("#tabs .tab")) {
      t.setAttribute("aria-selected", String(t.dataset.view === view));
    }
    for (const v of document.querySelectorAll(".js-view")) {
      v.toggleAttribute("hidden", shown !== null || v.id !== "view-" + view);
    }
  }
  document.getElementById("tabs").addEventListener("click", (e) => {
    const t = e.target.closest(".tab");
    if (t) show(t.dataset.view);
  });

  /* ── route ───────────────────────────────────────────────────── */
  // The list and a person are separate pages that share one file: the hash
  // names the person and, after a slash, their tab. No hash is the list.
  function route() {
    const [id, sub] = location.hash.slice(1).split("/");
    const next = people.find((x) => x.id === id) ?? null;
    if (next !== shown) filter = "all";
    shown = next;
    tab = ["memory", "style"].includes(sub) ? sub : "overview";
    closeRowMenu();
    personHead.hidden = person.hidden = !shown;
    peopleHead.hidden = !!shown;
    members.querySelectorAll(".member").forEach((m) => {
      if (m.dataset.id === shown?.id) m.setAttribute("aria-current", "page");
      else m.removeAttribute("aria-current");
    });
    if (shown) renderPerson(shown);
    else document.title = "Tiny Office · People";
    // another screen's 업무 맡기기 arrives here with the dialog open
    if (shown && sub === "assign") {
      history.replaceState(null, "", "#" + shown.id);
      if (shown.status !== "leave") openAssign(shown);
    }
    show(view);
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  document.addEventListener("runtimeback", () => { if (shown) renderPerson(shown); });
  route();
</script>
