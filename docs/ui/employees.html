<meta charset="utf-8" />
<title>Tiny Office · 직원</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"

<style>
  :root {
    color-scheme: light;

    --page: #edecee;
    --surface: #ffffff;
    --subtle: #f6f6f7;
    --sunk: #eeeef0;
    --line: #ebebed;
    --line-2: #e0e0e3;

    --ink: #1b1b1f;
    --solid: #17171c;
    --muted: #86868d;
    --faint: #b2b2b9;

    --brand: #5b5bd6;
    --brand-soft: #ecebfb;
    --ok: #2fae62;
    --ok-soft: #e4f6ec;
    --info: #3b82f6;
    --info-soft: #e8f0fe;
    --warn: #eaa221;
    --warn-soft: #fdf1dd;
    --bad: #e5484d;
    --bad-soft: #fdeaea;

    --r-ctl: 10px;
    --r-card: 12px;
    --r-app: 18px;

    --sans: "Noto Sans KR", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
  }

  body {
    margin: 0;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    background: var(--page);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
    padding: 22px 18px 40px;
  }
  * { box-sizing: border-box; }
  button { font: inherit; color: inherit; }

  .app {
    max-width: 1240px; margin: 0 auto;
    background: var(--surface);
    border-radius: var(--r-app);
    box-shadow: 0 1px 2px rgb(20 20 25 / .05), 0 12px 40px rgb(20 20 25 / .08);
    overflow: hidden;
    display: grid; grid-template-columns: 236px 1fr;
    min-height: 760px;
  }

  /* ═══ buttons ═══ */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    font: inherit; font-weight: 600; white-space: nowrap;
    border-radius: 999px; border: 1px solid transparent; cursor: pointer;
    transition: background .1s, border-color .1s;
  }
  .btn svg { width: 15px; height: 15px; flex: none; }
  .btn-lg { height: 42px; padding-inline: 22px; font-size: 14px; }
  .btn-md { height: 36px; padding-inline: 16px; font-size: 14px; }
  .btn-sm { height: 30px; padding-inline: 13px; font-size: 13px; }
  .btn-primary { background: var(--solid); color: #fff; }
  .btn-primary:hover { background: #2a2a31; }
  .btn-secondary { background: var(--surface); border-color: var(--line-2); color: var(--ink); }
  .btn-secondary:hover { background: var(--subtle); }
  .btn-ghost { background: none; color: var(--muted); }
  .btn-ghost:hover { background: var(--subtle); color: var(--ink); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:focus-visible, .ibtn:focus-visible, .row-item:focus-visible,
  .tab:focus-visible, .nav a:focus-visible, .tcard:focus-visible {
    outline: 2px solid var(--brand); outline-offset: 2px;
  }
  .ibtn {
    width: 32px; height: 32px; border-radius: 999px; border: none;
    background: var(--subtle); color: var(--muted);
    display: inline-grid; place-items: center; cursor: pointer;
  }
  .ibtn:hover { background: var(--sunk); color: var(--ink); }
  .ibtn svg { width: 15px; height: 15px; }

  /* ═══ sidebar ═══ */
  .side { background: var(--subtle); padding: 14px 12px; display: flex; flex-direction: column; }
  .side-top { display: flex; align-items: center; gap: 10px; padding: 2px 4px 14px; }
  .logo { width: 26px; height: 26px; border-radius: 7px; background: var(--ink); display: grid; place-items: center; flex: none; }
  .logo svg { width: 14px; height: 14px; color: #fff; }
  .side-name { display: block; font-size: 13px; font-weight: 700; letter-spacing: .03em; }
  .side-ver { display: block; font-size: 11px; color: var(--faint); }

  .nav { display: flex; flex-direction: column; gap: 1px; }
  .nav a {
    display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 10px;
    height: 34px; padding-inline: 8px; border-radius: var(--r-ctl);
    font-size: 14px; color: var(--muted); text-decoration: none;
  }
  .nav a:hover { background: var(--sunk); color: var(--ink); }
  .nav a[aria-current] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgb(20 20 25 / .06); }
  .nav svg { width: 17px; height: 17px; }
  .badge {
    min-width: 19px; height: 19px; padding-inline: 6px; border-radius: 999px;
    background: var(--bad); color: #fff; font-size: 11px; font-weight: 700;
    display: grid; place-items: center; font-variant-numeric: tabular-nums;
  }
  .rule { height: 1px; background: var(--line-2); margin: 14px 4px; }
  .ws-hd { display: flex; align-items: center; justify-content: space-between; padding: 0 8px; margin-bottom: 4px; }
  .ws-hd span { font-size: 13px; color: var(--muted); }
  .side-foot { margin-top: auto; padding-top: 12px; }

  /* ═══ main ═══ */
  .main { display: flex; flex-direction: column; min-width: 0; }
  .head { padding: 16px 22px 0; }
  .head-row { display: flex; align-items: flex-start; gap: 12px; }
  h1 { margin: 0; font-size: 23px; font-weight: 600; letter-spacing: -.01em; }
  .sub { display: block; font-size: 13px; color: var(--muted); margin-top: 1px; }
  .head-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }

  .tabs { display: flex; align-items: center; gap: 2px; margin-top: 14px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tab {
    display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
    height: 38px; padding-inline: 11px; border: none; background: none;
    font-size: 14px; color: var(--muted); cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
  .tab svg { width: 16px; height: 16px; }
  .tab .n { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }

  .body { padding: 16px 22px 24px; overflow: auto; flex: 1; }
  .view[hidden] { display: none; }

  /* ═══ status ═══ */
  .dot { width: 7px; height: 7px; border-radius: 999px; flex: none; }
  .dot.working { background: var(--warn); box-shadow: 0 0 0 1.5px #fff, 0 0 0 3px var(--warn); margin: 2px; }
  .dot.ready { background: transparent; border: 2px solid var(--info); }
  .dot.available { background: var(--ok); }
  .dot.training { background: var(--brand); border-radius: 2px; }
  .dot.vacation { background: var(--faint); border-radius: 1px; height: 3px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; flex: none;
    border-radius: 999px; padding: 2px 9px; font-size: 11.5px; font-weight: 600;
  }
  .chip.working { background: var(--warn-soft); color: #8a5c10; }
  .chip.ready { background: var(--info-soft); color: #2557b5; }
  .chip.available { background: var(--ok-soft); color: #1f7a48; }
  .chip.training { background: var(--brand-soft); color: #4342a6; }
  .chip.vacation { background: var(--sunk); color: var(--muted); }

  /* ═══ master / detail ═══ */
  .split { display: grid; grid-template-columns: minmax(0, 1fr) 344px; gap: 16px; align-items: start; }
  @media (max-width: 1100px) { .split { grid-template-columns: 1fr; } }

  .list { border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; }
  .row-item {
    display: grid; grid-template-columns: 40px minmax(0, 1.5fr) minmax(0, 1fr) auto auto;
    align-items: center; gap: 12px; width: 100%;
    padding: 11px 14px; border: none; background: none; text-align: left; cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .row-item:last-child { border-bottom: none; }
  .row-item:hover { background: var(--subtle); }
  .row-item[aria-selected="true"] { background: var(--brand-soft); }
  .r-av { position: relative; width: 40px; height: 40px; border-radius: 11px; background: var(--subtle); display: grid; place-items: center; }
  .r-live { position: absolute; right: -3px; bottom: -3px; width: 13px; height: 13px; border-radius: 999px; border: 3px solid var(--surface); }
  .row-item[aria-selected="true"] .r-live { border-color: var(--brand-soft); }
  .row-item[aria-selected="true"] .spec-chip { background: var(--surface); }
  .r-name { display: block; font-size: 14.5px; font-weight: 600; line-height: 1.35; }
  .r-role { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.35; }
  .r-dept { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .specs { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .spec-chip {
    font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 2px 8px;
    background: var(--brand-soft); color: #4342a6; white-space: nowrap;
  }
  .spec-none { font-size: 11.5px; color: var(--faint); }

  /* ═══ detail ═══ */
  .detail { border: 1px solid var(--line); border-radius: var(--r-card); position: sticky; top: 0; }
  .d-hd { display: flex; align-items: center; gap: 12px; padding: 16px 16px 14px; border-bottom: 1px solid var(--line); }
  .d-av { position: relative; width: 52px; height: 52px; border-radius: 14px; background: var(--subtle); display: grid; place-items: center; flex: none; }
  .d-name { display: block; font-size: 17px; font-weight: 600; line-height: 1.3; }
  .d-role { display: block; font-size: 13px; color: var(--muted); line-height: 1.35; }
  .d-sec { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .d-sec:last-child { border-bottom: none; }
  .k { display: block; font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--faint); margin-bottom: 7px; }
  .kv { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 3px 0; }
  .kv span:first-child { color: var(--muted); }
  .kv b { font-weight: 600; }

  .skill { display: grid; grid-template-columns: 82px 1fr 26px; gap: 9px; align-items: center; margin-bottom: 7px; }
  .skill:last-child { margin-bottom: 0; }
  .skill > span:first-child { font-size: 12.5px; color: var(--muted); }
  .skill b { font-size: 12.5px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .track { display: block; position: relative; height: 6px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 999px; background: var(--brand); }
  .track.expert i { background: var(--ok); }
  /* Where a skill becomes a specialty, and therefore a review seat. */
  .track u { position: absolute; top: -2px; bottom: -2px; width: 2px; background: rgb(27 27 31 / .32); }

  .trait { display: inline-flex; font-size: 12px; border-radius: 999px; padding: 2px 9px; background: var(--subtle); border: 1px solid var(--line); margin: 0 4px 4px 0; }
  .d-acts { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .d-acts .btn { width: 100%; }

  /* ═══ org chart ═══ */
  .org { display: flex; flex-direction: column; gap: 18px; }
  .dept { border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; }
  .dept-hd { display: flex; align-items: center; gap: 9px; padding: 12px 15px; background: var(--subtle); border-bottom: 1px solid var(--line); }
  .dept-hd h2 { margin: 0; font-size: 14.5px; font-weight: 600; }
  .cnt { font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-variant-numeric: tabular-nums; }
  .teams { padding: 14px 15px; display: flex; flex-direction: column; gap: 14px; }
  .team-hd { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
  .team-hd h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); }
  .team-line { flex: 1; height: 1px; background: var(--line); }
  .tgrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); }
  .tcard {
    display: flex; align-items: center; gap: 10px; text-align: left;
    border: 1px solid var(--line); border-radius: var(--r-card); padding: 10px 12px;
    background: var(--surface); cursor: pointer; width: 100%;
  }
  .tcard:hover { border-color: var(--line-2); box-shadow: 0 2px 8px rgb(20 20 25 / .06); }
  .t-av { position: relative; width: 36px; height: 36px; border-radius: 10px; background: var(--subtle); display: grid; place-items: center; flex: none; }
  .t-name { display: block; font-size: 13.5px; font-weight: 600; line-height: 1.35; }
  .t-role { display: block; font-size: 12px; color: var(--muted); line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vacant {
    display: grid; place-items: center; align-content: center; gap: 7px; min-height: 60px;
    border: 1px dashed var(--line-2); border-radius: var(--r-card); background: var(--subtle);
    color: var(--faint); font-size: 12.5px; cursor: pointer;
  }
  .vacant svg { width: 16px; height: 16px; }
  .vacant:hover { border-color: var(--muted); color: var(--muted); background: var(--surface); }

  /* ═══ notice ═══ */
  .notice {
    display: flex; align-items: flex-start; gap: 11px;
    background: var(--surface); border: 1px solid var(--line-2);
    border-radius: var(--r-card); padding: 13px 14px;
  }
  .n-ic {
    width: 22px; height: 22px; border-radius: 999px; flex: none; margin-top: 1px;
    display: grid; place-items: center; background: var(--sunk); color: var(--muted);
  }
  .n-ic svg { width: 13px; height: 13px; }
  .n-tx { min-width: 0; flex: 1; }
  .n-tx b { display: block; font-size: 13.5px; font-weight: 600; line-height: 1.45; }
  .n-tx span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .n-acts { margin-left: auto; display: flex; gap: 7px; flex: none; padding-top: 1px; }
  .notice-warn { border-color: #f0d8a8; }
  .notice-warn .n-ic { background: var(--warn-soft); color: #8a5c10; }

  /* ═══ training ═══ */
  .tr-now { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .tr-live {
    display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center;
    border: 1px solid var(--line-2); border-radius: var(--r-card); padding: 12px 14px;
  }
  .tr-t { display: block; font-size: 14px; font-weight: 600; }
  .tr-s { display: block; font-size: 12.5px; color: var(--muted); }
  .tr-nums { text-align: right; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tr-nums b { display: block; font-size: 14px; color: var(--ink); }

  .cat { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(244px, 1fr)); }
  .course { border: 1px solid var(--line); border-radius: var(--r-card); padding: 15px; display: flex; flex-direction: column; }
  .course:hover { border-color: var(--line-2); box-shadow: 0 2px 8px rgb(20 20 25 / .06); }
  .c-top { display: flex; align-items: flex-start; gap: 10px; }
  .c-ic { width: 34px; height: 34px; border-radius: 10px; background: var(--brand-soft); color: #4342a6; display: grid; place-items: center; flex: none; }
  .c-ic svg { width: 16px; height: 16px; }
  .c-name { display: block; font-size: 14px; font-weight: 600; line-height: 1.35; }
  .c-gain { display: block; font-size: 12.5px; color: var(--muted); }
  .c-meta { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-top: 12px; font-variant-numeric: tabular-nums; }
  .c-act { margin-top: 11px; }
  .c-act .btn { width: 100%; }

  .sec-hd { display: flex; align-items: center; gap: 8px; margin: 0 0 11px; }
  .sec-hd h2 { margin: 0; font-size: 15px; font-weight: 600; }
</style>

<script>
  /* ── palette and sprites ─────────────────────────────────────── */
  const P = { ".": null, K: "#2f2a3d", E: "#2f2a3d" };
  // B body · L belly · O eye white · A ear · H blush · N beak · E eye and mouth
  // Every sprite shares one body. Only the seven head rows change, so twenty

  function paint(ctx, rows, scale, ox, oy, extra) {
    const pal = extra ? { ...P, ...extra } : P;
    for (let y = 0; y < rows.length; y++) {
      const row = rows[y];
      let x = 0;
      while (x < row.length) {
        const ch = row[x];
        let run = 1;
        while (x + run < row.length && row[x + run] === ch) run++;
        const color = pal[ch];
        if (color) { ctx.fillStyle = color; ctx.fillRect(ox + x * scale, oy + y * scale, run * scale, scale); }
        x += run;
      }
    }
  }

    const scale = Math.max(1, Math.floor(px / 16));
    const pad = Math.floor((px - 16 * scale) / 2);
    paint(g, sp.sprite, scale, pad, pad, skin(sp));
    return el;
  }

    db: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><ellipse cx="8" cy="4" rx="5" ry="2.2"/><path d="M3 4v8c0 1.2 2.2 2.2 5 2.2s5-1 5-2.2V4"/><path d="M3 8c0 1.2 2.2 2.2 5 2.2s5-1 5-2.2"/></svg>',
    shield: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M8 1.8l5 2v4c0 3-2.2 5.3-5 6.4-2.8-1.1-5-3.4-5-6.4v-4z"/><path d="M5.8 8l1.6 1.6 3-3.2"/></svg>',
    check: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 8.4l3.2 3.2L12.8 4.8"/></svg>',
    book: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M1.8 5L8 2.2 14.2 5 8 7.8z"/><path d="M4.2 6.2v3.4c0 1 1.7 1.8 3.8 1.8s3.8-.8 3.8-1.8V6.2"/></svg>',
    info: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M8 7.4v4M8 5.2v.1"/></svg>',
    alert: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.2l6 11H2z"/><path d="M8 6.6v3M8 11.4v.1"/></svg>',
    plus: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg>',
  };

  const specialtiesOf = (p) => SKILLS.filter((_, i) => p.skills[i] >= EXPERT);

  /* ── sidebar roster ──────────────────────────────────────────── */
  const members = document.getElementById("members");
  for (const p of people) {
    const b = document.createElement("button");
    b.className = "row-item";
    b.type = "button";
    b.style.cssText = "grid-template-columns:22px 1fr auto;padding:5px 8px;border-bottom:none;border-radius:8px;gap:9px";
    b.innerHTML = `<span style="width:22px;height:22px;border-radius:6px;overflow:hidden;background:var(--sunk);display:grid;place-items:center"></span>
      <span style="font-size:13px">${p.name}</span><span class="dot ${p.status}"></span>`;
    b.firstElementChild.appendChild(avatar(p.species, 22));
    b.addEventListener("click", () => { show("list"); select(p.id); });
    members.appendChild(b);
  }

  /* ── header counts ───────────────────────────────────────────── */
  const trainingCount = people.filter((p) => p.status === "training").length;
  document.getElementById("nList").textContent = people.length;
  document.getElementById("nTraining").textContent = trainingCount;
  document.getElementById("headSub").textContent =
    `${people.length}명 · 개발본부 ${people.filter((p) => p.dept === "개발본부").length} · 프로덕트 ${people.filter((p) => p.dept === "프로덕트").length}`;

  /* ── roster ──────────────────────────────────────────────────── */
  const roster = document.getElementById("roster");
  for (const p of people) {
    const specs = specialtiesOf(p);
    const b = document.createElement("button");
    b.className = "row-item";
    b.type = "button";
    b.dataset.id = p.id;
    b.innerHTML = `
      <span class="r-av"><span class="r-live" style="background:${STATUS[p.status].color}"></span></span>
      <span><span class="r-name">${p.name}</span><span class="r-role">${p.role}</span></span>
      <span class="r-dept">${p.dept} · ${p.team}</span>
      <span class="specs">${
        specs.length
          ? specs.map((s) => `<span class="spec-chip">${s}</span>`).join("")
          : '<span class="spec-none">전문성 없음</span>'
      }</span>
      <span class="chip ${p.status}"><span class="dot ${p.status}"></span>${STATUS[p.status].label}</span>`;
    b.querySelector(".r-av").prepend(avatar(p.species, 40));
    b.addEventListener("click", () => select(p.id));
    roster.appendChild(b);
  }

  /* ── detail ──────────────────────────────────────────────────── */
  const detail = document.getElementById("detail");
  let selected = null;

  function select(id) {
    const p = people.find((x) => x.id === id);
    if (!p) return;
    selected = id;
    roster.querySelectorAll("[data-id]").forEach((n) => n.setAttribute("aria-selected", String(n.dataset.id === id)));

    const specs = specialtiesOf(p);
    const now =
      p.status === "training"
        ? `<div class="d-sec">
             <span class="k">학습 중</span>
             <div class="kv"><span>${p.training.course}</span><b>${p.training.gain} +</b></div>
             <span class="track" style="margin-top:8px"><i style="width:${Math.round((p.training.spent / p.training.total) * 100)}%"></i></span>
             <div class="kv" style="margin-top:6px"><span>${p.training.spent}/${p.training.total}분</span><b>${p.training.total - p.training.spent}분 남음</b></div>
           </div>`
        : p.task
        ? `<div class="d-sec"><span class="k">현재 업무</span><div class="kv"><span>${p.task}</span></div></div>`
        : p.back
        ? `<div class="d-sec"><span class="k">휴가</span><div class="kv"><span>${p.back}</span></div></div>`
        : `<div class="d-sec"><span class="k">현재 업무</span><div class="kv"><span>할당된 업무 없음</span></div></div>`;

    const actions =
      p.status === "training"
        ? `<button class="btn btn-secondary btn-md">학습 중단</button>`
        : p.status === "vacation"
        ? `<button class="btn btn-secondary btn-md" disabled>학습 보내기</button>
           <p style="margin:0;font-size:12px;color:var(--muted);text-align:center">휴가 중에는 학습을 보낼 수 없어요.</p>`
        : `<button class="btn btn-secondary btn-md">학습 보내기</button>
           <button class="btn btn-ghost btn-md">업무 할당</button>`;

    detail.innerHTML = `
      <div class="d-hd">
        <span class="d-av"></span>
        <span style="flex:1;min-width:0">
          <span class="d-name">${p.name}</span>
          <span class="d-role">${p.role}</span>
        </span>
        <span class="chip ${p.status}"><span class="dot ${p.status}"></span>${STATUS[p.status].label}</span>
      </div>
      <div class="d-sec">
        <div class="kv"><span>소속</span><b>${p.dept} · ${p.team}</b></div>
        <div class="kv"><span>입사</span><b>${p.joined}</b></div>
        <div class="kv"><span>완료한 업무</span><b>${p.done}건</b></div>
        <div class="kv"><span>리뷰한 PR</span><b>${p.reviews}건</b></div>
      </div>
      <div class="d-sec">
        <span class="k">전문성</span>
        ${
          specs.length
            ? `<span class="specs" style="justify-content:flex-start">${specs.map((s) => `<span class="spec-chip">${s}</span>`).join("")}</span>
               <p style="margin:8px 0 0;font-size:12px;color:var(--muted)">이 분야 PR의 리뷰어로 지정할 수 있어요.</p>`
            : `<p style="margin:0;font-size:12.5px;color:var(--muted)">아직 ${EXPERT}을 넘긴 스킬이 없어요. 학습으로 올릴 수 있어요.</p>`
        }
      </div>
      <div class="d-sec">
        <span class="k">스킬</span>
        ${SKILLS.map((s, i) => {
          const v = p.skills[i];
          return `<div class="skill">
            <span>${s}</span>
            <span class="track${v >= EXPERT ? " expert" : ""}"><i style="width:${v}%"></i><u style="left:${EXPERT}%"></u></span>
            <b>${v}</b>
          </div>`;
        }).join("")}
        <p style="margin:9px 0 0;font-size:12px;color:var(--faint)">눈금은 ${EXPERT} — 전문성이 되는 지점이에요.</p>
      </div>
      ${now}
      <div class="d-sec">
        <span class="k">성향</span>
        ${p.traits.map((t) => `<span class="trait">${t}</span>`).join("")}
      </div>
      <div class="d-acts">${actions}</div>`;
    detail.querySelector(".d-av").prepend(avatar(p.species, 52));
  }

  /* ── org chart ───────────────────────────────────────────────── */
  const org = document.getElementById("org");
  const DEPTS = [
    { name: "개발본부", teams: ["백엔드팀", "프론트엔드팀"] },
    { name: "프로덕트", teams: ["기획팀", "디자인팀"] },
  ];
  for (const d of DEPTS) {
    const inDept = people.filter((p) => p.dept === d.name);
    const box = document.createElement("div");
    box.className = "dept";
    box.innerHTML = `<div class="dept-hd"><h2>${d.name}</h2><span class="cnt">${inDept.length}</span></div>`;
    const teams = document.createElement("div");
    teams.className = "teams";
    for (const t of d.teams) {
      const inTeam = inDept.filter((p) => p.team === t);
      const wrap = document.createElement("div");
      wrap.innerHTML = `<div class="team-hd"><h3>${t}</h3><span class="cnt">${inTeam.length}</span><span class="team-line"></span></div>`;
      const grid = document.createElement("div");
      grid.className = "tgrid";
      for (const p of inTeam) {
        const c = document.createElement("button");
        c.className = "tcard";
        c.type = "button";
        c.innerHTML = `<span class="t-av"><span class="r-live" style="background:${STATUS[p.status].color}"></span></span>
          <span style="min-width:0"><span class="t-name">${p.name}</span><span class="t-role">${p.role}</span></span>`;
        c.querySelector(".t-av").prepend(avatar(p.species, 36));
        c.addEventListener("click", () => { show("list"); select(p.id); });
        grid.appendChild(c);
      }
      if (!inTeam.length) {
        const v = document.createElement("button");
        v.className = "vacant";
        v.type = "button";
        v.innerHTML = `${ICON.plus}<span>아직 아무도 없어요</span>`;
        grid.appendChild(v);
      }
      wrap.appendChild(grid);
      teams.appendChild(wrap);
    }
    box.appendChild(teams);
    org.appendChild(box);
  }

  /* ── training ────────────────────────────────────────────────── */
  const trNow = document.getElementById("trNow");
  const learners = people.filter((p) => p.status === "training");
  for (const p of learners) {
    const pct = Math.round((p.training.spent / p.training.total) * 100);
    const el = document.createElement("div");
    el.className = "tr-live";
    el.innerHTML = `
      <span class="r-av" style="width:40px;height:40px"></span>
      <span style="min-width:0">
        <span class="tr-t">${p.name} · ${p.training.course}</span>
        <span class="tr-s">${p.training.gain} 스킬이 올라요</span>
        <span class="track" style="margin-top:7px"><i style="width:${pct}%"></i></span>
      </span>
      <span class="tr-nums"><b>${pct}%</b>${p.training.total - p.training.spent}분 남음</span>`;
    el.querySelector(".r-av").prepend(avatar(p.species, 40));
    trNow.appendChild(el);
  }

  // A seat no employee can fill is the most useful thing this screen can say.
  const uncovered = SKILLS.filter((s, i) => !people.some((p) => p.skills[i] >= EXPERT));
  if (uncovered.length) {
    const n = document.createElement("div");
    n.className = "notice notice-warn";
    n.innerHTML = `
      <span class="n-ic">${ICON.alert}</span>
      <span class="n-tx">
        <b>${uncovered.join(" · ")} 리뷰를 맡을 사람이 없어요</b>
        <span>이 분야 PR이 올라오면 리뷰어를 지정할 수 없어요. 가장 가까운 직원을 학습에 보내 보세요.</span>
      </span>`;
    trNow.prepend(n);
  }

  const courses = document.getElementById("courses");
  for (const c of COURSES) {
    const i = SKILLS.indexOf(c.gain);
    const best = [...people].sort((a, b) => b.skills[i] - a.skills[i])[0];
    const covered = people.some((p) => p.skills[i] >= EXPERT);
    const el = document.createElement("div");
    el.className = "course";
    el.innerHTML = `
      <div class="c-top">
        <span class="c-ic">${ICON[c.icon]}</span>
        <span style="min-width:0">
          <span class="c-name">${c.name}</span>
          <span class="c-gain">${c.gain} 스킬</span>
        </span>
      </div>
      <div class="c-meta"><span>${c.minutes}분</span><span>${
        covered ? "전문가 있음" : `최고 ${best.name} ${best.skills[i]}`
      }</span></div>
      <div class="c-act"><button class="btn btn-secondary btn-sm" type="button">보낼 직원 고르기</button></div>`;
    courses.appendChild(el);
  }

  /* ── tabs ────────────────────────────────────────────────────── */
  function show(view) {
    for (const t of document.querySelectorAll(".tab")) {
      t.setAttribute("aria-selected", String(t.dataset.view === view));
    }
    for (const v of document.querySelectorAll(".view")) {
      v.toggleAttribute("hidden", v.id !== "view-" + view);
    }
  }
  document.getElementById("tabs").addEventListener("click", (e) => {
    const t = e.target.closest(".tab");
    if (t) show(t.dataset.view);
  });

  select("p1");
</script>
