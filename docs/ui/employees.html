<style>
  /* ═══ main ═══ */

  .view[hidden] { display: none; }

  /* ═══ list ═══ */

  .list { border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; }

  .row-item {
    display: grid; grid-template-columns: 40px minmax(0, 1.5fr) minmax(0, 1.1fr) minmax(0, auto) auto;
    align-items: center; gap: 12px; width: 100%;
    padding: 11px 14px; border-bottom: 1px solid var(--line);
    color: inherit; text-decoration: none;
  }

  .row-item:last-child { border-bottom: none; }

  .row-item:hover { background: var(--subtle); }

  .r-av { position: relative; width: 40px; height: 40px; border-radius: 11px; background: var(--subtle); display: grid; place-items: center; }

  .r-live { position: absolute; right: -3px; bottom: -3px; width: 13px; height: 13px; border-radius: 999px; border: 3px solid var(--surface); }

  .r-name { display: block; font-size: 15px; font-weight: 600; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .r-role { display: block; font-size: 14px; color: var(--muted); line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .r-dept { font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .r-mem { font-size: 14px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .r-mem b { color: var(--ink); font-weight: 600; }

  .areas { display: flex; gap: 4px; flex-wrap: wrap; }

  /* ═══ person ═══ */

  .crumb {
    display: inline-flex; align-items: center; gap: 5px; margin-bottom: 12px;
    font-size: 14px; color: var(--muted); text-decoration: none;
  }

  .crumb:hover { color: var(--ink); }

  .crumb svg { width: 14px; height: 14px; }

  .person-hd { align-items: center; }

  .person-name { display: flex; align-items: center; gap: 10px; }

  .d-av { position: relative; width: 56px; height: 56px; border-radius: 14px; background: var(--subtle); display: grid; place-items: center; flex: none; }

  .ptab[hidden] { display: none; }

  .p-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }

  @media (max-width: 1160px) { .p-grid { grid-template-columns: 1fr; } }

  .p-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

  .now-task { display: block; font-size: 17px; font-weight: 600; line-height: 1.4; margin-top: 8px; }

  .now-note { display: block; font-size: 14px; color: var(--muted); margin-top: 2px; }

  .panel-hd.with-link { display: flex; align-items: baseline; gap: 10px; }

  .panel-hd .link { margin-left: auto; font-size: 14px; color: var(--muted); background: none; border: none; padding: 0; cursor: pointer; }

  .panel-hd .link:hover { color: var(--ink); }

  .why { margin: 8px 0 0; font-size: 14px; color: var(--muted); }

  /* ═══ a person's memory ═══ */

  .mem-layout { display: grid; grid-template-columns: 212px minmax(0, 1fr); gap: 16px; align-items: start; }

  @media (max-width: 900px) { .mem-layout { grid-template-columns: 1fr; } }

  .rail { display: flex; flex-direction: column; gap: 2px; border: 1px solid var(--line); border-radius: var(--r-card); padding: 6px; }

  .rail-item {
    display: flex; align-items: center; gap: 8px; height: 34px; padding-inline: 10px;
    border: none; border-radius: 8px; background: none; font: inherit; font-size: 14px; color: var(--muted);
    text-align: left; cursor: pointer;
  }

  .rail-item:hover { background: var(--subtle); color: var(--ink); }

  .rail-item[aria-current="true"] { background: var(--brand-soft); color: var(--brand-ink); font-weight: 600; }

  .rail-item .n { margin-left: auto; font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; }

  .rail-item[aria-current="true"] .n { color: var(--brand-ink); }

  .empty-line { margin: 0; font-size: 14px; color: var(--faint); padding: 6px 0; }

  .style-form { display: flex; gap: 8px; margin-top: 10px; }

  /* ═══ memory ═══ */

  .mem-group { margin-bottom: 12px; }

  .mem-group:last-of-type { margin-bottom: 0; }

  .mem-hd { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }

  .mem-line { flex: 1; height: 1px; background: var(--line); }

  .style-line {
    display: flex; align-items: flex-start; gap: 8px; font-size: 14px;
    padding: 6px 0; border-bottom: 1px solid var(--line);
  }

  .style-line:last-of-type { border-bottom: none; }

  .style-line svg { width: 14px; height: 14px; flex: none; margin-top: 5px; color: var(--faint); }

  .style-line span { flex: 1; min-width: 0; }

  .style-line .line-menu { margin: -3px 0 -3px auto; opacity: 0; }

  .style-line .line-menu svg { margin: 0; color: currentColor; }

  .style-line:hover .line-menu, .line-menu:focus-visible, .line-menu[aria-expanded="true"] { opacity: 1; }

  .style-form.in-place { margin: 4px 0; }

  /* ═══ org chart ═══ */

  .org { display: flex; flex-direction: column; gap: 18px; }

  .dept { border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; }

  .dept-hd { display: flex; align-items: center; gap: 9px; padding: 12px 15px; background: var(--subtle); border-bottom: 1px solid var(--line); }

  .dept-hd h2 { margin: 0; font-size: 17px; font-weight: 600; }

  .cnt { font-size: 13px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-variant-numeric: tabular-nums; }

  .teams { padding: 14px 15px; display: flex; flex-direction: column; gap: 14px; }

  .team-hd { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }

  .team-hd h3 { margin: 0; font-size: 14px; font-weight: 600; color: var(--muted); }

  .team-line { flex: 1; height: 1px; background: var(--line); }

  .tgrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(206px, 1fr)); }

  .tcard {
    display: flex; align-items: center; gap: 10px; text-align: left;
    border: 1px solid var(--line); border-radius: var(--r-card); padding: 10px 12px;
    background: var(--surface); cursor: pointer; width: 100%;
  }

  .tcard:hover { border-color: var(--line-2); box-shadow: 0 2px 8px rgb(20 20 25 / .06); }

  .t-av { position: relative; width: 36px; height: 36px; border-radius: 10px; background: var(--subtle); display: grid; place-items: center; flex: none; }

  .t-name { display: block; font-size: 15px; font-weight: 600; line-height: 1.35; }

  .t-role { display: block; font-size: 13px; color: var(--muted); line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .vacant {
    display: grid; place-items: center; align-content: center; gap: 7px; min-height: 60px;
    border: 1px dashed var(--line-2); border-radius: var(--r-card); background: var(--subtle);
    color: var(--faint); font-size: 14px; cursor: pointer;
  }

  .vacant svg { width: 16px; height: 16px; }

  .vacant:hover { border-color: var(--muted); color: var(--muted); background: var(--surface); }

  /* ═══ memory tab ═══ */

  .feed-row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }

  .feed-row:last-child { border-bottom: none; }

  .f-av { width: 28px; height: 28px; border-radius: 8px; background: var(--subtle); display: grid; place-items: center; flex: none; }

  .f-tx { min-width: 0; flex: 1; font-size: 14px; line-height: 1.5; }

  .f-tx q { font-style: normal; background: var(--brand-soft); color: var(--brand-ink); border-radius: 5px; padding: 1px 5px; }

  .f-tx q::before, .f-tx q::after { content: ""; }

  .f-meta { display: block; font-size: 13px; color: var(--faint); margin-top: 1px; }

  .f-time { font-size: 13px; color: var(--faint); flex: none; white-space: nowrap; padding-top: 2px; }

  .stack { display: flex; flex-direction: column; gap: 10px; }

  /* ═══ memory scaling ═══ */

  .mem.cold-mem { border-color: var(--bad-line); background: var(--bad-wash); }


</style>

<script>
  /* ── palette and sprites ─────────────────────────────────────── */
  // B body · L belly · O eye white · A ear · H blush · N beak · E eye and mouth
  // Every sprite shares one body. Only the seven head rows change, so twenty
  // species still read as one family.

  function avatar(species, px) {
    const el = document.createElement("canvas");
    el.width = el.height = px;
    const g = el.getContext("2d");
    g.imageSmoothingEnabled = false;
    const sp = SPECIES.get(species);
    const scale = Math.max(1, Math.floor(px / 16));
    const pad = Math.floor((px - 16 * scale) / 2);
    paint(g, sp.sprite, scale, pad, pad, skin(sp));
    return el;
  }

      doneAndReviews: "Tasks · reviews", counts: (a, b) => a + " · " + b,
      timesUsed: "Memories referenced", times: (n) => n + "×",
      expertise: "Expertise",
      expertiseWhy: "Areas they have been taught. They can review PRs here too.",
      noExpertise: "No expertise yet. Teach them anything and it starts there.",
      carried: "Carried into every task", chars: (n) => n + " chars",
      fromWhere: (x) => "from " + x, toldDirectly: "Told directly",
      neverUsed: "Never used", usedTimes: (n) => "used " + n + "×",
      howTheyWork: "How they work", tellThem: "Teach them something", addStyle: "Add another rule",
      giveWork: "Give them work", nobodyYet: "Nobody here yet",
      feedTitle: "Memory in use", feedSub: "Where what you taught actually showed up.",
      referenced: (who, mem) => who + " used " + "<q>" + mem + "</q>",
      assignTitle: (n) => "Work for " + n,
      backlog: "Waiting", newTask: "Create a task", minutes: (m) => m + " min",
      broughtAlong: "What they know that helps here", broughtWhy: "They carry all of it. These are the ones in this task's area.",
      noAreaMemory: (a) => "No " + a.toLowerCase() + " memory",
      noAreaMemoryWhy: (n) => n + " does not know this area yet. Teach them a line now and they use it on this task.",
      tellNow: "Teach them now", cancel: "Cancel", assignThis: "Assign this", createAndAssign: "Create and assign",
      coldTitle: (n) => n + " memory has never been used",
      coldExample: (who, mem) => who + "'s “" + mem + "”",
      coldWhy: " — either no task has needed it yet, or it went to the wrong person.",
      review: "Take a look",
    },
  };

  const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "ko";
  const t = () => TEXT[lang];
  const dig = (o, k) => k.split(".").reduce((a, x) => a?.[x], o);
  const applyStatic = () => {
    for (const el of document.querySelectorAll("[data-t]")) {
      const v = dig(t(), el.dataset.t);
      if (typeof v === "string") el.textContent = v;
    }
    for (const el of document.querySelectorAll("[data-a]")) {
      const v = dig(t(), el.dataset.a);
      if (typeof v === "string") el.setAttribute("aria-label", v);
    }
  };
  applyStatic();

  /* ── data ────────────────────────────────────────────────────── */

  // The company's list, in its order.
  const AREA_KEYS = Object.keys(WORDS.ko.areas);

  const backlog = [
    { id: "t1", title: { ko: "결제 내역 페이지네이션", en: "Paginate the payment history" }, area: "db", minutes: 25 },
    { id: "t2", title: { ko: "주문 취소 API 추가", en: "Add an order cancellation API" }, area: "arch", minutes: 30 },
    { id: "t3", title: { ko: "에러 메시지 영문 번역", en: "Translate the error messages" }, area: "l10n", minutes: 20 },
    { id: "t4", title: { ko: "결제 웹훅 서명 검증", en: "Verify the payment webhook signature" }, area: "security", minutes: 35 },
  ];

  const people = STAFF;

  const feed = [
    { who: "p1", mem: { ko: "도메인 레이어에서 Date.now()를 쓰지 않아요", en: "No Date.now() in the domain layer" }, on: { ko: "결제 API 에러 응답 구조 변경", en: "Change the payment API error shape" }, when: { ko: "12분 전", en: "12 min ago" } },
    { who: "p2", mem: { ko: "한글에는 letter-spacing을 걸지 않아요", en: "Never track Hangul" }, on: { ko: "로그인 폼 구현", en: "Build the login form" }, when: { ko: "34분 전", en: "34 min ago" } },
    { who: "p1", mem: { ko: "복합 인덱스는 컬럼 순서가 중요해요", en: "Composite indexes care about column order" }, on: { ko: "결제 API 에러 응답 구조 변경", en: "Change the payment API error shape" }, when: { ko: "1시간 전", en: "1 hour ago" } },
    { who: "p5", mem: { ko: "배포 전에 세 개를 모두 돌려요", en: "Run all three before a deploy" }, on: { ko: "배포 파이프라인 정리", en: "Tidy the deploy pipeline" }, when: { ko: "2시간 전", en: "2 hours ago" } },
    { who: "p3", mem: { ko: "PR 설명에는 왜 했는지를 적어요", en: "A PR description says why" }, on: { ko: "API 문서 작성", en: "Write the API docs" }, when: { ko: "어제", en: "Yesterday" } },
  ];

  const ICON = {
    plus: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg>',
    alert: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.2l6 11H2z"/><path d="M8 6.6v3M8 11.4v.1"/></svg>',
    x: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>',
    task: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="2.6" y="2.6" width="10.8" height="10.8" rx="1.6"/><path d="M5.4 8.2l1.8 1.8 3.4-3.6"/></svg>',
    hand: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3.5 4.5h9M3.5 8h9M3.5 11.5h5"/></svg>',
    more: '<svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3.6" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12.4" cy="8" r="1.3"/></svg>',
    pen: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M10.6 2.8l2.6 2.6L6 12.6H3.4V10z"/></svg>',
    trash: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.8 4.4h10.4M6.2 4.4V2.8h3.6v1.6M4.2 4.4l.7 8.8h6.2l.7-8.8"/></svg>',
  };

  const josaNeeds = (w) => hasBatchim(w);
  const josa2 = (w, withFinal, without) => w + (hasBatchim(w) ? withFinal : without);

  const hasBatchim = (word) => {
    const c = word.charCodeAt(word.length - 1);
    return c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 !== 0;
  };
  const josa = (word, withFinal, withoutFinal) => (hasBatchim(word) ? withFinal : withoutFinal);

  // Prose lives beside the data it belongs to, which keeps a memory and its
  // translation from drifting apart.
  const tx = (v) => (v && typeof v === "object" ? v[lang] : v);

  // In the company's order, so an area does not jump to the top when first taught.
  const areasOf = (p) => AREA_KEYS.filter((a) => p.memories.some((m) => m.area === a));
  const usedOf = (p) => p.memories.reduce((n, m) => n + m.used, 0);
  const charsOf = (p) => p.memories.reduce((n, m) => n + tx(m.text).length, 0);

  /* ── sidebar roster ──────────────────────────────────────────── */
  const members = document.getElementById("members");
  function renderMembers() {
    members.replaceChildren();
    mountRoster(members, (p) => { location.hash = p.id; });
  }

  /* ── header ──────────────────────────────────────────────────── */
  function renderCounts() {
    document.getElementById("nList").textContent = people.length;
    document.getElementById("nMem").textContent = people.reduce((n, p) => n + p.memories.length, 0);
    document.getElementById("headSub").textContent =
      t().headSub(people.length, people.filter((p) => p.dept === "dev").length, people.filter((p) => p.dept === "product").length);
  }

  /* ── roster ──────────────────────────────────────────────────── */
  const roster = document.getElementById("roster");
  function renderRoster() {
    roster.replaceChildren();
    for (const p of people) {
      const areas = areasOf(p);
      const b = document.createElement("a");
      b.className = "row-item";
      b.href = "#" + p.id;
      b.innerHTML = `
        <span class="r-av"><span class="r-live" style="background:${STATUS[p.status].color}"></span></span>
        <span><span class="r-name">${p.name}</span><span class="r-role">${p.role}</span></span>
        <span class="r-dept">${t().depts[p.dept]} · ${t().teams[p.team]}</span>
        <span class="areas">${areas.map((a) => `<span class="area-chip">${t().areas[a]}</span>`).join("")}</span>
        <span class="r-mem">${t().memCountShort(p.memories.length)}</span>`;
      b.querySelector(".r-av").prepend(avatar(p.species, 40));
      roster.appendChild(b);
    }
  }

  /* ── person ──────────────────────────────────────────────────── */
  const personHead = document.getElementById("personHead");
  const peopleHead = document.querySelector(".head");
  const person = document.getElementById("person");
  let shown = null;
  let tab = "overview";
  let filter = "all";

  // A memory just taught is not cold: nobody has had the chance to use it.
  const isCold = (m) => m.used === 0 && !m.fresh;
  const usedLabel = (m) => (m.fresh ? t().justTaught : m.used === 0 ? t().neverUsed : t().usedTimes(m.used));

  const memCard = (m, withMenu = false) => {
    const cls = m.fresh ? "" : m.used === 0 ? "cold" : m.used >= 10 ? "hot" : "";
    const box = ["mem", isCold(m) ? "cold-mem" : "", m.flash ? "is-new" : ""].filter(Boolean).join(" ");
    const menu = withMenu
      ? `<button class="ibtn ibtn-sm mem-menu" type="button" data-mem="${shown.memories.indexOf(m)}" aria-label="${t().memMenu}" aria-expanded="false">${ICON.more}</button>`
      : "";
    return `<div class="${box}">
      ${menu}
      <span class="mem-t">${tx(m.text)}</span>
      <span class="mem-m">
        ${m.from ? ICON.task : ICON.hand}
        <span class="src">${m.from ? t().fromWhere(tx(m.from)) : t().toldDirectly}</span>
        <span class="used ${cls}">${usedLabel(m)}</span>
      </span>
    </div>`;
  };

  const byUse = (a, b) => (b.fresh ? 1 : 0) - (a.fresh ? 1 : 0) || b.used - a.used;

  function renderHead(p) {
    document.getElementById("pAv").replaceChildren(avatar(p.species, 56));
    document.getElementById("pName").textContent = p.name;
    document.getElementById("pRole").textContent = p.role + " · " + t().depts[p.dept] + " · " + t().teams[p.team];
    const chip = document.getElementById("pChip");
    chip.className = "chip " + p.status;
    chip.innerHTML = `<span class="dot ${p.status}"></span>${t().status[p.status]}`;
    document.getElementById("pnMem").textContent = p.memories.length;
    document.getElementById("pnStyle").textContent = p.style.length;
    for (const b of document.querySelectorAll("[data-ptab]")) b.setAttribute("aria-selected", String(b.dataset.ptab === tab));
    for (const el of document.querySelectorAll(".ptab")) el.hidden = el.id !== "pt-" + tab;
    document.title = "Tiny Office · " + p.name;
  }

  function renderOverview(p) {
    const now = p.task
      ? `<span class="k">${t().currentTask}</span><span class="now-task">${tx(p.task)}</span>`
      : p.back
      ? `<span class="k">${t().onLeave}</span><span class="now-task">${tx(p.back)}</span>`
      : `<span class="k">${t().nothingAssigned}</span><span class="now-note">${p.last ? t().lastFinished + " · " + tx(p.last) : t().justJoined}</span>`;

    document.getElementById("ovLeft").innerHTML = `
      <div class="panel">
        <div class="panel-hd"><h2>${t().now}</h2></div>
        <div class="panel-bd">${now}</div>
      </div>
      <div class="panel">
        <div class="panel-hd"><h2>${t().record}</h2></div>
        <div class="panel-bd">
          <div class="kv"><span>${t().joined}</span><b>${p.joined}</b></div>
          <div class="kv"><span>${t().doneAndReviews}</span><b>${t().counts(p.done, p.reviews)}</b></div>
          <div class="kv"><span>${t().timesUsed}</span><b>${t().times(usedOf(p))}</b></div>
        </div>
      </div>`;

    const seats = areasOf(p);
    const top = [...p.memories].sort(byUse).slice(0, 3);
    document.getElementById("ovRight").innerHTML = `
      <div class="panel">
        <div class="panel-hd with-link"><h2>${t().often}</h2><button class="link" type="button" data-go="memory">${t().allMemory}</button></div>
        <div class="panel-bd">${top.length ? top.map((m) => memCard(m)).join("") : `<p class="empty-line">${t().noMemory}</p>`}</div>
      </div>
      <div class="panel">
        <div class="panel-hd"><h2>${t().expertise}</h2></div>
        <div class="panel-bd">
          ${
            seats.length
              ? `<span class="areas">${seats
                  .map((a) => `<span class="area-chip">${t().areas[a]}</span>`)
                  .join("")}</span><p class="why">${t().expertiseWhy}</p>`
              : `<p class="why" style="margin:0">${t().noExpertise}</p>`
          }
        </div>
      </div>`;
  }

  function renderMemory(p) {
    const live = p.memories;
    const areas = areasOf(p);
    if (filter !== "all" && !areas.includes(filter)) filter = "all";

    const item = (key, label, n) =>
      `<button class="rail-item" type="button" data-filter="${key}" aria-current="${filter === key}"><span>${label}</span><span class="n">${n}</span></button>`;
    document.getElementById("rail").innerHTML =
      item("all", t().allAreas, live.length) +
      areas.map((a) => item(a, t().areas[a], live.filter((m) => m.area === a).length)).join("");

    let body;
    if (filter === "all") {
      body = live.length
        ? areas
            .map((a) => {
              const list = live.filter((m) => m.area === a).sort(byUse);
              return `<div class="mem-group">
                <div class="mem-hd">
                  <span class="area-chip">${t().areas[a]}</span>
                  <span class="mem-line"></span>
                  <span class="count">${list.length}</span>
                </div>
                ${list.map((m) => memCard(m, true)).join("")}
              </div>`;
            })
            .join("")
        : `<p class="empty-line">${t().noMemory}</p>`;
    } else {
      body = live.filter((m) => m.area === filter).sort(byUse).map((m) => memCard(m, true)).join("");
    }

    const title = filter === "all" ? t().memory : t().areas[filter];
    document.getElementById("memPanel").innerHTML = `
      <div class="panel-hd">
        <h2>${title}</h2>
        <p>${t().carried} · ${t().chars(charsOf(p))}</p>
      </div>
      <div class="panel-bd">
        ${body}
        <button class="mem-add" type="button" data-teach>${ICON.plus}${t().tellThem}</button>
      </div>`;
  }

  // editing: null, "new", or the index of the rule being corrected.
  function renderStyle(p, editing = null) {
    const panel = document.getElementById("stylePanel");
    const form = (cls) => `<form class="style-form${cls}" data-styleform>
        <input class="input" maxlength="80" autocomplete="off" placeholder="${t().stylePlaceholder}" aria-label="${t().addStyle}" />
        <button class="btn btn-primary btn-md" type="submit">${t().save}</button>
        <button class="btn btn-secondary btn-md" type="button" data-cancelstyle>${t().cancel}</button>
      </form>`;
    const line = (x, i) =>
      editing === i
        ? form(" in-place")
        : `<div class="style-line">${ICON.hand}<span>${tx(x)}</span><button class="ibtn ibtn-sm line-menu" type="button" data-style="${i}" aria-label="${t().styleMenu}" aria-expanded="false">${ICON.more}</button></div>`;
    panel.innerHTML = `
      <div class="panel-hd"><h2>${t().howTheyWork}</h2><p>${t().styleSub}</p></div>
      <div class="panel-bd">
        ${p.style.map(line).join("")}
        ${editing === "new" ? form("") : `<button class="mem-add" type="button" data-addstyle>${ICON.plus}${t().addStyle}</button>`}
      </div>`;
    panel.querySelector("[data-addstyle]")?.addEventListener("click", () => renderStyle(p, "new"));
    const f = panel.querySelector("[data-styleform]");
    if (!f) return;
    const input = f.querySelector("input");
    if (editing !== "new") input.value = tx(p.style[editing]);
    input.focus();
    f.addEventListener("submit", (e) => {
      e.preventDefault();
      const value = input.value.trim();
      if (value && editing === "new") p.style.push(value);
      else if (value) p.style[editing] = value;
      renderPerson(p);
    });
    panel.querySelector("[data-cancelstyle]").addEventListener("click", () => renderStyle(p));
  }

  function renderPerson(p) {
    renderHead(p);
    renderOverview(p);
    renderMemory(p);
    renderStyle(p);
    for (const m of p.memories) m.flash = false;
  }

  function teach(p, area = null, then = null) {
    openTeach({
      to: p,
      area: area ?? (filter !== "all" ? filter : null),
      onSave: ({ memory }) => {
        p.memories.unshift({ ...memory, used: 0, fresh: true, flash: true });
        // What was just taught stays in view.
        if (filter !== "all") filter = memory.area;
        if (tab !== "memory" && !then) location.hash = p.id + "/memory";
        else renderPerson(p);
        then?.();
      },
    });
  }

  document.getElementById("pTeach").addEventListener("click", () => teach(shown));
  document.getElementById("pAssign").addEventListener("click", () => openAssign(shown));
  document.getElementById("pTabs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-ptab]");
    if (b) location.hash = shown.id + (b.dataset.ptab === "overview" ? "" : "/" + b.dataset.ptab);
  });
  person.addEventListener("click", (e) => {
    const go = e.target.closest("[data-go]");
    if (go) location.hash = shown.id + "/" + go.dataset.go;
    const f = e.target.closest("[data-filter]");
    if (f) {
      filter = f.dataset.filter;
      renderMemory(shown);
    }
    if (e.target.closest("[data-teach]")) teach(shown);
    const more = e.target.closest("[data-mem]");
    if (more) openMemMenu(more);
    const rule = e.target.closest("[data-style]");
    if (rule) openStyleMenu(rule);
  });

  /* ── a memory or a rule, and what the player can do about it ── */
  const editOrRemove = (btn, onEdit, onRemove) =>
    openRowMenu(btn, [
      { label: t().edit, icon: ICON.pen, run: onEdit },
      { label: t().remove, icon: ICON.trash, bad: true, confirm: t().removeWhy, run: onRemove },
    ], { keep: t().keep });

  function openMemMenu(btn) {
    const p = shown;
    const m = p.memories[Number(btn.dataset.mem)];
    editOrRemove(
      btn,
      () => openTeach({
        to: p,
        edit: m,
        onSave: ({ memory }) => {
          Object.assign(m, { area: memory.area, text: memory.text, from: memory.from, flash: true });
          renderPerson(p);
        },
      }),
      () => {
        p.memories.splice(p.memories.indexOf(m), 1);
        renderPerson(p);
      },
    );
  }

  function openStyleMenu(btn) {
    const p = shown;
    const i = Number(btn.dataset.style);
    editOrRemove(
      btn,
      () => renderStyle(p, i),
      () => {
        p.style.splice(i, 1);
        renderPerson(p);
      },
    );
  }

  /* ── org chart ───────────────────────────────────────────────── */
  const org = document.getElementById("org");
  const DEPTS = [
    { name: "dev", teams: ["backend", "frontend"] },
    { name: "product", teams: ["planning", "design"] },
  ];
  function renderOrg() {
    org.replaceChildren();
    for (const d of DEPTS) {
      const inDept = people.filter((p) => p.dept === d.name);
      const box = document.createElement("div");
      box.className = "dept";
      box.innerHTML = `<div class="dept-hd"><h2>${t().depts[d.name]}</h2><span class="cnt">${inDept.length}</span></div>`;
      const teams = document.createElement("div");
      teams.className = "teams";
      for (const team of d.teams) {
        const inTeam = inDept.filter((p) => p.team === team);
        const wrap = document.createElement("div");
        wrap.innerHTML = `<div class="team-hd"><h3>${t().teams[team]}</h3><span class="cnt">${inTeam.length}</span><span class="team-line"></span></div>`;
        const grid = document.createElement("div");
        grid.className = "tgrid";
        for (const p of inTeam) {
          const c = document.createElement("button");
          c.className = "tcard";
          c.type = "button";
          c.innerHTML = `<span class="t-av"><span class="r-live" style="background:${STATUS[p.status].color}"></span></span>
            <span style="min-width:0"><span class="t-name">${p.name}</span><span class="t-role">${p.role} · ${t().memCount(p.memories.length)}</span></span>`;
          c.querySelector(".t-av").prepend(avatar(p.species, 36));
          c.addEventListener("click", () => { location.hash = p.id; });
          grid.appendChild(c);
        }
        if (!inTeam.length) {
          const v = document.createElement("button");
          v.className = "vacant";
          v.type = "button";
          v.dataset.hire = team;
          v.innerHTML = `${ICON.plus}<span>${t().nobodyYet}</span>`;
          grid.appendChild(v);
        }
        wrap.appendChild(grid);
        teams.appendChild(wrap);
      }
      box.appendChild(teams);
      org.appendChild(box);
    }
  }

  /* ── hiring ──────────────────────────────────────────────────── */
  // The samples' today.
  const TODAY = "2026. 9. 26.";

  function hire(team = null) {
    openHire({
      team,
      onSave: (h) => {
        const p = {
          ...h, id: "p" + (people.length + 1), status: "available", joined: TODAY,
          done: 0, reviews: 0, style: [], memories: [],
        };
        people.push(p);
        renderCounts();
        renderRoster();
        renderOrg();
        renderMembers();
        location.hash = p.id;
      },
    });
  }
  document.getElementById("hireBtn").addEventListener("click", () => hire());
  org.addEventListener("click", (e) => {
    const v = e.target.closest("[data-hire]");
    if (v) hire(v.dataset.hire);
  });

  renderMembers();
  renderCounts();
  renderRoster();
  renderOrg();

  /* ── memory tab ──────────────────────────────────────────────── */
  const notices = document.getElementById("memNotices");

  // Memory nobody ever used is something this screen knows that the player
  // cannot see anywhere else.
  const cold = people.flatMap((p) => p.memories.filter(isCold).map((m) => ({ p, m })));
  if (cold.length) {
    const n = document.createElement("div");
    n.className = "notice notice-bad";
    n.innerHTML = `
      <span class="n-ic">${ICON.x}</span>
      <span class="n-tx">
        <b>${t().coldTitle(cold.length)}</b>
        <span>${t().coldExample(cold[0].p.name, tx(cold[0].m.text))} ${t().coldWhy}</span>
      </span>
      <span class="n-acts"><button class="btn btn-secondary btn-sm" type="button">${t().review}</button></span>`;
    notices.appendChild(n);
  }

  const feedBox = document.getElementById("feed");
  for (const f of feed) {
    const p = people.find((x) => x.id === f.who);
    const el = document.createElement("div");
    el.className = "feed-row";
    el.innerHTML = `
      <span class="f-av"></span>
      <span class="f-tx">${t().referenced(p.name, tx(f.mem))}<span class="f-meta">${tx(f.on)}</span></span>
      <span class="f-time">${tx(f.when)}</span>`;
    el.querySelector(".f-av").appendChild(avatar(p.species, 28));
    feedBox.appendChild(el);
  }

  /* ── assign ──────────────────────────────────────────────────── */
  const scrim = document.getElementById("scrim");
  const modal = document.getElementById("modal");
  let assignee = null;
  let picked = backlog[0].id;

  let firstPaint = true;

  function renderAssign() {
    const p = assignee;
    const task = backlog.find((t) => t.id === picked);
    // The point of teaching shows up here: what this person brings to this task.
    const useful = task ? p.memories.filter((m) => m.area === task.area).sort((x, y) => y.used - x.used) : [];

    modal.innerHTML = `
      <div class="m-hd">
        <span class="m-av"></span>
        <span style="flex:1;min-width:0">
          <span class="m-t">${t().assignTitle(p.name)}</span>
          <span class="m-s">${p.role} · ${t().teams[p.team]}</span>
        </span>
      </div>

      <div class="m-sec">
        <span class="k">${t().backlog}</span>
        ${backlog
          .map(
            (task_) => `<button class="pick" type="button" role="radio" data-task="${task_.id}"
                      aria-checked="${task_.id === picked}">
                <span class="radio"></span>
                <span class="pick-t">${tx(task_.title)}</span>
                <span class="area-chip">${t().areas[task_.area]}</span>
                <span class="pick-m">${t().minutes(task_.minutes)}</span>
              </button>`,
          )
          .join("")}
        <button class="pick pick-new" type="button" role="radio" data-task="new" aria-checked="${picked === "new"}">
          <span class="radio"></span>
          <span class="pick-t">${t().newTask}</span>
          <span></span><span></span>
        </button>
      </div>

      ${
        task
          ? `<div class="m-sec">
               <span class="k">${t().broughtAlong} <span class="kn">${useful.length}</span></span>
               <p class="hint" style="margin:-2px 0 10px">${t().broughtWhy}</p>
               ${
                 useful.length
                   ? useful.map(memCard).join("")
                   : `<div class="notice notice-warn">
                        <span class="n-ic">${ICON.alert}</span>
                        <span class="n-tx">
                          <b>${t().noAreaMemory(t().areas[task.area])}</b>
                          <span>${t().noAreaMemoryWhy(p.name)}</span>
                        </span>
                        <span class="n-acts"><button class="btn btn-secondary btn-sm" type="button" data-tellnow>${t().tellNow}</button></span>
                      </div>`
               }
             </div>`
          : ""
      }

      <div class="m-foot">
        <button class="btn btn-secondary btn-md" type="button" data-close>${t().cancel}</button>
        <button class="btn btn-primary btn-md" type="button">${task ? t().assignThis : t().createAndAssign}</button>
      </div>`;

    modal.querySelector(".m-av").appendChild(avatar(p.species, 44));
    modal.querySelectorAll("[data-task]").forEach((b) =>
      b.addEventListener("click", () => {
        picked = b.dataset.task;
        renderAssign();
      }),
    );
    modal.querySelector("[data-close]").addEventListener("click", closeAssign);
    // Teaching here returns to the same task, which now shows what was taught.
    modal.querySelector("[data-tellnow]")?.addEventListener("click", () => {
      const keep = picked;
      closeAssign();
      teach(p, task.area, () => openAssign(p, keep));
    });
    // Re-rendering must not pull focus out of the list: only the first paint
    // sends it to Cancel, afterwards it returns to the row just picked.
    const back = modal.querySelector(`[data-task="${picked}"]`);
    (firstPaint || !back ? modal.querySelector("[data-close]") : back).focus({ preventScroll: true });
    firstPaint = false;
  }

  function openAssign(p, keep = null) {
    assignee = p;
    picked = keep ?? backlog[0].id;
    firstPaint = true;
    scrim.hidden = false;
    renderAssign();
  }
  function closeAssign() {
    scrim.hidden = true;
    assignee = null;
  }
  scrim.addEventListener("pointerdown", (e) => { if (e.target === scrim) closeAssign(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !scrim.hidden) closeAssign(); });

  /* ── tabs ────────────────────────────────────────────────────── */
  let view = "list";
  function show(next) {
    view = next;
    for (const t of document.querySelectorAll("#tabs .tab")) {
      t.setAttribute("aria-selected", String(t.dataset.view === view));
    }
    for (const v of document.querySelectorAll(".view")) {
      v.toggleAttribute("hidden", shown !== null || v.id !== "view-" + view);
    }
  }
  document.getElementById("tabs").addEventListener("click", (e) => {
    const t = e.target.closest(".tab");
    if (t) show(t.dataset.view);
  });

  /* ── route ───────────────────────────────────────────────────── */
  // The list and a person are separate pages that share one file: the hash
  // names the person and, after a slash, their tab. No hash is the list.
  function route() {
    const [id, sub] = location.hash.slice(1).split("/");
    const next = people.find((x) => x.id === id) ?? null;
    if (next !== shown) filter = "all";
    shown = next;
    tab = ["memory", "style"].includes(sub) ? sub : "overview";
    closeRowMenu();
    personHead.hidden = person.hidden = !shown;
    peopleHead.hidden = !!shown;
    members.querySelectorAll(".member").forEach((m) => {
      if (m.dataset.id === shown?.id) m.setAttribute("aria-current", "page");
      else m.removeAttribute("aria-current");
    });
    if (shown) renderPerson(shown);
    else document.title = "Tiny Office · People";
    show(view);
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
</script>
