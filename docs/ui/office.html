<meta charset="utf-8" />
<title>Tiny Office · Office</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
/>
<link rel="stylesheet" href="system.css" />
<script src="system.js"></script>
<style>
  body {
    margin: 0;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    background: var(--page);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
    padding: 22px 18px 40px;
  }

  button { font: inherit; color: inherit; }

  /* ═══ buttons ═══ */

  .btn:focus-visible, .ibtn:focus-visible, .desk:focus-visible, .mrow:focus-visible,
  .c-menu:focus-visible, .member:focus-visible,
  .tab:focus-visible, .nav a:focus-visible {
    outline: 2px solid var(--brand); outline-offset: 2px;
  }

  /* ═══ sidebar ═══ */

  .logo { width: 26px; height: 26px; border-radius: 7px; background: var(--ink); display: grid; place-items: center; flex: none; }

  .logo svg { width: 14px; height: 14px; color: #fff; }

  /* ═══ main ═══ */

  h1 { margin: 0; font-size: 23px; font-weight: 600; letter-spacing: -.01em; }

  .sub { display: block; font-size: 13px; color: var(--muted); margin-top: 1px; }

  .ghost-note { font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; }

  /* ═══ office ═══ */

  .room { display: block; border-radius: 6px; image-rendering: pixelated; }

  .desk { position: absolute; padding: 0; background: none; border: 2px solid transparent; border-radius: 7px; cursor: pointer; }

  .desk:hover { border-color: rgb(255 255 255 / .9); }

  .desk[aria-expanded="true"] { border-color: #fff; background: rgb(255 255 255 / .18); }


  /* ═══ team cards ═══ */

  .grp { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }

  .grp h2 { margin: 0; font-size: 15px; font-weight: 600; }

  .card:hover { box-shadow: 0 2px 10px rgb(20 20 25 / .07); }

  .card:has([aria-expanded="true"]) { border-color: var(--line-2); box-shadow: 0 4px 18px rgb(20 20 25 / .11); }

  .c-av canvas { border-radius: 10px; }

  .c-nums span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .c-menu {
    position: absolute; top: 11px; right: 9px;
    width: 26px; height: 26px; border: none; border-radius: 7px;
    background: none; color: var(--faint); cursor: pointer;
    display: grid; place-items: center;
  }

  .c-menu:hover, .c-menu[aria-expanded="true"] { background: var(--subtle); color: var(--ink); }

  .c-menu svg { width: 15px; height: 15px; }

  /* ═══ anchored popover ═══ */


  .p-av canvas { border-radius: 9px; }

  .p-nums span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Menu rows replace buttons inside the popover: a card never carries a
     near-black primary. The first row is the one the player came for. */

  .chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: 11.5px; font-weight: 600; flex: none; }

  .track { display: block; height: 4px; border-radius: 999px; background: var(--sunk); overflow: hidden; }

  @media (max-width: 960px) {
    .app { grid-template-columns: 1fr; }
    .side { border-bottom: 1px solid var(--line-2); }
  }
</style>

<div class="app">
  <!-- ═══ sidebar ═══ -->
  <nav class="side">
    <div class="side-top">
      <span class="logo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M2 6.5L8 2l6 4.5V13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/></svg></span>
      <span class="side-id">
        <span class="side-name">MY TINY OFFICE</span>
        <span class="side-ver">v0.1.0</span>
      </span>
    </div>

    <div class="nav">
      <a href="#" aria-current="page"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="2.5" y="3.5" width="13" height="11.5" rx="1.5"/><path d="M6 7.5h1.8M10.2 7.5H12M6 11h1.8M10.2 11H12"/></svg><span data-t="nav.office">사무실</span></a>
      <a href="projects.html"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M2.5 5.5h4.5L8.5 8h7v6.5h-13z"/></svg><span data-t="nav.projects">프로젝트</span></a>
      <a href="employees.html"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="6" r="2.8"/><path d="M3.5 15c0-3 2.5-5.5 5.5-5.5s5.5 2.5 5.5 5.5"/></svg><span data-t="nav.people">직원</span></a>
      <a href="#"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3.5 14.5v-3.5M9 14.5v-7M14.5 14.5v-10.5"/></svg><span data-t="nav.company">회사</span></a>
    </div>

    <div class="rule"></div>
    <div id="members"></div>

    <div class="side-foot">
      <div class="rule" style="margin:0 4px 8px"></div>
      <div class="nav">
        <a href="#"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="9" r="2.6"/><path d="M9 1.8v2M9 14.2v2M1.8 9h2M14.2 9h2M3.9 3.9l1.4 1.4M12.7 12.7l1.4 1.4M14.1 3.9l-1.4 1.4M5.3 12.7l-1.4 1.4"/></svg><span data-t="nav.settings">설정</span></a>
      </div>
    </div>
  </nav>

  <!-- ═══ main ═══ -->
  <div class="main">
    <div class="head">
      <div class="head-row">
        <span>
          <h1 data-t="title">사무실</h1>
          <span class="sub" data-t="sub">백엔드팀 · 책상 6석 중 5석 사용</span>
        </span>
        <div class="head-right">
          <span class="ghost-note" data-t="date">2026. 9. 26. (토) 10:24</span>
          <button class="btn btn-primary btn-lg"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg><span data-t="hire">직원 고용</span></button>
        </div>
      </div>

      <div class="tabs">
        <button class="tab" aria-selected="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="3" width="12" height="10" rx="1.4"/></svg><span data-t="tabs.all">전체</span><span class="n">5</span></button>
        <button class="tab"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 4h12M2 8h12M2 12h7"/></svg><span data-t="tabs.backend">백엔드팀</span><span class="n">3</span></button>
        <button class="tab"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2.5" width="12" height="11" rx="1.4"/><path d="M2 6h12"/></svg><span data-t="tabs.frontend">프론트엔드팀</span><span class="n">2</span></button>
        <button class="tab"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3l2 1.5"/></svg><span data-t="tabs.lounge">휴게실</span><span class="n">0</span></button>
        <button class="tab" data-a="addRoom" aria-label="방 추가" style="color:var(--faint)">+</button>
      </div>
    </div>

    <div class="body">
      <div class="stage">
        <div class="room-wrap">
          <canvas class="room" aria-hidden="true" id="room" width="864" height="384"></canvas>
          <div class="overlay" id="overlay"></div>
        </div>
      </div>
      <div id="teams"></div>
    </div>
  </div>
</div>

<div class="pop" id="pop" role="dialog" aria-label="직원 행동"></div>

<script>
  /* ── pixel tiles ─────────────────────────────────────────────── */

  // B body · L belly · O eye white · A ear · H blush · N beak · E eye and mouth
  // Every sprite shares one body. Only the seven head rows change, so twenty
  // species still read as one family.

  function drawAvatar(el, species) {
    const c = el.getContext("2d");
    c.clearRect(0, 0, el.width, el.height);
    c.imageSmoothingEnabled = false;
    const sp = SPECIES.get(species);
    const scale = Math.max(1, Math.floor(el.width / 16));
    const pad = Math.floor((el.width - 16 * scale) / 2);
    paint(c, sp.sprite, scale, pad, pad, skin(sp));
  }

  /* ── i18n ────────────────────────────────────────────────────── */
  // Employee nicknames are absent on purpose: the player wrote them, so they
  // never go through a dictionary.
  const TEXT = {
    ko: {
      ...WORDS.ko,
      hire: "직원 고용", hireDesk: "빈 책상에 직원 채우기",
      emptyDesk: "빈 책상", emptySeat: "빈 자리", addRoom: "방 추가",
      title: "사무실", sub: "백엔드팀 · 책상 6석 중 5석 사용", date: "2026. 9. 26. (토) 10:24",
      tabs: { all: "전체", backend: "백엔드팀", frontend: "프론트엔드팀", lounge: "휴게실" },
      work: "업무", noTask: "할당된 업무 없음", away: "자리 비움",
      minutes: (a, b) => a + "/" + b + "분", estimate: (m) => "예상 " + m + "분",
      notStarted: "시작 전", waiting: "대기", onLeave: "휴가", deskFree: "지금은 비어 있습니다",
      inProgress: "진행 중", assigned: "할당된 업무", lastDone: "최근 완료", vacationLabel: "휴가",
      actions: {
        complete: "완료 처리", detail: "업무 상세", reassign: "담당 변경",
        start: "업무 시작", swap: "다른 업무로 교체", unassign: "할당 취소",
        assign: "업무 할당", train: "교육 보내기", leave: "휴가 보내기", comeBack: "복귀 처리",
      },
      cannotAssign: "휴가 중에는 업무를 맡길 수 없습니다.",
      actionOf: (n) => n + " 행동",
      tasks: { pay: "결제 API 에러 응답 구조 변경", login: "로그인 폼 구현", docs: "API 문서 작성" },
      lastIndex: "인덱스 튜닝 완료", backIn: "3일 후 복귀",
    },
    en: {
      ...WORDS.en,
      hire: "Hire", hireDesk: "Fill this desk",
      emptyDesk: "Empty desk", emptySeat: "Empty", addRoom: "Add a room",
      title: "Office", sub: "Backend · 5 of 6 desks in use", date: "Sat, Sep 26, 2026 · 10:24",
      tabs: { all: "All", backend: "Backend", frontend: "Frontend", lounge: "Lounge" },
      work: "WORK", noTask: "Nothing assigned", away: "Away",
      minutes: (a, b) => a + "/" + b + " min", estimate: (m) => "~" + m + " min",
      notStarted: "Not started", waiting: "Free", onLeave: "Leave", deskFree: "Nothing on right now",
      inProgress: "In progress", assigned: "Assigned", lastDone: "Last finished", vacationLabel: "On leave",
      actions: {
        complete: "Mark done", detail: "Task details", reassign: "Reassign",
        start: "Start work", swap: "Swap the task", unassign: "Unassign",
        assign: "Assign work", train: "Send to training", leave: "Send on leave", comeBack: "Bring back",
      },
      cannotAssign: "They cannot take work while on leave.",
      actionOf: (n) => "Actions for " + n,
      tasks: { pay: "Change the payment API error shape", login: "Build the login form", docs: "Write the API docs" },
      lastIndex: "Finished tuning indexes", backIn: "Back in 3 days",
    },
  };

  const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "ko";
  const t = () => TEXT[lang];
  const dig = (o, k) => k.split(".").reduce((a, x) => a?.[x], o);
  const applyStatic = () => {
    for (const el of document.querySelectorAll("[data-t]")) {
      const v = dig(t(), el.dataset.t);
      if (typeof v === "string") el.textContent = v;
    }
    for (const el of document.querySelectorAll("[data-a]")) {
      const v = dig(t(), el.dataset.a);
      if (typeof v === "string") el.setAttribute("aria-label", v);
    }
  };
  applyStatic();

  /* ── data ────────────────────────────────────────────────────── */
  // Status mirrors the domain: a task is working or ready, an employee is
  // available or on vacation. The actions offered follow from that alone.
  const label = (k) => t().status[k];

  // The nickname is the player's; the species only picks a sprite.
  const people = [
    { id: "p1", name: "모카", species: "cat", role: "Backend Engineer", team: "backend", col: 3, row: 3,
      status: "working", task: { key: "pay", spent: 22, total: 30 } },
    { id: "p2", name: "두부", species: "bunny", role: "Frontend Engineer", team: "frontend", col: 8, row: 3,
      status: "working", task: { key: "login", spent: 12, total: 25 } },
    { id: "p3", name: "단풍", species: "deer", role: "Product Manager", team: "backend", col: 13, row: 3,
      status: "ready", task: { key: "docs", spent: 0, total: 20 } },
    { id: "p4", name: "삐약", species: "chick", role: "DBA", team: "backend", col: 3, row: 6,
      status: "available", last: "lastIndex" },
    { id: "p5", name: "완두", species: "frog", role: "DevOps Engineer", team: "frontend", col: 8, row: 6,
      status: "vacation", back: "backIn" },
    { id: null, col: 13, row: 6 },
  ];
  const staffed = people.filter((p) => p.id);
  const byId = new Map(staffed.map((p) => [p.id, p]));
  const pct = (p) => (p.task ? Math.round((p.task.spent / p.task.total) * 100) : 0);

  /* ── the room ────────────────────────────────────────────────── */
  const S = 3, T = 48;
  const room = document.getElementById("room");
  const ctx = room.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  for (let y = 0; y < 8; y++) for (let x = 0; x < 18; x++) paint(ctx, TILES.floor, S, x * T, y * T);
  for (let x = 0; x < 18; x++) paint(ctx, TILES.wall, S, x * T, 0);
  for (const [t, x, y] of [["window",2,0],["window",3,0],["board",8,0],["board",9,0],["shelf",14,0],["plant",0,7],["plant",17,7]])
    paint(ctx, TILES[t], S, x * T, y * T);
  for (const p of people) {
    const dx = p.col * T, dy = p.row * T;
    paint(ctx, CHAIR, S, dx, dy - T);
    if (p.id) paint(ctx, SPECIES.get(p.species).sprite, S, dx, dy - T, skin(SPECIES.get(p.species)));
    paint(ctx, TILES.deskL, S, dx, dy);
    paint(ctx, TILES.deskR, S, dx + T, dy);
    paint(ctx, MONITOR, S, dx + T / 2, dy - 2 * S, { M: p.status === "working" ? P.M : P.o });
  }

  const overlay = document.getElementById("overlay");
  for (const p of people) {
    const btn = document.createElement("button");
    btn.className = "desk";
    btn.type = "button";
    if (p.id) btn.dataset.id = p.id;
    btn.style.left = p.col * T - 4 + "px";
    btn.style.top = p.row * T - T - 6 + "px";
    btn.style.width = 2 * T + 8 + "px";
    btn.style.height = 2 * T + 10 + "px";
    btn.setAttribute("aria-label", p.id ? p.name : t().emptyDesk);
    if (p.id) btn.addEventListener("click", (e) => open(p.id, btn, e.detail === 0));
    overlay.appendChild(btn);

    const tag = document.createElement("span");
    tag.className = "tag";
    tag.style.left = p.col * T + T + "px";
    tag.style.top = p.row * T + T + 4 + "px";
    tag.textContent = p.id ? p.name : t().emptySeat;
    if (!p.id) tag.style.opacity = ".7";
    overlay.appendChild(tag);
    if (!p.id) continue;

    const bub = document.createElement("span");
    bub.className = "bub";
    bub.style.left = p.col * T + T + "px";
    bub.style.top = p.row * T - T - 24 + "px";
    bub.innerHTML = '<span class="dot ' + p.status + '"></span>' + label(p.status);
    overlay.appendChild(bub);
  }

  /* ── sidebar roster ──────────────────────────────────────────── */
  mountRoster(document.getElementById("members"), (p, el, viaKey) => open(p.id, el, viaKey));
  /* ── team cards ──────────────────────────────────────────────── */
  function cardInner(p) {
    const v = pct(p);
    const bar =
      p.status === "working" ? `<i style="width:${v}%;background:var(--warn)"></i>`
      : p.status === "ready" ? `<i style="width:3%;background:var(--info)"></i>`
      : p.status === "available" ? `<i style="width:100%;background:var(--ok)"></i>`
      : "";
    const nums =
      p.status === "working" ? `<span>${t().minutes(p.task.spent, p.task.total)}</span><b>${v}%</b>`
      : p.status === "ready" ? `<span>${t().estimate(p.task.total)}</span><b>${t().notStarted}</b>`
      : p.status === "available" ? `<span>${t()[p.last]}</span><b>${t().waiting}</b>`
      : `<span>${t()[p.back]}</span><b>${t().onLeave}</b>`;
    const line =
      p.status === "working" || p.status === "ready" ? t().tasks[p.task.key]
      : p.status === "available" ? t().noTask
      : t().away;
    return `
      <button class="c-menu" type="button" data-id="${p.id}" aria-haspopup="dialog" aria-expanded="false" aria-label="${t().actionOf(p.name)}"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="3.2" r="1.35"/><circle cx="8" cy="8" r="1.35"/><circle cx="8" cy="12.8" r="1.35"/></svg></button>
      <span class="c-av">
        <canvas aria-hidden="true" width="34" height="34"></canvas>
        <span class="c-live" style="background:${STATUS[p.status].color}"></span>
      </span>
      <span class="c-name">${p.name}</span>
      <span class="c-role">${p.role}</span>
      <span class="c-rule"></span>
      <span class="c-k">${t().work}</span>
      <span class="c-task">${line}</span>
      <span class="meter">${bar}</span>
      <span class="c-nums">${nums}</span>`;
  }

  const teams = document.getElementById("teams");
  for (const team of ["backend", "frontend"]) {
    const group = staffed.filter((p) => p.team === team);
    const wrap = document.createElement("div");
    wrap.style.marginBottom = "18px";
    wrap.innerHTML = `<div class="grp"><h2>${t().teams[team]}</h2><span class="cnt">${group.length}</span></div>`;
    const grid = document.createElement("div");
    grid.className = "cards";
    for (const p of group) {
      const c = document.createElement("div");
      c.className = "card";
      if (p.status === "vacation") c.style.opacity = ".72";
      c.innerHTML = cardInner(p);
      c.addEventListener("click", (e) => open(p.id, c, e.detail === 0));
      grid.appendChild(c);
      drawAvatar(c.querySelector("canvas"), p.species);
    }
    if (team === "backend") {
      const add = document.createElement("button");
      add.className = "addcard";
      add.type = "button";
      add.innerHTML =
        '<span class="plus"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg></span>' + t().hireDesk;
      grid.appendChild(add);
    }
    wrap.appendChild(grid);
    teams.appendChild(wrap);
  }

  /* ── anchored popover ────────────────────────────────────────── */
  const I = {
    check: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.4l3.2 3.2L13 4.8"/></svg>',
    play: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 3.4l7.6 4.6L5 12.6z"/></svg>',
    plus: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg>',
    swap: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5h9.5l-2.4-2.4M13 10.5H3.5l2.4 2.4"/></svg>',
    book: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M2.8 3.2h3.6A1.8 1.8 0 0 1 8 5v8a1.6 1.6 0 0 0-1.6-1.4H2.8zM13.2 3.2H9.6A1.8 1.8 0 0 0 8 5v8a1.6 1.6 0 0 1 1.6-1.4h3.6z"/></svg>',
    info: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M8 7.3v4M8 5.1v.1"/></svg>',
    sun: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="2.6"/><path d="M8 1.6v1.6M8 12.8v1.6M1.6 8h1.6M12.8 8h1.6M3.5 3.5l1.1 1.1M11.4 11.4l1.1 1.1M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1"/></svg>',
    undo: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.6 3.8v3.4h3.4"/><path d="M4 7.2a4.6 4.6 0 1 1 .8 4.4"/></svg>',
  };

  // Only transitions the domain allows from this state. The first row is the
  // one the player came here for.
  const ACTIONS = {
    working: [
      { icon: I.check, label: t().actions.complete, key: true },
      { icon: I.info, label: t().actions.detail },
      { icon: I.swap, label: t().actions.reassign },
    ],
    ready: [
      { icon: I.play, label: t().actions.start, key: true },
      { icon: I.swap, label: t().actions.swap },
      { icon: I.undo, label: t().actions.unassign, bad: true },
    ],
    available: [
      { icon: I.plus, label: t().actions.assign, key: true },
      { icon: I.book, label: t().actions.train },
      { icon: I.sun, label: t().actions.leave },
    ],
    vacation: [
      { icon: I.plus, label: t().actions.assign, key: true, off: t().cannotAssign },
      { icon: I.undo, label: t().actions.comeBack },
    ],
  };

  const pop = document.getElementById("pop");
  let anchor = null;

  function stateBlock(p) {
    const v = pct(p);
    if (p.status === "working")
      return `<span class="c-k">${t().inProgress}</span><span class="c-task">${t().tasks[p.task.key]}</span>
        <span class="track" style="margin-top:9px"><i style="width:${v}%;background:var(--warn)"></i></span>
        <span class="p-nums"><span>${t().minutes(p.task.spent, p.task.total)}</span><b>${v}%</b></span>`;
    if (p.status === "ready")
      return `<span class="c-k">${t().assigned}</span><span class="c-task">${t().tasks[p.task.key]}</span>
        <span class="p-nums"><span>${t().estimate(p.task.total)}</span><b>${t().notStarted}</b></span>`;
    if (p.status === "available")
      return `<span class="c-k">${t().lastDone}</span><span class="c-task">${t()[p.last]}</span>
        <span class="p-nums"><span>${t().deskFree}</span><b>${t().waiting}</b></span>`;
    return `<span class="c-k">${t().vacationLabel}</span><span class="c-task">${t()[p.back]}</span>`;
  }

  function open(id, el, viaKey) {
    const p = byId.get(id);
    if (!p) return;
    if (anchor === el && pop.hasAttribute("data-open")) { close(); return; }

    document.querySelectorAll("[data-id]").forEach((n) => {
      n.setAttribute("aria-expanded", String(n.dataset.id === id));
    });

    const rows = ACTIONS[p.status]
      .map((a) => {
        const cls = ["mrow", a.key ? "mrow-key" : "", a.bad ? "mrow-bad" : ""].filter(Boolean).join(" ");
        const row = `<button class="${cls}" type="button"${a.off ? " disabled" : ""}>${a.icon}${a.label}</button>`;
        return a.off ? row + `<p class="p-why">${a.off}</p>` : row;
      })
      .join("");

    pop.innerHTML = `
      <div class="p-hd">
        <span class="p-av">
          <canvas aria-hidden="true" width="32" height="32"></canvas>
          <span class="c-live" style="background:${STATUS[p.status].color}"></span>
        </span>
        <span style="flex:1;min-width:0">
          <span class="p-name">${p.name}</span>
          <span class="p-role">${p.role}</span>
        </span>
        <span class="chip ${p.status}"><span class="dot ${p.status}"></span>${label(p.status)}</span>
      </div>
      <div class="p-rule"></div>
      <div class="p-state">${stateBlock(p)}</div>
      <div class="p-rule"></div>
      <div class="p-acts">${rows}</div>`;
    drawAvatar(pop.querySelector("canvas"), p.species);

    anchor = el;
    pop.setAttribute("data-open", "");
    place(el);
    if (viaKey) {
      const first = pop.querySelector(".mrow:not(:disabled)");
      if (first) first.focus({ preventScroll: true });
    }
  }

  function place(el) {
    const r = el.getBoundingClientRect();
    const w = pop.offsetWidth, h = pop.offsetHeight, gap = 8, edge = 12;
    let left = r.right + gap;
    if (left + w > innerWidth - edge) left = r.left - w - gap;
    if (left < edge) left = Math.min(Math.max(edge, r.left), innerWidth - w - edge);
    let top = Math.min(r.top, innerHeight - h - edge);
    pop.style.left = Math.round(left) + "px";
    pop.style.top = Math.round(Math.max(edge, top)) + "px";
  }

  function close() {
    pop.removeAttribute("data-open");
    document.querySelectorAll("[data-id]").forEach((n) => n.setAttribute("aria-expanded", "false"));
    anchor = null;
  }

  document.addEventListener("pointerdown", (e) => {
    // The anchor closes itself on the click that follows; closing here first
    // would clear it and let that click reopen the popover.
    if (!anchor || pop.contains(e.target) || anchor.contains(e.target)) return;
    if (!e.target.closest("[data-id]")) close();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || !anchor) return;
    // A card is a plain container, so focus returns to its kebab button.
    const back = anchor.matches("[data-id]") ? anchor : anchor.querySelector("[data-id]");
    close();
    if (back) back.focus({ preventScroll: true });
  });
  addEventListener("resize", () => { if (anchor) place(anchor); });
  addEventListener("scroll", () => { if (anchor) place(anchor); }, true);
</script>
