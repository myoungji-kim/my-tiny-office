<meta charset="utf-8" />
<title>Tiny Office · Office</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
/>
<link rel="stylesheet" href="system.css" />
<script src="system.js"></script>
<style>
  /* ═══ office ═══ */

  .room { display: block; border-radius: 6px; image-rendering: pixelated; }

  .desk { position: absolute; padding: 0; background: none; border: 2px solid transparent; border-radius: 7px; cursor: pointer; }

  .desk:hover { border-color: rgb(255 255 255 / .9); }

  .desk[aria-expanded="true"] { border-color: #fff; background: rgb(255 255 255 / .18); }

  /* ═══ team cards ═══ */

  .grp { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }

  .grp h2 { margin: 0; font-size: 17px; font-weight: 600; }

  .card:hover { box-shadow: 0 2px 10px rgb(20 20 25 / .07); }

  .card:has([aria-expanded="true"]) { border-color: var(--line-2); box-shadow: 0 4px 18px rgb(20 20 25 / .11); }

  .c-av canvas { border-radius: 10px; }

  .c-nums span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .c-menu {
    position: absolute; top: 11px; right: 9px;
    width: 26px; height: 26px; border: none; border-radius: 7px;
    background: none; color: var(--faint); cursor: pointer;
    display: grid; place-items: center;
  }

  .c-menu:hover, .c-menu[aria-expanded="true"] { background: var(--subtle); color: var(--ink); }

  .c-menu svg { width: 15px; height: 15px; }

  /* ═══ anchored popover ═══ */

  .p-av canvas { border-radius: 9px; }

  .p-nums span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Menu rows replace buttons inside the popover: a card never carries a
     near-black primary. The first row is the one the player came for. */

  @media (max-width: 960px) {
    .app { grid-template-columns: 1fr; }
    .side { border-bottom: 1px solid var(--line-2); }
  }
</style>

<div class="app">
  <!-- ═══ sidebar ═══ -->
  <nav class="side">
    <a class="side-top" href="company.html">
      <span class="logo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M2 6.5L8 2l6 4.5V13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/></svg></span>
      <span class="side-id">
        <span class="side-name">My Tiny Office</span>
        <span class="side-ver">v0.1.0</span>
      </span>
    </a>

    <div class="nav">
      <a href="#" aria-current="page"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="2.5" y="3.5" width="13" height="11.5" rx="1.5"/><path d="M6 7.5h1.8M10.2 7.5H12M6 11h1.8M10.2 11H12"/></svg><span data-t="nav.office">사무실</span></a>
      <a href="projects.html"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M2.5 5.5h4.5L8.5 8h7v6.5h-13z"/></svg><span data-t="nav.projects">프로젝트</span></a>
      <a href="employees.html"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="6" r="2.8"/><path d="M3.5 15c0-3 2.5-5.5 5.5-5.5s5.5 2.5 5.5 5.5"/></svg><span data-t="nav.people">직원</span></a>
      <a href="company.html"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3.5 14.5v-3.5M9 14.5v-7M14.5 14.5v-10.5"/></svg><span data-t="nav.company">회사</span></a>

        <a href="#"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="9" r="2.6"/><path d="M9 1.8v2M9 14.2v2M1.8 9h2M14.2 9h2M3.9 3.9l1.4 1.4M12.7 12.7l1.4 1.4M14.1 3.9l-1.4 1.4M5.3 12.7l-1.4 1.4"/></svg><span data-t="nav.settings">설정</span></a>
      </div>
    </div>
  </nav>

  <!-- ═══ main ═══ -->
  <div class="main">
    <div class="head">
      <div class="head-row">
        <span>
          <h1 data-t="title">사무실</h1>
          <span class="sub" id="headSub"></span>
        </span>
        <div class="head-right">
          <span class="ghost-note" data-t="date">2026. 9. 26. (토) 10:24</span>
        </div>
      </div>

      <div class="tabs" id="tabs"></div>
    </div>

    <div class="body">
      <div class="stage">
        <div class="room-wrap">
          <canvas class="room" aria-hidden="true" id="room" width="864" height="384"></canvas>
          <div class="overlay" id="overlay"></div>
        </div>
      </div>
      <div id="teams"></div>

  </div>
</div>

<div class="pop" id="pop" role="dialog" aria-label="직원 행동"></div>

<div class="scrim" id="scrim" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<script>
  /* ── pixel tiles ─────────────────────────────────────────────── */

  // B body · L belly · O eye white · A ear · H blush · N beak · E eye and mouth
  // Every sprite shares one body. Only the seven head rows change, so twenty
  // species still read as one family.

  function drawAvatar(el, species) {
    const c = el.getContext("2d");
    c.clearRect(0, 0, el.width, el.height);
    c.imageSmoothingEnabled = false;
    const sp = SPECIES.get(species);
    const scale = Math.max(1, Math.floor(el.width / 16));
    const pad = Math.floor((el.width - 16 * scale) / 2);
    paint(c, sp.sprite, scale, pad, pad, skin(sp));
  }

  /* ── i18n ────────────────────────────────────────────────────── */
  // Employee nicknames are absent on purpose: the player wrote them, so they
  // never go through a dictionary.
  const TEXT = {
    ko: {
      ...WORDS.ko,
      hireDesk: "빈 책상에 직원 채우기", noTeam: "팀 없음", noDesk: "빈 책상이 없어요", justHired: "방금 입사",
      emptyDesk: "빈 책상", emptySeat: "빈 자리", addRoom: "방 추가",
      title: "사무실", date: "2026. 9. 26. (토) 10:24",
      tabs: { all: "전체", lounge: "휴게실" },
      deskSub: (used, seats) => "책상 " + seats + "석 중 " + used + "석 사용",
      loungeSub: "일이 없는 사람은 여기 있어요.",
      nobodyHere: "지금은 아무도 없어요.", meetingSub: "같이 볼 일이 있을 때 쓰는 방이에요.",
      atLounge: "휴게실",
      addRoomTitle: "방 추가", addRoomWhich: "어떤 방을 만들까요?", makeRoom: "방 만들기", cancel: "취소",
      forTeam: "어느 팀",
      rooms: {
        team: "팀 방", teamWhy: "팀 자리를 한곳에 모아요.",
        meeting: "회의실", meetingWhy: "리뷰를 같이 보는 자리예요.",
        server: "서버실", serverWhy: "직원이 8명이 되면 열려요.",
        lounge: "휴게실", loungeWhy: "이미 있어요.",
      },
      work: "업무", noTask: "할당된 업무 없음", away: "자리 비움",
      minutes: (a, b) => a + "/" + b + "분", estimate: (m) => "예상 " + m + "분",
      notStarted: "시작 전", waiting: "대기", onLeave: "휴가", deskFree: "지금은 비어 있습니다",
      inProgress: "진행 중", assigned: "할당된 업무", lastDone: "최근 완료", vacationLabel: "휴가",
      actions: {
        complete: "완료 처리", detail: "업무 상세", reassign: "담당 변경",
        start: "업무 시작", swap: "다른 업무로 교체", unassign: "할당 취소",
        assign: "업무 할당", teach: "기억 가르치기", leave: "휴가 보내기", comeBack: "복귀 처리",
      },
      cannotAssign: "휴가 중에는 업무를 맡길 수 없습니다.",
      actionOf: (n) => n + " 행동",
      tasks: { pay: "결제 API 에러 응답 구조 변경", login: "로그인 폼 구현", docs: "API 문서 작성" },
      lastIndex: "인덱스 튜닝 완료", backIn: "3일 후 복귀",
    },
    en: {
      ...WORDS.en,
      hireDesk: "Fill this desk", noTeam: "No team", noDesk: "No free desk", justHired: "Just joined",
      emptyDesk: "Empty desk", emptySeat: "Empty", addRoom: "Add a room",
      title: "Office", date: "Sat, Sep 26, 2026 · 10:24",
      tabs: { all: "All", lounge: "Lounge" },
      deskSub: (used, seats) => used + " of " + seats + " desks in use",
      loungeSub: "Whoever has no work to do is here.",
      nobodyHere: "Nobody is here right now.", meetingSub: "A room for going through something together.",
      atLounge: "Lounge",
      addRoomTitle: "Add a room", addRoomWhich: "What kind of room?", makeRoom: "Add the room", cancel: "Cancel",
      forTeam: "Which team",
      rooms: {
        team: "Team room", teamWhy: "Keeps one team together.",
        meeting: "Meeting room", meetingWhy: "Somewhere to go through a review together.",
        server: "Server room", serverWhy: "Opens at eight employees.",
        lounge: "Lounge", loungeWhy: "You already have one.",
      },
      work: "WORK", noTask: "Nothing assigned", away: "Away",
      minutes: (a, b) => a + "/" + b + " min", estimate: (m) => "~" + m + " min",
      notStarted: "Not started", waiting: "Free", onLeave: "Leave", deskFree: "Nothing on right now",
      inProgress: "In progress", assigned: "Assigned", lastDone: "Last finished", vacationLabel: "On leave",
      actions: {
        complete: "Mark done", detail: "Task details", reassign: "Reassign",
        start: "Start work", swap: "Swap the task", unassign: "Unassign",
        assign: "Assign work", teach: "Teach", leave: "Send on leave", comeBack: "Bring back",
      },
      cannotAssign: "They cannot take work while on leave.",
      actionOf: (n) => "Actions for " + n,
      tasks: { pay: "Change the payment API error shape", login: "Build the login form", docs: "Write the API docs" },
      lastIndex: "Finished tuning indexes", backIn: "Back in 3 days",
    },
  };

  const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "ko";
  const t = () => TEXT[lang];
  const dig = (o, k) => k.split(".").reduce((a, x) => a?.[x], o);
  const applyStatic = () => {
    for (const el of document.querySelectorAll("[data-t]")) {
      const v = dig(t(), el.dataset.t);
      if (typeof v === "string") el.textContent = v;
    }
    for (const el of document.querySelectorAll("[data-a]")) {
      const v = dig(t(), el.dataset.a);
      if (typeof v === "string") el.setAttribute("aria-label", v);
    }
  };
  applyStatic();

  /* ── data ────────────────────────────────────────────────────── */
  // Status mirrors the domain: a task is working or ready, an employee is
  // available or on vacation. The actions offered follow from that alone.
  const label = (k) => t().status[k];

  // Who these people are is the company's answer, not this screen's. The floor
  // adds only where each of them sits and what is on their desk today.
  const DESKS = [
    { id: "p1", col: 3, row: 3, task: { key: "pay", spent: 22, total: 30 } },
    { id: "p2", col: 8, row: 3, task: { key: "login", spent: 12, total: 25 } },
    { id: "p3", col: 13, row: 3, task: { key: "docs", spent: 0, total: 20 } },
    { id: "p4", col: 3, row: 6, last: "lastIndex" },
    { id: "p5", col: 8, row: 6, back: "backIn" },
    { id: null, col: 13, row: 6 },
  ];
  const fromCompany = new Map(STAFF.map((p) => [p.id, p]));
  const people = DESKS.map((d) => (d.id ? { ...fromCompany.get(d.id), ...d } : d));
  const staffed = people.filter((p) => p.id);
  const byId = new Map(staffed.map((p) => [p.id, p]));
  const pct = (p) => (p.task ? Math.round((p.task.spent / p.task.total) * 100) : 0);

  /* ── rooms ───────────────────────────────────────────────────── */
  // A tab is a room. The whole floor is one of them, each team has its own,
  // and the lounge is where anyone without work to do ends up.

  const S = 3, T = 48;
  const canvas = document.getElementById("room");
  const ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  ctx.imageSmoothingEnabled = false;

  const tabs = document.getElementById("tabs");
  const TEAMS = [...new Set(staffed.map((p) => p.team))].filter(Boolean);
  const inLounge = (p) => p.status === "available";
  const atDesk = (p) => p.status === "working" || p.status === "ready";

  const ROOMS = [
    { key: "all", kind: "all" },
    ...TEAMS.map((team) => ({ key: team, kind: "team", team })),
    { key: "lounge", kind: "lounge" },
  ];
  let room = "all";

  const roomOf = (key) => ROOMS.find((r) => r.key === key);
  const roomName = (r) => (r.kind === "team" ? t().teams[r.team] : t().rooms[r.kind] ?? t().tabs[r.kind]);
  const headcount = (r) =>
    r.kind === "all" ? staffed.length
      : r.kind === "team" ? staffed.filter((p) => p.team === r.team).length
      : r.kind === "lounge" ? staffed.filter(inLounge).length
      : 0;

  // The whole floor keeps the seats it was drawn with; a team room lays its
  // own out, three to a row, and a new one starts as empty desks to fill.
  function seatsOf(key) {
    if (key === "all") return people;
    const mine = people.filter((p) => p.id && p.team === key);
    if (!mine.length) return [{ id: null, col: 3, row: 3 }, { id: null, col: 8, row: 3 }];
    return mine.map((p, i) => ({ ...p, col: 3 + (i % 3) * 5, row: 3 + Math.floor(i / 3) * 3 }));
  }

  function drawRoom(w, h, deco) {
    canvas.width = w * T;
    canvas.height = h * T;
    ctx.imageSmoothingEnabled = false;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) paint(ctx, TILES.floor, S, x * T, y * T);
    for (let x = 0; x < w; x++) paint(ctx, TILES.wall, S, x * T, 0);
    for (const [tile, x, y] of deco) paint(ctx, TILES[tile], S, x * T, y * T);
    overlay.innerHTML = "";
  }

  function mark(p, x, y, name, state) {
    const btn = document.createElement("button");
    btn.className = "desk";
    btn.type = "button";
    if (p?.id) btn.dataset.id = p.id;
    btn.style.left = x * T - 4 + "px";
    btn.style.top = y * T - T - 6 + "px";
    btn.style.width = 2 * T + 8 + "px";
    btn.style.height = 2 * T + 10 + "px";
    btn.setAttribute("aria-label", p?.id ? p.name : t().emptyDesk);
    if (p?.id) btn.addEventListener("click", (e) => open(p.id, btn, e.detail === 0));
    overlay.appendChild(btn);

    const tag = document.createElement("span");
    tag.className = "tag";
    tag.style.left = x * T + T + "px";
    tag.style.top = y * T + T + 4 + "px";
    tag.textContent = name;
    if (!p?.id || !atDesk(p)) tag.style.opacity = ".7";
    overlay.appendChild(tag);
    if (!state) return;

    const bub = document.createElement("span");
    bub.className = "bub";
    bub.style.left = x * T + T + "px";
    bub.style.top = y * T - T - 24 + "px";
    // Someone in the lounge is available; the bubble only says where they are.
    bub.innerHTML = '<span class="dot ' + (state === "lounge" ? "available" : state) + '"></span>' + (state === "lounge" ? t().atLounge : label(state));
    overlay.appendChild(bub);
  }

  function drawDesks(key) {
    const seats = seatsOf(key);
    const w = Math.max(...seats.map((p) => p.col)) + 5;
    const h = Math.max(...seats.map((p) => p.row)) + 2;
    const deco = [["window", 2, 0], ["window", 3, 0], ["board", 8, 0], ["board", 9, 0], ["shelf", 14, 0], ["plant", 0, h - 1], ["plant", w - 1, h - 1]]
      .filter(([, x, y]) => x < w && y < h);
    drawRoom(w, h, deco);

    for (const p of seats) {
      const dx = p.col * T, dy = p.row * T;
      const here = p.id && atDesk(p);
      paint(ctx, CHAIR, S, dx, dy - T);
      if (here) paint(ctx, SPECIES.get(p.species).sprite, S, dx, dy - T, skin(SPECIES.get(p.species)));
      paint(ctx, TILES.deskL, S, dx, dy);
      paint(ctx, TILES.deskR, S, dx + T, dy);
      paint(ctx, MONITOR, S, dx + T / 2, dy - 2 * S, { M: p.status === "working" ? P.M : P.o });
      // An empty chair still belongs to someone, and the tag says where they went.
      mark(p, p.col, p.row, p.id ? p.name : t().emptySeat, p.id ? (inLounge(p) ? "lounge" : p.status) : null);
    }
  }

  function drawLounge() {
    const here = staffed.filter(inLounge);
    drawRoom(13, 6, [["window", 2, 0], ["coffee", 8, 0], ["shelf", 11, 0], ["plant", 0, 5], ["plant", 12, 5], ["table", 7, 3]]);
    paint(ctx, TILES.sofaBackL, S, 4 * T, 2 * T);
    paint(ctx, TILES.sofaBackR, S, 5 * T, 2 * T);
    // Between the back and the seat, which is what sitting in it looks like.
    here.forEach((p, i) => {
      const col = 4 + (i % 2);
      paint(ctx, SPECIES.get(p.species).sprite, S, col * T, 2 * T + 4 * S, skin(SPECIES.get(p.species)));
    });
    paint(ctx, TILES.sofaL, S, 4 * T, 3 * T);
    paint(ctx, TILES.sofaR, S, 5 * T, 3 * T);
    here.forEach((p, i) => mark(p, 4 + (i % 2) - 0.5, 3, p.name, p.status));
  }

  function drawMeeting() {
    drawRoom(11, 6, [["window", 2, 0], ["board", 6, 0], ["plant", 0, 5], ["plant", 10, 5]]);
    // One table, however many tiles long, with the far side seated.
    const from = 3, wide = 5;
    for (let i = 0; i < wide; i++) {
      paint(ctx, CHAIR, S, (from + i) * T, 2 * T);
      paint(ctx, TILES[i === 0 ? "deskL" : i === wide - 1 ? "deskR" : "deskM"], S, (from + i) * T, 3 * T);
    }
  }

  function render() {
    tabs.innerHTML = "";
    for (const r of ROOMS) {
      const b = document.createElement("button");
      b.className = "tab";
      b.setAttribute("aria-selected", String(r.key === room));
      b.innerHTML = `<span>${roomName(r)}</span><span class="n">${headcount(r)}</span>`;
      b.addEventListener("click", () => { room = r.key; close(); render(); });
      tabs.appendChild(b);
    }
    const add = document.createElement("button");
    add.className = "tab";
    add.style.color = "var(--faint)";
    add.setAttribute("aria-label", t().addRoom);
    add.textContent = "+";
    add.addEventListener("click", openAddRoom);
    tabs.appendChild(add);

    const here = roomOf(room);
    if (here.kind === "lounge") drawLounge();
    else if (here.kind === "meeting") drawMeeting();
    else drawDesks(room);

    const seats = here.kind === "all" || here.kind === "team" ? seatsOf(room) : [];
    document.getElementById("headSub").textContent =
      here.kind === "lounge" ? t().loungeSub
        : here.kind === "meeting" ? t().meetingSub
        : t().deskSub(seats.filter((p) => p.id).length, seats.length);

    drawCards();
  }

  /* ── sidebar roster ──────────────────────────────────────────── */
  function renderMembers() {
    const box = document.getElementById("members");
    box.replaceChildren();
    mountRoster(box, (p, el, viaKey) => open(p.id, el, viaKey));
  }
  renderMembers();
  /* ── team cards ──────────────────────────────────────────────── */
  function cardInner(p) {
    const v = pct(p);
    const bar =
      p.status === "working" ? `<i style="width:${v}%;background:var(--warn)"></i>`
      : p.status === "ready" ? `<i style="width:3%;background:var(--info)"></i>`
      : p.status === "available" ? `<i style="width:100%;background:var(--ok)"></i>`
      : "";
    const nums =
      p.status === "working" ? `<span>${t().minutes(p.task.spent, p.task.total)}</span><b>${v}%</b>`
      : p.status === "ready" ? `<span>${t().estimate(p.task.total)}</span><b>${t().notStarted}</b>`
      : p.status === "available" ? `<span>${t()[p.last]}</span><b>${t().waiting}</b>`
      : `<span>${t()[p.back]}</span><b>${t().onLeave}</b>`;
    const line =
      p.status === "working" || p.status === "ready" ? t().tasks[p.task.key]
      : p.status === "available" ? t().noTask
      : t().away;
    return `
      <button class="c-menu" type="button" data-id="${p.id}" aria-haspopup="dialog" aria-expanded="false" aria-label="${t().actionOf(p.name)}"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="3.2" r="1.35"/><circle cx="8" cy="8" r="1.35"/><circle cx="8" cy="12.8" r="1.35"/></svg></button>
      <span class="c-av">
        <canvas aria-hidden="true" width="34" height="34"></canvas>
        <span class="c-live" style="background:${STATUS[p.status].color}"></span>
      </span>
      <span class="c-name">${p.name}</span>
      <span class="c-role">${p.role}</span>
      <span class="c-rule"></span>
      <span class="c-k">${t().work}</span>
      <span class="c-task">${line}</span>
      <span class="meter">${bar}</span>
      <span class="c-nums">${nums}</span>`;
  }

  const teams = document.getElementById("teams");

  function drawCards() {
    teams.innerHTML = "";
    const here = roomOf(room);
    const groups =
      here.kind === "all" ? [["noTeam", staffed.filter((p) => !p.team)], ...TEAMS.map((team) => [team, staffed.filter((p) => p.team === team)])].filter(([k, g]) => k !== "noTeam" || g.length)
      : here.kind === "team" ? [[room, staffed.filter((p) => p.team === room)]]
      : [[here.kind, here.kind === "lounge" ? staffed.filter(inLounge) : []]];

    for (const [key, group] of groups) {
      const wrap = document.createElement("div");
      wrap.style.marginBottom = "18px";
      const heading = key === "noTeam" ? t().noTeam : t().teams[key] ?? t().rooms[key];
      wrap.innerHTML = `<div class="grp"><h2>${heading}</h2><span class="cnt">${group.length}</span></div>`;
      const grid = document.createElement("div");
      grid.className = "cards";
      for (const p of group) {
        const c = document.createElement("div");
        c.className = "card";
        if (p.status === "vacation") c.style.opacity = ".72";
        c.innerHTML = cardInner(p);
        c.addEventListener("click", (e) => open(p.id, c, e.detail === 0));
        grid.appendChild(c);
        drawAvatar(c.querySelector("canvas"), p.species);
      }
      if (!group.length) {
        const e = document.createElement("p");
        e.className = "col-empty";
        e.textContent = t().nobodyHere;
        grid.appendChild(e);
      }
      if (t().teams[key] && group.length) {
        const add = document.createElement("button");
        add.className = "addcard";
        add.type = "button";
        add.innerHTML =
          '<span class="plus"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg></span>' +
          (freeDesk() < 0 ? t().noDesk : t().hireDesk);
        add.disabled = freeDesk() < 0;
        add.addEventListener("click", () => hireAt(key));
        grid.appendChild(add);
      }
      wrap.appendChild(grid);
      teams.appendChild(wrap);
    }
  }

  /* ── hiring ──────────────────────────────────────────────────── */
  // Hiring needs a free desk, and the new person sits at it.
  const freeDesk = () => DESKS.findIndex((d) => !d.id);

  function hireAt(team) {
    openHire({
      team,
      onSave: (h) => {
        const i = freeDesk();
        if (i < 0) return;
        const base = { ...h, id: "p" + (STAFF.length + 1), status: "available", memories: [], style: [], done: 0, reviews: 0 };
        STAFF.push(base);
        fromCompany.set(base.id, base);
        Object.assign(DESKS[i], { id: base.id, last: "justHired" });
        const p = { ...base, ...DESKS[i] };
        people[i] = p;
        staffed.push(p);
        byId.set(p.id, p);
        renderMembers();
        render();
      },
    });
  }

  /* ── anchored popover ────────────────────────────────────────── */
  const I = {
    check: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.4l3.2 3.2L13 4.8"/></svg>',
    play: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 3.4l7.6 4.6L5 12.6z"/></svg>',
    plus: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg>',
    swap: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5h9.5l-2.4-2.4M13 10.5H3.5l2.4 2.4"/></svg>',
    book: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M2.8 3.2h3.6A1.8 1.8 0 0 1 8 5v8a1.6 1.6 0 0 0-1.6-1.4H2.8zM13.2 3.2H9.6A1.8 1.8 0 0 0 8 5v8a1.6 1.6 0 0 1 1.6-1.4h3.6z"/></svg>',
    info: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M8 7.3v4M8 5.1v.1"/></svg>',
    sun: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="2.6"/><path d="M8 1.6v1.6M8 12.8v1.6M1.6 8h1.6M12.8 8h1.6M3.5 3.5l1.1 1.1M11.4 11.4l1.1 1.1M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1"/></svg>',
    undo: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.6 3.8v3.4h3.4"/><path d="M4 7.2a4.6 4.6 0 1 1 .8 4.4"/></svg>',
  };

  // Only transitions the domain allows from this state. The first row is the
  // one the player came here for. Teaching is not a transition, so it is
  // offered in every state.
  const TEACH = { icon: I.book, label: t().actions.teach, teach: true };
  const ACTIONS = {
    working: [
      { icon: I.check, label: t().actions.complete, key: true },
      { icon: I.info, label: t().actions.detail },
      { icon: I.swap, label: t().actions.reassign },
      TEACH,
    ],
    ready: [
      { icon: I.play, label: t().actions.start, key: true },
      { icon: I.swap, label: t().actions.swap },
      TEACH,
      { icon: I.undo, label: t().actions.unassign, bad: true },
    ],
    available: [
      { icon: I.plus, label: t().actions.assign, key: true },
      TEACH,
      { icon: I.sun, label: t().actions.leave },
    ],
    vacation: [
      { icon: I.plus, label: t().actions.assign, key: true, off: t().cannotAssign },
      { icon: I.undo, label: t().actions.comeBack },
      TEACH,
    ],
  };

  const pop = document.getElementById("pop");
  let anchor = null;

  function stateBlock(p) {
    const v = pct(p);
    if (p.status === "working")
      return `<span class="c-k">${t().inProgress}</span><span class="c-task">${t().tasks[p.task.key]}</span>
        <span class="track"><i style="width:${v}%;background:var(--warn)"></i></span>
        <span class="p-nums"><span>${t().minutes(p.task.spent, p.task.total)}</span><b>${v}%</b></span>`;
    if (p.status === "ready")
      return `<span class="c-k">${t().assigned}</span><span class="c-task">${t().tasks[p.task.key]}</span>
        <span class="p-nums"><span>${t().estimate(p.task.total)}</span><b>${t().notStarted}</b></span>`;
    if (p.status === "available")
      return `<span class="c-k">${t().lastDone}</span><span class="c-task">${t()[p.last]}</span>
        <span class="p-nums"><span>${t().deskFree}</span><b>${t().waiting}</b></span>`;
    return `<span class="c-k">${t().vacationLabel}</span><span class="c-task">${t()[p.back]}</span>`;
  }

  function open(id, el, viaKey) {
    const p = byId.get(id);
    if (!p) return;
    if (anchor === el && pop.hasAttribute("data-open")) { close(); return; }

    document.querySelectorAll("[data-id]").forEach((n) => {
      n.setAttribute("aria-expanded", String(n.dataset.id === id));
    });

    const rows = ACTIONS[p.status]
      .map((a) => {
        const cls = ["mrow", a.key ? "mrow-key" : "", a.bad ? "mrow-bad" : ""].filter(Boolean).join(" ");
        const row = `<button class="${cls}" type="button"${a.off ? " disabled" : ""}${a.teach ? " data-teach" : ""}>${a.icon}${a.label}</button>`;
        return a.off ? row + `<p class="p-why">${a.off}</p>` : row;
      })
      .join("");

    pop.innerHTML = `
      <div class="p-hd">
        <span class="p-av">
          <canvas aria-hidden="true" width="32" height="32"></canvas>
          <span class="c-live" style="background:${STATUS[p.status].color}"></span>
        </span>
        <span style="flex:1;min-width:0">
          <span class="p-name">${p.name}</span>
          <span class="p-role">${p.role}</span>
        </span>
        <span class="chip ${p.status}"><span class="dot ${p.status}"></span>${label(p.status)}</span>
      </div>
      <div class="p-rule"></div>
      <div class="p-state">${stateBlock(p)}</div>
      <div class="p-rule"></div>
      <div class="p-acts">${rows}</div>`;
    drawAvatar(pop.querySelector("canvas"), p.species);
    pop.querySelector("[data-teach]").addEventListener("click", () => {
      close();
      openTeach({ to: fromCompany.get(p.id), onSave: ({ to, memory }) => to.memories.unshift({ ...memory, used: 0 }) });
    });

    anchor = el;
    pop.setAttribute("data-open", "");
    place(el);
    if (viaKey) {
      const first = pop.querySelector(".mrow:not(:disabled)");
      if (first) first.focus({ preventScroll: true });
    }
  }

  function place(el) {
    const r = el.getBoundingClientRect();
    const w = pop.offsetWidth, h = pop.offsetHeight, gap = 8, edge = 12;
    let left = r.right + gap;
    if (left + w > innerWidth - edge) left = r.left - w - gap;
    if (left < edge) left = Math.min(Math.max(edge, r.left), innerWidth - w - edge);
    let top = Math.min(r.top, innerHeight - h - edge);
    pop.style.left = Math.round(left) + "px";
    pop.style.top = Math.round(Math.max(edge, top)) + "px";
  }

  function close() {
    pop.removeAttribute("data-open");
    document.querySelectorAll("[data-id]").forEach((n) => n.setAttribute("aria-expanded", "false"));
    anchor = null;
  }

  document.addEventListener("pointerdown", (e) => {
    // The anchor closes itself on the click that follows; closing here first
    // would clear it and let that click reopen the popover.
    if (!anchor || pop.contains(e.target) || anchor.contains(e.target)) return;
    if (!e.target.closest("[data-id]")) close();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || !anchor) return;
    // A card is a plain container, so focus returns to its kebab button.
    const back = anchor.matches("[data-id]") ? anchor : anchor.querySelector("[data-id]");
    close();
    if (back) back.focus({ preventScroll: true });
  });
  addEventListener("resize", () => { if (anchor) place(anchor); });
  addEventListener("scroll", () => { if (anchor) place(anchor); }, true);

  /* ── adding a room ───────────────────────────────────────────── */
  // What can be built is a fact about the company, so the rows that cannot say
  // why rather than disappearing.

  const scrim = document.getElementById("scrim");
  const dialog = document.getElementById("modal");
  const chevron = `<svg viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 2L6 6l4.5-4"/></svg>`;

  const spareTeams = () => Object.keys(t().teams).filter((k) => !ROOMS.some((r) => r.team === k));
  const has = (kind) => ROOMS.some((r) => r.kind === kind);

  const KINDS = [
    { key: "team", open: () => spareTeams().length > 0 },
    { key: "meeting", open: () => !has("meeting") },
    { key: "server", open: () => staffed.length >= 8 },
    { key: "lounge", open: () => !has("lounge") },
  ];

  function renderAddRoom() {
    const kind = dialog.dataset.kind || KINDS.find((k) => k.open())?.key;
    const spare = spareTeams();

    dialog.setAttribute("aria-label", t().addRoomTitle);
    dialog.innerHTML = `
      <div class="m-hd">
        <span style="flex:1;min-width:0"><span class="m-t">${t().addRoomTitle}</span></span>
      </div>

      <div class="m-sec">
        <span class="label">${t().addRoomWhich}</span>
        <div role="radiogroup" style="margin-top:8px">
          ${KINDS.map(({ key, open }) => `
            <button class="pick" type="button" role="radio" aria-checked="${key === kind}" data-kind="${key}"${open() ? "" : " disabled"}>
              <span class="radio"></span>
              <span class="pick-t">${t().rooms[key]}</span>
              <span></span><span class="pick-m">${t().rooms[key + "Why"]}</span>
            </button>`).join("")}
        </div>

        ${kind === "team" ? `
          <div class="field">
            <span class="label">${t().forTeam}</span>
            <span class="select-wrap">
              <select class="select" id="roomTeam">
                ${spare.map((k) => `<option value="${k}">${t().teams[k]}</option>`).join("")}
              </select>
              ${chevron}
            </span>
          </div>` : ""}
      </div>

      <div class="m-foot">
        <button class="btn btn-secondary btn-md" data-close>${t().cancel}</button>
        <button class="btn btn-primary btn-md" data-make${kind ? "" : " disabled"}>${t().makeRoom}</button>
      </div>`;

    for (const b of dialog.querySelectorAll("[data-kind]")) {
      b.addEventListener("click", () => {
        dialog.dataset.kind = b.dataset.kind;
        renderAddRoom();
        dialog.querySelector(`[data-kind="${b.dataset.kind}"]`).focus();
      });
    }
    dialog.querySelector("[data-close]").addEventListener("click", closeModal);
    dialog.querySelector("[data-make]").addEventListener("click", () => {
      const team = dialog.querySelector("#roomTeam")?.value;
      const made = kind === "team" ? { key: team, kind: "team", team } : { key: kind, kind };
      ROOMS.splice(ROOMS.length - 1, 0, made);
      room = made.key;
      closeModal();
      render();
    });
  }

  function openAddRoom() {
    close();
    delete dialog.dataset.kind;
    scrim.hidden = false;
    renderAddRoom();
    dialog.querySelector(".pick:not(:disabled)")?.focus({ preventScroll: true });
  }

  function closeModal() {
    scrim.hidden = true;
  }

  scrim.addEventListener("pointerdown", (e) => { if (e.target === scrim) closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !scrim.hidden) closeModal(); });

  render();

</script>
