<style>
  :root {
    color-scheme: light;

    --page: #edecee;
    --surface: #ffffff;
    --subtle: #f6f6f7;
    --sunk: #eeeef0;
    --line: #ebebed;
    --line-2: #e0e0e3;

    --ink: #1b1b1f;
    --solid: #17171c;
    --ok-ink: #1f7a48;
    --ok-line: #bfe6cf;
    --info-ink: #2557b5;
    --warn-ink: #8a5c10;
    --warn-line: #f0d8a8;
    --bad-ink: #a8322f;
    --bad-line: #f4c2c3;
    --bad-wash: #fffafa;
    --brand-ink: #4342a6;
    --solid-hover: #2a2a31;
    --hairline-hover: #cfcfd4;
    --floor: #b0854f;
    --term: #17171c;
    --term-fg: #e8e8ea;
    --term-dim: #6f6f78;
    --term-line: #3a3a42;
    --term-hover: #26262d;
    --muted: #86868d;
    --faint: #b2b2b9;

    --brand: #5b5bd6;
    --ok: #2fae62;
    --ok-soft: #e4f6ec;
    --info: #3b82f6;
    --info-soft: #e8f0fe;
    --warn: #eaa221;
    --warn-soft: #fdf1dd;
    --bad: #e5484d;
    --bad-soft: #fdeaea;

    --r-ctl: 10px;
    --r-card: 12px;
    --r-app: 18px;

    --sans: "Noto Sans KR", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  }

  body {
    margin: 0;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    background: var(--page);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
    padding: 22px 18px 40px;
  }
  * { box-sizing: border-box; }
  button { font: inherit; color: inherit; }


  .app {
    max-width: 1240px; margin: 0 auto;
    background: var(--surface);
    border-radius: var(--r-app);
    box-shadow: 0 1px 2px rgb(20 20 25 / .05), 0 12px 40px rgb(20 20 25 / .08);
    overflow: hidden;
    display: grid; grid-template-columns: 236px 1fr;
    min-height: 720px;
  }

  /* ═══ buttons ═══ */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    font: inherit; font-weight: 600; white-space: nowrap; text-decoration: none;
    border-radius: 999px; border: 1px solid transparent; cursor: pointer;
    transition: background .1s, border-color .1s;
  }
  .btn svg { width: 15px; height: 15px; flex: none; }
  .btn-lg { height: 42px; padding-inline: 22px; font-size: 14px; }
  .btn-md { height: 36px; padding-inline: 16px; font-size: 14px; }
  .btn-sm { height: 30px; padding-inline: 13px; font-size: 13px; }
  .btn-primary { background: var(--solid); color: #fff; }
  .btn-primary:hover { background: var(--solid-hover); }
  .btn-secondary { background: var(--surface); border-color: var(--line-2); color: var(--ink); }
  .btn-secondary:hover { background: var(--subtle); }
  .btn-ghost { background: none; color: var(--muted); }
  .btn-ghost:hover { background: var(--subtle); color: var(--ink); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:focus-visible, .ibtn:focus-visible, .desk:focus-visible, .mrow:focus-visible,
  .c-menu:focus-visible, .member:focus-visible,
  .tab:focus-visible, .nav a:focus-visible {
    outline: 2px solid var(--brand); outline-offset: 2px;
  }
  .ibtn {
    width: 32px; height: 32px; border-radius: 999px; border: none;
    background: var(--subtle); color: var(--muted);
    display: inline-grid; place-items: center; cursor: pointer;
  }
  .ibtn:hover { background: var(--sunk); color: var(--ink); }
  .ibtn svg { width: 15px; height: 15px; }

  /* ═══ sidebar ═══ */
  .side { background: var(--subtle); padding: 14px 12px; display: flex; flex-direction: column; }
  .side-top { display: flex; align-items: center; gap: 10px; padding: 2px 4px 14px; }
  .logo { width: 26px; height: 26px; border-radius: 7px; background: var(--ink); display: grid; place-items: center; flex: none; }
  .logo svg { width: 14px; height: 14px; color: #fff; }
  .side-id { line-height: 1.25; }
  .side-name { display: block; font-size: 13px; font-weight: 700; letter-spacing: .03em; }
  .side-ver { display: block; font-size: 11px; color: var(--faint); }

  .nav { display: flex; flex-direction: column; gap: 1px; }
  .nav a {
    display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 10px;
    height: 34px; padding-inline: 8px; border-radius: var(--r-ctl);
    font-size: 14px; color: var(--muted); text-decoration: none;
  }
  .nav a:hover { background: var(--sunk); color: var(--ink); }
  .nav a[aria-current] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgb(20 20 25 / .06); }
  .nav svg { width: 17px; height: 17px; }
  .badge {
    min-width: 19px; height: 19px; padding-inline: 6px; border-radius: 999px;
    background: var(--bad); color: #fff; font-size: 11px; font-weight: 700;
    display: grid; place-items: center; font-variant-numeric: tabular-nums;
  }

  .rule { height: 1px; background: var(--line-2); margin: 14px 4px; }
  .ws-hd { display: flex; align-items: center; justify-content: space-between; padding: 0 8px; margin-bottom: 4px; }
  .ws-hd span { font-size: 13px; color: var(--muted); }

  .member {
    display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 9px;
    height: 32px; padding-inline: 8px; border-radius: 8px; font-size: 13px;
    width: 100%; background: none; border: none; text-align: left; cursor: pointer;
  }
  .member:hover { background: var(--sunk); }
  .member[aria-expanded="true"] { background: var(--surface); box-shadow: 0 1px 2px rgb(20 20 25 / .06); font-weight: 600; }
  .member .av { width: 22px; height: 22px; border-radius: 6px; overflow: hidden; background: var(--sunk); display: grid; place-items: center; }
  .side-foot { margin-top: auto; padding-top: 12px; }

  /* ═══ main ═══ */
  .main { display: flex; flex-direction: column; min-width: 0; }
  .head { padding: 16px 22px 0; }
  .head-row { display: flex; align-items: flex-start; gap: 12px; }
  h1 { margin: 0; font-size: 23px; font-weight: 600; letter-spacing: -.01em; }
  .sub { display: block; font-size: 13px; color: var(--muted); margin-top: 1px; }
  .head-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .ghost-note { font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; }

  .tabs { display: flex; align-items: center; gap: 2px; margin-top: 14px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tab {
    display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
    height: 38px; padding-inline: 11px; border: none; background: none;
    font-size: 14px; color: var(--muted); cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
  .tab svg { width: 16px; height: 16px; }
  .tab .n { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }

  .body { padding: 16px 22px 24px; display: flex; flex-direction: column; gap: 18px; overflow: auto; flex: 1; }

  /* ═══ office ═══ */
  .stage {
    border-radius: var(--r-card); background: var(--subtle);
    border: 1px solid var(--line); padding: 12px; overflow: auto; position: relative;
  }
  .room-wrap { position: relative; width: max-content; margin: 0 auto; }
  .room { display: block; border-radius: 6px; image-rendering: pixelated; }
  .overlay { position: absolute; inset: 0; }
  .desk { position: absolute; padding: 0; background: none; border: 2px solid transparent; border-radius: 7px; cursor: pointer; }
  .desk:hover { border-color: rgb(255 255 255 / .9); }
  .desk[aria-expanded="true"] { border-color: #fff; background: rgb(255 255 255 / .18); }
  .bub {
    position: absolute; left: 50%; transform: translateX(-50%);
    background: #fff; border-radius: 8px; padding: 3px 9px;
    font-size: 12px; font-weight: 600; white-space: nowrap;
    display: flex; align-items: center; gap: 5px;
    box-shadow: 0 1px 3px rgb(20 20 25 / .2);
  }
  .tag {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap;
    text-shadow: 0 1px 2px rgb(0 0 0 / .55);
  }

  .dot { width: 7px; height: 7px; border-radius: 999px; flex: none; }
  .dot.working { background: var(--warn); box-shadow: 0 0 0 1.5px #fff, 0 0 0 3px var(--warn); margin: 2px; }
  .dot.ready { background: transparent; border: 2px solid var(--info); }
  .dot.available { background: var(--ok); }
  .dot.vacation { background: var(--faint); border-radius: 1px; height: 3px; }

  /* ═══ team cards ═══ */
  .grp { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .grp h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .grp .cnt { font-size: 12px; color: var(--muted); background: var(--subtle); border-radius: 999px; padding: 1px 8px; font-variant-numeric: tabular-nums; }

  .cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(238px, 1fr)); }
  .card {
    position: relative; background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px;
    cursor: pointer; transition: border-color .1s, box-shadow .1s;
  }
  .card:hover { box-shadow: 0 2px 10px rgb(20 20 25 / .07); }
  .card:has([aria-expanded="true"]) { border-color: var(--line-2); box-shadow: 0 4px 18px rgb(20 20 25 / .11); }
  .c-av { position: relative; width: 46px; height: 46px; border-radius: 13px; background: var(--subtle); display: grid; place-items: center; overflow: visible; }
  .c-av canvas { border-radius: 10px; }
  .c-live {
    position: absolute; right: -3px; bottom: -3px; width: 14px; height: 14px;
    border-radius: 999px; border: 3px solid var(--surface);
  }
  .c-name { display: block; font-size: 16px; font-weight: 600; line-height: 1.35; margin-top: 11px; }
  .c-role { display: block; font-size: 13px; color: var(--faint); line-height: 1.35; }
  .c-rule { display: block; height: 1px; background: var(--line); margin: 13px 0; }
  .c-k { display: block; font-size: 11px; font-weight: 600; color: var(--faint); }
  .c-task { display: block; font-size: 13.5px; font-weight: 500; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meter { display: block; height: 4px; border-radius: 999px; background: var(--sunk); overflow: hidden; margin-top: 11px; }
  .meter i { display: block; height: 100%; border-radius: 999px; }
  .c-nums { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 7px; }
  .c-nums span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .c-nums b { font-weight: 600; color: var(--ink); flex: none; }
  .c-menu {
    position: absolute; top: 11px; right: 9px;
    width: 26px; height: 26px; border: none; border-radius: 7px;
    background: none; color: var(--faint); cursor: pointer;
    display: grid; place-items: center;
  }
  .c-menu:hover, .c-menu[aria-expanded="true"] { background: var(--subtle); color: var(--ink); }
  .c-menu svg { width: 15px; height: 15px; }

  .addcard {
    display: grid; place-items: center; align-content: center; gap: 9px; min-height: 190px;
    border-radius: var(--r-card); border: 1px dashed var(--line-2); background: var(--subtle);
    color: var(--faint); font-size: 13px; cursor: pointer;
  }
  .addcard:hover { border-color: var(--muted); color: var(--muted); background: var(--surface); }
  .addcard .plus { width: 34px; height: 34px; border-radius: 999px; background: var(--sunk); display: grid; place-items: center; }
  .addcard svg { width: 16px; height: 16px; }

  /* ═══ anchored popover ═══ */
  .pop {
    position: fixed; z-index: 40; width: 292px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 6px;
    box-shadow: 0 2px 6px rgb(20 20 25 / .06), 0 18px 48px rgb(20 20 25 / .17);
    opacity: 0; transform: scale(.97) translateY(-4px); transform-origin: top left;
    transition: opacity .11s ease, transform .11s ease;
    pointer-events: none; visibility: hidden;
  }
  .pop[data-open] { opacity: 1; transform: none; pointer-events: auto; visibility: visible; }
  .p-hd { display: flex; align-items: center; gap: 11px; padding: 9px 10px 11px; }
  .p-av { position: relative; width: 38px; height: 38px; border-radius: 11px; background: var(--subtle); display: grid; place-items: center; flex: none; }
  .p-av canvas { border-radius: 9px; }
  .p-name { display: block; font-size: 15px; font-weight: 600; line-height: 1.3; }
  .p-role { display: block; font-size: 12.5px; color: var(--faint); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p-rule { height: 1px; background: var(--line); margin: 0 10px; }
  .p-state { padding: 11px 10px; }
  .p-nums { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 7px; }
  .p-nums span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p-nums b { font-weight: 600; color: var(--ink); flex: none; }
  .p-acts { padding-top: 5px; }
  .p-why { margin: 0; font-size: 12px; color: var(--muted); padding: 1px 10px 7px; }

  /* Menu rows replace buttons inside the popover: a card never carries a
     near-black primary. The first row is the one the player came for. */
  .mrow {
    display: flex; align-items: center; gap: 10px; width: 100%;
    height: 36px; padding-inline: 10px; border: none; border-radius: 9px;
    background: none; text-align: left; font: inherit; font-size: 13.5px; color: var(--ink);
    cursor: pointer;
  }
  .mrow:hover { background: var(--subtle); }
  .mrow svg { width: 16px; height: 16px; flex: none; color: var(--muted); }
  .mrow-key { font-weight: 600; }
  .mrow-key svg { color: var(--ink); }
  .mrow-bad { color: var(--bad); }
  .mrow-bad svg { color: var(--bad); }
  .mrow-bad:hover { background: var(--bad-soft); }
  .mrow:disabled { color: var(--faint); cursor: default; background: none; }
  .mrow:disabled svg { color: var(--faint); }

  .chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: 11.5px; font-weight: 600; flex: none; }
  .chip.working { background: var(--warn-soft); color: var(--warn-ink); }
  .chip.ready { background: var(--info-soft); color: var(--info-ink); }
  .chip.available { background: var(--ok-soft); color: var(--ok-ink); }
  .chip.vacation { background: var(--sunk); color: var(--muted); }
  .track { display: block; height: 4px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 999px; }

  @media (max-width: 960px) {
    .app { grid-template-columns: 1fr; }
    .side { border-bottom: 1px solid var(--line-2); }
  }
  /* ═══ sample-page bar ═══ */
  /* Not part of the design. One bar rather than two floating pieces, faint
     until wanted, so it never covers the screen it exists to show. */
  .devbar {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 60;
    display: flex; align-items: center; gap: 2px; padding: 5px 6px;
    max-width: calc(100vw - 28px); overflow-x: auto;
    background: var(--surface); border: 1px solid var(--line-2); border-radius: 999px;
    box-shadow: 0 2px 14px rgb(20 20 25 / .16);
    opacity: .42; transition: opacity .12s;
  }
  .devbar:hover, .devbar:focus-within { opacity: 1; }
  .devbar a, .devbar button {
    height: 26px; padding-inline: 11px; border: none; border-radius: 999px;
    background: none; font: inherit; font-size: 12px; font-weight: 600;
    color: var(--muted); cursor: pointer; text-decoration: none; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 6px; flex: none;
  }
  .devbar a:hover, .devbar button:hover { background: var(--subtle); color: var(--ink); }
  .devbar [aria-current], .devbar [aria-pressed="true"] { background: var(--ink); color: #fff; }
  .devbar a:focus-visible, .devbar button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .devbar .sep { width: 1px; height: 18px; background: var(--line-2); flex: none; margin-inline: 4px; }
  .devbar .home { padding-inline: 9px; }
  .devbar svg { width: 14px; height: 14px; }
  .devbar .grouplabel {
    font-size: 11px; font-weight: 600; color: var(--faint);
    padding-inline: 6px 2px; flex: none; white-space: nowrap;
  }
  .lang { display: contents; }
</style>

      .map((a) => {
        const cls = ["mrow", a.key ? "mrow-key" : "", a.bad ? "mrow-bad" : ""].filter(Boolean).join(" ");
        const row = `<button class="${cls}" type="button"${a.off ? " disabled" : ""}>${a.icon}${a.label}</button>`;
        return a.off ? row + `<p class="p-why">${a.off}</p>` : row;
      })
      .join("");

    pop.innerHTML = `
      <div class="p-hd">
        <span class="p-av">
          <canvas aria-hidden="true" width="32" height="32"></canvas>
          <span class="c-live" style="background:${STATUS[p.status].color}"></span>
        </span>
        <span style="flex:1;min-width:0">
          <span class="p-name">${p.name}</span>
          <span class="p-role">${p.role}</span>
        </span>
        <span class="chip ${p.status}"><span class="dot ${p.status}"></span>${label(p.status)}</span>
      </div>
      <div class="p-rule"></div>
      <div class="p-state">${stateBlock(p)}</div>
      <div class="p-rule"></div>
      <div class="p-acts">${rows}</div>`;
    drawAvatar(pop.querySelector("canvas"), p.species);

    anchor = el;
    pop.setAttribute("data-open", "");
    place(el);
    if (viaKey) {
      const first = pop.querySelector(".mrow:not(:disabled)");
      if (first) first.focus({ preventScroll: true });
    }
  }

  function place(el) {
    const r = el.getBoundingClientRect();
    const w = pop.offsetWidth, h = pop.offsetHeight, gap = 8, edge = 12;
    let left = r.right + gap;
    if (left + w > innerWidth - edge) left = r.left - w - gap;
    if (left < edge) left = Math.min(Math.max(edge, r.left), innerWidth - w - edge);
    let top = Math.min(r.top, innerHeight - h - edge);
    pop.style.left = Math.round(left) + "px";
    pop.style.top = Math.round(Math.max(edge, top)) + "px";
  }

  function close() {
    pop.removeAttribute("data-open");
    document.querySelectorAll("[data-id]").forEach((n) => n.setAttribute("aria-expanded", "false"));
    anchor = null;
  }

  document.addEventListener("pointerdown", (e) => {
    if (anchor && !pop.contains(e.target) && !e.target.closest("[data-id]")) close();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || !anchor) return;
    // A card is a plain container, so focus returns to its kebab button.
    const back = anchor.matches("[data-id]") ? anchor : anchor.querySelector("[data-id]");
    close();
    if (back) back.focus({ preventScroll: true });
  });
  addEventListener("resize", () => { if (anchor) place(anchor); });
  addEventListener("scroll", () => { if (anchor) place(anchor); }, true);
</script>
<script>
  // The bar marks where you are and carries ?lang= across pages, so switching
  // screens does not silently switch you back to Korean. In-app links in the
  // samples carry it too, for the same reason.
  {
    const here = (location.pathname.split("/").pop() || "index.html").replace(".html", "");
    const l = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "ko";
    for (const el of document.querySelectorAll(".devbar [data-ko]")) {
      if (el.dataset.p === here) el.setAttribute("aria-current", "page");
      if (el.tagName === "A" && el.dataset.p === "index") el.setAttribute("aria-label", el.dataset[l]);
      else el.textContent = el.dataset[l];
    }
    if (l === "en") {
      for (const a of document.querySelectorAll('a[href$=".html"]')) {
        // keep the link relative: reading .href would absolutise it
        const h = a.getAttribute("href");
        if (!a.hasAttribute("aria-current") && !h.includes("?")) a.setAttribute("href", h + "?lang=en");
      }
    }
  }
</script>
