<meta charset="utf-8" />

<style>
  /* ═══ office ═══ */

  .room { display: block; border-radius: 6px; image-rendering: pixelated; }

  .desk { position: absolute; padding: 0; background: none; border: 2px solid transparent; border-radius: 7px; cursor: pointer; }

  .desk:hover { border-color: rgb(255 255 255 / .9); }

  .desk[aria-expanded="true"] { border-color: #fff; background: rgb(255 255 255 / .18); }

  /* ═══ team cards ═══ */

  .grp { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }

  .grp h2 { margin: 0; font-size: 17px; font-weight: 600; }

  .card:hover { box-shadow: 0 2px 10px rgb(20 20 25 / .07); }

  .card:has([aria-expanded="true"]) { border-color: var(--line-2); box-shadow: 0 4px 18px rgb(20 20 25 / .11); }

  .c-av canvas { border-radius: 10px; }

  .c-nums span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .c-menu {
    position: absolute; top: 11px; right: 9px;
    width: 26px; height: 26px; border: none; border-radius: 7px;
    background: none; color: var(--faint); cursor: pointer;
    display: grid; place-items: center;
  }

  .c-menu:hover, .c-menu[aria-expanded="true"] { background: var(--subtle); color: var(--ink); }

  .c-menu svg { width: 15px; height: 15px; }

  /* ═══ anchored popover ═══ */

  .p-av canvas { border-radius: 9px; }

  .p-nums span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ═══ today ═══ */

  .today-row { display: grid; grid-template-columns: 44px 16px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }

  .today-row:last-child { border-bottom: none; }

  .today-at { font-family: var(--mono); font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }

  .today-ic { display: grid; place-items: center; color: var(--muted); }

  .today-ic svg { width: 15px; height: 15px; }

  .today-row.you .today-ic { color: var(--brand); }

  .today-row.bad .today-ic { color: var(--bad); }

  .bub .agent-mark { margin-left: 2px; }

  .p-lost { display: block; font-size: 13px; line-height: 1.45; color: var(--bad-ink); margin-top: 8px; }

  .today-tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }

  .today-tx b { color: var(--ink); font-weight: 600; }

  .today-more { margin-top: 8px; }

  /* Menu rows replace buttons inside the popover: a card never carries a
     near-black primary. The first row is the one the user came for. */

  @media (max-width: 960px) {
    .app { grid-template-columns: 1fr; }
    .side { border-bottom: 1px solid var(--line-2); }
  }
</style>

<script>
  /* ── pixel tiles ─────────────────────────────────────────────── */

  // B body · L belly · O eye white · A ear · H blush · N beak · E eye and mouth
  // Every sprite shares one body. Only the seven head rows change, so twenty
  // species still read as one family.

  function drawAvatar(el, species) {
    const c = el.getContext("2d");
    c.clearRect(0, 0, el.width, el.height);
    c.imageSmoothingEnabled = false;
    const sp = SPECIES.get(species);
    const scale = Math.max(1, Math.floor(el.width / 16));
    const pad = Math.floor((el.width - 16 * scale) / 2);
    paint(c, sp.sprite, scale, pad, pad, skin(sp));
  }

  /* ── i18n ────────────────────────────────────────────────────── */
  // Employee nicknames are absent on purpose: the user wrote them, so they
  // never go through a dictionary.
  const TEXT = {
    ko: {
      ...WORDS.ko,
      hireDesk: "빈 책상에 직원 채우기", noTeam: "팀 없음", noDesk: "빈 책상이 없어요", justHired: "방금 입사",
      emptyDesk: "빈 책상", emptySeat: "빈 자리",
      title: "사무실", date: "2026. 9. 26. (토) 10:24",
      feedTitle: "오늘", feedSub: "사무실에서 일어난 일, 최신순이에요.", feedNothing: "이 방에서는 오늘 아직 일어난 일이 없어요.",
      feedMore: (n) => n + "건 더 보기", feedLess: "접기", feedApprove: "승인하러 가기", feedLook: "보러 가기",
      lostWhy: "하던 업무와 기억은 그대로예요. 다시 연결하면 이어서 해요.",
      feed: {
        started: (e) => subj(e.name) + " " + objB(e.task) + " 시작했어요",
        reviewStarted: (e) => subj(e.name) + " " + objB(e.task) + " " + e.area + " 관점에서 보기 시작했어요",
        memoryUsed: (e) => subj(e.name) + " ‘" + e.mem + "’" + (hasBatchim(e.mem) ? "을" : "를") + " 참고했어요",
        waiting: (e) => subj(e.name) + " " + objB(e.task) + " 마쳤어요 · " + e.took + "분 · 승인을 기다려요",
        applied: (e) => objB(e.task) + " 반영했어요",
        leave: (e) => subj(e.name) + " 휴가를 떠났어요",
        lost: (e) => e.name + "의 에이전트 연결이 끊겼어요 · <b>" + e.task + "</b>",
      },
      tabs: { all: "전체", lounge: "휴게실" },
      deskSub: (used, seats) => "책상 " + seats + "석 중 " + used + "석 사용",
      loungeSub: "일이 없는 사람은 여기 있어요.",
      nobodyHere: "지금은 아무도 없어요.", meetingSub: "검토하는 사람이 여기 앉아요. 검토가 끝나면 자리로 돌아가요.",
      atLounge: "휴게실", atMeeting: "회의실",
      rooms: { meeting: "회의실" },
      work: "업무", noTask: "할당된 업무 없음", away: "자리 비움",
      spent: (m) => m + "분째",
      waiting: "대기", onLeave: "휴가", deskFree: "지금은 비어 있습니다",
      inProgress: "진행 중", lastDone: "최근 완료", vacationLabel: "휴가",
      actions: {
        reconnect: "다시 연결", detail: "업무 상세", reassign: "담당 변경",
        assign: "업무 맡기기", teach: "기억 가르치기", leave: "휴가 보내기", comeBack: "복귀 처리",
      },
      cannotAssign: "휴가 중에는 업무를 맡길 수 없습니다.",
      actionOf: (n) => n + " 행동",
      tasks: { paging: "결제 내역 페이지네이션", orderType: "주문 상태 타입 좁히기", webhook: "결제 웹훅 서명 검증" },
      reviewKey: "검토", reviewingNow: "검토 중인 업무",
      backIn: "3일 후 복귀", backUnknown: "복귀 날짜 미정", justBack: "휴가에서 막 돌아왔어요",
    },
    en: {
      ...WORDS.en,
      hireDesk: "Fill this desk", noTeam: "No team", noDesk: "No free desk", justHired: "Just joined",
      emptyDesk: "Empty desk", emptySeat: "Empty",
      title: "Office", date: "Sat, Sep 26, 2026 · 10:24",
      feedTitle: "Today", feedSub: "What happened in the office, newest first.", feedNothing: "Nothing has happened in this room yet today.",
      feedMore: (n) => "Show " + n + " more", feedLess: "Show less", feedApprove: "Review it", feedLook: "Take a look",
      lostWhy: "The task and everything they remember are untouched. Reconnect and they pick it up.",
      feed: {
        started: (e) => e.name + " started <b>" + e.task + "</b>",
        reviewStarted: (e) => e.name + " started looking at the " + e.area + " side of <b>" + e.task + "</b>",
        memoryUsed: (e) => e.name + " drew on “" + e.mem + "”",
        waiting: (e) => e.name + " finished <b>" + e.task + "</b> in " + e.took + " min · waiting on you",
        applied: (e) => "<b>" + e.task + "</b> was applied",
        leave: (e) => e.name + " went on leave",
        lost: (e) => e.name + "'s agent disconnected · <b>" + e.task + "</b>",
      },
      tabs: { all: "All", lounge: "Lounge" },
      deskSub: (used, seats) => used + " of " + seats + " desks in use",
      loungeSub: "Whoever has no work to do is here.",
      nobodyHere: "Nobody is here right now.", meetingSub: "Whoever is reviewing sits here, and goes back to their desk when it is done.",
      atLounge: "Lounge", atMeeting: "Meeting room",
      rooms: { meeting: "Meeting room" },
      work: "WORK", noTask: "Nothing assigned", away: "Away",
      spent: (m) => m + " min so far",
      waiting: "Free", onLeave: "Leave", deskFree: "Nothing on right now",
      inProgress: "In progress", lastDone: "Last finished", vacationLabel: "On leave",
      actions: {
        reconnect: "Reconnect", detail: "Task details", reassign: "Reassign",
        assign: "Give work", teach: "Teach", leave: "Send on leave", comeBack: "Bring back",
      },
      cannotAssign: "They cannot take work while on leave.",
      actionOf: (n) => "Actions for " + n,
      tasks: { paging: "Paginate the payment history", orderType: "Narrow the order status type", webhook: "Verify the payment webhook signature" },
      reviewKey: "Review", reviewingNow: "Reviewing",
      backIn: "Back in 3 days", backUnknown: "No return date yet", justBack: "Just back from leave",
    },
  };

  const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "ko";
  const t = () => TEXT[lang];
  const dig = (o, k) => k.split(".").reduce((a, x) => a?.[x], o);
  const applyStatic = () => {
    for (const el of document.querySelectorAll("[data-t]")) {
      const v = dig(t(), el.dataset.t);
      if (typeof v === "string") el.textContent = v;
    }
    for (const el of document.querySelectorAll("[data-a]")) {
      const v = dig(t(), el.dataset.a);
      if (typeof v === "string") el.setAttribute("aria-label", v);
    }
  };
  applyStatic();

  /* ── data ────────────────────────────────────────────────────── */
  // Status mirrors the domain: an employee is working, reviewing someone
  // else's work, available or on vacation. The actions offered follow from that alone.
  const label = (k) => t().status[k];

  // Who these people are is the company's answer, not this screen's. The floor
  // adds only where each of them sits and what is on their desk today.
  const DESKS = [
    { id: "p1", col: 3, row: 3, task: { key: "paging", spent: 23 } },
    { id: "p2", col: 8, row: 3, task: { key: "orderType", spent: 8 } },
    { id: "p3", col: 13, row: 3, task: { key: "webhook", spent: 41 } },
    { id: "p4", col: 3, row: 6, review: { key: "webhook", spent: 6 } },
    { id: "p5", col: 8, row: 6, back: "backIn" },
    { id: null, col: 13, row: 6 },
  ];
  const fromCompany = new Map(STAFF.map((p) => [p.id, p]));
  const people = DESKS.map((d) => (d.id ? { ...fromCompany.get(d.id), ...d } : d));
  const staffed = people.filter((p) => p.id);
  const byId = new Map(staffed.map((p) => [p.id, p]));

  /* ── rooms ───────────────────────────────────────────────────── */
  // A tab is a room, and every room follows from the company: the whole floor,
  // a room for each team that has people, the meeting room where reviewers
  // sit, and the lounge where anyone without work ends up.

  const S = 3, T = 48;
  const canvas = document.getElementById("room");
  const ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  ctx.imageSmoothingEnabled = false;

  const tabs = document.getElementById("tabs");
  const TEAMS = [...new Set(staffed.map((p) => p.team))].filter(Boolean);
  const inLounge = (p) => p.status === "available";
  const atDesk = (p) => p.status === "working";
  const inMeeting = (p) => p.status === "reviewing";

  const ROOMS = [
    { key: "all", kind: "all" },
    ...TEAMS.map((team) => ({ key: team, kind: "team", team })),
    { key: "meeting", kind: "meeting" },
    { key: "lounge", kind: "lounge" },
  ];
  let room = "all";

  const roomOf = (key) => ROOMS.find((r) => r.key === key);
  const roomName = (r) => (r.kind === "team" ? t().teams[r.team] : t().rooms[r.kind] ?? t().tabs[r.kind]);
  const headcount = (r) =>
    r.kind === "all" ? staffed.length
      : r.kind === "team" ? staffed.filter((p) => p.team === r.team).length
      : r.kind === "lounge" ? staffed.filter(inLounge).length
      : staffed.filter(inMeeting).length;

  // The whole floor keeps the seats it was drawn with; a team room lays its
  // own out, three to a row.
  function seatsOf(key) {
    if (key === "all") return people;
    const mine = people.filter((p) => p.id && p.team === key);
    return mine.map((p, i) => ({ ...p, col: 3 + (i % 3) * 5, row: 3 + Math.floor(i / 3) * 3 }));
  }

  function drawRoom(w, h, deco) {
    canvas.width = w * T;
    canvas.height = h * T;
    ctx.imageSmoothingEnabled = false;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) paint(ctx, TILES.floor, S, x * T, y * T);
    for (let x = 0; x < w; x++) paint(ctx, TILES.wall, S, x * T, 0);
    for (const [tile, x, y] of deco) paint(ctx, TILES[tile], S, x * T, y * T);
    overlay.innerHTML = "";
  }

  function mark(p, x, y, name, state) {
    const btn = document.createElement("button");
    btn.className = "desk";
    btn.type = "button";
    if (p?.id) btn.dataset.id = p.id;
    btn.style.left = x * T - 4 + "px";
    btn.style.top = y * T - T - 6 + "px";
    btn.style.width = 2 * T + 8 + "px";
    btn.style.height = 2 * T + 10 + "px";
    btn.setAttribute("aria-label", p?.id ? p.name : t().emptyDesk);
    if (p?.id) btn.addEventListener("click", (e) => open(p.id, btn, e.detail === 0));
    overlay.appendChild(btn);

    const tag = document.createElement("span");
    tag.className = "tag";
    tag.style.left = x * T + T + "px";
    tag.style.top = y * T + T + 4 + "px";
    tag.textContent = name;
    if (!p?.id || !atDesk(p)) tag.style.opacity = ".7";
    overlay.appendChild(tag);
    if (!state) return;

    const bub = document.createElement("span");
    bub.className = "bub";
    bub.style.left = x * T + T + "px";
    bub.style.top = y * T - T - 24 + "px";
    // Someone in the lounge is available; the bubble only says where they are.
    const where = { lounge: ["available", t().atLounge], meeting: ["reviewing", t().atMeeting] }[state];
    bub.innerHTML = '<span class="dot ' + (where ? where[0] : state) + '"></span>' + (where ? where[1] : label(state)) + (p?.agentLost ? agentMark(true) : "");
    overlay.appendChild(bub);
  }

  function drawDesks(key) {
    const seats = seatsOf(key);
    const w = Math.max(...seats.map((p) => p.col)) + 5;
    const h = Math.max(...seats.map((p) => p.row)) + 2;
    const deco = [["window", 2, 0], ["window", 3, 0], ["board", 8, 0], ["board", 9, 0], ["shelf", 14, 0], ["plant", 0, h - 1], ["plant", w - 1, h - 1]]
      .filter(([, x, y]) => x < w && y < h);
    drawRoom(w, h, deco);

    for (const p of seats) {
      const dx = p.col * T, dy = p.row * T;
      const here = p.id && atDesk(p);
      paint(ctx, CHAIR, S, dx, dy - T);
      if (here) paint(ctx, SPECIES.get(p.species).sprite, S, dx, dy - T, skin(SPECIES.get(p.species)));
      paint(ctx, TILES.deskL, S, dx, dy);
      paint(ctx, TILES.deskR, S, dx + T, dy);
      paint(ctx, MONITOR, S, dx + T / 2, dy - 2 * S, { M: p.status === "working" ? P.M : P.o });
      // An empty chair still belongs to someone, and the tag says where they went.
      mark(p, p.col, p.row, p.id ? p.name : t().emptySeat, p.id ? (inLounge(p) ? "lounge" : inMeeting(p) ? "meeting" : p.status) : null);
    }
  }

  function drawLounge() {
    const here = staffed.filter(inLounge);
    drawRoom(13, 6, [["window", 2, 0], ["coffee", 8, 0], ["shelf", 11, 0], ["plant", 0, 5], ["plant", 12, 5], ["table", 7, 3]]);
    paint(ctx, TILES.sofaBackL, S, 4 * T, 2 * T);
    paint(ctx, TILES.sofaBackR, S, 5 * T, 2 * T);
    // Between the back and the seat, which is what sitting in it looks like.
    here.forEach((p, i) => {
      const col = 4 + (i % 2);
      paint(ctx, SPECIES.get(p.species).sprite, S, col * T, 2 * T + 4 * S, skin(SPECIES.get(p.species)));
    });
    paint(ctx, TILES.sofaL, S, 4 * T, 3 * T);
    paint(ctx, TILES.sofaR, S, 5 * T, 3 * T);
    here.forEach((p, i) => mark(p, 4 + (i % 2) - 0.5, 3, p.name, p.status));
  }

  // A table for every review under way, two to a row; none when nobody reviews.
  function drawMeeting() {
    const here = staffed.filter(inMeeting);
    const rows = Math.max(1, Math.ceil(here.length / 2));
    const h = 3 + rows * 3;
    drawRoom(13, h, [["window", 2, 0], ["board", 6, 0], ["board", 7, 0], ["plant", 0, h - 1], ["plant", 12, h - 1]]);
    here.forEach((p, i) => {
      const col = 2 + (i % 2) * 6, row = 3 + Math.floor(i / 2) * 3;
      paint(ctx, CHAIR, S, (col + 1) * T, (row - 1) * T);
      paint(ctx, SPECIES.get(p.species).sprite, S, (col + 1) * T, (row - 1) * T, skin(SPECIES.get(p.species)));
      paint(ctx, TILES.deskL, S, col * T, row * T);
      paint(ctx, TILES.deskM, S, (col + 1) * T, row * T);
      paint(ctx, TILES.deskR, S, (col + 2) * T, row * T);
      mark(p, col + 0.5, row, p.name, p.status);
    });
  }

  function render() {
    tabs.innerHTML = "";
    for (const r of ROOMS) {
      const b = document.createElement("button");
      b.className = "tab";
      b.setAttribute("aria-selected", String(r.key === room));
      b.innerHTML = `<span>${roomName(r)}</span><span class="n">${headcount(r)}</span>`;
      b.addEventListener("click", () => { room = r.key; close(); render(); });
      tabs.appendChild(b);
    }
    const here = roomOf(room);
    if (here.kind === "lounge") drawLounge();
    else if (here.kind === "meeting") drawMeeting();
    else drawDesks(room);

    const seats = here.kind === "all" || here.kind === "team" ? seatsOf(room) : [];
    document.getElementById("headSub").textContent =
      here.kind === "lounge" ? t().loungeSub
        : here.kind === "meeting" ? t().meetingSub
        : t().deskSub(seats.filter((p) => p.id).length, seats.length);

    drawCards();
  }

  /* ── sidebar roster ──────────────────────────────────────────── */
  function renderMembers() {
    const box = document.getElementById("members");
    box.replaceChildren();
    mountRoster(box, (p, el, viaKey) => open(p.id, el, viaKey));
  }
  renderMembers();
  /* ── team cards ──────────────────────────────────────────────── */
  function cardInner(p) {
    const nums =
      p.status === "working" ? `<span>${t().spent(p.task.spent)}</span><b>${t().status.working}</b>`
      : p.status === "reviewing" ? `<span>${t().spent(p.review.spent)}</span><b>${t().status.reviewing}</b>`
      : p.status === "available" ? `<span>${t()[p.last]}</span><b>${t().waiting}</b>`
      : `<span>${t()[p.back]}</span><b>${t().onLeave}</b>`;
    const line =
      p.status === "working" ? t().tasks[p.task.key]
      : p.status === "reviewing" ? t().tasks[p.review.key]
      : p.status === "available" ? t().noTask
      : t().away;
    return `
      <button class="c-menu" type="button" data-id="${p.id}" aria-haspopup="dialog" aria-expanded="false" aria-label="${t().actionOf(p.name)}"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="3.2" r="1.35"/><circle cx="8" cy="8" r="1.35"/><circle cx="8" cy="12.8" r="1.35"/></svg></button>
      <span class="c-av">
        <canvas aria-hidden="true" width="34" height="34"></canvas>
        <span class="c-live" style="background:${STATUS[p.status].color}"></span>
        ${p.agentLost ? agentMark() : ""}
      </span>
      <span class="c-name">${p.name}</span>
      <span class="c-role">${p.role}</span>
      <span class="c-rule"></span>
      <span class="c-k">${p.status === "reviewing" ? t().reviewKey : t().work}</span>
      <span class="c-task">${line}</span>
      <span class="c-nums">${nums}</span>`;
  }

  /* ── today ───────────────────────────────────────────────────── */
  // Each row is a domain event worded by the dictionary. What waits on the
  // user carries the way to it; nothing else asks for anything.
  const subj = (n) => (lang === "en" ? n : withParticle(n, "이", "가"));
  const objB = (w) => "<b>" + w + "</b>" + (lang === "en" ? "" : hasBatchim(w) ? "을" : "를");
  const EVENTS = [
    { at: "10:18", kind: "lost", who: "p1", project: "pay", task: { ko: "결제 내역 페이지네이션", en: "Paginate the payment history" } },
    { at: "10:16", kind: "started", who: "p2", task: { ko: "주문 상태 타입 좁히기", en: "Narrow the order status type" } },
    { at: "10:12", kind: "reviewStarted", who: "p4", area: "security", task: { ko: "결제 웹훅 서명 검증", en: "Verify the payment webhook signature" } },
    { at: "10:09", kind: "memoryUsed", who: "p1", mem: { ko: "도메인 레이어에서 Date.now()를 쓰지 않아요", en: "No Date.now() in the domain layer" } },
    { at: "10:01", kind: "started", who: "p1", task: { ko: "결제 내역 페이지네이션", en: "Paginate the payment history" } },
    { at: "10:00", kind: "waiting", who: "p1", took: 52, project: "pay", task: { ko: "결제 API 에러 응답 구조 변경", en: "Change the payment API error shape" } },
    { at: "09:43", kind: "started", who: "p3", task: { ko: "결제 웹훅 서명 검증", en: "Verify the payment webhook signature" } },
    { at: "09:40", kind: "applied", task: { ko: "환불 정책 문서화", en: "Write down the refund policy" } },
    { at: "09:12", kind: "waiting", who: "p4", took: 19, project: "order", task: { ko: "주문 테이블 인덱스 정리", en: "Tidy the order table indexes" } },
    { at: "09:00", kind: "leave", who: "p5" },
  ];
  const FEED_ICON = {
    started: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 3.4l7.6 4.6L5 12.6z"/></svg>',
    reviewStarted: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1.6 8s2.4-4 6.4-4 6.4 4 6.4 4-2.4 4-6.4 4-6.4-4-6.4-4z"/><circle cx="8" cy="8" r="1.7"/></svg>',
    memoryUsed: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M2.8 3.2h3.6A1.8 1.8 0 0 1 8 5v8a1.6 1.6 0 0 0-1.6-1.4H2.8zM13.2 3.2H9.6A1.8 1.8 0 0 0 8 5v8a1.6 1.6 0 0 1 1.6-1.4h3.6z"/></svg>',
    waiting: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.4 9.4h3.2l1 1.8h2.8l1-1.8h3.2"/><path d="M3.6 3.4h8.8l1.2 6v3.2H2.4V9.4z"/></svg>',
    applied: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 8.4l3 3 6.2-6.6"/></svg>',
    lost: PLUG,
    leave: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="2.6"/><path d="M8 1.6v1.6M8 12.8v1.6M1.6 8h1.6M12.8 8h1.6M3.5 3.5l1.1 1.1M11.4 11.4l1.1 1.1M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1"/></svg>',
  };
  const FEED_SHOWN = 6;
  let feedOpen = false;

  // The feed follows the room: a team's room and the lounge show the people in them.
  function renderFeed(here) {
    const box = document.getElementById("feed");
    const inRoom = (p) => (here.kind === "team" ? p.team === room : here.kind === "lounge" ? inLounge(byId.get(p.id)) : inMeeting(byId.get(p.id)));
    const mine = (e) => here.kind === "all" || (e.who && inRoom(fromCompany.get(e.who)));
    const list = EVENTS.filter(mine);
    const rows = feedOpen ? list : list.slice(0, FEED_SHOWN);
    const suffix = lang === "en" ? "?lang=en" : "";
    box.innerHTML = list.length ? "" : `<p class="col-empty" style="margin:0">${t().feedNothing}</p>`;
    for (const e of rows) {
      const words = { name: e.who ? fromCompany.get(e.who).name : "", task: e.task?.[lang], mem: e.mem?.[lang], area: t().areas[e.area], took: e.took };
      const row = document.createElement("div");
      row.className = "today-row" + (e.kind === "waiting" ? " you" : e.kind === "lost" ? " bad" : "");
      row.innerHTML = `<span class="today-at">${e.at}</span><span class="today-ic">${FEED_ICON[e.kind]}</span>
        <span class="today-tx">${t().feed[e.kind](words)}</span>
        ${e.project ? `<a class="btn btn-secondary btn-sm" href="projects.html${suffix}#${e.project}">${e.kind === "lost" ? t().feedLook : t().feedApprove}</a>` : "<span></span>"}`;
      row.querySelector(".today-tx").title = row.querySelector(".today-tx").textContent;
      box.appendChild(row);
    }
    if (list.length > FEED_SHOWN) {
      const more = document.createElement("button");
      more.className = "btn btn-ghost btn-sm today-more";
      more.type = "button";
      more.textContent = feedOpen ? t().feedLess : t().feedMore(list.length - FEED_SHOWN);
      more.addEventListener("click", () => { feedOpen = !feedOpen; renderFeed(here); });
      box.appendChild(more);
    }
  }

  const teams = document.getElementById("teams");

  function drawCards() {
    teams.innerHTML = "";
    const here = roomOf(room);
    renderFeed(here);
    const groups =
      here.kind === "all" ? [["noTeam", staffed.filter((p) => !p.team)], ...TEAMS.map((team) => [team, staffed.filter((p) => p.team === team)])].filter(([k, g]) => k !== "noTeam" || g.length)
      : here.kind === "team" ? [[room, staffed.filter((p) => p.team === room)]]
      : [[here.kind, staffed.filter(here.kind === "lounge" ? inLounge : inMeeting)]];

    for (const [key, group] of groups) {
      const wrap = document.createElement("div");
      wrap.style.marginBottom = "18px";
      const heading = key === "noTeam" ? t().noTeam : t().teams[key] ?? roomName(roomOf(key));
      wrap.innerHTML = `<div class="grp"><h2>${heading}</h2><span class="cnt">${group.length}</span></div>`;
      const grid = document.createElement("div");
      grid.className = "cards";
      for (const p of group) {
        const c = document.createElement("div");
        c.className = "card";
        if (p.status === "vacation") c.style.opacity = ".72";
        c.innerHTML = cardInner(p);
        c.addEventListener("click", (e) => open(p.id, c, e.detail === 0));
        grid.appendChild(c);
        drawAvatar(c.querySelector("canvas"), p.species);
      }
      if (!group.length) {
        const e = document.createElement("p");
        e.className = "col-empty";
        e.textContent = t().nobodyHere;
        grid.appendChild(e);
      }
      if (t().teams[key] && group.length) {
        const add = document.createElement("button");
        add.className = "addcard";
        add.type = "button";
        add.innerHTML =
          '<span class="plus"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg></span>' +
          (freeDesk() < 0 ? t().noDesk : t().hireDesk);
        add.disabled = freeDesk() < 0;
        add.addEventListener("click", () => hireAt(key));
        grid.appendChild(add);
      }
      wrap.appendChild(grid);
      teams.appendChild(wrap);
    }
  }

  /* ── hiring ──────────────────────────────────────────────────── */
  // Hiring needs a free desk, and the new person sits at it.
  const freeDesk = () => DESKS.findIndex((d) => !d.id);

  function hireAt(team) {
    openHire({
      team,
      onSave: (h) => {
        const i = freeDesk();
        if (i < 0) return;
        const base = { ...h, id: "p" + (STAFF.length + 1), status: "available", memories: [], style: [], done: 0, reviews: 0 };
        STAFF.push(base);
        fromCompany.set(base.id, base);
        Object.assign(DESKS[i], { id: base.id, last: "justHired" });
        const p = { ...base, ...DESKS[i] };
        people[i] = p;
        staffed.push(p);
        byId.set(p.id, p);
        renderMembers();
        render();
      },
    });
  }

  /* ── anchored popover ────────────────────────────────────────── */
  const I = {
    plug: PLUG,
    plus: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg>',
    swap: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5h9.5l-2.4-2.4M13 10.5H3.5l2.4 2.4"/></svg>',
    book: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M2.8 3.2h3.6A1.8 1.8 0 0 1 8 5v8a1.6 1.6 0 0 0-1.6-1.4H2.8zM13.2 3.2H9.6A1.8 1.8 0 0 0 8 5v8a1.6 1.6 0 0 1 1.6-1.4h3.6z"/></svg>',
    info: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M8 7.3v4M8 5.1v.1"/></svg>',
    sun: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="2.6"/><path d="M8 1.6v1.6M8 12.8v1.6M1.6 8h1.6M12.8 8h1.6M3.5 3.5l1.1 1.1M11.4 11.4l1.1 1.1M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1"/></svg>',
    undo: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.6 3.8v3.4h3.4"/><path d="M4 7.2a4.6 4.6 0 1 1 .8 4.4"/></svg>',
  };

  // Only transitions the domain allows from this state. The first row is the
  // one the user came here for. Teaching is not a transition, so it is
  // offered in every state.
  // Where each desk's work lives on the board.
  const TASK_AT = { paging: "pay/t1", orderType: "order/t3", webhook: "pay/t2" };

  const suffix = lang === "en" ? "?lang=en" : "";
  const go = (page, hash) => { location.href = page + suffix + "#" + hash; };
  const taskOf = (p) => TASK_AT[(p.task ?? p.review).key];

  // The office holds a copy of each person beside the company's own. The
  // copy keeps its own wording keys, so only status and the agent reach the
  // company's, which is what the sidebar draws.
  const change = (p, fields) => {
    Object.assign(p, fields);
    Object.assign(fromCompany.get(p.id), { status: p.status, agentLost: p.agentLost });
    render();
    renderMembers();
  };

  const TEACH = {
    icon: I.book, label: t().actions.teach,
    run: (p) => openTeach({ to: fromCompany.get(p.id), onSave: ({ to, memory }) => to.memories.unshift({ ...memory, used: 0 }) }),
  };
  const RECONNECT = { icon: I.plug, label: t().actions.reconnect, key: true, run: (p) => change(p, { agentLost: false }) };
  const ACTIONS = {
    working: [
      { icon: I.info, label: t().actions.detail, key: true, run: (p) => go("projects.html", taskOf(p)) },
      { icon: I.swap, label: t().actions.reassign, run: (p) => go("projects.html", taskOf(p) + "/assign") },
      TEACH,
    ],
    reviewing: [
      { icon: I.info, label: t().actions.detail, key: true, run: (p) => go("projects.html", taskOf(p)) },
      TEACH,
    ],
    available: [
      { icon: I.plus, label: t().actions.assign, key: true, run: (p) => go("employees.html", p.id + "/assign") },
      TEACH,
      { icon: I.sun, label: t().actions.leave, run: (p) => change(p, { status: "vacation", back: "backUnknown" }) },
    ],
    vacation: [
      { icon: I.plus, label: t().actions.assign, key: true, off: t().cannotAssign },
      { icon: I.undo, label: t().actions.comeBack, run: (p) => change(p, { status: "available", back: null, last: "justBack" }) },
      TEACH,
    ],
  };

  const pop = document.getElementById("pop");
  let anchor = null;

  function stateBlock(p) {
    if (p.status === "working")
      return `<span class="c-k">${t().inProgress}</span><span class="c-task">${t().tasks[p.task.key]}</span>
        <span class="p-nums"><span>${t().spent(p.task.spent)}</span><b>${t().status.working}</b></span>
        ${p.agentLost ? `<span class="p-lost"><b>${WORDS[lang].agentLost}</b> · ${t().lostWhy}</span>` : ""}`;
    if (p.status === "reviewing")
      return `<span class="c-k">${t().reviewingNow}</span><span class="c-task">${t().tasks[p.review.key]}</span>
        <span class="p-nums"><span>${t().spent(p.review.spent)}</span><b>${t().status.reviewing}</b></span>`;
    if (p.status === "available")
      return `<span class="c-k">${t().lastDone}</span><span class="c-task">${t()[p.last]}</span>
        <span class="p-nums"><span>${t().deskFree}</span><b>${t().waiting}</b></span>`;
    return `<span class="c-k">${t().vacationLabel}</span><span class="c-task">${t()[p.back]}</span>`;
  }

  function open(id, el, viaKey) {
    const p = byId.get(id);
    if (!p) return;
    if (anchor === el && pop.hasAttribute("data-open")) { close(); return; }

    document.querySelectorAll("[data-id]").forEach((n) => {
      n.setAttribute("aria-expanded", String(n.dataset.id === id));
    });

    const acts = p.agentLost
      ? [RECONNECT, ...ACTIONS[p.status].map((a) => ({ ...a, key: false }))]
      : ACTIONS[p.status];
    const rows = acts
      .map((a) => {
        const cls = ["mrow", a.key ? "mrow-key" : "", a.bad ? "mrow-bad" : ""].filter(Boolean).join(" ");
        const row = `<button class="${cls}" type="button"${a.off ? " disabled" : ""}>${a.icon}${a.label}</button>`;
        return a.off ? row + `<p class="p-why">${a.off}</p>` : row;
      })
      .join("");

    pop.innerHTML = `
      <div class="p-hd">
        <span class="p-av">
          <canvas aria-hidden="true" width="32" height="32"></canvas>
          <span class="c-live" style="background:${STATUS[p.status].color}"></span>
          ${p.agentLost ? agentMark() : ""}
        </span>
        <span style="flex:1;min-width:0">
          <span class="p-name">${p.name}</span>
          <span class="p-role">${p.role}</span>
        </span>
        <span class="chip ${p.status}"><span class="dot ${p.status}"></span>${label(p.status)}</span>
      </div>
      <div class="p-rule"></div>
      <div class="p-state">${stateBlock(p)}</div>
      <div class="p-rule"></div>
      <div class="p-acts">${rows}</div>`;
    drawAvatar(pop.querySelector("canvas"), p.species);
    pop.querySelectorAll(".p-acts > .mrow").forEach((b, i) => {
      b.addEventListener("click", () => { close(); acts[i].run(p); });
    });

    anchor = el;
    pop.setAttribute("data-open", "");
    place(el);
    if (viaKey) {
      const first = pop.querySelector(".mrow:not(:disabled)");
      if (first) first.focus({ preventScroll: true });
    }
  }

  function place(el) {
    const r = el.getBoundingClientRect();
    const w = pop.offsetWidth, h = pop.offsetHeight, gap = 8, edge = 12;
    let left = r.right + gap;
    if (left + w > innerWidth - edge) left = r.left - w - gap;
    if (left < edge) left = Math.min(Math.max(edge, r.left), innerWidth - w - edge);
    let top = Math.min(r.top, innerHeight - h - edge);
    pop.style.left = Math.round(left) + "px";
    pop.style.top = Math.round(Math.max(edge, top)) + "px";
  }

  function close() {
    pop.removeAttribute("data-open");
    document.querySelectorAll("[data-id]").forEach((n) => n.setAttribute("aria-expanded", "false"));
    anchor = null;
  }

  document.addEventListener("pointerdown", (e) => {
    // The anchor closes itself on the click that follows; closing here first
    // would clear it and let that click reopen the popover.
    if (!anchor || pop.contains(e.target) || anchor.contains(e.target)) return;
    if (!e.target.closest("[data-id]")) close();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || !anchor) return;
    // A card is a plain container, so focus returns to its kebab button.
    const back = anchor.matches("[data-id]") ? anchor : anchor.querySelector("[data-id]");
    close();
    if (back) back.focus({ preventScroll: true });
  });
  addEventListener("resize", () => { if (anchor) place(anchor); });
  addEventListener("scroll", () => { if (anchor) place(anchor); }, true);

  render();

</script>
