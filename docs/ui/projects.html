<meta charset="utf-8" />
<title>Tiny Office · Projects</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
/>
<link rel="stylesheet" href="system.css" />
<script src="system.js"></script>
<style>
  /* ═══ the board ═══ */
  /* A column is a status a task rests in, ordered the way work moves. Each one
     is a container of its own so the cards inside read as a stack rather than
     floating in the page, and it is wide enough that a title stays on one
     line — the board scrolls sideways instead of squeezing five in. */

  /* ═══ the list of projects ═══ */

  #projList .row-item { grid-template-columns: 58px minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1.7fr) 110px; }

  .pr-name { display: block; font-size: 16px; font-weight: 600; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .pr-desc { display: block; font-size: 15px; color: var(--muted); line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .pr-folder { font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .pr-counts { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .pr-counts b { color: var(--ink); font-weight: 600; }

  .pr-counts .wait b { color: var(--brand); }

  .pr-since { font-size: 14px; color: var(--faint); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }

  .list-empty { padding: 22px 14px; font-size: 15px; color: var(--muted); }

  .proj-title { display: flex; align-items: center; gap: 10px; }

  /* ═══ a task's page ═══ */

  .tk-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }

  .tk-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

  .step { display: grid; grid-template-columns: 44px 16px minmax(0, 1fr); gap: 10px; align-items: start; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 15px; }

  .step:last-child { border-bottom: none; }

  .step-at { font-family: var(--mono); font-size: 13px; color: var(--faint); padding-top: 2px; }

  .step-ic { display: grid; place-items: center; color: var(--muted); padding-top: 2px; }

  .step-ic svg { width: 14px; height: 14px; }

  .step.latest .step-ic { color: var(--warn); }

  .step-tx { color: var(--muted); min-width: 0; }

  .step-tx code { font-family: var(--mono); font-size: 14px; color: var(--ink); overflow-wrap: anywhere; }

  .file { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; width: 100%; padding: 8px 0; border: none; border-bottom: 1px solid var(--line); background: none; text-align: left; font: inherit; cursor: pointer; }

  .file:last-of-type { border-bottom: none; }

  .file-path { font-family: var(--mono); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .file-add { font-size: 14px; color: var(--ok-ink); font-variant-numeric: tabular-nums; }

  .file-del { font-size: 14px; color: var(--bad-ink); font-variant-numeric: tabular-nums; }

  .diff { margin: 0 0 8px; padding: 9px 11px; border-radius: 9px; background: var(--sunk); font-family: var(--mono); font-size: 13.5px; line-height: 1.6; overflow-x: auto; }

  .diff .d-add { color: var(--ok-ink); }

  .diff .d-del { color: var(--bad-ink); }

  .msg { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 9px; padding: 7px 0; font-size: 15px; }

  .msg b { display: block; font-size: 14px; }

  .tk-mem { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; font-size: 15px; color: var(--muted); }

  .tk-mem svg { width: 13px; height: 13px; flex: none; margin-top: 3px; }

  .tk-mem.used { color: var(--ink); }

  .tk-mem.used svg { color: var(--ok); }

  .runs { display: flex; flex-wrap: wrap; gap: 6px; }

  .run { display: inline-flex; align-items: center; gap: 2px; height: 32px; padding: 0 4px 0 11px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--surface); font-family: var(--mono); font-size: 14px; }

  .run button { width: 22px; height: 22px; display: grid; place-items: center; border: 0; border-radius: 999px; background: none; color: var(--faint); cursor: pointer; }

  .run button:hover { background: var(--subtle); color: var(--ink); }

  .run button:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }

  .run button svg { width: 11px; height: 11px; }

  .run-add { display: flex; gap: 6px; margin-top: 8px; }

  .run-add .input { flex: 1; font-family: var(--mono); font-size: 15px; }

  .tk-apply { display: block; font-size: 14px; color: var(--muted); margin-top: 10px; }

  .tk-apply code { font-family: var(--mono); color: var(--ink); }

  .fold > summary { display: flex; align-items: center; gap: 8px; list-style: none; cursor: pointer; }

  .fold > summary::-webkit-details-marker { display: none; }

  .fold > summary .fold-ic { margin-left: auto; display: grid; place-items: center; color: var(--faint); transition: transform .15s; }

  .fold > summary .fold-ic svg { width: 12px; height: 8px; }

  .fold[open] > summary .fold-ic { transform: rotate(180deg); }

  .fold:not([open]) > summary { border-bottom: none; }

  .fold > summary:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; border-radius: var(--r-card); }

  .said-card { margin-bottom: 16px; }

  .said-hd { display: flex; align-items: center; gap: 10px; }

  .said-hd h2 { margin-right: auto; }

  .said-av { width: 32px; height: 32px; border-radius: 8px; background: var(--subtle); display: grid; place-items: center; flex: none; }

  .view-sw { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--line-2); border-radius: 9px; background: var(--surface); }

  .view-sw button { width: 30px; height: 28px; display: grid; place-items: center; border: 0; border-radius: 7px; background: none; color: var(--muted); cursor: pointer; }

  .view-sw button svg { width: 16px; height: 16px; }

  .view-sw button:hover { color: var(--ink); background: var(--subtle); }

  .view-sw button[aria-checked="true"] { color: var(--brand-ink); background: var(--brand-soft); }

  .view-sw button:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }

  .said-bd { position: relative; padding: 18px 58px 22px 22px; }

  .said-text { max-width: 60rem; }

  .copy-ic { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); color: var(--muted); cursor: pointer; opacity: 0; transition: opacity .12s; }

  .copy-ic svg { width: 15px; height: 15px; }

  .copy-ic:hover { color: var(--ink); background: var(--subtle); }

  .copy-ic.done { color: var(--ok); opacity: 1; }

  .said-bd:hover .copy-ic, .copy-ic:focus-visible { opacity: 1; }

  .copy-ic:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }

  @media (hover: none) { .copy-ic { opacity: 1; } }

  .sug-card { margin-bottom: 16px; }

  .sug { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }

  .sug:first-child { padding-top: 0; }

  .sug:last-child { border-bottom: none; padding-bottom: 0; }

  .sug-tx { flex: 1; min-width: 0; font-size: 15px; line-height: 1.5; }

  .said-raw { margin: 0; font-family: var(--mono); font-size: 14px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }

  .md { font-size: 16px; line-height: 1.75; overflow-wrap: anywhere; }

  .md > * { margin: 0; }

  .md > * + * { margin-top: 12px; }

  .md > * + h3, .md > * + h4 { margin-top: 22px; }

  .md h3 { font-size: 18px; font-weight: 600; line-height: 1.4; scroll-margin-top: 16px; }

  .md h4 { font-size: 16px; font-weight: 600; line-height: 1.4; }

  .md ul, .md ol { padding-left: 22px; }

  .md li + li { margin-top: 4px; }

  .md code { font-family: var(--mono); font-size: 14px; background: var(--sunk); padding: 2px 6px; border-radius: 6px; }

  .md pre { padding: 12px 14px; border-radius: 10px; background: var(--sunk); font-family: var(--mono); font-size: 14px; line-height: 1.6; overflow-x: auto; }

  .md pre code { padding: 0; background: none; }

  .md blockquote { padding-left: 12px; border-left: 3px solid var(--line-2); color: var(--muted); }

  .md table { display: block; width: max-content; max-width: 100%; overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; border-spacing: 0; font-size: 15px; line-height: 1.55; }

  .md th, .md td { padding: 8px 14px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }

  .md tr:last-child td { border-bottom: none; }

  .md td:first-child { white-space: nowrap; }

  .md th { background: var(--sunk); color: var(--muted); font-size: 14px; font-weight: 600; }

  @media (max-width: 900px) { .tk-grid { grid-template-columns: 1fr; } }

  /* ═══ a task's page: what to decide, the conversation, the details ═══ */

  .tk2 { display: grid; grid-template-columns: minmax(0, 1fr) 16px var(--tk-side, 300px); gap: 6px; align-items: start; }

  @media (max-width: 1000px) { .tk2 { grid-template-columns: 1fr; gap: 20px; } .tk-split { display: none; } }

  .tk-split { position: relative; align-self: stretch; min-height: 120px; cursor: col-resize; touch-action: none; }

  .tk-split::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; transform: translateX(-50%); border-radius: 2px; background: transparent; transition: background .12s; }

  .tk-split:hover::before, .tk-split.dragging::before { background: var(--line-2); }


  .tk-split:focus-visible::before { background: var(--brand); }

  .tk2.resizing { user-select: none; cursor: col-resize; }

  .tk-tools { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }

  .view-sw.words button { width: auto; padding: 0 10px; font-size: 13px; font-weight: 500; }

  .tk-main { min-width: 0; }

  .tk-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

  .tk-now { margin-bottom: 16px; }

  .tk-tabs { display: flex; align-items: flex-end; gap: 12px; border-bottom: 1px solid var(--line); }

  .tk-tabs .tabs { flex: 1; margin-top: 0; border-bottom: none; }


  .tk-pane { padding-top: 6px; }

  .talk { position: relative; display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; padding: 18px 0; border-bottom: 1px solid var(--line); }

  .talk:last-child { border-bottom: none; }

  .talk-av { width: 32px; height: 32px; border-radius: 9px; background: var(--subtle); display: grid; place-items: center; color: var(--muted); }

  .talk-av svg { width: 16px; height: 16px; }

  .talk-hd { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; padding-right: 40px; }

  .talk-hd b { font-size: 15px; font-weight: 600; }

  .talk-k { font-size: 13px; color: var(--muted); }

  .talk-k.changes { color: var(--bad-ink); }

  .talk-k.approve { color: var(--ok-ink); }

  .talk-at { font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; }

  .talk-bd { margin-top: 6px; }

  .talk .copy-ic { top: 14px; right: 0; }

  .talk:hover .copy-ic, .talk .copy-ic:focus-visible { opacity: 1; }

  .talk-sug { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }

  .talk-sug > b { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }

  .talk-live { display: flex; align-items: center; gap: 8px; padding: 14px 0 4px; font-size: 14px; color: var(--muted); }

  .talk-live code { font-family: var(--mono); font-size: 13.5px; color: var(--ink); overflow-wrap: anywhere; }

  .talk-empty { padding: 18px 0; margin: 0; }

  .talk-sum { display: none; width: 100%; margin-top: 2px; padding: 0; border: 0; background: none; font: inherit; font-size: 15px; color: var(--muted); text-align: left; cursor: pointer; align-items: baseline; gap: 10px; }

  .talk-sum > span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .talk.folded { padding: 12px 0; }

  .talk.folded .talk-sum { display: flex; }

  .talk.folded .talk-bd, .talk.folded .talk-sug, .talk.folded .talk-toc, .talk.folded .copy-ic, .talk.folded .talk-more { display: none; }

  .talk-toggle { flex: none; padding: 0; border: 0; background: none; font: inherit; font-size: 14px; font-weight: 500; color: var(--brand-ink); cursor: pointer; }

  .talk-more { display: block; margin-top: 8px; }

  .talk-bd.clip { max-height: 520px; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, var(--ink) 78%, transparent); mask-image: linear-gradient(to bottom, var(--ink) 78%, transparent); }

  .talk-toc { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

  .talk-toc:empty { display: none; }

  .talk-toc button { height: 26px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--surface); font: inherit; font-size: 13px; color: var(--muted); cursor: pointer; }

  .talk-toc button:hover { color: var(--ink); background: var(--subtle); }

  .talk-toc button:focus-visible, .talk-toggle:focus-visible, .talk-sum:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }


  .side-kv .kv b { font-weight: 500; }

  .side-kv .kv .chip { font-size: 13px; }

  .chip.planned { background: none; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-2); }

  /* A project's status reads by shape as well as colour, the same in the tabs
     and beside its name. */
  .pmark { width: 10px; height: 10px; flex: none; display: inline-grid; place-items: center; }

  .pmark.planned { border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--faint); width: 8px; height: 8px; }

  .pmark svg { width: 10px; height: 10px; }

  .pmark.held { color: var(--muted); }

  .pmark.done { color: var(--ok); }

  @media (max-width: 860px) {
    #projList .row-item { grid-template-columns: minmax(0, 1fr) auto; }
    .pr-folder, .pr-counts { display: none; }
  }

  .board { display: grid; grid-auto-flow: column; grid-auto-columns: 268px; gap: 10px; align-items: start; overflow-x: auto; padding-bottom: 6px; }

  /* a section of its own, not the reference pages' card */
  .col {
    display: flex; flex-direction: column; gap: 8px; min-width: 0;
    background: var(--sunk); border: 1px solid var(--line);
    border-radius: 14px; padding: 10px; margin: 0; box-shadow: none;
  }

  .col-hd { display: flex; align-items: center; gap: 7px; padding: 2px 2px 4px; }

  .col-dot { width: 7px; height: 7px; border-radius: 999px; flex: none; }

  .col-hd h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }

  .col-n { font-size: 13px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }

  .col-line { flex: 1; }
  .work {
    text-align: left; width: 100%; font: inherit; color: inherit;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-ctl); padding: 11px 12px 10px; cursor: pointer;
    display: flex; flex-direction: column; gap: 8px;
    transition: border-color .1s, box-shadow .1s;
  }

  .work:hover { border-color: var(--line-2); box-shadow: 0 1px 3px rgb(20 20 25 / .06); }

  .work[aria-expanded="true"] { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }

  /* a stretch item in a flex column, so it has to be told to hug its text */
  .work .area-chip { align-self: flex-start; }

  .w-title { font-size: 16px; font-weight: 500; line-height: 1.45; }

  /* finished work is struck through rather than merely greyed */
  .work.is-done .w-title { text-decoration: line-through; color: var(--muted); }

  .w-who { display: flex; align-items: center; gap: 5px; min-width: 0; }

  .w-who span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .w-av { width: 20px; height: 20px; border-radius: 6px; background: var(--subtle); display: grid; place-items: center; flex: none; }

  /* the numbers a card carries, set off from the body by a rule */
  .w-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums;
    border-top: 1px solid var(--line); padding-top: 8px;
  }

  .w-foot span { display: flex; align-items: center; gap: 5px; min-width: 0; }

  .w-foot svg { width: 12px; height: 12px; flex: none; }

  /* The word carries the priority; colour only lifts the one that is urgent.
     --line-2 is a border colour and never text. */
  .w-time { display: flex; align-items: center; gap: 5px; flex: none; white-space: nowrap; }

  /* held work is set aside, not finished: greyed rather than struck through */
  .work.is-held { background: var(--subtle); }
  .work.is-held .w-title { color: var(--muted); }

  .r-line.peer { color: var(--info-ink, var(--muted)); }
  .r-line.settled { color: var(--ok-ink); }

  .prio { font-size: 13px; font-weight: 600; flex: none; white-space: nowrap; color: var(--muted); }
  .prio.high { color: var(--bad-ink); }
  .prio svg { width: 11px; height: 11px; }
  .col-add {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; font: inherit; font-size: 15px; color: var(--faint);
    background: none; border: 1px dashed var(--line-2); border-radius: var(--r-ctl);
    padding: 9px; cursor: pointer;
  }

  .col-add:hover { border-color: var(--muted); color: var(--muted); background: var(--surface); }

  .col-add svg { width: 13px; height: 13px; }

  /* ═══ what a review is waiting on ═══ */

  .r-line { display: flex; align-items: flex-start; gap: 6px; font-size: 14px; min-width: 0; }

  .r-tx { min-width: 0; overflow-wrap: anywhere; }

  .r-line.changes { color: var(--bad-ink); }
  .r-line.blocked { color: var(--bad-ink); }

  .r-line code { font-family: var(--mono); font-size: .92em; overflow-wrap: anywhere; }

  .r-line svg { width: 13px; height: 13px; flex: none; margin-top: 3px; }

  /* Blocked is not a column: a task is always blocked out of some status, so
     it is a mark on the card rather than a place of its own. */
  .work.is-blocked { border-color: var(--bad-line); }

  .w-block { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: var(--bad-ink); background: var(--bad-soft); border-radius: 999px; padding: 2px 8px; align-self: flex-start; }

  .w-block svg { width: 11px; height: 11px; }
  /* ═══ what a review said, and who may give one ═══ */

  .p-said {
    display: block; font-size: 15px; line-height: 1.5; color: var(--muted);
    background: var(--sunk); border-radius: 9px; padding: 9px 10px; margin-top: 8px;
  }

  .p-said b { display: block; font-weight: 600; color: var(--ink); font-size: 14px; margin-bottom: 3px; }

  /* A reviewer row carries what they are doing, which can be long, so it
     grows to two lines instead of squeezing the name. */
  .mrow.seat { height: auto; min-height: 36px; padding-block: 7px; gap: 9px; align-items: flex-start; }

  .mrow.seat .w-av { margin-top: 1px; }

  .seat-tx { display: flex; flex-direction: column; min-width: 0; flex: 1; }

  .seat-top { display: flex; align-items: baseline; gap: 8px; }

  .seat-top b { font-weight: 500; white-space: nowrap; }

  .seat-when { margin-left: auto; font-size: 14px; font-weight: 600; color: var(--info-ink); white-space: nowrap; }

  .seat-why { font-size: 14px; line-height: 1.4; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .mrow.seat:disabled .seat-when, .mrow.seat:disabled .seat-why { color: var(--faint); }

  @media (max-width: 900px) {
    .board { grid-auto-columns: 84vw; }
  }
</style>

      session: "5d02aa91-3f7c-4e28-a6b0-91d4c2e8f735", usedMem: [2],
      // the whole conversation, oldest first: reports, reviews, what the user asked
      talk: [
        { by: "p1", kind: "report", at: "09:48", text: { ko: "## 한 일\n에러 응답을 `{ code, message, retryable }` 하나로 맞췄어요. 응답은 이제 `toResponse` 한 곳에서만 만들어져요.\n\n| 파일 | 바뀐 것 |\n|---|---|\n| `src/api/errors.ts` | `AppError`를 `ErrorBody`로 바꾸는 `toResponse`와 재시도 코드 목록 `RETRYABLE` |\n| `src/api/payments.ts` | 결제 실패 세 곳이 `toResponse`를 쓰도록 변경 |\n| `docs/api/errors.md` | 새 응답 형식과 에러 코드 목록 |\n\n## 확인한 것\n- `npm test` 통과 (42개)\n- 예전 `{ error }` 응답을 만드는 곳은 저장소에 더 없어요.\n\n## 확실하지 않은 것\n어떤 코드가 재시도 대상인지는 코드와 문서에 없어서 추측했어요. 지금은 `timeout`, `rate_limited`만 `retryable: true`예요.", en: "## What I did\nEvery error response now has one shape, `{ code, message, retryable }`, built in one place, `toResponse`.\n\n| File | Change |\n|---|---|\n| `src/api/errors.ts` | `toResponse`, turning an `AppError` into an `ErrorBody`, and `RETRYABLE` |\n| `src/api/payments.ts` | The three payment failures go through `toResponse` |\n| `docs/api/errors.md` | The new shape and the list of codes |\n\n## Checked\n- `npm test` passes (42)\n- Nothing in the repository builds the old `{ error }` response any more.\n\n## Not sure\nWhich codes can be retried is written nowhere, so I guessed: only `timeout` and `rate_limited` are `retryable: true`." } },
        { by: "p4", kind: "review", verdict: "changes", at: "09:55", text: { ko: "**좋은 점**\n- 응답 모양이 `toResponse` 한 곳에서만 만들어져서 앞으로 바꾸기 쉬워요.\n- 문서에 코드 목록이 같이 들어간 것도 좋아요.\n\n**바꿔야 할 점**\n1. 카드사 일시 오류(`issuer_unavailable`)는 다시 시도하면 대부분 성공해요. 재시도 대상에 넣어 주세요.\n   ```ts\n   const RETRYABLE = new Set<ErrorCode>(['timeout', 'rate_limited', 'issuer_unavailable']);\n   ```\n2. `src/api/payments.ts:88`에서 알 수 없는 에러를 `message: err.message` 그대로 내보내요. 내부 메시지가 밖으로 새지 않게 `internal`로 감싸 주세요.", en: "**Good**\n- The shape is built only in `toResponse`, so it is easy to change later.\n- The docs carry the list of codes too.\n\n**To change**\n1. A card issuer's temporary failure (`issuer_unavailable`) mostly succeeds when retried. Make it retryable.\n   ```ts\n   const RETRYABLE = new Set<ErrorCode>(['timeout', 'rate_limited', 'issuer_unavailable']);\n   ```\n2. `src/api/payments.ts:88` sends an unknown error's `err.message` out as it is. Wrap it as `internal` so internal messages do not leak." } },
        { by: null, kind: "request", at: "10:02", text: { ko: "삐약 의견대로 고쳐 주세요. 그리고 앱 클라이언트가 아직 `error` 필드를 읽고 있으니, 한 버전 동안은 `error`도 같이 내려 주세요.", en: "Make the changes the review asked for. The app client still reads `error`, so keep sending `error` too for one release." } },
        { by: "p1", kind: "report", at: "10:14", text: { ko: "`issuer_unavailable` 재시도, `internal` 감싸기, 하위 호환 `error` 필드까지 반영했어요. 테스트는 45개 모두 통과해요.\n\n## 고친 것\n1. **재시도 대상**: `issuer_unavailable`을 `RETRYABLE`에 넣었어요 (`src/api/errors.ts:12`).\n2. **알 수 없는 에러**: `code: 'internal'`, `message: 'Something went wrong'`으로 감싸요. 원래 메시지와 스택은 `log.error`로만 남겨요.\n3. **하위 호환**: 한 버전 동안 `error` 필드를 같이 내려요. 지울 시점은 문서에 적었어요.\n\n```diff\n return {\n   code: err.code,\n   message: err.message,\n   retryable: RETRYABLE.has(err.code),\n+  /* v2.3에서 지워요: 클라이언트가 message를 읽게 되면 */\n+  error: err.message,\n };\n```\n\n## 바뀐 파일\n| 파일 | 바뀐 것 | 줄 |\n|---|---|---|\n| `src/api/errors.ts` | 재시도 코드, `internal` 감싸기, `error` 필드 | +42 −17 |\n| `src/api/payments.ts` | `charge`, `refund`, `capture`가 `toResponse`를 씀 | +9 −12 |\n| `src/api/errors.test.ts` | 새 테스트 3개 | +38 |\n| `docs/api/errors.md` | 응답 형식, 코드 목록, `error` 필드를 지울 시점 | +21 −4 |\n\n## 확인한 것\n- `npm test` 통과: 45개 (새 테스트 3개)\n  - 재시도 코드 세 가지가 `retryable: true`인지\n  - 모르는 에러가 `internal`로 감싸지고 원래 메시지가 응답에 없는지\n  - `error` 필드가 `message`와 같은지\n- `npm run lint` 통과\n- `{ error }`만 내려 주던 곳은 저장소에 더 없어요 (`src/` 전체 검색).\n\n## 남은 것\n- 앱 클라이언트가 `message`를 읽도록 바뀌면 `error` 필드를 지워야 해요. 문서에 v2.3으로 적었어요.\n- `issuer_unavailable`을 몇 번까지 다시 시도할지는 이 저장소에 정해진 게 없어요. 지금은 호출하는 쪽에 맡겨요.\n\n## 참고\n> 결제 실패 응답의 HTTP 상태는 그대로 `502`예요. 상태 코드를 나누는 건 이번 범위가 아니라서 건드리지 않았어요.\n\n```ts\n/* 호출하는 쪽에서 쓰는 모양 */\nconst res = await pay(order);\nif (!res.ok && res.body.retryable) await retryLater(order);\n```", en: "`issuer_unavailable` is retried, unknown errors are wrapped as `internal`, and `error` stays for one release. All 45 tests pass.\n\n## Changed\n1. **Retryable**: `issuer_unavailable` is in `RETRYABLE` (`src/api/errors.ts:12`).\n2. **Unknown errors**: wrapped as `code: 'internal'`, `message: 'Something went wrong'`; the original message and stack only go to `log.error`.\n3. **Compatibility**: `error` is sent too for one release; when it goes is in the docs.\n\n```diff\n return {\n   code: err.code,\n   message: err.message,\n   retryable: RETRYABLE.has(err.code),\n+  /* drop in v2.3, once clients read message */\n+  error: err.message,\n };\n```\n\n## Files\n| File | Change | Lines |\n|---|---|---|\n| `src/api/errors.ts` | Retryable codes, the `internal` wrap, the `error` field | +42 −17 |\n| `src/api/payments.ts` | `charge`, `refund`, `capture` go through `toResponse` | +9 −12 |\n| `src/api/errors.test.ts` | Three new tests | +38 |\n| `docs/api/errors.md` | The shape, the codes, when `error` goes | +21 −4 |\n\n## Checked\n- `npm test` passes: 45 (three new)\n  - the three retryable codes are `retryable: true`\n  - an unknown error is wrapped and its message is not in the response\n  - `error` equals `message`\n- `npm run lint` passes\n- Nothing in `src/` sends only `{ error }` any more.\n\n## Left\n- Once the app client reads `message`, `error` has to go; the docs say v2.3.\n- How often to retry `issuer_unavailable` is written nowhere here; callers decide for now.\n\n## Note\n> The HTTP status of a failed payment is still `502`. Splitting status codes was not part of this, so it is untouched.\n\n```ts\n/* how a caller uses it */\nconst res = await pay(order);\nif (!res.ok && res.body.retryable) await retryLater(order);\n```" },

        { by: "p4", kind: "review", verdict: "approve", at: "10:19", text: { ko: "두 가지 모두 반영됐어요. `error` 필드를 언제 지울지 문서에 적어 둔 것도 좋아요. 이대로 반영해도 돼요.", en: "Both are in. Writing down when `error` goes is good too. It can be applied as it is." } },

  const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "ko";

  // The subset of markdown an agent writes, as the app draws it: headings,

  // first, so nothing in the text becomes markup.
  function markdown(text) {
    const esc = (v) => v.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const inline = (v) => esc(v).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    const lines = text.split("\n");
    const out = [];
    for (let i = 0; i < lines.length; ) {
      const line = lines[i];
      if (line.trim() === "") { i++; continue; }
      if (/^\s*```/.test(line)) {
        // a fence inside a list item is indented; the code keeps only its own indentation
        const indent = line.length - line.trimStart().length;
        const body = [];
        for (i++; i < lines.length && !/^\s*```/.test(lines[i]); i++) body.push(lines[i].slice(Math.min(indent, lines[i].length - lines[i].trimStart().length)));

        i++;
