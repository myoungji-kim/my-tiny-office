<style>
  /* ═══ the board ═══ */
  /* A column is a status a task rests in, ordered the way work moves. Each one
     is a container of its own so the cards inside read as a stack rather than
     floating in the page, and it is wide enough that a title stays on one
     line — the board scrolls sideways instead of squeezing five in. */

  /* ═══ the list of projects ═══ */

  #projList .row-item { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1.7fr) 110px; }

  .pr-name { display: block; font-size: 15px; font-weight: 600; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .pr-desc { display: block; font-size: 14px; color: var(--muted); line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .pr-folder { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .pr-counts { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .pr-counts b { color: var(--ink); font-weight: 600; }

  .pr-counts .wait b { color: var(--brand); }

  .pr-since { font-size: 13px; color: var(--faint); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }

  .list-empty { padding: 22px 14px; font-size: 14px; color: var(--muted); }

  .proj-title { display: flex; align-items: center; gap: 10px; }

  .chip.planned { background: none; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-2); }

  /* A project's status reads by shape as well as colour, the same in the tabs
     and beside its name. */
  .pmark { width: 10px; height: 10px; flex: none; display: inline-grid; place-items: center; }

  .pmark.planned { border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--faint); width: 8px; height: 8px; }

  .pmark svg { width: 10px; height: 10px; }

  .pmark.held { color: var(--muted); }

  .pmark.done { color: var(--ok); }

  @media (max-width: 860px) {
    #projList .row-item { grid-template-columns: minmax(0, 1fr) auto; }
    .pr-folder, .pr-counts { display: none; }
  }

  .board { display: grid; grid-auto-flow: column; grid-auto-columns: 268px; gap: 10px; align-items: start; overflow-x: auto; padding-bottom: 6px; }

  /* a section of its own, not the reference pages' card */
  .col {
    display: flex; flex-direction: column; gap: 8px; min-width: 0;
    background: var(--sunk); border: 1px solid var(--line);
    border-radius: 14px; padding: 10px; margin: 0; box-shadow: none;
  }

  .col-hd { display: flex; align-items: center; gap: 7px; padding: 2px 2px 4px; }

  .col-dot { width: 7px; height: 7px; border-radius: 999px; flex: none; }

  .col-hd h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -.01em; }

  .col-n { font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }

  .col-line { flex: 1; }
  .work {
    text-align: left; width: 100%; font: inherit; color: inherit;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-ctl); padding: 11px 12px 10px; cursor: pointer;
    display: flex; flex-direction: column; gap: 8px;
    transition: border-color .1s, box-shadow .1s;
  }

  .work:hover { border-color: var(--line-2); box-shadow: 0 1px 3px rgb(20 20 25 / .06); }

  .work[aria-expanded="true"] { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }

  /* a stretch item in a flex column, so it has to be told to hug its text */
  .work .area-chip { align-self: flex-start; }

  .w-title { font-size: 15px; font-weight: 500; line-height: 1.45; }

  /* finished work is struck through rather than merely greyed */
  .work.is-done .w-title { text-decoration: line-through; color: var(--muted); }

  .w-who { display: flex; align-items: center; gap: 5px; min-width: 0; }

  .w-who span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .w-av { width: 20px; height: 20px; border-radius: 6px; background: var(--subtle); display: grid; place-items: center; flex: none; }

  /* the numbers a card carries, set off from the body by a rule */
  .w-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums;
    border-top: 1px solid var(--line); padding-top: 8px;
  }

  .w-foot span { display: flex; align-items: center; gap: 5px; min-width: 0; }

  .w-foot svg { width: 12px; height: 12px; flex: none; }

  /* The word carries the priority; colour only lifts the one that is urgent.
     --line-2 is a border colour and never text. */
  .w-time { display: flex; align-items: center; gap: 5px; flex: none; white-space: nowrap; }

  /* held work is set aside, not finished: greyed rather than struck through */
  .work.is-held { background: var(--subtle); }
  .work.is-held .w-title { color: var(--muted); }

  .r-line.peer { color: var(--info-ink, var(--muted)); }
  .r-line.settled { color: var(--ok-ink); }

  .prio { font-size: 12px; font-weight: 600; flex: none; white-space: nowrap; color: var(--muted); }
  .prio.high { color: var(--bad-ink); }
  .prio svg { width: 11px; height: 11px; }
  .col-add {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; font: inherit; font-size: 14px; color: var(--faint);
    background: none; border: 1px dashed var(--line-2); border-radius: var(--r-ctl);
    padding: 9px; cursor: pointer;
  }

  .col-add:hover { border-color: var(--muted); color: var(--muted); background: var(--surface); }

  .col-add svg { width: 13px; height: 13px; }

  /* ═══ what a review is waiting on ═══ */

  .r-line { display: flex; align-items: center; gap: 6px; font-size: 13px; }

  .r-line.changes { color: var(--bad-ink); }
  .r-line.blocked { color: var(--bad-ink); }

  .r-line svg { width: 13px; height: 13px; flex: none; }

  /* Blocked is not a column: a task is always blocked out of some status, so
     it is a mark on the card rather than a place of its own. */
  .work.is-blocked { border-color: var(--bad-line); }

  .w-block { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--bad-ink); background: var(--bad-soft); border-radius: 999px; padding: 2px 8px; align-self: flex-start; }

  .w-block svg { width: 11px; height: 11px; }
  /* ═══ what a review said, and who may give one ═══ */

  .p-said {
    display: block; font-size: 14px; line-height: 1.5; color: var(--muted);
    background: var(--sunk); border-radius: 9px; padding: 9px 10px; margin-top: 8px;
  }

  .p-said b { display: block; font-weight: 600; color: var(--ink); font-size: 13px; margin-bottom: 3px; }

  .seat-row { display: flex; align-items: center; gap: 8px; min-width: 0; }

  .seat-why { font-size: 12px; color: var(--faint); }

  @media (max-width: 900px) {
    .board { grid-auto-columns: 84vw; }
  }
</style>

<script>
  /* ── the work on the board ───────────────────────────────────── */

  // A project is planned, active, held or done, and only the user moves it:
  // nothing in a planned one is picked up, and work running out does not
  // finish a project, because more can always be added.
  const TODAY = "2026. 9. 26.";
  const PROJECTS = [
    { id: "pay", status: "active", since: "2026. 9. 2.", name: { ko: "결제 개편", en: "Payments rework" }, folder: "~/Projects/tinysoft",
      desc: { ko: "결제 흐름을 정리하고 웹훅을 믿을 수 있게 만들어요.", en: "Tidy the payment flow and make the webhooks trustworthy." } },
    { id: "order", status: "active", since: "2026. 9. 20.", name: { ko: "주문 v2", en: "Orders v2" }, folder: "~/Projects/orders",
      desc: { ko: "주문 상태를 하나의 흐름으로 다시 세워요.", en: "Rebuild the order states as one flow." } },
    { id: "settle", status: "planned", name: { ko: "정산 리포트", en: "Settlement reports" }, folder: "~/Projects/settle",
      desc: { ko: "가맹점이 월별 정산 내역을 내려받아요.", en: "Merchants download their monthly settlements." } },
    { id: "admin", status: "held", since: "2026. 8. 18.", name: { ko: "관리자 대시보드", en: "Admin dashboard" }, folder: "~/Projects/admin",
      desc: { ko: "운영팀이 주문과 환불을 한 화면에서 봐요.", en: "One screen for support to see orders and refunds." },
      reason: { ko: "결제 개편을 먼저 끝내기로", en: "Payments rework comes first" } },
    // A finished project is kept as its record: its span and how much was done.
    { id: "login", status: "done", since: "2026. 4. 14.", doneOn: "2026. 5. 29.", tasks: 14, name: { ko: "로그인 개편", en: "Login rework" }, folder: "~/Projects/tinysoft" },
    { id: "deploy", status: "done", since: "2026. 2. 1.", doneOn: "2026. 3. 20.", tasks: 9, name: { ko: "배포 파이프라인", en: "Deploy pipeline" }, folder: "~/Projects/infra" },
    { id: "first", status: "done", since: "2026. 1. 18.", doneOn: "2026. 2. 27.", tasks: 6, name: { ko: "첫 API", en: "First API" }, folder: "~/Projects/tinysoft" },
  ];

  // backlog → working → approval → done, and held off to the side.
  // Time is what a task has actually taken, never a share of an estimate: with
  // a real agent doing the work nobody knows when it ends.

    { id: "t1", project: "pay", area: "db", priority: "high", status: "working", who: "p1", spent: 23,
      title: { ko: "결제 내역 페이지네이션", en: "Paginate the payment history" } },

    { id: "t2", project: "pay", area: "security", priority: "high", status: "working", who: "p5", spent: 41,
      title: { ko: "결제 웹훅 서명 검증", en: "Verify the payment webhook signature" },
      peer: { by: "p4", state: "reviewing" } },

    { id: "t3", project: "order", area: "types", priority: "normal", status: "working", who: "p2", spent: 8,

    { id: "t4", project: "pay", area: "arch", priority: "normal", status: "approval", who: "p1", spent: 52,

    { id: "t5", project: "order", area: "db", priority: "normal", status: "approval", who: "p4", spent: 19,

    { id: "t6", project: "order", area: "arch", priority: "normal", status: "backlog", who: null,

    // an agent that stopped: blocked is a mark, not a place
    { id: "t10", project: "pay", area: "types", priority: "normal", status: "working", who: "p2", spent: 5,
      title: { ko: "결제 타입 정의 정리", en: "Tidy the payment type definitions" },
      blocked: { ko: "에이전트 연결이 끊겼어요", en: "The agent disconnected" } },

    // parked with their project, and picked up again when it resumes
    { id: "t11", project: "admin", area: "product", priority: "normal", status: "held", who: "p3", spent: 12, withProject: true,
      title: { ko: "대시보드 지표 정의", en: "Define the dashboard metrics" },
      reason: { ko: "결제 개편을 먼저 끝내기로", en: "Payments rework comes first" } },

    { id: "t12", project: "admin", area: "arch", priority: "low", status: "backlog", who: null,
      title: { ko: "권한별 메뉴 나누기", en: "Split the menu by permission" } },

    // written down ahead, and nobody picks them up until the project starts
    { id: "t13", project: "settle", area: "db", priority: "normal", status: "backlog", who: "p4",
      title: { ko: "정산 집계 쿼리 설계", en: "Design the settlement rollup query" } },

    { id: "t14", project: "settle", area: "product", priority: "low", status: "backlog", who: null,

  // A column is a status a task rests in. Approval is the user's: work is
  // finished locally and nothing has been applied anywhere yet.
  const COLUMNS = [
    { status: "backlog", color: "var(--faint)" },
    { status: "working", color: "var(--warn)" },
    { status: "approval", color: "var(--brand)" },
    { status: "done", color: "var(--ok)" },
    { status: "held", color: "var(--line-2)" },
  ];
  /* ── i18n ────────────────────────────────────────────────────── */
  // Employee nicknames are absent on purpose: the user wrote them, so they
  // never go through a dictionary.
  const TEXT = {
    ko: {
      ...WORDS.ko,
      title: "프로젝트", newTask: "새 업무", backToList: "프로젝트 목록",
      filters: { planned: "대기", active: "진행 중", held: "보류", done: "완료" },
      headSub: (n, a) => "진행 중 " + n + "개 · 내 승인 대기 " + a + "건",
      counts: (c) => [["대기", c.backlog], ["진행", c.working], ["승인 대기", c.approval, "wait"], ["완료", c.done]]

      date: (y, m, d) => m + "월 " + d + "일",
      since: (d) => d + "부터", doneOn: (d) => d + " 마침", notStarted: "시작 전",
      listEmpty: { planned: "기다리는 프로젝트가 없어요.", active: "진행 중인 프로젝트가 없어요.", held: "보류한 프로젝트가 없어요.", done: "아직 마친 프로젝트가 없어요." },
      plannedNotice: "아직 시작하지 않은 프로젝트예요", plannedNoticeWhy: "업무를 적어 둘 수 있어요. 시작하면 그때부터 대기열의 업무를 가져가요.",

      doneNotice: (d) => d + "에 마친 프로젝트예요", doneNoticeWhy: "기록으로 남아 있어요. 다시 열면 업무를 더할 수 있어요.",
      holdTitle: "이 프로젝트를 보류할까요?", holdReason: "보류하는 이유", holdPlaceholder: "결제 개편을 먼저 끝내기로",

  };
  const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "ko";
  const t = () => TEXT[lang];
  const tx = (v) => (v && typeof v === "object" ? v[lang] : v);

  const dig = (o, k) => k.split(".").reduce((a, x) => a?.[x], o);
  const applyStatic = () => {
    for (const el of document.querySelectorAll("[data-t]")) {
      const v = dig(t(), el.dataset.t);
      if (typeof v === "string") el.textContent = v;
    }
    for (const el of document.querySelectorAll("[data-a]")) {
      const v = dig(t(), el.dataset.a);
      if (typeof v === "string") el.setAttribute("aria-label", v);
    }
  };
  applyStatic();

  // 을/를 and 이/가 depend on the last syllable of the word in front of them.
  const subjectParticle = (word) => (lang === "en" ? "" : hasBatchim(word) ? "이" : "가");
  const areaLabel = (a) => t().areas[a];
  const areaObject = (a) => (lang === "en" ? areaLabel(a) : areaLabel(a) + (hasBatchim(areaLabel(a)) ? "을" : "를"));

  /* ── who may review what ─────────────────────────────────────── */
  // A review seat is not a field on a person: it is what they have been
  // taught. Teaching someone a database memory is what makes them able to
  // review database work, and the people screen derives it the same way.
  const SEAT_AREAS = Object.keys(WORDS.ko.areas);
  const areasOf = (p) => [...new Set(p.memories.map((m) => m.area))];
  const seatsOf = (p) => areasOf(p).filter((a) => SEAT_AREAS.includes(a));
  const reviewersFor = (area) => STAFF.filter((p) => seatsOf(p).includes(area));
  const byId = new Map(STAFF.map((p) => [p.id, p]));


  /* ── the board ───────────────────────────────────────────────── */

  let project = null;
  let filter = "active";
  const board = document.getElementById("board");
  const tabs = document.getElementById("tabs");
  const pop = document.getElementById("pop");
  let anchor = null;

  const shown = () => TASKS.filter((k) => k.project === project);
  const here = () => PROJECTS.find((p) => p.id === project);
  const tasksOf = (p) => TASKS.filter((k) => k.project === p.id);
  // Work is written down in a planned or active project, never in a held or done one.
  const writable = (p) => p.status === "planned" || p.status === "active";
  const countOf = (p) => Object.fromEntries(COLUMNS.map(({ status }) => [status, tasksOf(p).filter((k) => k.status === status).length]));

  const dayOf = (s) => { const [y, m, d] = s.split(".").map(Number); return new Date(y, m - 1, d); };
  const shortDate = (s) => { const [y, m, d] = s.split(".").map(Number); return t().date(y, m, d); };
  const daysBetween = (a, b) => Math.round((dayOf(b) - dayOf(a)) / 86400000);

  const icon = {
    clock: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="5.6"/><path d="M8 5v3.2l2 1.3"/></svg>',
    eye: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1.6 8s2.4-4 6.4-4 6.4 4 6.4 4-2.4 4-6.4 4-6.4-4-6.4-4z"/><circle cx="8" cy="8" r="1.7"/></svg>',
    back: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6.5 3.5L3 7l3.5 3.5M3 7h6.5a3.5 3.5 0 0 1 0 7H7"/></svg>',
    none: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="5.6"/><path d="M5.6 8h4.8"/></svg>',
    flag: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 14V3h8l-1.6 2.6L12 8.2H4"/></svg>',
    folder: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M1.8 4.2h4L7 5.8h7.2v6.4H1.8z"/></svg>',
    check: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 8.4l3 3 6.2-6.6"/></svg>',
    plus: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg>',
    pause: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 4v8M10 4v8"/></svg>',
  };

  // What the card says under the title, if anything: an agent that stopped,
  // a colleague looking at it, or a suggestion that one should.
  function noteFor(task) {
    if (task.blocked) return { cls: "blocked", svg: icon.none, text: tx(task.blocked) };
    if (task.changes) return { cls: "changes", svg: icon.back, text: t().changesAsked(tx(task.changes)) };
    if (!task.peer) return null;
    if (task.peer.state === "reviewing") {
      return { cls: "peer", svg: icon.eye, text: t().peerReviewing(byId.get(task.peer.by).name, areaLabel(task.area)) };
    }
    if (task.peer.state === "done") {
      return { cls: "settled", svg: icon.check, text: t().peerDone(byId.get(task.peer.by).name) };
    }
    return reviewersFor(task.area).length
      ? { cls: "peer", svg: icon.eye, text: t().peerSuggested(areaLabel(task.area)) }
      : null;
  }

  // A queued task has not started this round, so it shows its priority instead.
  const timeLine = (task) =>
    task.status === "working" ? t().spent(task.spent)
      : task.status !== "backlog" && task.spent !== undefined ? t().took(task.spent)
      : null;

  const away = (p) => p.status === "vacation";
  const free = (p) => p.status === "available";

  // Who is on it decides where it sits: nobody means the backlog, and a person
  // who is free starts right away. Work already past the office does not move.
  function settle(task) {
    if (task.status !== "backlog" && task.status !== "working") return;
    if (PROJECTS.find((p) => p.id === task.project)?.status === "planned") return;
    if (!task.who) {
      task.status = "backlog";
      task.spent = undefined;
    } else if (task.status === "backlog" && free(byId.get(task.who))) {
      task.status = "working";
      task.spent = 0;
    }
  }

  function taskCard(task) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "work" + (task.blocked ? " is-blocked" : "") + (task.status === "done" ? " is-done" : "") + (task.status === "held" ? " is-held" : "");
    b.dataset.id = task.id;
    b.setAttribute("aria-expanded", "false");

    const who = task.who ? byId.get(task.who) : null;
    const note = noteFor(task);
    const time = timeLine(task);
    const project = PROJECTS.find((p) => p.id === task.project);

    b.innerHTML = `
      <span class="area-chip">${areaLabel(task.area)}</span>
      <span class="w-title">${tx(task.title)}</span>
      ${task.blocked ? `<span class="w-block">${icon.none}${t().blocked}</span>` : ""}
      ${note ? `<span class="r-line ${note.cls}">${note.svg}${note.text}</span>` : ""}
      <span class="w-foot">
        ${who ? `<span class="w-who"><span class="w-av"></span><span>${who.name}</span></span>` : `<span>${t().unassigned}</span>`}
        ${time ? `<span class="w-time">${icon.clock}${time}</span>` : `<span class="prio ${task.priority}">${icon.flag}${t().priority[task.priority]}</span>`}
      </span>`;

    if (who) b.querySelector(".w-av").appendChild(spriteCanvas(who.species, 20));
    b.title = tx(project.name);
    b.addEventListener("click", (e) => open(task, b, e.detail === 0));
    return b;
  }

  function render() {
    const p = here();
    document.querySelector(".head").hidden = !!p;
    document.getElementById("projHead").hidden = !p;
    document.getElementById("projList").hidden = !!p;
    document.getElementById("pjNotice").hidden = !p;
    board.hidden = !p;
    if (p) renderProject(p);
    else renderList();
  }

  function renderList() {
    tabs.innerHTML = "";
    for (const f of ["planned", "active", "held", "done"]) {
      const b = document.createElement("button");
      b.className = "tab";
      b.setAttribute("aria-selected", String(f === filter));
      b.innerHTML = `${projectMark(f)}<span>${t().filters[f]}</span><span class="n">${PROJECTS.filter((p) => p.status === f).length}</span>`;
      b.addEventListener("click", () => { filter = f; render(); });
      tabs.appendChild(b);
    }
    const active = PROJECTS.filter((p) => p.status === "active");
    const waiting = TASKS.filter((k) => k.status === "approval").length;
    document.getElementById("headSub").textContent = t().headSub(active.length, waiting);

    const list = document.getElementById("projList");
    const rows = PROJECTS.filter((p) => p.status === filter);
    list.innerHTML = rows.length ? "" : `<p class="list-empty">${t().listEmpty[filter]}</p>`;
    for (const p of rows) {
      const a = document.createElement("a");
      a.className = "row-item";
      a.href = "#" + p.id;
      const done = p.status === "done";
      a.innerHTML = `
        <span><span class="pr-name">${tx(p.name)}</span>${p.desc ? `<span class="pr-desc">${tx(p.desc)}</span>` : ""}</span>
        <span class="pr-folder mono">${p.folder ?? t().noFolder}</span>
        <span class="pr-counts">${done ? t().record(p.tasks, daysBetween(p.since, p.doneOn)) : t().counts(countOf(p))}</span>
        <span class="pr-since">${done ? t().doneOn(shortDate(p.doneOn)) : p.since ? t().since(shortDate(p.since)) : t().notStarted}</span>`;
      list.appendChild(a);
    }
  }

  const STATUS_CHIP = { planned: "planned", active: "working", held: "vacation", done: "available" };
  const projectMark = (status) =>
    status === "active" ? `<span class="dot working"></span>`
    : status === "held" ? `<span class="pmark held">${icon.pause}</span>`
    : status === "done" ? `<span class="pmark done">${icon.check}</span>`
    : `<span class="pmark planned"></span>`;

  function renderProject(p) {
    document.getElementById("pjName").textContent = tx(p.name);
    const chip = document.getElementById("pjChip");
    chip.className = "chip " + STATUS_CHIP[p.status];
    chip.innerHTML = projectMark(p.status) + t().filters[p.status];
    // A project with no folder cannot be worked in; a planned one says so in its notice instead.
    document.getElementById("pjSub").innerHTML = [p.desc ? tx(p.desc) : "", p.folder ? `<span class="mono">${p.folder}</span>` : p.status === "planned" ? "" : t().noFolderYet]
      .filter(Boolean).join(" · ");
    document.getElementById("pjNewTask").hidden = !writable(p);

    const notice = document.getElementById("pjNotice");
    notice.innerHTML =
      p.status === "planned" ? `<div class="notice"><span class="n-ic">${icon.flag}</span>
          <span class="n-tx"><b>${t().plannedNotice}</b><span>${p.folder ? t().plannedNoticeWhy : t().needsFolder}</span></span>
          <span class="n-acts"><button class="btn btn-secondary btn-sm" type="button" data-start${p.folder ? "" : " disabled"}>${t().actions.startProject}</button></span></div>`
      : p.status === "held" ? `<div class="notice notice-warn"><span class="n-ic">${icon.pause}</span>
          <span class="n-tx"><b>${t().heldNotice}</b><span>${tx(p.reason)} · ${t().heldNoticeHint}</span></span>
          <span class="n-acts"><button class="btn btn-secondary btn-sm" type="button" data-resume>${t().actions.resumeProject}</button></span></div>`
      : p.status === "done" ? `<div class="notice"><span class="n-ic">${icon.check}</span>
          <span class="n-tx"><b>${t().doneNotice(shortDate(p.doneOn))}</b><span>${t().doneNoticeWhy}</span></span>
          <span class="n-acts"><button class="btn btn-secondary btn-sm" type="button" data-resume>${t().actions.reopenProject}</button></span></div>`
      : "";
    notice.hidden = !notice.innerHTML;
    notice.querySelector("[data-resume]")?.addEventListener("click", () => resumeProject(p));
    notice.querySelector("[data-start]")?.addEventListener("click", () => startProject(p));

    board.innerHTML = "";
    for (const { status, color } of COLUMNS) {
      const list = shown().filter((k) => k.status === status);
      const col = document.createElement("section");
      col.className = "col";
      col.innerHTML = `<div class="col-hd"><span class="col-dot" style="background:${color}"></span><h2>${t().columns[status]}</h2><span class="col-n">${list.length}</span><span class="col-line"></span></div>`;
      for (const task of list) col.appendChild(taskCard(task));
      if (!list.length) {
        const e = document.createElement("p");
        e.className = "col-empty";
        e.textContent = t().empty;
        col.appendChild(e);
      }
      if (status === "backlog" && writable(p)) {
        const a = document.createElement("button");
        a.className = "col-add";
        a.dataset.newTask = "";
        a.innerHTML = icon.plus + `<span>${t().addTask}</span>`;
        col.appendChild(a);
      }
      board.appendChild(col);
    }

  }

  // What the project's own menu offers follows from where the project is.
  document.getElementById("projectMenu").addEventListener("click", (e) => {
    const p = here();
    const unsettled = tasksOf(p).filter((k) => k.status === "working" || k.status === "approval").length;
    const rows =
      p.status === "planned" ? [
        p.folder ? menu(t().actions.startProject, "key", () => startProject(p)) : offRow(t().actions.startProject),
        ...(p.folder ? [] : [why(t().needsFolder)]),
        menu(t().actions.editProject, null, () => openEditProject(p)),
      ]
      : p.status === "active" ? [
        menu(t().actions.editProject, null, () => openEditProject(p)),
        menu(t().actions.holdProject, null, () => askHoldProject(p)),
        ...(unsettled ? [offRow(t().actions.finishProject), why(t().cannotFinish(unsettled))] : [menu(t().actions.finishProject, null, () => askFinishProject(p))]),
      ]
      : p.status === "held" ? [
        menu(t().actions.resumeProject, "key", () => resumeProject(p)),
        menu(t().actions.editProject, null, () => openEditProject(p)),
      ]
      : [menu(t().actions.reopenProject, null, () => resumeProject(p))];
    openMenu(e.currentTarget, [...rows, menu(t().actions.removeProject, "bad", () => askRemoveProject(p))]);
  });

  function offRow(label) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "mrow";
    b.disabled = true;
    b.textContent = label;
    return b;
  }

  function why(text) {
    const p = document.createElement("p");
    p.className = "p-why";
    p.textContent = text;
    return p;
  }
  /* ── one task, and what the user can do about it ───────────── */

  function menu(label, kind, then) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "mrow" + (kind ? " mrow-" + kind : "");
    b.textContent = label;
    b.addEventListener("click", () => {
      close();
      then?.();
    });
    return b;
  }

  function reviewerRow(task, p) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "mrow";
    b.innerHTML = `<span class="seat-row"><span class="w-av"></span><span>${p.name}</span><span class="seat-why">${t().whySeat(areaLabel(task.area))}</span></span>`;
    b.querySelector(".w-av").appendChild(spriteCanvas(p.species, 20));
    b.addEventListener("click", () => {
      task.peer = { by: p.id, state: "reviewing" };
      close();
      render();
    });
    return b;
  }

  // Who may review is who has been taught the area, never the one doing the work.
  function reviewChoices(task, acts, say) {
    const seats = reviewersFor(task.area).filter((p) => p.id !== task.who);
    if (seats.length) {
      for (const p of seats) acts.appendChild(reviewerRow(task, p));
      return;
    }
    say("p-why", t().noSeat);
    const go = document.createElement("a");
    go.className = "mrow";
    go.href = "employees.html";
    go.textContent = t().actions.open;
    acts.appendChild(go);
  }

  function open(task, el, viaKey, picking = false) {
    if (anchor === el && pop.hasAttribute("data-open") && !picking) { close(); return; }

    document.querySelectorAll("[data-id]").forEach((n) => {
      n.setAttribute("aria-expanded", String(n.dataset.id === task.id));
    });

    const who = task.who ? byId.get(task.who) : null;
    pop.innerHTML = `
      <div class="p-hd">
        <span class="p-av"></span>
        <span style="flex:1;min-width:0">
          <span class="p-name">${tx(task.title)}</span>
          <span class="p-role">${areaLabel(task.area)} · ${t().priority[task.priority]}</span>
        </span>
      </div>
      <span class="p-rule"></span>`;

    if (who) pop.querySelector(".p-av").appendChild(spriteCanvas(who.species, 38));
    else pop.querySelector(".p-av").textContent = "—";

    const acts = document.createElement("div");
    acts.className = "p-acts";
    const say = (cls, html) => {
      const s = document.createElement("span");
      s.className = cls;
      s.innerHTML = html;
      pop.appendChild(s);
    };

    // A held project starts nothing new, but what is finished can still be
    // applied; a done one is only a record.
    const live = here().status === "active";
    const kept = here().status !== "done";
    const draft = writable(here());

    if (task.status === "backlog" && live) {
      acts.appendChild(menu(t().actions.assign, null, () => assignTask(task)));
    }

    if (task.status === "working" && live) {
      // The system offers the review; it knows the area and who was taught it.
      if (task.peer?.state === "suggested") {
        reviewChoices(task, acts, say);
      } else if (!task.peer && picking) {
        say("p-why", t().pickWho(areaLabel(task.area)));
        reviewChoices(task, acts, say);
      } else if (!task.peer) {
        const ask = document.createElement("button");
        ask.type = "button";
        ask.className = "mrow";
        ask.textContent = t().actions.pickPeer;
        ask.addEventListener("click", () => open(task, el, viaKey, true));
        acts.appendChild(ask);
      }
    }

    // This is the line the work does not cross on its own.
    if (task.status === "approval" && kept) {
      say("p-said", `<b>${t().approveTitle}</b>${t().approveWhy}`);
      acts.appendChild(menu(t().actions.approve, "key", () => approveTask(task)));
      acts.appendChild(menu(t().actions.rework, null, () => askRework(task)));
      acts.appendChild(menu(t().actions.hold, null, () => askHoldTask(task)));
    }

    if (task.status === "held") {
      say("p-said", `<b>${t().heldBecause}</b>${tx(task.reason)}`);
      if (live) acts.appendChild(menu(t().actions.resume, "key", () => resumeTask(task)));
      acts.appendChild(menu(t().actions.teach, null, () => teachFrom(task)));
    }

    // A finished task is the record of what happened, so it is not edited or
    // thrown away. One waiting for approval is finished too - the answer there
    // is to approve it, send it back or hold it, not to rewrite what was done.
    if (task.status !== "done" && draft) {
      if (task.status !== "approval") acts.appendChild(menu(t().actions.edit, null, () => openEditTask(task)));
      acts.appendChild(menu(t().actions.removeTask, "bad", () => askRemoveTask(task)));
    }

    if (acts.children.length) pop.appendChild(acts);

    anchor = el;
    pop.setAttribute("data-open", "");
    place(el);
    if (viaKey) (pop.querySelector(".mrow") ?? pop).focus?.();
  }
  function openMenu(el, rows) {
    if (anchor === el && pop.hasAttribute("data-open")) { close(); return; }
    document.querySelectorAll("[data-id]").forEach((n) => n.setAttribute("aria-expanded", String(n === el)));

    pop.innerHTML = "";
    const acts = document.createElement("div");
    acts.className = "p-acts";
    for (const row of rows) acts.appendChild(row);
    pop.appendChild(acts);

    anchor = el;
    pop.setAttribute("data-open", "");
    place(el);
  }

  function place(el) {
    const r = el.getBoundingClientRect();
    const w = pop.offsetWidth, h = pop.offsetHeight, gap = 8, edge = 12;
    let left = r.right + gap;
    if (left + w > innerWidth - edge) left = r.left - w - gap;
    if (left < edge) left = Math.min(Math.max(edge, r.left), innerWidth - w - edge);
    const top = Math.min(r.top, innerHeight - h - edge);
    pop.style.left = Math.round(left) + "px";
    pop.style.top = Math.round(Math.max(edge, top)) + "px";
  }

  function close() {
    pop.removeAttribute("data-open");
    document.querySelectorAll("[data-id]").forEach((n) => n.setAttribute("aria-expanded", "false"));
    anchor = null;
  }

  document.addEventListener("pointerdown", (e) => {
    // The anchor closes itself on the click that follows; closing here first
    // would clear it and let that click reopen the popover.
    if (!anchor || pop.contains(e.target) || anchor.contains(e.target)) return;
    if (!e.target.closest("[data-id]")) close();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || !anchor) return;
    const back = anchor;
    close();
    back.focus({ preventScroll: true });
  });

  window.addEventListener("resize", () => { if (anchor) place(anchor); });

  /* ── sidebar roster ──────────────────────────────────────────── */
  // The board has no per-person view of its own, so a pick opens that person
  // on the people screen.
  mountRoster(document.getElementById("members"), (p) => {
    location.href = "employees.html" + (lang === "en" ? "?lang=en" : "") + "#" + p.id;
  });
  /* ── making a task ───────────────────────────────────────────── */
  // The one choice worth making carefully is the area, because it decides who
  // can review the work later. So the dialog answers that while it is being
  // made, rather than leaving it to be discovered in the review column.

  const scrim = document.getElementById("scrim");
  const dialog = document.getElementById("modal");

  function renderNewTask() {
    const editing = TASKS.find((k) => k.id === dialog.dataset.edit) ?? null;
    const area = dialog.dataset.area || SEAT_AREAS[0];
    const into = dialog.dataset.project || project;
    const who = dialog.dataset.who || "";
    const prio = dialog.dataset.prio || "normal";
    const knowers = reviewersFor(area).map((p) => p.name);
    const chevron = `<svg viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 2L6 6l4.5-4"/></svg>`;
    const picked = who ? byId.get(who) : null;
    const heading = editing ? t().editTaskTitle : t().newTaskTitle;
    // An agent is running in this project's folder right now, so the work can
    // be redirected but not moved somewhere else.
    const running = editing?.status === "working";

    // What naming this person means, which is a different thing while someone
    // is already on the work.
    const whatHappens = () => {
      if (running) {
        if (!picked) return t().backToBacklog;
        return picked.id === editing.who ? t().keepsGoing : t().handOver(picked.name);
      }
      // A held task is not waiting its turn; it is waiting for the user.
      if (editing?.status === "held") return picked ? t().whenResumed(picked.name) : t().whenResumedAnyone;
      if (PROJECTS.find((p) => p.id === into)?.status === "planned") return picked ? t().whenStarted(picked.name) : t().whenStartedAnyone;
      if (!picked) return t().whoTakes;
      return free(picked) ? t().freeNow(picked.name) : t().busyNow(picked.name);
    };

    dialog.setAttribute("aria-label", heading);
    dialog.innerHTML = `
      <div class="m-hd">
        <span style="flex:1;min-width:0"><span class="m-t">${heading}</span></span>
      </div>

      <div class="m-sec">
        <div class="field" style="margin-top:0">
          <span class="label">${t().fProject}</span>
          <span class="select-wrap">
            <select class="select" id="ntProject"${running ? " disabled" : ""}>
              ${PROJECTS.filter(writable).map((p) => `<option value="${p.id}"${p.id === into ? " selected" : ""}>${tx(p.name)}</option>`).join("")}
            </select>
            ${chevron}
          </span>
          ${running ? `<span class="hint">${t().folderLocked}</span>` : ""}
        </div>

        <div class="field">
          <span class="label">${t().fTitle} <span class="req">*</span></span>
          <input class="input" id="ntTitle" placeholder="${t().fTitlePlaceholder}" autocomplete="off" />
        </div>

        <div class="field">
          <span class="label">${t().fDesc}</span>
          <textarea class="textarea" placeholder="${t().fDescPlaceholder}"></textarea>
        </div>
      </div>

      <div class="m-sec">
        <div class="grid2" style="gap:14px">
          <div class="field" style="margin-top:0">
            <span class="label">${t().fArea}</span>
            <span class="select-wrap">
              <select class="select" id="ntArea">
                ${SEAT_AREAS.map((a) => `<option value="${a}"${a === area ? " selected" : ""}>${t().areas[a]}</option>`).join("")}
              </select>
              ${chevron}
            </span>
          </div>
          <div class="field" style="margin-top:0">
            <span class="label">${t().fPriority}</span>
            <span class="select-wrap">
              <select class="select" id="ntPrio">
                ${["low", "normal", "high"]
                  .map((k) => `<option value="${k}"${k === prio ? " selected" : ""}>${t().priority[k]}</option>`)
                  .join("")}
              </select>
              ${chevron}
            </span>
          </div>
        </div>

        ${
          knowers.length
            ? `<span class="hint">${t().areaHint} ${t().canReview(knowers)}</span>`
            : `<div class="notice notice-warn" style="margin-top:12px">
                 <span class="n-ic">${icon.none}</span>
                 <span class="n-tx"><span>${t().canReviewNobody(areaObject(area))}</span></span>
               </div>`
        }
      </div>

      <div class="m-sec">
        <div class="field" style="margin-top:0">
          <span class="label">${t().fAssignee}</span>
          <span class="select-wrap">
            <select class="select" id="ntWho">
              <option value=""${who ? "" : " selected"}>${t().anyoneFree}</option>
              ${STAFF.map(
                (p) =>
                  `<option value="${p.id}"${p.id === who ? " selected" : ""}${away(p) ? " disabled" : ""}>${
                    away(p) ? t().onLeaveOption(p.name) : p.name
                  }</option>`,
              ).join("")}
            </select>
            ${chevron}
          </span>
          <span class="hint">${whatHappens()}</span>
        </div>
      </div>

      <div class="m-foot">
        <button class="btn btn-secondary btn-md" data-close>${t().cancel}</button>
        <button class="btn btn-primary btn-md" data-save>${running ? t().sendChange : editing ? t().save : t().create}</button>
      </div>`;

    // What the dialog promised is what the board shows, on a new task and on
    // one being corrected alike.
    dialog.querySelector("[data-save]").addEventListener("click", () => {
      const field = dialog.querySelector("#ntTitle");
      const name = field.value.trim();
      if (!name) return field.focus();
      const desc = dialog.querySelector(".textarea").value.trim();
      const task = editing ?? { id: "nt" + TASKS.length, status: "backlog" };
      const handedOver = running && task.who !== (picked?.id ?? null);
      // The user's own words are not translated, so a new one reads the same
      // in both languages and a correction only touches the one being read.
      const wrote = (had, value) => (editing ? { ...had, [lang]: value } : { ko: value, en: value });
      Object.assign(task, {
        // the only field the dialog does not re-render on, so it is read live
        project: running ? task.project : into, area, priority: dialog.querySelector("#ntPrio").value,
        who: picked ? picked.id : null,
        title: wrote(task.title, name),
        desc: desc ? wrote(task.desc, desc) : undefined,
      });
      // Nothing of the old run carries over to whoever takes it next.
      if (handedOver && task.who) task.spent = 0;
      settle(task);
      if (!editing) TASKS.push(task);
      closeModal();
      if (into !== project) location.hash = into;
      else render();
    });

    // re-rendering is how the dialog answers what a choice means, so the text
    // already typed has to survive it
    const keep = () => {
      const title = dialog.querySelector("#ntTitle").value;
      const desc = dialog.querySelector(".textarea").value;
      return (focusId) => {
        renderNewTask();
        dialog.querySelector("#ntTitle").value = title;
        dialog.querySelector(".textarea").value = desc;
        dialog.querySelector(focusId).focus();
      };
    };
    for (const [id, key] of [["#ntArea", "area"], ["#ntProject", "project"], ["#ntWho", "who"]]) {
      dialog.querySelector(id).addEventListener("change", (e) => {
        const again = keep();
        dialog.dataset[key] = e.target.value;
        again(id);
      });
    }
    // Priority changes nothing the dialog says, so it is only remembered.
    dialog.querySelector("#ntPrio").addEventListener("change", (e) => {
      dialog.dataset.prio = e.target.value;
    });
    dialog.querySelector("[data-close]").addEventListener("click", closeModal);
  }
  function openNewTask() {
    openModal(renderNewTask, { project });
    dialog.querySelector("#ntTitle").focus({ preventScroll: true });
  }

  function openEditTask(task) {
    openModal(renderNewTask, {
      edit: task.id, project: task.project, area: task.area,
      who: task.who ?? "", prio: task.priority,
    });
    const field = dialog.querySelector("#ntTitle");
    field.value = tx(task.title);
    if (task.desc) dialog.querySelector(".textarea").value = tx(task.desc);
    field.focus({ preventScroll: true });
  }

  /* ── making a project ────────────────────────────────────────── */
  // A project is a folder as much as it is a name: the office works in it, so
  // the dialog asks for it here rather than leaving it to be discovered when
  // the first task cannot start.

  const SAMPLE_FOLDERS = ["~/Projects/tinysoft", "~/Projects/orders"];

  function renderNewProject() {
    const editing = PROJECTS.find((p) => p.id === dialog.dataset.edit) ?? null;
    const dir = dialog.dataset.folder || "";
    const heading = editing ? t().editProjectTitle : t().newProjectTitle;
    dialog.setAttribute("aria-label", heading);
    dialog.innerHTML = `
      <div class="m-hd">
        <span style="flex:1;min-width:0"><span class="m-t">${heading}</span></span>
      </div>

      <div class="m-sec">
        <div class="field" style="margin-top:0">
          <span class="label">${t().fName} <span class="req">*</span></span>
          <input class="input" id="npName" placeholder="${t().fNamePlaceholder}" autocomplete="off" />
        </div>

        <div class="field">
          <span class="label">${t().fAbout}</span>
          <input class="input" id="npDesc" placeholder="${t().fAboutPlaceholder}" autocomplete="off" />
        </div>

        <div class="field">
          <span class="label">${t().workspace}</span>
          <div class="folder">
            ${icon.folder}
            <span class="path${dir ? "" : " empty"}">${dir || t().noFolder}</span>
            <button class="btn btn-secondary btn-sm" type="button" data-pick-folder>${dir ? t().change : t().choose}</button>
          </div>
          <span class="hint">${dir ? t().folderHint : t().noFolderHint}</span>
        </div>
      </div>

      <div class="m-foot">
        <button class="btn btn-secondary btn-md" data-close>${t().cancel}</button>
        <button class="btn btn-primary btn-md" data-save>${editing ? t().save : t().createProject}</button>
      </div>`;

    // The sample keeps what it is given for as long as the page is open, so
    // the new project can be opened and filled. A reload is the reset.
    dialog.querySelector("[data-save]").addEventListener("click", () => {
      const field = dialog.querySelector("#npName");
      const name = field.value.trim();
      if (!name) return field.focus();
      const about = dialog.querySelector("#npDesc").value.trim();
      if (editing) {
        editing.name = { ...editing.name, [lang]: name };
        editing.desc = about ? { ...editing.desc, [lang]: about } : undefined;
        editing.folder = dir || null;
      } else {
        PROJECTS.push({
          id: "np" + PROJECTS.length,
          name: { ko: name, en: name },
          desc: about ? { ko: about, en: about } : undefined,
          folder: dir || null,
          status: "planned",
        });
      }
      closeModal();
      if (!editing) location.hash = PROJECTS.at(-1).id;
      else render();
    });

    dialog.querySelector("[data-pick-folder]").addEventListener("click", () => {
      const name = dialog.querySelector("#npName").value;
      const about = dialog.querySelector("#npDesc").value;
      dialog.dataset.folder = SAMPLE_FOLDERS[(SAMPLE_FOLDERS.indexOf(dir) + 1) % SAMPLE_FOLDERS.length];
      renderNewProject();
      dialog.querySelector("#npName").value = name;
      dialog.querySelector("#npDesc").value = about;
      dialog.querySelector("[data-pick-folder]").focus();
    });
    dialog.querySelector("[data-close]").addEventListener("click", closeModal);
  }

  function openNewProject() {
    openModal(renderNewProject);
    dialog.querySelector("#npName").focus({ preventScroll: true });
  }

  function openEditProject(p) {
    openModal(renderNewProject, { edit: p.id, folder: p.folder ?? "" });
    const field = dialog.querySelector("#npName");
    field.value = tx(p.name);
    if (p.desc) dialog.querySelector("#npDesc").value = tx(p.desc);
    field.focus({ preventScroll: true });
  }

  /* ── taking something back ───────────────────────────────────── */
  // Nothing has happened to a task in the backlog, so it just goes. Anything
  // past it took someone's work, and a project takes its tasks with it, so
  // those say what is being thrown away before it happens.

  function confirmRemoval(heading, why, onYes) {
    confirmStep({ heading, why, yes: t().remove, danger: true, onYes });
  }

  // `field` asks for a line of text before the step can be taken.
  function confirmStep({ heading, why, yes, danger, field, onYes }) {
    openModal(() => {
      dialog.setAttribute("aria-label", heading);
      dialog.innerHTML = `
        <div class="m-hd">
          <span style="flex:1;min-width:0"><span class="m-t">${heading}</span></span>
        </div>
        <div class="m-sec">
          <span class="m-s">${why}</span>
          ${field ? `<label class="field"><span class="label">${field.label}</span><input class="input" id="stepText" placeholder="${field.placeholder}" /></label>` : ""}
        </div>
        <div class="m-foot">
          <button class="btn btn-secondary btn-md" data-close>${t().cancel}</button>
          ${danger ? `<button class="btn btn-danger btn-md" data-yes>${yes}</button>` : `<button class="btn btn-primary btn-md" data-yes${field ? " disabled" : ""}>${yes}</button>`}
        </div>`;
      const yesBtn = dialog.querySelector("[data-yes]");
      const text = dialog.querySelector("#stepText");
      text?.addEventListener("input", () => { yesBtn.disabled = !text.value.trim(); });
      dialog.querySelector("[data-close]").addEventListener("click", closeModal);
      yesBtn.addEventListener("click", () => {
        onYes(text?.value.trim());
        closeModal();
        render();
      });
    });
    (dialog.querySelector("#stepText") ?? dialog.querySelector("[data-yes]")).focus({ preventScroll: true });
  }

  /* ── moving one task ─────────────────────────────────────────── */
  // One task at a time: work handed back to someone busy queues behind what
  // they are on instead of starting.
  const backTo = (task) => (task.who && free(byId.get(task.who)) ? "working" : "backlog");

  function assignTask(task) {
    openEditTask(task);
    dialog.querySelector("#ntWho").focus({ preventScroll: true });
  }

  function approveTask(task) {
    Object.assign(task, { status: "done", changes: undefined });
    render();
  }

  function askRework(task) {
    const who = byId.get(task.who);
    confirmStep({
      heading: t().reworkTitle, yes: t().actions.rework,
      why: backTo(task) === "working" ? t().reworkNow(who.name) : t().reworkLater(who.name),
      field: { label: t().reworkLabel, placeholder: t().reworkPlaceholder },
      onYes: (text) => Object.assign(task, { status: backTo(task), changes: { ko: text, en: text } }),
    });
  }

  function askHoldTask(task) {
    confirmStep({
      heading: t().holdTaskTitle, why: t().holdTaskWhy, yes: t().holdYes,
      field: { label: t().holdReason, placeholder: t().holdTaskPlaceholder },
      onYes: (text) => Object.assign(task, { status: "held", reason: { ko: text, en: text } }),
    });
  }

  function resumeTask(task) {
    Object.assign(task, { status: backTo(task), reason: undefined });
    render();
  }

  // Teaching from a task takes the task as where the memory came from.
  function teachFrom(task) {
    openTeach({
      to: task.who ? byId.get(task.who) : null,
      area: task.area,
      from: task.title,
      onSave: ({ to, memory }) => to.memories.unshift({ ...memory, used: 0 }),
    });
  }

  // Starting is what lets the backlog be picked up, and when the project's span begins.
  function startProject(p) {
    Object.assign(p, { status: "active", since: TODAY });
    for (const k of tasksOf(p)) settle(k);
    close();
    render();
  }

  function askHoldProject(p) {
    const running = tasksOf(p).filter((k) => k.status === "working");
    confirmStep({
      heading: t().holdTitle, why: t().holdWhy(running.length), yes: t().holdYes,
      field: { label: t().holdReason, placeholder: t().holdPlaceholder },
      onYes: (reason) => {
        const r = { ko: reason, en: reason };
        Object.assign(p, { status: "held", reason: r });
        for (const k of running) Object.assign(k, { status: "held", reason: r, withProject: true });
      },
    });
  }

  function askFinishProject(p) {
    const open = tasksOf(p).filter((k) => k.status !== "done").length;
    confirmStep({
      heading: t().finishTitle, why: t().finishWhy(open), yes: t().finishYes,
      onYes: () => Object.assign(p, { status: "done", doneOn: TODAY, tasks: tasksOf(p).filter((k) => k.status === "done").length }),
    });
  }

  // Held work goes back to whoever had it, or queues behind what they took on
  // meanwhile. A reopened project picks up from its board as it was left.
  function resumeProject(p) {
    for (const k of tasksOf(p).filter((k) => k.withProject)) {
      Object.assign(k, { status: free(byId.get(k.who)) ? "working" : "backlog", withProject: false, reason: undefined });
    }
    Object.assign(p, { status: "active", reason: undefined, doneOn: undefined });
    close();
    render();
  }

  const drop = (task) => TASKS.splice(TASKS.indexOf(task), 1);

  function askRemoveTask(task) {
    if (task.status === "backlog") {
      drop(task);
      render();
      return;
    }
    confirmRemoval(t().removeTaskTitle, t().removeTaskWhy[task.status], () => drop(task));
  }

  function askRemoveProject(p) {
    const mine = tasksOf(p);
    const why = p.status === "done" ? t().removeProjectDone : p.status === "planned" ? t().removePlanned(mine.length) : mine.length ? t().removeProjectWhy(mine.length) : t().removeProjectEmpty;
    confirmRemoval(t().removeProjectTitle, why, () => {
      for (const k of mine) drop(k);
      PROJECTS.splice(PROJECTS.indexOf(p), 1);
      filter = p.status;
      location.hash = "";
    });
  }

  function openModal(render, state = {}) {
    close();
    for (const k of Object.keys(dialog.dataset)) delete dialog.dataset[k];
    Object.assign(dialog.dataset, state);
    scrim.hidden = false;
    render();
  }

  function closeModal() {
    scrim.hidden = true;
  }

  scrim.addEventListener("pointerdown", (e) => { if (e.target === scrim) closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !scrim.hidden) closeModal(); });
  // the column button is built by render(), so this listens rather than binds
  document.addEventListener("click", (e) => {
    if (e.target.closest("[data-new-task]")) openNewTask();
    if (e.target.closest("[data-new-project]")) openNewProject();
  });

  // The list is the page; a project's board has an address of its own.
  function route() {
    close();
    project = PROJECTS.some((p) => p.id === location.hash.slice(1)) ? location.hash.slice(1) : null;
    if (project) filter = here().status;
    render();
  }
  window.addEventListener("hashchange", route);
  route();
</script>
