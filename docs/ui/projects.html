        out.push(`<h3>${inline(line.replace(/^#+\s*/, ""))}</h3>`);
        i++;
      } else if (/^\s*\|.*\|\s*$/.test(line) && /^\s*\|?\s*:?-{3,}/.test(lines[i + 1] ?? "")) {
        const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim()));
        const head = cells(line);
        const rows = [];
        for (i += 2; i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i]); i++) rows.push(cells(lines[i]));
        out.push(`<table><thead><tr>${head.map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
      } else if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
        const ordered = /^\s*\d/.test(line);
        // a list broken by a code block goes on counting where it was
        const first = ordered ? Number(/\d+/.exec(line)[0]) : 1;
        const items = [];
        for (; i < lines.length && (/^\s*([-*+]|\d+[.)])\s+/.test(lines[i]) || /^ {2,}\S/.test(lines[i])); i++) {
          if (/^ {2,}\S/.test(lines[i]) && !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) {
            if (/^\s*```/.test(lines[i])) break;
            items[items.length - 1] += " " + lines[i].trim();
          } else items.push(lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/, ""));
        }
        out.push(`<${ordered ? `ol${first === 1 ? "" : ` start="${first}"`}` : "ul"}>${items.map((x) => `<li>${inline(x)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`);
      } else {
        const body = [];
        for (; i < lines.length && lines[i].trim() !== "" && !/^(#{1,6}\s|\s*```|\s*([-*+]|\d+[.)])\s)/.test(lines[i]); i++) body.push(lines[i].trim());
        out.push(`<p>${inline(body.join(" "))}</p>`);
      }
    }
    return out.join("");
  }

// How wide the details are is this person's to choose, and it is remembered
  // here; a double click puts it back.
  const SIDE = { min: 220, max: 560, start: 300, step: 24, key: "mto.taskSide" };
  const sideWidth = () => {
    try {
      const saved = Number(localStorage.getItem(SIDE.key));
      return saved >= SIDE.min && saved <= SIDE.max ? saved : SIDE.start;
    } catch {
      return SIDE.start;
    }
  };
  function mountSplit(grid) {
    const split = grid.querySelector(".tk-split");
    const set = (w, keep = true) => {
      const width = Math.round(Math.min(SIDE.max, Math.max(SIDE.min, w)));
      grid.style.setProperty("--tk-side", width + "px");
      split.setAttribute("aria-valuenow", String(width));
      if (keep) try { localStorage.setItem(SIDE.key, String(width)); } catch {}
    };
    set(sideWidth(), false);
    split.addEventListener("pointerdown", (e) => {
      split.setPointerCapture(e.pointerId);
      split.classList.add("dragging");
      grid.classList.add("resizing");
      const right = grid.getBoundingClientRect().right;
      const move = (ev) => set(right - ev.clientX - 8);
      const up = () => {
        split.classList.remove("dragging");
        grid.classList.remove("resizing");
        split.removeEventListener("pointermove", move);
        split.removeEventListener("pointerup", up);
      };
      split.addEventListener("pointermove", move);
      split.addEventListener("pointerup", up);
    });
    split.addEventListener("dblclick", () => set(SIDE.start));
    split.addEventListener("keydown", (e) => {
      const now = Number(split.getAttribute("aria-valuenow"));
      if (e.key === "ArrowLeft") set(now + SIDE.step);
      else if (e.key === "ArrowRight") set(now - SIDE.step);
      else if (e.key === "Home") set(SIDE.max);
      else if (e.key === "End") set(SIDE.min);
      else return;
      e.preventDefault();
    });
  }

  let taskTab = "talk";
  let tabOf = null;
  function renderTask(p, task) {
    if (tabOf !== task.id) { taskTab = "talk"; tabOf = task.id; }
    const who = task.who ? byId.get(task.who) : null;
    const k = t().tk;
    document.getElementById("tkCrumb").href = "#" + p.id;
    document.getElementById("tkCrumbName").textContent = tx(p.name);
    document.getElementById("tkTitle").textContent = tx(task.title);
    const chip = document.getElementById("tkChip");
    chip.className = "chip " + ({ working: "working", approval: "reviewing", done: "available", held: "leave" }[task.status] ?? "planned");
    chip.textContent = t().columns[task.status];
    document.getElementById("tkSub").innerHTML = [
      `<span class="area-chip">${areaLabel(task.area)}</span>`,
      `<span class="prio ${task.priority}">${icon.flag}${t().priority[task.priority]}</span>`,
      who ? who.name : t().unassigned,
      task.status === "working" ? t().spent(task.spent) : task.spent !== undefined && task.status !== "backlog" ? k.took(task.spent) : "",
    ].filter(Boolean).join(" · ");
    renderTaskActions(p, task);

    const off = RUNTIME.off ? " disabled" : "";
    // What the user has to decide leads the page, and only when there is something.
    const now = !task.blocked || task.status !== "working"
      ? task.status === "approval" && who
        ? `<div class="notice tk-now"><span class="n-ic">${TASK_ICON.used}</span><span class="n-tx"><b>${k.decideTitle(who.name)}</b><span>${k.decideWhy}</span></span>
            <span class="n-acts"><button class="btn btn-secondary btn-sm" type="button" data-tab-go="changes">${k.seeChanges}</button></span></div>`
        : ""
      : task.blocked.kind === "command"
        ? `<div class="notice notice-bad tk-now"><span class="n-ic">${TASK_ICON.run}</span><span class="n-tx"><b>${t().runStopped("<code>" + task.blocked.run + "</code>")}</b><span>${t().runWhy(who.name)}</span></span>
            <span class="n-acts"><button class="btn btn-secondary btn-sm" type="button" data-allow-run${off}>${t().allowRun}</button></span></div>`
        : `<div class="notice notice-bad tk-now"><span class="n-ic">${PLUG}</span><span class="n-tx"><b>${t().agentLost}</b><span>${t().lostWhy}</span></span>
            <span class="n-acts"><button class="btn btn-secondary btn-sm" type="button" data-reconnect${off}>${t().reconnect}</button></span></div>`;

    // The conversation: the work's reports, a colleague's review, the user's
    // requests, in the order they came. What was done and what changed are
    // the other two tabs.
    const logAt = (kind) => task.log?.find((l) => l.kind === kind)?.at ?? "";
    const talk = [];
    const LABEL = { report: k.talkReport, review: k.talkReview, request: k.talkRequest, reply: k.talkReply };
    for (const m of task.talk ?? []) {
      talk.push({ by: m.by ? byId.get(m.by) : null, label: LABEL[m.kind] + (m.verdict ? " · " + (m.verdict === "approve" ? k.talkApprove : k.talkChanges) : ""),
        cls: m.verdict === "approve" ? "approve" : m.verdict === "changes" || m.kind === "request" ? "changes" : "", at: m.at, text: m.text, suggest: m.suggest });
    }
    for (const m of task.talk ? [] : task.thread ?? []) {
      const person = byId.get(m.by);
      const reviewing = m.by !== task.who;
      talk.push({ by: person, label: reviewing ? k.talkReview : k.talkReply, at: reviewing ? logAt("reviewDone") : "", text: m.text });
    }
    if (task.changes && !task.talk) talk.push({ by: null, label: k.talkRequest, at: "", text: task.changes, cls: "changes" });
    // what they said last closes the conversation: their report, or where they are
    if (task.said && who && !task.talk) {
      const k2 = task.blocked ? k.talkBefore : task.status === "working" ? k.talkNow : k.talkReport;
      talk.push({ by: who, label: k2, at: task.status === "working" ? "" : logAt("finished"), text: task.said, suggest: task.suggest });
    }
    const working = task.status === "working" && !task.blocked;
    const live = working && task.steps?.length
      ? `<div class="talk-live"><span class="dot working"></span>${k.liveNow} · ${k.steps[task.steps[0].kind]} <code>${task.steps[0].what}</code></div>`
      : "";
    const YOU = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8" cy="5.5" r="2.7"/><path d="M2.8 14c.6-2.8 2.7-4.3 5.2-4.3s4.6 1.5 5.2 4.3"/></svg>';
    const COPY = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="5.5" y="5.5" width="8" height="8" rx="1.6"/><path d="M10.5 3.2V3a1.5 1.5 0 0 0-1.5-1.5H3A1.5 1.5 0 0 0 1.5 3v6A1.5 1.5 0 0 0 3 10.5h.2"/></svg>';
    // The latest two stay open; anything older folds to its first line.
    // what a folded message shows: its first sentence, not a heading or a label
    const lead = (text) => text.split("\n")
      .filter((l) => !/^\s*(#{1,6}\s|\*\*[^*]+\*\*\s*$|```|\|)/.test(l))
      .map((l) => l.replace(/^[>*\-\d.\s]+/, "").replace(/[*`]/g, "").trim())
      .find((l) => l !== "") ?? "";
    const talkHtml = talk.length
      ? talk.map((m, i) => `<div class="talk${i < talk.length - 2 ? " folded" : ""}" data-talk="${i}">
          <span class="talk-av"${m.by ? ` data-av="${m.by.id}" data-av-size="32"` : ""}>${m.by ? "" : YOU}</span>
          <div style="min-width:0">
            <div class="talk-hd"><b>${m.by ? m.by.name : k.you}</b><span class="talk-k${m.cls ? " " + m.cls : ""}">${m.label}</span><span class="talk-at">${m.at}</span></div>
            <button class="talk-sum" type="button" data-unfold="${i}"><span>${lead(tx(m.text))}</span><span class="talk-toggle">${k.talkOpen}</span></button>
            <div class="talk-toc" data-toc></div>
            <div class="talk-bd"><div class="md">${markdown(tx(m.text))}</div><pre class="said-raw" hidden>${tx(m.text)}</pre></div>
            ${m.suggest?.length ? `<div class="talk-sug"><b>${k.suggestTitle}</b>${m.suggest.map((x, j) => `<div class="sug"><span class="sug-tx">${tx(x)}</span><button class="btn btn-secondary btn-sm" type="button" data-pass="${j}">${k.passIt}</button><button class="btn btn-primary btn-sm" type="button" data-teach-sug="${j}">${k.teachIt}</button></div>`).join("")}</div>` : ""}
          </div>
          <button class="copy-ic" type="button" data-copy="${i}" aria-label="${t().copy}" title="${t().copy}">${COPY}</button>
        </div>`).join("") + live
      : live || `<p class="col-empty talk-empty">${k.talkEmpty} ${task.status === "backlog" && !who ? t().whoTakes : ""}</p>`;

    const stepRow = (s) => `
          <div class="step"><span class="step-at">${s.at}</span><span class="step-ic">${TASK_ICON[s.kind]}</span>
            <span class="step-tx">${k.steps[s.kind]} <code>${s.what}</code>${s.note ? " · " + tx(s.note) : ""}</span></div>`;
    const stepsHtml = task.steps?.length ? task.steps.map(stepRow).join("") : `<p class="col-empty talk-empty">${k.noChanges}</p>`;
    const changesHtml = (task.files?.length
        ? task.files.map((c, i) => `<button class="file" type="button" data-file="${i}"><span class="file-path">${c.file}</span><span class="file-add">+${c.add}</span><span class="file-del">−${c.del}</span></button>`).join("")
        : `<p class="col-empty talk-empty">${k.noChanges}</p>`)
      + (task.status === "approval" ? `<span class="tk-apply">${k.applyWhat(branchOf(task))}</span>` : "")
      + (task.status === "done" && task.commit ? `<span class="tk-apply">${k.applied(branchOf(task), task.commit)}</span>` : "");

    const tabsHtml = [["talk", k.tabTalk, talk.length], ["changes", k.changed, task.files?.length ?? 0], ["did", k.did, task.steps?.length ?? 0]]
      .map(([id, label, n]) => `<button class="tab" type="button" role="tab" data-tab="${id}" aria-selected="${id === taskTab}"><span>${label}</span><span class="n">${n}</span></button>`).join("");
    const switcher = `<div class="view-sw" role="radiogroup" aria-label="${k.saidAs}"><button type="button" role="radio" aria-checked="true" data-said="md" aria-label="${k.formatted}" title="${k.formatted}">${TASK_ICON.read}</button><button type="button" role="radio" aria-checked="false" data-said="raw" aria-label="${k.plain}" title="${k.plain}"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 4.5L2 8l3.5 3.5M10.5 4.5L14 8l-3.5 3.5"/></svg></button></div>`;

    const widthSwitch = `<div class="view-sw words" role="radiogroup" aria-label="${k.widthLabel}">${Object.keys(APP_WIDTHS).map((w) => `<button type="button" role="radio" aria-checked="${w === appWidth()}" data-width="${w}">${k.widths[w]}</button>`).join("")}</div>`;

    // The details stay where they are; what is looked at now and then is folded.
    const reviewer = task.peer ? byId.get(task.peer.by) : null;
    const chipCls = { working: "working", approval: "reviewing", done: "available", held: "leave" }[task.status] ?? "planned";
    const details = `<div class="panel side-kv"><div class="panel-hd"><h2>${k.details}</h2></div><div class="panel-bd">
        <div class="kv"><span>${k.fStatus}</span><b><span class="chip ${chipCls}">${t().columns[task.status]}</span></b></div>
        <div class="kv"><span>${k.fWho}</span><b>${who ? who.name : t().unassigned}</b></div>
        <div class="kv"><span>${k.fReviewer}</span><b>${reviewer ? reviewer.name : k.noReviewer}</b></div>
        <div class="kv"><span>${k.fArea}</span><b>${areaLabel(task.area)}</b></div>
        <div class="kv"><span>${k.fPrio}</span><b>${t().priority[task.priority]}</b></div>
        ${task.spent !== undefined ? `<div class="kv"><span>${k.fTime}</span><b>${task.status === "working" ? t().spent(task.spent) : k.took(task.spent)}</b></div>` : ""}
      </div></div>`;
    const fold = (title, n, bodyHtml) => `<details class="panel fold"><summary class="panel-hd"><h2>${title}${n === undefined ? "" : `<span class="kn">${n}</span>`}</h2><span class="fold-ic">${chevron}</span></summary><div class="panel-bd">${bodyHtml}</div></details>`;
    const mine = who ? who.memories : [];
    const side = [
      details,
      task.desc ? panel(k.desc, `<span style="font-size:15px">${tx(task.desc)}</span>`) : "",
      fold(who ? k.mem(mine.length) : k.memAhead, undefined, who
        ? mine.map((m, i) => { const used = task.usedMem?.includes(i); return `<div class="tk-mem${used ? " used" : ""}">${used ? TASK_ICON.used : TASK_ICON.unused}<span>${tx(m.text)}</span></div>`; }).join("") + `<span class="hint">${k.memHow}</span>`
        : `<p class="col-empty" style="margin:0">${k.memNobody}</p>`),
      task.session ? fold(k.session, undefined, `
        <div class="kv"><span>${k.folder}</span><b class="mono">${p.folder}/.worktrees/${task.id}</b></div>
        <div class="kv"><span>branch</span><b class="mono">${branchOf(task)}</b></div>
        <span class="hint">${k.resumeHint}</span>
        <div class="cmd"><pre><span class="p">$</span> claude --resume ${task.session}</pre><button class="copy" type="button">${t().copy}</button></div>`) : "",
      task.log?.length ? fold(k.log, task.log.length, task.log.map((l) => `<div class="kv"><span>${l.at}</span><b style="font-weight:500">${k.logs[l.kind]({ name: l.who ? byId.get(l.who).name : "", took: l.took })}</b></div>`).join("")) : "",
    ];

    const view = document.getElementById("taskView");
    view.innerHTML = `${now}<div class="tk2">
        <div class="tk-main">
          <div class="tk-tabs"><div class="tabs" role="tablist">${tabsHtml}</div><div class="tk-tools">${taskTab === "talk" ? switcher : ""}${widthSwitch}</div></div>
          <div class="tk-pane" data-pane="talk"${taskTab === "talk" ? "" : " hidden"}>${talkHtml}</div>
          <div class="tk-pane" data-pane="changes"${taskTab === "changes" ? "" : " hidden"}>${changesHtml}</div>
          <div class="tk-pane" data-pane="did"${taskTab === "did" ? "" : " hidden"}>${stepsHtml}</div>
        </div>
        <div class="tk-split" role="separator" aria-orientation="vertical" aria-label="${k.splitLabel}" tabindex="0" aria-valuemin="${SIDE.min}" aria-valuemax="${SIDE.max}" aria-valuenow="${sideWidth()}"></div>
        <div class="tk-side">${side.join("")}</div>
      </div>`;
    mountSplit(view.querySelector(".tk2"));
    for (const b of view.querySelectorAll("[data-width]")) b.addEventListener("click", () => {
      setAppWidth(b.dataset.width);
      for (const o of view.querySelectorAll("[data-width]")) o.setAttribute("aria-checked", String(o === b));
    });
    for (const b of view.querySelectorAll("[data-tab], [data-tab-go]")) b.addEventListener("click", () => { taskTab = b.dataset.tab ?? b.dataset.tabGo; renderTask(p, task); });
    // An open message longer than the screen is cut short until asked for,
    // and one with sections lists them, to jump to.
    for (const el of view.querySelectorAll(".talk")) {
      const bd = el.querySelector(".talk-bd");
      const heads = [...bd.querySelectorAll(".md h3")];
      if (heads.length > 1) {
        el.querySelector("[data-toc]").innerHTML = heads.map((h, j) => `<button type="button" data-jump="${j}">${h.textContent}</button>`).join("");
        for (const b of el.querySelectorAll("[data-jump]")) b.addEventListener("click", () => {
          bd.classList.remove("clip");
          heads[b.dataset.jump].scrollIntoView({ behavior: "smooth", block: "start" });
        });
      }
      if (!el.classList.contains("folded") && bd.scrollHeight > 560) {
        bd.classList.add("clip");
        const more = document.createElement("button");
        more.type = "button";
        more.className = "talk-toggle talk-more";
        more.textContent = k.talkAll;
        more.addEventListener("click", () => { const cut = bd.classList.toggle("clip"); more.textContent = cut ? k.talkAll : k.talkLess; });
        bd.after(more);
      }
    }
    for (const b of view.querySelectorAll("[data-unfold]")) b.addEventListener("click", () => {
      b.closest(".talk").classList.remove("folded");
    });
    for (const b of view.querySelectorAll("[data-copy]")) b.addEventListener("click", () => {
      navigator.clipboard?.writeText(tx(talk[b.dataset.copy].text));
      b.classList.add("done");
      b.innerHTML = TASK_ICON.used;
    });
    view.querySelector("[data-allow-run]")?.addEventListener("click", () => {
      p.runs = [...(p.runs ?? []), task.blocked.run];
      task.blocked = undefined;
      render();
    });
    for (const b of view.querySelectorAll("[data-said]")) {
      b.addEventListener("click", () => {
        for (const o of view.querySelectorAll("[data-said]")) o.setAttribute("aria-checked", String(o === b));
        for (const md of view.querySelectorAll(".talk .md")) md.hidden = b.dataset.said !== "md";
        for (const raw of view.querySelectorAll(".talk .said-raw")) raw.hidden = b.dataset.said !== "raw";
      });
    }
    for (const b of view.querySelectorAll("[data-pass]")) b.addEventListener("click", () => { task.suggest.splice(Number(b.dataset.pass), 1); render(); });
    for (const b of view.querySelectorAll("[data-teach-sug]")) b.addEventListener("click", () => teachFrom(task, task.suggest[b.dataset.teachSug], () => { task.suggest.splice(Number(b.dataset.teachSug), 1); render(); }));
    view.querySelector("[data-reconnect]")?.addEventListener("click", () => {
      task.blocked = undefined;
      if (who) who.agentLost = false;
      render();
      renderMembers();
    });
    for (const av of view.querySelectorAll("[data-av]")) av.appendChild(spriteCanvas(byId.get(av.dataset.av).species, Number(av.dataset.avSize ?? 20)));
    for (const b of view.querySelectorAll("[data-file]")) {
      b.addEventListener("click", () => {
        const c = task.files[b.dataset.file];
        const open = b.nextElementSibling?.classList.contains("diff");
        if (open) return b.nextElementSibling.remove();
        if (!c.diff) return;
        const pre = document.createElement("pre");
        pre.className = "diff";
        pre.innerHTML = c.diff.map((l) => `<span class="${l[0] === "+" ? "d-add" : l[0] === "-" ? "d-del" : ""}">${l.replace(/</g, "&lt;")}</span>`).join("\n");
        b.after(pre);
      });
    }
  }

  // The header carries what the task's popover offers, as page buttons.
  function renderTaskActions(p, task) {
    const box = document.getElementById("tkActs");
    box.innerHTML = "";
    const live = p.status === "active";
    // `waits` marks what needs a working Claude Code.
    const button = (label, kind, run, waits = false) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "btn btn-lg " + (kind === "primary" ? "btn-primary" : "btn-secondary");
      b.textContent = label;
      b.disabled = waits && RUNTIME.off;
      b.addEventListener("click", run);
      box.appendChild(b);
      return b;
    };
    if (task.status === "backlog" && live) button(t().actions.assign, "primary", () => assignTask(task), true);
    if (task.status === "working" && live) {
      button(t().actions.edit, "secondary", () => openEditTask(task), true);
    }
    if (task.status === "approval" && p.status !== "done") {
      button(t().actions.hold, "secondary", () => askHoldTask(task));
      // finished work is where a colleague's eyes are asked for
      if (!task.peer || task.peer.state === "done") { const ask = button(t().actions.pickPeer, "secondary", () => open(task, ask, false, true), true); }
      button(t().actions.rework, "secondary", () => askRework(task), true);
      button(t().actions.approve, "primary", () => approveTask(task));
    }
    if (task.status === "held" && live) button(t().actions.resume, "primary", () => resumeTask(task), true);
    if (box.querySelector(":disabled")) {
      const note = document.createElement("span");
      note.className = "ghost-note";
      note.textContent = t().runtime.cannotStart;
      box.prepend(note);
    }
    if (task.status !== "done" && writable(p)) {
      const more = document.createElement("button");
      more.className = "ibtn";
      more.type = "button";
      more.dataset.id = "task-more";
      more.setAttribute("aria-label", t().actions.removeTask);
      more.innerHTML = '<svg viewBox="0 0 16 16" fill="currentColor"><circle cx="4" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="12" cy="8" r="1.4"/></svg>';
      more.addEventListener("click", () => openMenu(more, [menu(t().actions.removeTask, "bad", () => askRemoveTask(task))]));
      box.prepend(more);
    }
  }

  function renderList() {
    tabs.innerHTML = "";
    for (const f of ["planned", "active", "held", "done"]) {
      const b = document.createElement("button");
      b.className = "tab";
      b.setAttribute("aria-selected", String(f === filter));
      b.innerHTML = `${projectMark(f)}<span>${t().filters[f]}</span><span class="n">${PROJECTS.filter((p) => p.status === f).length}</span>`;
      b.addEventListener("click", () => { filter = f; render(); });
      tabs.appendChild(b);
    }
    const active = PROJECTS.filter((p) => p.status === "active");
    const waiting = TASKS.filter((k) => k.status === "approval").length;
    document.getElementById("headSub").textContent = t().headSub(active.length, waiting);

    const list = document.getElementById("projList");
    // Whoever is free takes from the highest-ranked project first, so every
    // tab is in that order.
    const rows = PROJECTS.filter((p) => p.status === filter).sort((a, b) => RANK[a.priority] - RANK[b.priority]);
    list.innerHTML = rows.length ? "" : `<p class="list-empty">${t().listEmpty[filter]}</p>`;
    for (const p of rows) {
      const a = document.createElement("a");
      a.className = "row-item";
      a.href = "#" + p.id;
      const done = p.status === "done";
      a.innerHTML = `${prioMark(p.priority)}
        <span><span class="pr-name">${tx(p.name)}</span>${p.desc ? `<span class="pr-desc">${tx(p.desc)}</span>` : ""}</span>
        <span class="pr-folder mono">${p.folder ?? t().noFolder}</span>
        <span class="pr-counts">${done ? t().record(p.tasks, daysBetween(p.since, p.doneOn)) : t().counts(countOf(p))}</span>
        <span class="pr-since">${done ? t().doneOn(shortDate(p.doneOn)) : p.since ? t().since(shortDate(p.since)) : t().notStarted}</span>`;
      list.appendChild(a);
    }
  }

  const RANK = { high: 0, normal: 1, low: 2 };
  const prioMark = (k) => `<span class="prio ${k}">${icon.flag}${t().priority[k]}</span>`;

  const STATUS_CHIP = { planned: "planned", active: "working", held: "leave", done: "available" };
  const projectMark = (status) =>
    status === "active" ? `<span class="dot working"></span>`
    : status === "held" ? `<span class="pmark held">${icon.pause}</span>`
    : status === "done" ? `<span class="pmark done">${icon.check}</span>`
    : `<span class="pmark planned"></span>`;

  function renderProject(p) {
    document.getElementById("pjName").textContent = tx(p.name);
    const chip = document.getElementById("pjChip");
    chip.className = "chip " + STATUS_CHIP[p.status];
    chip.innerHTML = projectMark(p.status) + t().filters[p.status];
    // A project with no folder cannot be worked in; a planned one says so in its notice instead.
    document.getElementById("pjSub").innerHTML = [prioMark(p.priority), p.desc ? tx(p.desc) : "", p.folder ? `<span class="mono">${p.folder}</span>` : p.status === "planned" ? "" : t().noFolderYet]
      .filter(Boolean).join(" · ");
    document.getElementById("pjNewTask").hidden = !writable(p);

    const notice = document.getElementById("pjNotice");
    notice.innerHTML =
      p.status === "planned" ? `<div class="notice"><span class="n-ic">${icon.flag}</span>
          <span class="n-tx"><b>${t().plannedNotice}</b><span>${p.folder ? t().plannedNoticeWhy : t().needsFolder}</span></span>
          <span class="n-acts"><button class="btn btn-secondary btn-sm" type="button" data-start${p.folder && !RUNTIME.off ? "" : " disabled"}>${t().actions.startProject}</button></span></div>`
      : p.status === "held" ? `<div class="notice notice-warn"><span class="n-ic">${icon.pause}</span>
          <span class="n-tx"><b>${t().heldNotice}</b><span>${tx(p.reason)} · ${t().heldNoticeHint}</span></span>
          <span class="n-acts"><button class="btn btn-secondary btn-sm" type="button" data-resume${RUNTIME.off ? " disabled" : ""}>${t().actions.resumeProject}</button></span></div>`
      : p.status === "done" ? `<div class="notice"><span class="n-ic">${icon.check}</span>
          <span class="n-tx"><b>${t().doneNotice(shortDate(p.doneOn))}</b><span>${t().doneNoticeWhy}</span></span>
          <span class="n-acts"><button class="btn btn-secondary btn-sm" type="button" data-resume>${t().actions.reopenProject}</button></span></div>`
      : "";
    notice.hidden = !notice.innerHTML;
    notice.querySelector("[data-resume]")?.addEventListener("click", () => resumeProject(p));
    notice.querySelector("[data-start]")?.addEventListener("click", () => startProject(p));

    board.innerHTML = "";
    for (const { status, color } of COLUMNS) {
      const list = shown().filter((k) => k.status === status);
      const col = document.createElement("section");
      col.className = "col";
      col.innerHTML = `<div class="col-hd"><span class="col-dot" style="background:${color}"></span><h2>${t().columns[status]}</h2><span class="col-n">${list.length}</span><span class="col-line"></span></div>`;
      for (const task of list) col.appendChild(taskCard(task));
      if (!list.length) {
        const e = document.createElement("p");
        e.className = "col-empty";
        e.textContent = t().empty;
        col.appendChild(e);
      }
      if (status === "backlog" && writable(p)) {
        const a = document.createElement("button");
        a.className = "col-add";
        a.dataset.newTask = "";
        a.innerHTML = icon.plus + `<span>${t().addTask}</span>`;
        col.appendChild(a);
      }
      board.appendChild(col);
    }

  }

  // What the project's own menu offers follows from where the project is.
  document.getElementById("projectMenu").addEventListener("click", (e) => {
    const p = here();
    const unsettled = tasksOf(p).filter((k) => k.status === "working" || k.status === "approval").length;
    const rows =
      p.status === "planned" ? [
        p.folder && !RUNTIME.off ? menu(t().actions.startProject, "key", () => startProject(p)) : offRow(t().actions.startProject),
        ...(p.folder ? RUNTIME.off ? [why(t().runtime.cannotStart)] : [] : [why(t().needsFolder)]),
        menu(t().actions.editProject, null, () => openEditProject(p)),
      ]
      : p.status === "active" ? [
        menu(t().actions.editProject, null, () => openEditProject(p)),
        menu(t().actions.holdProject, null, () => askHoldProject(p)),
        ...(unsettled ? [offRow(t().actions.finishProject), why(t().cannotFinish(unsettled))] : [menu(t().actions.finishProject, null, () => askFinishProject(p))]),
      ]
      : p.status === "held" ? [
        ...(RUNTIME.off ? [offRow(t().actions.resumeProject), why(t().runtime.cannotStart)] : [menu(t().actions.resumeProject, "key", () => resumeProject(p))]),
        menu(t().actions.editProject, null, () => openEditProject(p)),
      ]
      : [menu(t().actions.reopenProject, null, () => resumeProject(p))];
    openMenu(e.currentTarget, [...rows, menu(t().actions.removeProject, "bad", () => askRemoveProject(p))]);
  });

  function offRow(label) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "mrow";
    b.disabled = true;
    b.textContent = label;
    return b;
  }

  function why(text) {
    const p = document.createElement("p");
    p.className = "p-why";
    p.textContent = text;
    return p;
  }
  /* ── one task, and what the user can do about it ───────────── */

  function menu(label, kind, then) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "mrow" + (kind ? " mrow-" + kind : "");
    b.textContent = label;
    b.addEventListener("click", () => {
      close();
      then?.();
    });
    return b;
  }

  // What someone is on right now, in the words of the work itself.
  const busyWith = (p) =>
    TASKS.find((k) => k.who === p.id && k.status === "working")?.title ?? p.task ?? p.review;

  // A review is work too: someone free starts looking now, someone busy looks
  // once they are done, and nobody on leave can be asked.
  function reviewerRow(task, p) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "mrow seat";
    const when = away(p) ? t().seatAway : free(p) ? t().seatNow : t().seatLater;
    const doing = away(p) ? tx(p.leaveSince) : free(p) ? t().reviewerFree : t().reviewerBusy(tx(busyWith(p)), p.status === "reviewing");
    b.innerHTML = `<span class="w-av"></span><span class="seat-tx"><span class="seat-top"><b>${p.name}</b><span class="seat-when">${when}</span></span><span class="seat-why">${doing}</span></span>`;
    b.title = doing;
    b.querySelector(".w-av").appendChild(spriteCanvas(p.species, 20));
    b.disabled = away(p);
    b.addEventListener("click", () => {
      const now = free(p);
      task.peer = { by: p.id, state: now ? "reviewing" : "queued" };
      if (now) p.status = "reviewing";
      close();
      render();
      renderMembers();
    });
    return b;
  }

  // Who may review is who has been taught the area, never the one doing the work.
  function reviewChoices(task, acts, say) {
    const seats = reviewersFor(task.area).filter((p) => p.id !== task.who);
    if (seats.length) {
      for (const p of seats) acts.appendChild(reviewerRow(task, p));
      return;
    }
    say("p-why", t().noSeat);
    const go = document.createElement("a");
    go.className = "mrow";
    go.href = "employees.html";
    go.textContent = t().actions.open;
    acts.appendChild(go);
  }

  function open(task, el, viaKey, picking = false) {
    if (anchor === el && pop.hasAttribute("data-open") && !picking) { close(); return; }

    document.querySelectorAll("[data-id]").forEach((n) => {
      n.setAttribute("aria-expanded", String(n.dataset.id === task.id));
    });

    const who = task.who ? byId.get(task.who) : null;
    pop.innerHTML = `
      <div class="p-hd">
        <span class="p-av"></span>
        <span style="flex:1;min-width:0">
          <span class="p-name">${tx(task.title)}</span>
          <span class="p-role">${areaLabel(task.area)} · ${t().priority[task.priority]}</span>
        </span>
      </div>
      <span class="p-rule"></span>`;

    if (who) pop.querySelector(".p-av").appendChild(spriteCanvas(who.species, 38));
    else pop.querySelector(".p-av").textContent = "—";

    const acts = document.createElement("div");
    acts.className = "p-acts";
    const say = (cls, html) => {
      const s = document.createElement("span");
      s.className = cls;
      s.innerHTML = html;
      pop.appendChild(s);
    };

    // A held project starts nothing new, but what is finished can still be
    // applied; a done one is only a record.
    const live = here().status === "active";
    const kept = here().status !== "done";
    const draft = writable(here());
    // Whatever would start or resume an agent waits while Claude Code is
    // signed out: the row stays, disabled, and the reason is said once.
    const gated = (label, kind, run) => (RUNTIME.off ? offRow(label) : menu(label, kind, run));
    const reviewOpen = !task.peer || task.peer.state === "suggested";

    if (task.status === "backlog" && live) {
      acts.appendChild(gated(t().actions.assign, null, () => assignTask(task)));
    }

    if (task.status === "working" && live && RUNTIME.off && reviewOpen) {
      acts.appendChild(offRow(t().actions.pickPeer));
    } else if (task.status === "working" && live) {
      // The system offers the review; it knows the area and who was taught it.
      if (task.peer?.state === "suggested") {
        reviewChoices(task, acts, say);
      } else if (!task.peer && picking) {
        say("p-why", t().pickWho(areaLabel(task.area)));
        reviewChoices(task, acts, say);
      } else if (!task.peer) {
        const ask = document.createElement("button");
        ask.type = "button";
        ask.className = "mrow";
        ask.textContent = t().actions.pickPeer;
        ask.addEventListener("click", () => open(task, el, viaKey, true));
        acts.appendChild(ask);
      }
    }

    // This is the line the work does not cross on its own.
    if (task.status === "approval" && kept) {
      say("p-said", `<b>${t().approveTitle}</b>${t().approveWhy}`);
      // a commit needs no agent
      acts.appendChild(menu(t().actions.approve, "key", () => approveTask(task)));
      acts.appendChild(gated(t().actions.rework, null, () => askRework(task)));
      acts.appendChild(menu(t().actions.hold, null, () => askHoldTask(task)));
    }

    if (task.status === "held") {
      say("p-said", `<b>${t().heldBecause}</b>${tx(task.reason)}`);
      if (live) acts.appendChild(gated(t().actions.resume, "key", () => resumeTask(task)));
      acts.appendChild(menu(t().actions.teach, null, () => teachFrom(task)));
    }

    // A finished task is the record of what happened, so it is not edited or
    // thrown away. One waiting for approval is finished too - the answer there
    // is to approve it, send it back or hold it, not to rewrite what was done.
    if (task.status !== "done" && draft) {
      if (task.status !== "approval") acts.appendChild(task.status === "working" ? gated(t().actions.edit, null, () => openEditTask(task)) : menu(t().actions.edit, null, () => openEditTask(task)));
      acts.appendChild(menu(t().actions.removeTask, "bad", () => askRemoveTask(task)));
    }

    const detail = document.createElement("a");
    detail.className = "mrow";
    detail.href = "#" + task.project + "/" + task.id;
    detail.textContent = t().actions.detail;
    detail.addEventListener("click", close);
    if (acts.querySelector(".mrow:disabled")) acts.prepend(why(t().runtime.cannotStart));
    acts.prepend(detail);
    pop.appendChild(acts);

    anchor = el;
    pop.setAttribute("data-open", "");
    place(el);
    if (viaKey) (pop.querySelector(".mrow") ?? pop).focus?.();
  }
  function openMenu(el, rows) {
    if (anchor === el && pop.hasAttribute("data-open")) { close(); return; }
    document.querySelectorAll("[data-id]").forEach((n) => n.setAttribute("aria-expanded", String(n === el)));

    pop.innerHTML = "";
    const acts = document.createElement("div");
    acts.className = "p-acts";
    for (const row of rows) acts.appendChild(row);
    pop.appendChild(acts);

    anchor = el;
    pop.setAttribute("data-open", "");
    place(el);
  }

  function place(el) {
    const r = el.getBoundingClientRect();
    const w = pop.offsetWidth, h = pop.offsetHeight, gap = 8, edge = 12;
    let left = r.right + gap;
    if (left + w > innerWidth - edge) left = r.left - w - gap;
    if (left < edge) left = Math.min(Math.max(edge, r.left), innerWidth - w - edge);
    const top = Math.min(r.top, innerHeight - h - edge);
    pop.style.left = Math.round(left) + "px";
    pop.style.top = Math.round(Math.max(edge, top)) + "px";
  }

  function close() {
    pop.removeAttribute("data-open");
    document.querySelectorAll("[data-id]").forEach((n) => n.setAttribute("aria-expanded", "false"));
    anchor = null;
  }

  document.addEventListener("pointerdown", (e) => {
    // The anchor closes itself on the click that follows; closing here first
    // would clear it and let that click reopen the popover.
    if (!anchor || pop.contains(e.target) || anchor.contains(e.target)) return;
    if (!e.target.closest("[data-id]")) close();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || !anchor) return;
    const back = anchor;
    close();
    back.focus({ preventScroll: true });
  });

  window.addEventListener("resize", () => { if (anchor) place(anchor); });

  /* ── sidebar roster ──────────────────────────────────────────── */
  // The board has no per-person view of its own, so a pick opens that person
  // on the people screen.
  function renderMembers() {
    const box = document.getElementById("members");
    box.replaceChildren();
    mountRoster(box, (p) => {
      location.href = "employees.html" + (lang === "en" ? "?lang=en" : "") + "#" + p.id;
    });
  }
  renderMembers();
  /* ── making a task ───────────────────────────────────────────── */
  // The one choice worth making carefully is the area, because it decides who
  // can review the work later. So the dialog answers that while it is being
  // made, rather than leaving it to be discovered in the review column.

  const scrim = document.getElementById("scrim");
  const dialog = document.getElementById("modal");

  function renderNewTask() {
    const editing = TASKS.find((k) => k.id === dialog.dataset.edit) ?? null;
    const area = dialog.dataset.area || SEAT_AREAS[0];
    const into = dialog.dataset.project || project;
    const who = dialog.dataset.who || "";
    const prio = dialog.dataset.prio || "normal";
    const knowers = reviewersFor(area).map((p) => p.name);
    // only someone taught the area reviews it, and never whoever does the work
    const reviewers = reviewersFor(area).filter((p) => p.id !== who);
    const reviewer = reviewers.find((p) => p.id === dialog.dataset.reviewer) ?? null;
    const picked = who ? byId.get(who) : null;
    const heading = editing ? t().editTaskTitle : t().newTaskTitle;
    // An agent is running in this project's folder right now, so the work can
    // be redirected but not moved somewhere else.
    const running = editing?.status === "working";

    // What naming this person means, which is a different thing while someone
    // is already on the work.
    const whatHappens = () => {
      if (running) {
        if (!picked) return t().backToBacklog;
        return picked.id === editing.who ? t().keepsGoing : t().handOver(picked.name);
      }
      // A held task is not waiting its turn; it is waiting for the user.
      if (editing?.status === "held") return picked ? t().whenResumed(picked.name) : t().whenResumedAnyone;
      if (PROJECTS.find((p) => p.id === into)?.status === "planned") return picked ? t().whenStarted(picked.name) : t().whenStartedAnyone;
      if (!picked) return t().whoTakes;
      if (RUNTIME.off && free(picked)) return t().runtime.cannotStart;
      return free(picked) ? t().freeNow(picked.name) : t().busyNow(picked.name);
    };

    dialog.setAttribute("aria-label", heading);
    dialog.innerHTML = `
      <div class="m-hd">
        <span style="flex:1;min-width:0"><span class="m-t">${heading}</span></span>
      </div>

      <div class="m-sec">
        <div class="field" style="margin-top:0">
          <span class="label">${t().fProject}</span>
          <span class="select-wrap">
            <select class="select" id="ntProject"${running ? " disabled" : ""}>
              ${PROJECTS.filter(writable).map((p) => `<option value="${p.id}"${p.id === into ? " selected" : ""}>${tx(p.name)}</option>`).join("")}
            </select>
            ${chevron}
          </span>
          ${running ? `<span class="hint">${t().folderLocked}</span>` : ""}
        </div>

        <div class="field">
          <span class="label">${t().fTitle} <span class="req">*</span></span>
          <input class="input" id="ntTitle" placeholder="${t().fTitlePlaceholder}" autocomplete="off" />
        </div>

        <div class="field">
          <span class="label">${t().fDesc}</span>
          <textarea class="textarea" placeholder="${t().fDescPlaceholder}"></textarea>
        </div>
      </div>

      <div class="m-sec">
        <div class="grid2" style="gap:14px">
          <div class="field" style="margin-top:0">
            <span class="label">${t().fArea}</span>
            <span class="select-wrap">
              <select class="select" id="ntArea">
                ${SEAT_AREAS.map((a) => `<option value="${a}"${a === area ? " selected" : ""}>${t().areas[a]}</option>`).join("")}
              </select>
              ${chevron}
            </span>
          </div>
          <div class="field" style="margin-top:0">
            <span class="label">${t().fPriority}</span>
            <span class="select-wrap">
              <select class="select" id="ntPrio">
                ${["low", "normal", "high"]
                  .map((k) => `<option value="${k}"${k === prio ? " selected" : ""}>${t().priority[k]}</option>`)
                  .join("")}
              </select>
              ${chevron}
            </span>
          </div>
        </div>

        ${
          knowers.length
            ? `<span class="hint">${t().areaHint} ${t().canReview(knowers)}</span>`
            : `<div class="notice notice-warn" style="margin-top:12px">
                 <span class="n-ic">${icon.none}</span>
                 <span class="n-tx"><span>${t().canReviewNobody(areaObject(area))}</span></span>
               </div>`
        }
      </div>

      <div class="m-sec">
        <div class="field" style="margin-top:0">
          <span class="label">${t().fAssignee}</span>
          <span class="select-wrap">
            <select class="select" id="ntWho">
              <option value=""${who ? "" : " selected"}>${t().anyoneFree}</option>
              ${STAFF.map(
                (p) =>
                  `<option value="${p.id}"${p.id === who ? " selected" : ""}${away(p) ? " disabled" : ""}>${
                    away(p) ? t().onLeaveOption(p.name) : p.name
                  }</option>`,
              ).join("")}
            </select>
            ${chevron}
          </span>
          <span class="hint">${whatHappens()}</span>
        </div>
        <div class="field">
          <span class="label">${t().fReviewer}</span>
          <span class="select-wrap">
            <select class="select" id="ntReviewer"${reviewers.length ? "" : " disabled"}>
              <option value="">${t().noReviewer}</option>
              ${reviewers.map((p) => `<option value="${p.id}"${p.id === reviewer?.id ? " selected" : ""}>${p.name}</option>`).join("")}
            </select>
            ${chevron}
          </span>
          <span class="hint">${reviewer ? t().reviewerWhen(reviewer.name) : t().reviewerNone}</span>
        </div>
      </div>

      <div class="m-foot">
        <button class="btn btn-secondary btn-md" data-close>${t().cancel}</button>
        <button class="btn btn-primary btn-md" data-save>${running ? t().sendChange : editing ? t().save : t().create}</button>
      </div>`;

    // What the dialog promised is what the board shows, on a new task and on
    // one being corrected alike.
    dialog.querySelector("[data-save]").addEventListener("click", () => {
      const field = dialog.querySelector("#ntTitle");
      const name = field.value.trim();
      if (!name) return field.focus();
      const desc = dialog.querySelector(".textarea").value.trim();
      const task = editing ?? { id: "nt" + TASKS.length, status: "backlog" };
      const handedOver = running && task.who !== (picked?.id ?? null);
      // The user's own words are not translated, so a new one reads the same
      // in both languages and a correction only touches the one being read.
      const wrote = (had, value) => (editing ? { ...had, [lang]: value } : { ko: value, en: value });
      Object.assign(task, {
        // the only field the dialog does not re-render on, so it is read live
        project: running ? task.project : into, area, priority: dialog.querySelector("#ntPrio").value,
        who: picked ? picked.id : null,
        title: wrote(task.title, name),
        desc: desc ? wrote(task.desc, desc) : undefined,
      });
      // Nothing of the old run carries over to whoever takes it next.
      if (handedOver && task.who) task.spent = 0;
      settle(task);
      if (!editing) TASKS.push(task);
      closeModal();
      if (into !== project) location.hash = into;
      else render();
    });

    // re-rendering is how the dialog answers what a choice means, so the text
    // already typed has to survive it
    const keep = () => {
      const title = dialog.querySelector("#ntTitle").value;
      const desc = dialog.querySelector(".textarea").value;
      return (focusId) => {
        renderNewTask();
        dialog.querySelector("#ntTitle").value = title;
        dialog.querySelector(".textarea").value = desc;
        dialog.querySelector(focusId).focus();
      };
    };
    for (const [id, key] of [["#ntArea", "area"], ["#ntProject", "project"], ["#ntWho", "who"], ["#ntReviewer", "reviewer"]]) {
      dialog.querySelector(id).addEventListener("change", (e) => {
        const again = keep();
        dialog.dataset[key] = e.target.value;
        again(id);
      });
    }
    // Priority changes nothing the dialog says, so it is only remembered.
    dialog.querySelector("#ntPrio").addEventListener("change", (e) => {
      dialog.dataset.prio = e.target.value;
    });
    dialog.querySelector("[data-close]").addEventListener("click", closeModal);
  }
  function openNewTask() {
    openModal(renderNewTask, { project });
    dialog.querySelector("#ntTitle").focus({ preventScroll: true });
  }

  function openEditTask(task) {
    openModal(renderNewTask, {
      edit: task.id, project: task.project, area: task.area,
      who: task.who ?? "", prio: task.priority,
    });
    const field = dialog.querySelector("#ntTitle");
    field.value = tx(task.title);
    if (task.desc) dialog.querySelector(".textarea").value = tx(task.desc);
    field.focus({ preventScroll: true });
  }

  /* ── making a project ────────────────────────────────────────── */
  // A project is a folder as much as it is a name: the office works in it, so
  // the dialog asks for it here rather than leaving it to be discovered when
  // the first task cannot start.

  const SAMPLE_FOLDERS = ["~/Projects/tinysoft", "~/Projects/orders"];
  // what a folder's package.json offers, as the app would read it
  const SAMPLE_RUNS = { "~/Projects/tinysoft": ["npm test", "npm run lint", "npm run build"], "~/Projects/orders": ["npm test", "npm run lint"] };
  const X_SM = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>';

  function renderNewProject() {
    const editing = PROJECTS.find((p) => p.id === dialog.dataset.edit) ?? null;
    const dir = dialog.dataset.folder || "";
    const prio = dialog.dataset.prio || editing?.priority || "normal";
    const runs = dialog.dataset.runs !== undefined ? JSON.parse(dialog.dataset.runs) : editing?.runs ?? [];
    const heading = editing ? t().editProjectTitle : t().newProjectTitle;
    dialog.setAttribute("aria-label", heading);
    dialog.innerHTML = `
      <div class="m-hd">
        <span style="flex:1;min-width:0"><span class="m-t">${heading}</span></span>
      </div>

      <div class="m-sec">
        <div class="field" style="margin-top:0">
          <span class="label">${t().fName} <span class="req">*</span></span>
          <input class="input" id="npName" placeholder="${t().fNamePlaceholder}" autocomplete="off" />
        </div>

        <div class="field">
          <span class="label">${t().fAbout}</span>
          <input class="input" id="npDesc" placeholder="${t().fAboutPlaceholder}" autocomplete="off" />
        </div>

        <div class="field">
          <span class="label">${t().fPriority}</span>
          <span class="select-wrap">
            <select class="select" id="npPrio">
              ${["low", "normal", "high"].map((k) => `<option value="${k}"${k === prio ? " selected" : ""}>${t().priority[k]}</option>`).join("")}
            </select>
            ${chevron}
          </span>
          <span class="hint">${t().projectPrioHint}</span>
        </div>

        <div class="field">
          <span class="label">${t().workspace}</span>
          <div class="folder">
            ${icon.folder}
            <span class="path${dir ? "" : " empty"}">${dir || t().noFolder}</span>
            <button class="btn btn-secondary btn-sm" type="button" data-pick-folder>${dir ? t().change : t().choose}</button>
          </div>
          ${dir ? `<div class="scope">
            ${scopeRow("yes", t().scopeFiles)}${scopeRow("yes", t().scopeRuns)}${scopeRow("no", t().scopeNot)}
          </div>` : ""}
          <span class="hint">${dir ? t().folderHint : t().noFolderHint} ${dir ? `<a href="settings.html${lang === "en" ? "?lang=en" : ""}#safety">${t().scopeMore}</a>` : ""}</span>
        </div>

        ${dir ? `<div class="field">
          <span class="label">${t().fRuns}</span>
          ${runs.length
            ? `<div class="runs">${runs.map((r, i) => `<span class="run">${r}<button type="button" data-drop-run="${i}" aria-label="${t().removeRun(r)}">${X_SM}</button></span>`).join("")}</div>`
            : `<span class="hint" style="margin-top:0">${t().runsNone}</span>`}
          <div class="run-add"><input class="input" id="npRun" placeholder="${t().runPlaceholder}" autocomplete="off" spellcheck="false" /><button class="btn btn-secondary btn-sm" type="button" data-add-run>${t().addRun}</button></div>
          <span class="hint">${t().runsHint}</span>
        </div>` : ""}
      </div>

      <div class="m-foot">
        <button class="btn btn-secondary btn-md" data-close>${t().cancel}</button>
        <button class="btn btn-primary btn-md" data-save>${editing ? t().save : t().createProject}</button>
      </div>`;

    // The sample keeps what it is given for as long as the page is open, so
    // the new project can be opened and filled. A reload is the reset.
    dialog.querySelector("[data-save]").addEventListener("click", () => {
      const field = dialog.querySelector("#npName");
      const name = field.value.trim();
      if (!name) return field.focus();
      const about = dialog.querySelector("#npDesc").value.trim();
      if (editing) {
        editing.name = { ...editing.name, [lang]: name };
        editing.desc = about ? { ...editing.desc, [lang]: about } : undefined;
        editing.folder = dir || null;
        editing.priority = prio;
        editing.runs = dir ? runs : [];
      } else {
        PROJECTS.push({
          id: "np" + PROJECTS.length,
          name: { ko: name, en: name },
          desc: about ? { ko: about, en: about } : undefined,
          folder: dir || null,
          runs: dir ? runs : [],
          status: "planned",
          priority: prio,
        });
      }
      closeModal();
      if (!editing) location.hash = PROJECTS.at(-1).id;
      else render();
    });

    dialog.querySelector("#npPrio").addEventListener("change", (e) => { dialog.dataset.prio = e.target.value; });

    // Re-rendering keeps what was typed; focus returns to what was pressed.
    const again = (focusSel) => {
      const name = dialog.querySelector("#npName").value;
      const about = dialog.querySelector("#npDesc").value;
      renderNewProject();
      dialog.querySelector("#npName").value = name;
      dialog.querySelector("#npDesc").value = about;
      dialog.querySelector(focusSel)?.focus();
    };
    dialog.querySelector("[data-pick-folder]").addEventListener("click", () => {
      dialog.dataset.folder = SAMPLE_FOLDERS[(SAMPLE_FOLDERS.indexOf(dir) + 1) % SAMPLE_FOLDERS.length];
      dialog.dataset.runs = JSON.stringify(SAMPLE_RUNS[dialog.dataset.folder] ?? []);
      again("[data-pick-folder]");
    });
    const addRun = () => {
      const v = dialog.querySelector("#npRun").value.trim();
      if (!v || runs.includes(v)) return;
      dialog.dataset.runs = JSON.stringify([...runs, v]);
      again("#npRun");
    };
    dialog.querySelector("[data-add-run]")?.addEventListener("click", addRun);
    dialog.querySelector("#npRun")?.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); addRun(); } });
    for (const b of dialog.querySelectorAll("[data-drop-run]")) {
      b.addEventListener("click", () => {
        dialog.dataset.runs = JSON.stringify(runs.filter((_, i) => i !== Number(b.dataset.dropRun)));
        again("#npRun");
      });
    }
    dialog.querySelector("[data-close]").addEventListener("click", closeModal);
  }

  function openNewProject() {
    openModal(renderNewProject);
    dialog.querySelector("#npName").focus({ preventScroll: true });
  }

  function openEditProject(p) {
    openModal(renderNewProject, { edit: p.id, folder: p.folder ?? "", runs: JSON.stringify(p.runs ?? []) });
    const field = dialog.querySelector("#npName");
    field.value = tx(p.name);
    if (p.desc) dialog.querySelector("#npDesc").value = tx(p.desc);
    field.focus({ preventScroll: true });
  }

  /* ── taking something back ───────────────────────────────────── */
  // Nothing has happened to a task in the backlog, so it just goes. Anything
  // past it took someone's work, and a project takes its tasks with it, so
  // those say what is being thrown away before it happens.

  function confirmRemoval(heading, why, onYes) {
    confirmStep({ heading, why, yes: t().remove, danger: true, onYes });
  }

  // `field` asks for a line of text before the step can be taken.
  function confirmStep({ heading, why, yes, danger, field, onYes }) {
    openModal(() => {
      dialog.setAttribute("aria-label", heading);
      dialog.innerHTML = `
        <div class="m-hd">
          <span style="flex:1;min-width:0"><span class="m-t">${heading}</span></span>
        </div>
        <div class="m-sec">
          <span class="m-s">${why}</span>
          ${field ? `<div class="field"><label class="label" for="stepText">${field.label}</label><input class="input" id="stepText" placeholder="${field.placeholder}" /></div>` : ""}
        </div>
        <div class="m-foot">
          <button class="btn btn-secondary btn-md" data-close>${t().cancel}</button>
          ${danger ? `<button class="btn btn-danger btn-md" data-yes>${yes}</button>` : `<button class="btn btn-primary btn-md" data-yes${field ? " disabled" : ""}>${yes}</button>`}
        </div>`;
      const yesBtn = dialog.querySelector("[data-yes]");
      const text = dialog.querySelector("#stepText");
      text?.addEventListener("input", () => { yesBtn.disabled = !text.value.trim(); });
      dialog.querySelector("[data-close]").addEventListener("click", closeModal);
      yesBtn.addEventListener("click", () => {
        onYes(text?.value.trim());
        closeModal();
        render();
      });
    });
    (dialog.querySelector("#stepText") ?? dialog.querySelector("[data-yes]")).focus({ preventScroll: true });
  }

  /* ── moving one task ─────────────────────────────────────────── */
  // One task at a time: work handed back to someone busy queues behind what
  // they are on instead of starting.
  const backTo = (task) => (task.who && free(byId.get(task.who)) ? "working" : "backlog");

  function assignTask(task) {
    openEditTask(task);
    dialog.querySelector("#ntWho").focus({ preventScroll: true });
  }

  // Approving commits the task's worktree to its own branch; pushing stays the user's.
  function approveTask(task) {
    Object.assign(task, { status: "done", changes: undefined, commit: Math.random().toString(16).slice(2, 9) });
    render();
  }

  function askRework(task) {
    const who = byId.get(task.who);
    confirmStep({
      heading: t().reworkTitle, yes: t().actions.rework,
      why: backTo(task) === "working" ? t().reworkNow(who.name) : t().reworkLater(who.name),
      field: { label: t().reworkLabel, placeholder: t().reworkPlaceholder },
      onYes: (text) => Object.assign(task, { status: backTo(task), changes: { ko: text, en: text } }),
    });
  }

  function askHoldTask(task) {
    confirmStep({
      heading: t().holdTaskTitle, why: t().holdTaskWhy, yes: t().holdYes,
      field: { label: t().holdReason, placeholder: t().holdTaskPlaceholder },
      onYes: (text) => Object.assign(task, { status: "held", reason: { ko: text, en: text } }),
    });
  }

  function resumeTask(task) {
    Object.assign(task, { status: backTo(task), reason: undefined });
    render();
  }

  // Teaching from a task takes the task as where the memory came from.
  // `suggested` starts the memory from what the agent thought worth remembering.
  function teachFrom(task, suggested = null, onTaught = () => {}) {
    openTeach({
      to: task.who ? byId.get(task.who) : null,
      area: task.area,
      from: task.title,
      text: suggested,
      onSave: ({ to, memory }) => { to.memories.unshift({ ...memory, used: 0 }); onTaught(); },
    });
  }

  // Starting is what lets the backlog be picked up, and when the project's span begins.
  function startProject(p) {
    Object.assign(p, { status: "active", since: TODAY });
    for (const k of tasksOf(p)) settle(k);
    close();
    render();
  }

  function askHoldProject(p) {
    const running = tasksOf(p).filter((k) => k.status === "working");
    confirmStep({
      heading: t().holdTitle, why: t().holdWhy(running.length), yes: t().holdYes,
      field: { label: t().holdReason, placeholder: t().holdPlaceholder },
      onYes: (reason) => {
        const r = { ko: reason, en: reason };
        Object.assign(p, { status: "held", reason: r });
        for (const k of running) Object.assign(k, { status: "held", reason: r, withProject: true });
      },
    });
  }

  function askFinishProject(p) {
    const open = tasksOf(p).filter((k) => k.status !== "done").length;
    confirmStep({
      heading: t().finishTitle, why: t().finishWhy(open), yes: t().finishYes,
      onYes: () => Object.assign(p, { status: "done", doneOn: TODAY, tasks: tasksOf(p).filter((k) => k.status === "done").length }),
    });
  }

  // Held work goes back to whoever had it, or queues behind what they took on
  // meanwhile. A reopened project picks up from its board as it was left.
  function resumeProject(p) {
    for (const k of tasksOf(p).filter((k) => k.withProject)) {
      Object.assign(k, { status: free(byId.get(k.who)) ? "working" : "backlog", withProject: false, reason: undefined });
    }
    Object.assign(p, { status: "active", reason: undefined, doneOn: undefined });
    close();
    render();
  }

  const drop = (task) => TASKS.splice(TASKS.indexOf(task), 1);

  function askRemoveTask(task) {
    if (task.status === "backlog") {
      drop(task);
      render();
      return;
    }
    confirmRemoval(t().removeTaskTitle, t().removeTaskWhy[task.status], () => drop(task));
  }

  function askRemoveProject(p) {
    const mine = tasksOf(p);
    const why = p.status === "done" ? t().removeProjectDone : p.status === "planned" ? t().removePlanned(mine.length) : mine.length ? t().removeProjectWhy(mine.length) : t().removeProjectEmpty;
    confirmRemoval(t().removeProjectTitle, why, () => {
      for (const k of mine) drop(k);
      PROJECTS.splice(PROJECTS.indexOf(p), 1);
      filter = p.status;
      location.hash = "";
    });
  }

  function openModal(render, state = {}) {
    close();
    for (const k of Object.keys(dialog.dataset)) delete dialog.dataset[k];
    Object.assign(dialog.dataset, state);
    scrim.hidden = false;
    render();
  }

  function closeModal() {
    scrim.hidden = true;
  }

  scrim.addEventListener("pointerdown", (e) => { if (e.target === scrim) closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !scrim.hidden) closeModal(); });
  // the column button is built by render(), so this listens rather than binds
  document.addEventListener("click", (e) => {
    if (e.target.closest("[data-new-task]")) openNewTask();
    if (e.target.closest("[data-new-project]")) openNewProject();
  });

  // The list is the page; a project's board has an address of its own.
  function route() {
    close();
    const [pid, tid, then] = location.hash.slice(1).split("/");
    project = PROJECTS.some((p) => p.id === pid) ? pid : null;
    taskId = project && TASKS.some((k) => k.id === tid && k.project === pid) ? tid : null;
    if (project) filter = here().status;
    render();
    // another screen's 담당 변경 arrives here with the assignee open
    if (taskId && then === "assign") {
      history.replaceState(null, "", "#" + project + "/" + taskId);
      assignTask(TASKS.find((k) => k.id === taskId));
    }
  }
  window.addEventListener("hashchange", route);
  document.addEventListener("runtimeback", () => { close(); render(); });
  route();
</script>
