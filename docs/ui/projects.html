<meta charset="utf-8" />
<title>Tiny Office · Projects</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
/>
<link rel="stylesheet" href="system.css" />
<script src="system.js"></script>
<style>
  body {
    margin: 0; padding: 26px 22px 70px;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    background: var(--page); color: var(--ink);
    font-family: var(--sans); font-size: 14px; line-height: 1.6;
  }

  .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--ink); display: grid; place-items: center; flex: none; }

  .logo svg { width: 15px; height: 15px; color: #fff; }

  .sub { display: block; font-size: 13px; color: var(--muted); margin-top: 1px; }

  .ibtn {
    width: 32px; height: 32px; border-radius: 999px; border: none;
    background: var(--subtle); color: var(--muted);
    display: inline-grid; place-items: center; cursor: pointer;
  }

  .tab:focus-visible, .btn:focus-visible, .col-add:focus-visible,
  .work:focus-visible, .mrow:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  /* ═══ the board ═══ */

  .board { display: grid; gap: 10px; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start; }

  .col { display: flex; flex-direction: column; gap: 9px; min-width: 0; }

  .col-hd { display: flex; align-items: center; gap: 7px; padding: 0 2px 2px; }

  .col-hd h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: -.01em; }

  .col-n {
    font-size: 11px; font-weight: 600; color: var(--faint);
    background: var(--sunk); border-radius: 999px; padding: 1px 7px;
    font-variant-numeric: tabular-nums;
  }

  .col-line { flex: 1; height: 1px; background: var(--line); }

  /* The review column is the one that waits on the player, so it reads as a
     place with something in it rather than another column of cards. */
  .col.review .col-hd h2 { color: var(--warn-ink); }
  .col.review .col-n { background: var(--warn-soft); color: var(--warn-ink); }

  .work {
    text-align: left; width: 100%; font: inherit; color: inherit;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-ctl); padding: 11px 12px; cursor: pointer;
    display: flex; flex-direction: column; gap: 7px;
    transition: border-color .1s, box-shadow .1s;
  }

  .work:hover { border-color: var(--line-2); box-shadow: 0 1px 3px rgb(20 20 25 / .06); }

  .work[aria-expanded="true"] { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }

  .w-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }

  .w-title { font-size: 13.5px; font-weight: 500; line-height: 1.4; }

  .w-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11.5px; color: var(--faint); }

  .w-who { display: flex; align-items: center; gap: 5px; min-width: 0; }

  .w-who span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .w-av { width: 20px; height: 20px; border-radius: 6px; background: var(--subtle); display: grid; place-items: center; flex: none; }

  .prio { font-size: 11px; font-weight: 600; flex: none; white-space: nowrap; }
  .prio.high { color: var(--bad-ink); }
  .prio.normal { color: var(--faint); }
  .prio.low { color: var(--line-2); }

  .col-add {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; font: inherit; font-size: 12.5px; color: var(--faint);
    background: none; border: 1px dashed var(--line-2); border-radius: var(--r-ctl);
    padding: 9px; cursor: pointer;
  }

  .col-add:hover { border-color: var(--muted); color: var(--muted); background: var(--surface); }

  .col-add svg { width: 13px; height: 13px; }

  .col-empty { font-size: 12px; color: var(--line-2); padding: 7px 2px; }

  /* ═══ what a review is waiting on ═══ */

  .r-line { display: flex; align-items: center; gap: 6px; font-size: 11.5px; }

  .r-line.pending { color: var(--warn-ink); }
  .r-line.changes { color: var(--bad-ink); }
  .r-line.stuck { color: var(--faint); }

  .r-line svg { width: 13px; height: 13px; flex: none; }

  /* ═══ the popover's review section ═══ */

  .p-said {
    display: block; font-size: 12.5px; line-height: 1.5; color: var(--muted);
    background: var(--sunk); border-radius: 9px; padding: 9px 10px; margin-top: 8px;
  }

  .p-said b { display: block; font-weight: 600; color: var(--ink); font-size: 11.5px; margin-bottom: 3px; }

  .seat-row { display: flex; align-items: center; gap: 8px; min-width: 0; }

  .seat-why { font-size: 11px; color: var(--faint); }

  @media (max-width: 1180px) {
    .board { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  @media (max-width: 820px) {
    .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>

<div class="app">

    <div class="nav">
      <a href="office.html"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="2.5" y="3.5" width="13" height="11.5" rx="1.5"/><path d="M6 7.5h1.8M10.2 7.5H12M6 11h1.8M10.2 11H12"/></svg><span data-t="nav.office">사무실</span></a>
      <a href="#" aria-current="page"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M2.5 5.5h4.5L8.5 8h7v6.5h-13z"/></svg><span data-t="nav.projects">프로젝트</span></a>

      <a href="#"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3.5 14.5v-3.5M9 14.5v-7M14.5 14.5v-10.5"/></svg><span data-t="nav.company">회사</span></a>
    </div>

    <div class="rule"></div>
    <div class="ws-hd"><span>Acme Tiny Software</span><button class="ibtn" style="width:22px;height:22px" data-a="hire" aria-label="직원 고용"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg></button></div>
    <div id="members"></div>

    <div class="side-foot">
      <div class="rule" style="margin:0 4px 8px"></div>
      <div class="nav">
        <a href="#"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="9" r="2.6"/><path d="M9 1.8v2M9 14.2v2M1.8 9h2M14.2 9h2M3.9 3.9l1.4 1.4M12.7 12.7l1.4 1.4M14.1 3.9l-1.4 1.4M5.3 12.7l-1.4 1.4"/></svg><span data-t="nav.settings">설정</span></a>
      </div>
    </div>
  </nav>

  <div class="main">
    <div class="head">
      <div class="head-row">
        <span>
          <h1 data-t="title">프로젝트</h1>
          <span class="sub" id="headSub"></span>
        </span>
        <div class="head-right">
          <button class="btn btn-primary btn-lg"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg><span data-t="newTask">새 업무</span></button>
        </div>
      </div>

      <div class="tabs" id="tabs"></div>
    </div>

    <div class="body">
      <div class="board" id="board"></div>
    </div>
  </div>
</div>

<div class="pop" id="pop" role="dialog" aria-label="업무"></div>

<script>
  /* ── the work on the board ───────────────────────────────────── */

  const PROJECTS = [
    { id: "pay", name: { ko: "결제 개편", en: "Payments rework" } },
    { id: "order", name: { ko: "주문 v2", en: "Orders v2" } },
  ];

  // status follows the domain: backlog → ready → working → review → done
  const TASKS = [
    { id: "t1", project: "pay", area: "db", priority: "high", status: "working", who: "p1", minutes: 25, done: 12,
      title: { ko: "결제 내역 페이지네이션", en: "Paginate the payment history" } },
    { id: "t2", project: "pay", area: "arch", priority: "normal", status: "review", who: "p1",
      title: { ko: "결제 API 에러 응답 구조 변경", en: "Change the payment API error shape" },
      review: { by: "p4", state: "changes",
        said: { ko: "재시도 가능한 실패와 영구 실패를 같은 코드로 내려주고 있어요. 나눠 주세요.", en: "Retryable and permanent failures come back under one code. Split them." } } },
    { id: "t3", project: "pay", area: "security", priority: "high", status: "review", who: "p5",
      title: { ko: "결제 웹훅 서명 검증", en: "Verify the payment webhook signature" },
      review: { by: null, state: "pending" } },
    { id: "t4", project: "order", area: "types", priority: "normal", status: "review", who: "p2",
      title: { ko: "주문 상태 타입 좁히기", en: "Narrow the order status type" },
      review: { by: "p2", state: "reviewing" } },
    { id: "t5", project: "order", area: "arch", priority: "normal", status: "ready", who: "p1",
      title: { ko: "주문 취소 API 추가", en: "Add an order cancellation API" } },
    { id: "t6", project: "order", area: "quality", priority: "low", status: "review", who: "p3",
      title: { ko: "주문 회귀 테스트 작성", en: "Write the order regression tests" },
      review: { by: null, state: "pending" } },
    { id: "t7", project: "pay", area: "l10n", priority: "low", status: "backlog", who: null,
      title: { ko: "결제 에러 메시지 영문 번역", en: "Translate the payment error messages" } },
    { id: "t8", project: "order", area: "db", priority: "normal", status: "done", who: "p4",
      title: { ko: "주문 테이블 인덱스 정리", en: "Tidy the order table indexes" } },
    { id: "t9", project: "pay", area: "product", priority: "normal", status: "done", who: "p3",
      title: { ko: "환불 정책 문서화", en: "Write down the refund policy" } },
  ];

  const COLUMNS = ["backlog", "ready", "working", "review", "done"];

  /* ── i18n ────────────────────────────────────────────────────── */
  // Employee nicknames are absent on purpose: the player wrote them, so they
  // never go through a dictionary.
  const TEXT = {
    ko: {
      nav: { office: "사무실", projects: "프로젝트", people: "직원", company: "회사", settings: "설정" },
      title: "프로젝트", newTask: "새 업무", hire: "직원 고용",
      all: "전체", addProject: "프로젝트 추가",
      headSub: (t, r) => "업무 " + t + "개 · 리뷰 대기 " + r + "건",
      columns: { backlog: "대기열", ready: "준비됨", working: "진행 중", review: "리뷰", done: "완료" },
      areas: { arch: "아키텍처", types: "타입 안정성", db: "데이터베이스", security: "보안", l10n: "로컬라이제이션", product: "기획", quality: "품질", process: "프로세스" },
      priority: { low: "낮음", normal: "보통", high: "높음" },
      unassigned: "담당자 없음", addTask: "업무 추가", empty: "없음",
      minutes: (a, b) => a + "/" + b + "분",
      reviewPending: "리뷰어를 기다려요", reviewing: (n) => n + " 검토 중", changesBy: (n) => n + subjectParticle(n) + " 변경을 요청했어요",
      nobodyKnows: (a) => a + " 아는 사람이 없어요",
      said: "리뷰 의견",
      actions: { assign: "담당자 지정", start: "시작", pickReviewer: "리뷰어 지정", approve: "승인", request: "변경 요청", rework: "다시 작업", teach: "이걸 기억시키기", open: "직원 화면에서 보기" },
      whySeat: (a) => a + " 기억이 있어요",
      noSeat: "이 분야를 아는 사람을 먼저 만들어야 해요",
    },
    en: {
      nav: { office: "Office", projects: "Projects", people: "People", company: "Company", settings: "Settings" },
      title: "Projects", newTask: "New task", hire: "Hire",
      all: "All", addProject: "Add a project",
      headSub: (t, r) => t + " tasks · " + r + " waiting on review",
      columns: { backlog: "Backlog", ready: "Ready", working: "In progress", review: "Review", done: "Done" },
      areas: { arch: "Architecture", types: "Type safety", db: "Database", security: "Security", l10n: "Localization", product: "Product", quality: "Quality", process: "Process" },
      priority: { low: "Low", normal: "Normal", high: "High" },
      unassigned: "Unassigned", addTask: "Add a task", empty: "Nothing here",
      minutes: (a, b) => a + "/" + b + " min",
      reviewPending: "Waiting for a reviewer", reviewing: (n) => n + " is reviewing", changesBy: (n) => n + " asked for changes",
      nobodyKnows: (a) => "Nobody knows " + a,
      said: "What the review said",
      actions: { assign: "Assign", start: "Start", pickReviewer: "Pick a reviewer", approve: "Approve", request: "Request changes", rework: "Back to work", teach: "Teach them this", open: "Open in People" },
      whySeat: (a) => "has " + a + " memories",
      noSeat: "Someone has to learn this area first",
    },
  };

  const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "ko";
  const t = () => TEXT[lang];
  const tx = (v) => (v && typeof v === "object" ? v[lang] : v);

  const dig = (o, k) => k.split(".").reduce((a, x) => a?.[x], o);
  const applyStatic = () => {
    for (const el of document.querySelectorAll("[data-t]")) {
      const v = dig(t(), el.dataset.t);
      if (typeof v === "string") el.textContent = v;
    }
    for (const el of document.querySelectorAll("[data-a]")) {
      const v = dig(t(), el.dataset.a);
      if (typeof v === "string") el.setAttribute("aria-label", v);
    }
  };
  applyStatic();

  // 을/를 and 이/가 depend on the last syllable of the word in front of them.
  const hasBatchim = (word) => {
    const c = word.charCodeAt(word.length - 1);
    return c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 !== 0;
  };
  const subjectParticle = (word) => (lang === "en" ? "" : hasBatchim(word) ? "이" : "가");
  const areaLabel = (a) => t().areas[a];
  const areaObject = (a) => (lang === "en" ? areaLabel(a) : areaLabel(a) + (hasBatchim(areaLabel(a)) ? "을" : "를"));

  /* ── who may review what ─────────────────────────────────────── */
  // A review seat is not a field on a person: it is what they have been
  // taught. Teaching someone a database memory is what makes them able to
  // review database work, and the people screen derives it the same way.
  const SEAT_AREAS = ["arch", "types", "db", "security", "l10n", "product", "quality"];
  const liveOf = (p) => p.memories.filter((m) => !m.archived);
  const areasOf = (p) => [...new Set(liveOf(p).map((m) => m.area))];
  const seatsOf = (p) => areasOf(p).filter((a) => SEAT_AREAS.includes(a));
  const reviewersFor = (area) => STAFF.filter((p) => seatsOf(p).includes(area));
  const byId = new Map(STAFF.map((p) => [p.id, p]));

  const avatar = (species, size) => {
    const c = document.createElement("canvas");
    c.width = c.height = size;
    const ctx = c.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    const sp = SPECIES.get(species);
    const scale = Math.max(1, Math.floor(size / 16));
    const pad = Math.floor((size - 16 * scale) / 2);
    paint(ctx, sp.sprite, scale, pad, pad, skin(sp));
    return c;
  };

  /* ── the board ───────────────────────────────────────────────── */

  let project = "all";
  const board = document.getElementById("board");
  const tabs = document.getElementById("tabs");
  const pop = document.getElementById("pop");
  let anchor = null;

  const shown = () => TASKS.filter((k) => project === "all" || k.project === project);

  const icon = {
    clock: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="5.6"/><path d="M8 5v3.2l2 1.3"/></svg>',
    eye: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1.6 8s2.4-4 6.4-4 6.4 4 6.4 4-2.4 4-6.4 4-6.4-4-6.4-4z"/><circle cx="8" cy="8" r="1.7"/></svg>',
    back: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6.5 3.5L3 7l3.5 3.5M3 7h6.5a3.5 3.5 0 0 1 0 7H7"/></svg>',
    none: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="5.6"/><path d="M5.6 8h4.8"/></svg>',
    plus: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg>',
  };

  function reviewLine(task) {
    const r = task.review;
    if (r.state === "changes") return { cls: "changes", svg: icon.back, text: t().changesBy(byId.get(r.by).name) };
    if (r.state === "reviewing") return { cls: "pending", svg: icon.eye, text: t().reviewing(byId.get(r.by).name) };
    return reviewersFor(task.area).length
      ? { cls: "pending", svg: icon.clock, text: t().reviewPending }
      : { cls: "stuck", svg: icon.none, text: t().nobodyKnows(areaObject(task.area)) };
  }

  function taskCard(task) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "work";
    b.dataset.id = task.id;
    b.setAttribute("aria-expanded", "false");

    const who = task.who ? byId.get(task.who) : null;
    const line = task.status === "review" ? reviewLine(task) : null;

    b.innerHTML = `
      <span class="w-top">
        <span class="w-title">${tx(task.title)}</span>
        <span class="prio ${task.priority}">${t().priority[task.priority]}</span>
      </span>
      <span class="w-meta">
        <span class="area-chip">${areaLabel(task.area)}</span>
        ${who ? `<span class="w-who"><span class="w-av"></span>${who.name}</span>` : `<span>${t().unassigned}</span>`}
      </span>
      ${task.status === "working" ? `<span class="meter"><i style="width:${Math.round((task.done / task.minutes) * 100)}%;background:var(--info)"></i></span>
        <span class="w-meta">${t().minutes(task.done, task.minutes)}</span>` : ""}
      ${line ? `<span class="r-line ${line.cls}">${line.svg}${line.text}</span>` : ""}`;

    if (who) b.querySelector(".w-av").appendChild(avatar(who.species, 20));
    b.addEventListener("click", (e) => open(task, b, e.detail === 0));
    return b;
  }

  function render() {
    tabs.innerHTML = "";
    const counts = (id) => TASKS.filter((k) => id === "all" || k.project === id).length;
    for (const p of [{ id: "all", name: { ko: t().all, en: t().all } }, ...PROJECTS]) {
      const b = document.createElement("button");
      b.className = "tab";
      b.setAttribute("aria-selected", String(p.id === project));
      b.innerHTML = `<span>${tx(p.name)}</span><span class="n">${counts(p.id)}</span>`;
      b.addEventListener("click", () => { project = p.id; close(); render(); });
      tabs.appendChild(b);
    }
    const add = document.createElement("button");
    add.className = "tab";
    add.style.color = "var(--faint)";
    add.setAttribute("aria-label", t().addProject);
    add.textContent = "+";
    tabs.appendChild(add);

    board.innerHTML = "";
    for (const status of COLUMNS) {
      const list = shown().filter((k) => k.status === status);
      const col = document.createElement("section");
      col.className = "col" + (status === "review" ? " review" : "");
      col.innerHTML = `<div class="col-hd"><h2>${t().columns[status]}</h2><span class="col-n">${list.length}</span><span class="col-line"></span></div>`;
      for (const task of list) col.appendChild(taskCard(task));
      if (!list.length) {
        const e = document.createElement("p");
        e.className = "col-empty";
        e.textContent = t().empty;
        col.appendChild(e);
      }
      if (status === "backlog") {
        const a = document.createElement("button");
        a.className = "col-add";
        a.innerHTML = icon.plus + `<span>${t().addTask}</span>`;
        col.appendChild(a);
      }
      board.appendChild(col);
    }

    const waiting = TASKS.filter((k) => k.status === "review").length;
    document.getElementById("headSub").textContent = t().headSub(TASKS.length, waiting);
  }

  /* ── one task, and what the player can do about it ───────────── */

  function menu(label, kind) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "mrow" + (kind ? " mrow-" + kind : "");
    b.textContent = label;
    b.addEventListener("click", close);
    return b;
  }

  function reviewerRow(p, area) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "mrow";
    b.innerHTML = `<span class="seat-row"><span class="w-av"></span><span>${p.name}</span><span class="seat-why">${t().whySeat(areaLabel(area))}</span></span>`;
    b.querySelector(".w-av").appendChild(avatar(p.species, 20));
    b.addEventListener("click", close);
    return b;
  }

  function open(task, el, viaKey) {
    if (anchor === el && pop.hasAttribute("data-open")) { close(); return; }

    document.querySelectorAll("[data-id]").forEach((n) => {
      n.setAttribute("aria-expanded", String(n.dataset.id === task.id));
    });

    const who = task.who ? byId.get(task.who) : null;
    pop.innerHTML = `
      <div class="p-hd">
        <span class="p-av"></span>
        <span style="flex:1;min-width:0">
          <span class="p-name">${tx(task.title)}</span>
          <span class="p-role">${areaLabel(task.area)} · ${t().priority[task.priority]}</span>
        </span>
      </div>
      <span class="p-rule"></span>`;

    if (who) pop.querySelector(".p-av").appendChild(avatar(who.species, 38));
    else pop.querySelector(".p-av").textContent = "—";

    const acts = document.createElement("div");
    acts.className = "p-acts";

    if (task.status === "backlog") acts.appendChild(menu(t().actions.assign));
    if (task.status === "ready") acts.appendChild(menu(t().actions.start, "key"));
    if (task.status === "working") acts.appendChild(menu(t().actions.pickReviewer));

    if (task.status === "review") {
      const r = task.review;
      if (r.state === "changes") {
        const said = document.createElement("span");
        said.className = "p-said";
        said.innerHTML = `<b>${t().said}</b>${tx(r.said)}`;
        pop.appendChild(said);
        acts.appendChild(menu(t().actions.rework, "key"));
        acts.appendChild(menu(t().actions.teach));
      } else if (r.state === "reviewing") {
        acts.appendChild(menu(t().actions.approve, "key"));
        acts.appendChild(menu(t().actions.request, "bad"));
      } else {
        const seats = reviewersFor(task.area);
        if (seats.length) for (const p of seats) acts.appendChild(reviewerRow(p, task.area));
        else {
          const why = document.createElement("span");
          why.className = "p-why";
          why.textContent = t().noSeat;
          pop.appendChild(why);
          const go = document.createElement("a");
          go.className = "mrow";
          go.href = "employees.html";
          go.textContent = t().actions.open;
          acts.appendChild(go);
        }
      }
    }

    if (acts.children.length) pop.appendChild(acts);

    anchor = el;
    pop.setAttribute("data-open", "");
    place(el);
    if (viaKey) (pop.querySelector(".mrow") ?? pop).focus?.();
  }

  function place(el) {
    const r = el.getBoundingClientRect();
    const w = pop.offsetWidth, h = pop.offsetHeight, gap = 8, edge = 12;
    let left = r.right + gap;
    if (left + w > innerWidth - edge) left = r.left - w - gap;
    if (left < edge) left = Math.min(Math.max(edge, r.left), innerWidth - w - edge);
    const top = Math.min(r.top, innerHeight - h - edge);
    pop.style.left = Math.round(left) + "px";
    pop.style.top = Math.round(Math.max(edge, top)) + "px";
  }

  function close() {
    pop.removeAttribute("data-open");
    document.querySelectorAll("[data-id]").forEach((n) => n.setAttribute("aria-expanded", "false"));
    anchor = null;
  }

  document.addEventListener("pointerdown", (e) => {
    // The anchor closes itself on the click that follows; closing here first
    // would clear it and let that click reopen the popover.
    if (!anchor || pop.contains(e.target) || anchor.contains(e.target)) return;
    if (!e.target.closest("[data-id]")) close();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || !anchor) return;
    const back = anchor;
    close();
    back.focus({ preventScroll: true });
  });

  window.addEventListener("resize", () => { if (anchor) place(anchor); });

  /* ── the roster in the sidebar, as on the other screens ──────── */
  const members = document.getElementById("members");
  for (const p of STAFF) {
    const row = document.createElement("div");
    row.className = "ws-hd";
    row.style.cssText = "padding:5px 10px";
    row.innerHTML = `<span style="display:flex;align-items:center;gap:8px;min-width:0"><span class="w-av"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name}</span></span>`;
    row.querySelector(".w-av").appendChild(avatar(p.species, 20));
    members.appendChild(row);
  }

  render();
</script>
