<style>
  /* ═══ main ═══ */

  .sec-hd { display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px; }

  .sec-hd h2 { margin: 0; font-size: 18px; font-weight: 600; }

  .sec-hd .more { margin-left: auto; font-size: 15px; color: var(--muted); background: none; border: none; cursor: pointer; padding: 0; }

  .sec-hd .more:hover { color: var(--ink); }

  /* ═══ overview ═══ */

  .co-name { display: flex; align-items: center; gap: 6px; }

  .co-name b { font-size: 18px; font-weight: 600; }

  .co-name .input { max-width: 320px; }

  .co-since { display: block; font-size: 15px; color: var(--muted); margin-top: 2px; }

  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }

  @media (max-width: 1160px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .tile { border: 1px solid var(--line); border-radius: var(--r-card); padding: 13px 15px; }

  .tile .k { margin-bottom: 4px; }

  .tile-n { display: block; font-size: 26px; font-weight: 600; line-height: 1.25; font-variant-numeric: tabular-nums; }

  .tile-d { display: block; font-size: 14px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }

  .tile-d.up { color: var(--ok-ink); }

  .crew { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }

  .mate {
    display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px 11px;
    border: 1px solid var(--line); border-radius: var(--r-card); color: inherit; text-decoration: none;
  }

  .mate:hover { border-color: var(--line-2); box-shadow: 0 2px 8px rgb(20 20 25 / .06); }

  .mate-av { width: 44px; height: 44px; border-radius: 12px; background: var(--subtle); display: grid; place-items: center; }

  .mate-n { font-size: 16px; font-weight: 600; line-height: 1.3; }

  .mate-d { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .proj { border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; }

  .proj-row {
    display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; align-items: center; gap: 16px;
    padding: 11px 15px; border-bottom: 1px solid var(--line);
  }

  .proj-row:last-child { border-bottom: none; }

  .proj-n { font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .proj-m { font-size: 15px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .faces { display: flex; }

  .faces span { width: 24px; height: 24px; border-radius: 7px; background: var(--subtle); display: grid; place-items: center; border: 2px solid var(--surface); margin-left: -6px; }

  .faces span:first-child { margin-left: 0; }

  .proj-foot { font-size: 15px; color: var(--muted); margin-top: 8px; }

  .proj-foot a { color: var(--ink); }

  /* ═══ history ═══ */

  .month { margin-bottom: 18px; }

  .month:last-child { margin-bottom: 0; }

  .month h3 { margin: 0 0 6px; font-size: 15px; font-weight: 600; color: var(--muted); }

  .mile { display: grid; grid-template-columns: 58px 28px minmax(0, 1fr); align-items: center; gap: 10px; padding: 7px 0; }

  .mile-date { font-size: 15px; color: var(--faint); font-variant-numeric: tabular-nums; }

  .mile-ic { width: 28px; height: 28px; border-radius: 8px; background: var(--subtle); display: grid; place-items: center; color: var(--muted); }

  .mile-ic svg { width: 14px; height: 14px; }

  .mile-tx { font-size: 16px; line-height: 1.5; }

  .mile-tx span { color: var(--muted); }

  /* ═══ areas and roles ═══ */

  .flow { display: flex; flex-direction: column; gap: 22px; }

  .flow:empty { display: none; }

  .area-row {
    display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr) auto 28px;
    align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line);
  }

  .area-row:last-of-type { border-bottom: none; }

  .area-name { font-size: 16px; font-weight: 600; }

  .knows { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }

  .knows .who { display: flex; align-items: center; gap: 5px; font-size: 15px; color: var(--muted); }

  .knows .who span { width: 20px; height: 20px; border-radius: 6px; background: var(--subtle); display: grid; place-items: center; overflow: hidden; }

  .teach-link { font: inherit; font-size: 15px; color: var(--ink); font-weight: 600; background: none; border: none; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

  .teach-link:hover { color: var(--brand-ink); }

  .area-form { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }

  .area-form .input { flex: 1 1 200px; }

  .area-form .hint { flex-basis: 100%; margin: 0; color: var(--bad-ink); }

  .area-n { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .none { font-size: 15px; color: var(--faint); }
</style>

<script>
  /* ── i18n ────────────────────────────────────────────────────── */
  // The company's name, nicknames and project names are absent: the user wrote them.
  const TEXT = {
    ko: {
      ...WORDS.ko,
      title: "회사",
      headSub: (days, n) => "창업 " + days + "일째 · 직원 " + n + "명",
      tabs: { overview: "개요", history: "연혁", lists: "분야·역할", memory: "회사 기억" },
      rename: "이름 바꾸기", save: "저장", cancel: "취소",
      since: (date, days) => date + " 창업 · " + days + "일째",
      tiles: {

      ongoing: (n) => "진행 중인 프로젝트 " + n + "개 · ", toBoard: "프로젝트 목록으로",
      recentTitle: "최근 이정표", allHistory: "연혁 전체 보기",
      miles: {
        founded: () => "회사를 세웠어요",
        joined: (m) => m.nth === 1 ? "첫 직원 " + withParticle(m.who.name, "이", "가") + " 합류했어요" : withParticle(m.who.name, "이", "가") + " 합류했어요<span> · " + m.nth + "번째 직원</span>",

        firstTask: (m) => withParticle(m.who.name, "이", "가") + " 첫 업무를 마쳤어요<span> · " + m.task.ko + "</span>",
        tasks: (m) => "완료한 업무가 " + m.n + "건을 넘었어요",
        firstReview: (m) => withParticle(m.who.name, "이", "가") + " 첫 검토를 마쳤어요",
        memories: (m) => "가르친 기억이 " + m.n + "개가 됐어요",
        project: (m) => "‘" + m.name + "’ 프로젝트를 마쳤어요<span> · " + m.days + "일</span>",
      },
      areasTitle: "전문 분야", areasSub: "우리 회사가 다루는 분야예요. 직원에게 알려준 기억은 모두 이 중 하나에 속해요.",
      teachLink: "알려주기", addArea: "분야 추가",
      memCount: (n) => "기억 " + n + "개",
      nobodyKnowsArea: (list) => list.join(" · ") + (hasBatchim(list.at(-1)) ? "을" : "를") + " 아는 직원이 없어요",
      nobodyKnowsWhy: "이 분야 업무는 참고할 기억 없이 시작하고, 검토를 맡을 사람도 없어요. 누구에게든 한 줄 알려주면 시작돼요.",
      pickSomeone: "알려줄 직원 고르기",
      areaMenu: "분야 메뉴", areaName: "분야 이름", areaPlaceholder: "예: 게임 서버", nameTaken: "이미 있는 이름이에요.",
      removeArea: "지우기", removeWhy: "지우면 되돌릴 수 없어요.", keep: "그대로 두기",

    en: {

      title: "Company",

      rename: "Rename", save: "Save", cancel: "Cancel",
      since: (date, days) => "Founded " + date + " · day " + days,
      tiles: {
        people: "People", done: "Tasks done", reviews: "Reviews", memories: "Memories taught",
        peopleN: (n) => String(n), teamsN: (n) => n + " teams",
        count: (n) => String(n), memN: (n) => String(n), week: (n) => "+" + n + " this week",

      crewTitle: "The people here", daysWith: (n) => "day " + n,

      memCount: (n) => n + (n === 1 ? " memory" : " memories"),
      nobodyKnowsArea: (list) => "Nobody knows " + list.join(" · "),
      nobodyKnowsWhy: "Work here starts with nothing to draw on, and nobody can review it. Teach anyone one line to start.",
      pickSomeone: "Pick someone to teach",
      areaMenu: "Area actions", areaName: "Area name", areaPlaceholder: "e.g. Game server", nameTaken: "That name is taken.",
      removeArea: "Delete", removeWhy: "This cannot be undone.", keep: "Keep it",
      moveTitle: (area) => "Delete ‘" + area + "’",
      moveSub: (n) => n + " memories are in this area. Choose where they go first.",
      moveTo: "Move them to", moveAndRemove: "Move and delete",
      rolesTitle: "Roles", rolesSub: "The titles you hire for. Everyone has one.",
      addRole: "Add a role", roleMenu: "Role actions", roleName: "Role name", rolePlaceholder: "e.g. Game Server Engineer",
      peopleCount: (n) => (n === 1 ? "1 person" : n + " people"), nobodyYet: "Nobody yet",
      moveRoleTitle: (r) => "Delete ‘" + r + "’",
      moveRoleSub: (n) => (n === 1 ? "1 person has" : n + " people have") + " this role. Choose what they become first.",
      moveRoleTo: "Change them to", changeAndRemove: "Change and delete",
      companyTitle: "Company memory", companySub: "Everyone knows these.", tellCompany: "Tell the whole company",
      fromWhere: (x) => "from " + x, toldDirectly: "Told directly", usedTimes: (n) => "used " + n + "×", justTaught: "Just taught",
    },
  };

  const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "ko";
  const t = () => TEXT[lang];
  const tx = (v) => (v && typeof v === "object" ? v[lang] : v);
  const dig = (o, k) => k.split(".").reduce((a, x) => a?.[x], o);
  for (const el of document.querySelectorAll("[data-t]")) {
    const v = dig(t(), el.dataset.t);
    if (typeof v === "string") el.textContent = v;
  }

  /* ── data ────────────────────────────────────────────────────── */
  const TODAY = new Date(2026, 8, 26);
  const day = (s) => { const [y, m, d] = s.split(".").map((x) => parseInt(x, 10)); return new Date(y, m - 1, d); };
  const daysSince = (d) => Math.round((TODAY - d) / 86400000) + 1;
  const fmtDay = new Intl.DateTimeFormat(lang === "en" ? "en-US" : "ko-KR", lang === "en" ? { month: "short", day: "numeric" } : { month: "numeric", day: "numeric" });
  const fmtFull = new Intl.DateTimeFormat(lang === "en" ? "en-US" : "ko-KR", { year: "numeric", month: lang === "en" ? "short" : "numeric", day: "numeric" });
  const fmtMonth = new Intl.DateTimeFormat(lang === "en" ? "en-US" : "ko-KR", { year: "numeric", month: "long" });

  const people = STAFF;
  const who = (id) => people.find((p) => p.id === id);
  let companyName = "My Tiny Office";
  const FOUNDED = day("2026. 1. 12.");

  // The company owns this list; an area gets a label once the user names it.
  const AREAS = Object.keys(WORDS.ko.areas).map((name) => ({ name }));

  const companyMemories = [
    { text: { ko: "커밋 메시지는 conventional prefix로 시작해요.", en: "Commit messages start with a conventional prefix." }, from: null, used: 34 },
    { text: { ko: "사용자에게 보이는 글은 i18n을 거쳐요. 사용자가 입력한 이름은 예외예요.", en: "User-facing text goes through i18n. Names the user typed do not." }, from: null, used: 28 },
    { text: { ko: "문서와 코드가 어긋나면 코드가 아니라 문서를 고쳐요.", en: "When the docs and the code disagree, fix the docs." }, from: { ko: "스타일 가이드가 낡았던 주", en: "the week the style guide went stale" }, used: 12 },
  ];

  const finished = [
    { name: "로그인 개편", from: "2026. 4. 15.", to: "2026. 5. 29.", tasks: 14, crew: ["p2", "p5", "p3"] },
    { name: "배포 파이프라인", from: "2026. 2. 2.", to: "2026. 3. 20.", tasks: 9, crew: ["p5", "p1"] },
    { name: "첫 API", from: "2026. 1. 19.", to: "2026. 2. 27.", tasks: 11, crew: ["p5", "p3"] },
  ];
  const ONGOING = 2;

  // A milestone keeps its kind and its facts, never a sentence: the words are
  // the dictionary's, and a user-written name is whatever it is now.
  const MILESTONES = [
    { on: "2026. 1. 12.", kind: "founded" },
    { on: "2026. 1. 12.", kind: "joined", who: "p5", nth: 1 },
    { on: "2026. 1. 12.", kind: "team", team: "frontend" },
    { on: "2026. 1. 23.", kind: "firstTask", who: "p5", task: { ko: "개발 서버 띄우기", en: "Stand up the dev server" } },
    { on: "2026. 2. 20.", kind: "joined", who: "p3", nth: 2 },
    { on: "2026. 2. 20.", kind: "team", team: "planning" },
    { on: "2026. 2. 27.", kind: "project", name: "첫 API", days: 40 },
    { on: "2026. 3. 2.", kind: "joined", who: "p1", nth: 3 },
    { on: "2026. 3. 2.", kind: "team", team: "backend" },
    { on: "2026. 3. 11.", kind: "tasks", n: 10 },
    { on: "2026. 3. 16.", kind: "firstReview", who: "p3" },
    { on: "2026. 3. 20.", kind: "project", name: "배포 파이프라인", days: 47 },
    { on: "2026. 4. 15.", kind: "joined", who: "p2", nth: 4 },
    { on: "2026. 4. 28.", kind: "memories", n: 10 },
    { on: "2026. 5. 8.", kind: "joined", who: "p4", nth: 5 },
    { on: "2026. 5. 29.", kind: "project", name: "로그인 개편", days: 45 },
    { on: "2026. 6. 12.", kind: "tasks", n: 50 },
    { on: "2026. 9. 20.", kind: "tasks", n: 100 },
  ];

  const ICON = {
    plus: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg>',
    alert: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.2l6 11H2z"/><path d="M8 6.6v3M8 11.4v.1"/></svg>',
    pen: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M10.6 2.8l2.6 2.6L6 12.6H3.4V10z"/></svg>',
    task: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="2.6" y="2.6" width="10.8" height="10.8" rx="1.6"/><path d="M5.4 8.2l1.8 1.8 3.4-3.6"/></svg>',
    hand: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3.5 4.5h9M3.5 8h9M3.5 11.5h5"/></svg>',
    flag: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M4 14V2.6h7.6l-1.6 2.7 1.6 2.7H4"/></svg>',
    person: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="5.4" r="2.5"/><path d="M3.2 13.6c0-2.7 2.2-4.8 4.8-4.8s4.8 2.1 4.8 4.8"/></svg>',
    team: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="5.5" y="1.8" width="5" height="3.6" rx=".8"/><rect x="1.6" y="10.6" width="5" height="3.6" rx=".8"/><rect x="9.4" y="10.6" width="5" height="3.6" rx=".8"/><path d="M8 5.4v2.6M4.1 10.6V8h7.8v2.6"/></svg>',
    eye: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1.8 8S4 3.8 8 3.8 14.2 8 14.2 8 12 12.2 8 12.2 1.8 8 1.8 8z"/><circle cx="8" cy="8" r="1.9"/></svg>',
    more: '<svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3.6" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12.4" cy="8" r="1.3"/></svg>',
    trash: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.8 4.4h10.4M6.2 4.4V2.8h3.6v1.6M4.2 4.4l.7 8.8h6.2l.7-8.8"/></svg>',
    book: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 2.6h7.4L13 5.2v8.2H3z"/><path d="M5.4 6.4h5.2M5.4 9h5.2M5.4 11.2h3"/></svg>',
  };
  const MILE_ICON = { founded: "flag", joined: "person", team: "team", firstTask: "task", tasks: "task", firstReview: "eye", memories: "book", project: "flag" };

  const areasOf = (p) => [...new Set(p.memories.map((m) => m.area))];
  const sum = (f) => people.reduce((n, p) => n + f(p), 0);

  /* ── sidebar ─────────────────────────────────────────────────── */
  const suffix = lang === "en" ? "?lang=en" : "";
  mountRoster(document.getElementById("members"), (p) => {
    location.href = "employees.html" + suffix + "#" + p.id;
  });

  /* ── header ──────────────────────────────────────────────────── */
  const age = daysSince(FOUNDED);
  document.getElementById("headSub").textContent = t().headSub(age, people.length);
  document.getElementById("nHistory").textContent = MILESTONES.length;

  /* ── overview ────────────────────────────────────────────────── */
  const coCard = document.getElementById("coCard");

  function renderName(editing) {
    coCard.innerHTML = editing
      ? `<form class="co-name" id="nameForm">
           <input class="input" id="nameInput" maxlength="20" autocomplete="off" />
           <button class="btn btn-primary btn-sm" type="submit">${t().save}</button>
           <button class="btn btn-secondary btn-sm" type="button" data-cancel>${t().cancel}</button>
         </form>`
      : `<span class="co-name"><b></b><button class="ibtn ibtn-sm" type="button" data-rename aria-label="${t().rename}">${ICON.pen}</button></span>`;
    coCard.insertAdjacentHTML("beforeend", `<span class="co-since">${t().since(fmtFull.format(FOUNDED), age)}</span>`);

    if (!editing) {
      coCard.querySelector("b").textContent = companyName;
      coCard.querySelector("[data-rename]").addEventListener("click", () => renderName(true));
      return;
    }
    const input = coCard.querySelector("#nameInput");
    input.value = companyName;
    input.focus();
    input.select();
    coCard.querySelector("#nameForm").addEventListener("submit", (e) => {
      e.preventDefault();
      if (input.value.trim()) companyName = input.value.trim();
      document.querySelector(".side-name").textContent = companyName;
      renderName(false);
    });
    coCard.querySelector("[data-cancel]").addEventListener("click", () => renderName(false));
  }
  renderName(false);

  // a team counts once someone is in it, as its office room does
  const teams = new Set(people.map((p) => p.team).filter(Boolean)).size;
  const taught = sum((p) => p.memories.length) + companyMemories.length;
  const STATS = [
    { k: t().tiles.people, n: t().tiles.peopleN(people.length), d: t().tiles.teamsN(teams) },
    { k: t().tiles.done, n: t().tiles.count(sum((p) => p.done)), d: t().tiles.week(12), up: true },
    { k: t().tiles.reviews, n: t().tiles.count(sum((p) => p.reviews)), d: t().tiles.week(7), up: true },
    { k: t().tiles.memories, n: t().tiles.memN(taught), d: t().tiles.week(3), up: true },
  ];
  document.getElementById("tiles").innerHTML = STATS.map(
    (x) => `<div class="tile"><span class="k">${x.k}</span><span class="tile-n">${x.n}</span><span class="tile-d${x.up ? " up" : ""}">${x.d}</span></div>`,
  ).join("");

  const crew = document.getElementById("crew");
  for (const p of [...people].sort((a, b) => day(a.joined) - day(b.joined))) {
    const a = document.createElement("a");
    a.className = "mate";
    a.href = "employees.html" + suffix + "#" + p.id;
    a.innerHTML = `<span class="mate-av"></span><span class="mate-n"></span><span class="mate-d">${t().daysWith(daysSince(day(p.joined)))}</span>`;
    a.querySelector(".mate-n").textContent = p.name;
    a.querySelector(".mate-av").appendChild(spriteCanvas(p.species, 44));
    crew.appendChild(a);
  }

  const finishedBox = document.getElementById("finished");
  for (const f of finished) {
    const row = document.createElement("div");
    row.className = "proj-row";
    const from = day(f.from), to = day(f.to);
    row.innerHTML = `
      <span class="proj-n"></span>
      <span class="proj-m">${fmtDay.format(from)} – ${fmtDay.format(to)} · ${t().span(Math.round((to - from) / 86400000) + 1)}</span>
      <span class="proj-m">${t().tasksN(f.tasks)}</span>
      <span class="faces"></span>`;
    row.querySelector(".proj-n").textContent = f.name;
    const faces = row.querySelector(".faces");
    for (const id of f.crew) {
      const s = document.createElement("span");
      s.appendChild(spriteCanvas(who(id).species, 20));
      faces.appendChild(s);
    }
    finishedBox.appendChild(row);
  }
  document.getElementById("ongoing").innerHTML = `${t().ongoing(ONGOING)}<a href="projects.html${suffix}">${t().toBoard}</a>`;

  /* ── milestones ──────────────────────────────────────────────── */
  const mileRow = (m) => {
    const facts = { ...m, who: m.who ? who(m.who) : null };
    return `<div class="mile">
      <span class="mile-date">${fmtDay.format(day(m.on))}</span>
      <span class="mile-ic">${ICON[MILE_ICON[m.kind]]}</span>
      <span class="mile-tx">${t().miles[m.kind](facts)}</span>
    </div>`;
  };
  const newest = [...MILESTONES].reverse();
  document.getElementById("recent").innerHTML = newest.slice(0, 3).map(mileRow).join("");

  const byMonth = new Map();
  for (const m of newest) {
    const key = fmtMonth.format(day(m.on));
    if (!byMonth.has(key)) byMonth.set(key, []);
    byMonth.get(key).push(m);
  }
  document.getElementById("history").innerHTML = [...byMonth]
    .map(([month, list]) => `<div class="month"><h3>${month}</h3>${list.map(mileRow).join("")}</div>`)
    .join("");

  /* ── areas and roles ───────────────────────────────────────────────────── */
  // Both lists the company owns are edited the same way: add at the foot, and a
  // row's ⋯ renames it or deletes it, asking where its contents go first.
  function listEditor(cfg) {
    let editing = null;
    const form = () => `<form class="area-form" data-form>
        <input class="input" maxlength="${cfg.max}" autocomplete="off" placeholder="${cfg.placeholder}" aria-label="${cfg.nameLabel}" />
        <button class="btn btn-primary btn-md" type="submit">${t().save}</button>
        <button class="btn btn-secondary btn-md" type="button" data-cancel>${t().cancel}</button>
        <p class="hint" data-taken hidden>${t().nameTaken}</p>
      </form>`;

    function render() {
      const table = cfg.table;
      table.replaceChildren();
      for (const x of cfg.items) {
        if (editing === x) {
          table.insertAdjacentHTML("beforeend", form());
          continue;
        }
        const who = cfg.members(x);
        const row = document.createElement("div");
        row.className = "area-row";
        row.innerHTML = `
          <span class="area-name"></span>
          <span class="knows">${who.length ? who.map((p) => `<span class="who"><span></span>${p.name}</span>`).join("") : cfg.empty(x)}</span>
          <span class="area-n">${cfg.count(x)}</span>
          <button class="ibtn ibtn-sm" type="button" data-menu aria-label="${cfg.menuLabel}" aria-expanded="false">${ICON.more}</button>`;
        row.querySelector(".area-name").textContent = cfg.label(x);
        row.querySelectorAll(".who > span").forEach((box, i) => box.append(spriteCanvas(who[i].species, 20)));
        row.querySelector("[data-menu]").addEventListener("click", (e) => menu(e.currentTarget, x));
        table.append(row);
      }
      if (editing === "new") table.insertAdjacentHTML("beforeend", form());
      else {
        table.insertAdjacentHTML("beforeend", `<button class="mem-add" type="button" data-add>${ICON.plus}${cfg.addLabel}</button>`);
        table.querySelector("[data-add]").addEventListener("click", () => { editing = "new"; render(); });
      }
      wire();
      cfg.after?.();
    }

    function wire() {
      const f = cfg.table.querySelector("[data-form]");
      if (!f) return;
      const x = editing === "new" ? null : editing;
      const input = f.querySelector("input");
      input.value = x ? cfg.label(x) : "";
      input.focus();
      input.select();
      f.addEventListener("submit", (e) => {
        e.preventDefault();
        const label = input.value.trim();
        if (!label) return;
        const taken = cfg.items.some((y) => y !== x && cfg.label(y) === label);
        f.querySelector("[data-taken]").hidden = !taken;
        if (taken) return;
        if (x && label !== cfg.label(x)) cfg.rename(x, label);
        if (!x) cfg.create(label);
        editing = null;
        render();
      });
      f.querySelector("[data-cancel]").addEventListener("click", () => { editing = null; render(); });
    }

    function menu(btn, x) {
      const n = cfg.holds(x);
      const others = cfg.items.filter((y) => y !== x);
      const items = [{ label: t().rename, icon: ICON.pen, run: () => { editing = x; render(); } }];
      // A list everyone needs one of keeps its last row.
      if (others.length || !cfg.keepLast) {
        items.push(
          n
            ? {
                label: t().removeArea, icon: ICON.trash, bad: true,
                run: () => openMoveDialog({
                  title: cfg.moveTitle(cfg.label(x)),
                  sub: cfg.moveSub(n),
                  label: cfg.moveLabel,
                  options: others.map((y) => ({ value: cfg.label(y), label: cfg.label(y) })),
                  cancel: t().cancel,
                  confirm: cfg.moveConfirm,
                  onConfirm: (into) => { cfg.remove(x, others.find((y) => cfg.label(y) === into)); render(); },
                }),
              }
            : { label: t().removeArea, icon: ICON.trash, bad: true, confirm: t().removeWhy, run: () => { cfg.remove(x, null); render(); } },
        );
      }
      openRowMenu(btn, items, { keep: t().keep });
    }

    return { render };
  }

  // A default area speaks both languages; one the user named or renamed is
  // their text, shown as written in either.
  const areaLabel = (a) => a.label ?? t().areas[a.name];
  const teachAreas = () => AREAS.map((a) => ({ key: a.name, label: areaLabel(a) }));
  const knowersOf = (name) => people.filter((p) => areasOf(p).includes(name));
  const countOf = (name) => sum((p) => p.memories.filter((m) => m.area === name).length);

  function renderNotices() {
    const uncovered = AREAS.filter((a) => !knowersOf(a.name).length);
    const box = document.getElementById("ruleNotices");
    box.innerHTML = uncovered.length
      ? `<div class="notice notice-warn">
          <span class="n-ic">${ICON.alert}</span>
          <span class="n-tx"><b></b><span>${t().nobodyKnowsWhy}</span></span>
          <span class="n-acts"><button class="btn btn-secondary btn-sm" type="button" data-pick="${uncovered[0].name}">${t().pickSomeone}</button></span>
        </div>`
      : "";
    if (uncovered.length) box.querySelector("b").textContent = t().nobodyKnowsArea(uncovered.map(areaLabel));
  }

  const areas = listEditor({
    table: document.getElementById("areaTable"),
    items: AREAS,
    max: 20,
    label: areaLabel,
    rename: (a, label) => { a.label = label; },
    create: (label) => AREAS.push({ name: "custom-" + Date.now(), label }),
    members: (a) => knowersOf(a.name),
    count: (a) => t().memCount(countOf(a.name)),
    empty: (a) => `<span class="none">${t().nobodyYet} · <button class="teach-link" type="button" data-pick="${a.name}">${t().teachLink}</button></span>`,
    holds: (a) => countOf(a.name),
    remove: (a, into) => {
      for (const p of people) for (const m of p.memories) if (m.area === a.name) m.area = into?.name ?? null;
      AREAS.splice(AREAS.indexOf(a), 1);
    },
    after: renderNotices,
    addLabel: t().addArea, menuLabel: t().areaMenu, nameLabel: t().areaName, placeholder: t().areaPlaceholder,
    moveTitle: t().moveTitle, moveSub: t().moveSub, moveLabel: t().moveTo, moveConfirm: t().moveAndRemove,
  });

  // A role is a job title, written the same in either language.
  const ROLE_LIST = ROLES.map((label) => ({ label }));
  const inRole = (r) => people.filter((p) => p.role === r.label);
  const roles = listEditor({
    table: document.getElementById("roleTable"),
    items: ROLE_LIST,
    max: 32,
    keepLast: true,
    label: (r) => r.label,
    rename: (r, label) => { for (const p of inRole(r)) p.role = label; r.label = label; },
    create: (label) => ROLE_LIST.push({ label }),
    members: inRole,
    count: (r) => t().peopleCount(inRole(r).length),
    empty: () => `<span class="none">${t().nobodyYet}</span>`,
    holds: (r) => inRole(r).length,
    remove: (r, into) => {
      for (const p of inRole(r)) p.role = into.label;
      ROLE_LIST.splice(ROLE_LIST.indexOf(r), 1);
    },
    addLabel: t().addRole, menuLabel: t().roleMenu, nameLabel: t().roleName, placeholder: t().rolePlaceholder,
    moveTitle: t().moveRoleTitle, moveSub: t().moveRoleSub, moveLabel: t().moveRoleTo, moveConfirm: t().changeAndRemove,
  });

  const memCard = (m) => `<div class="mem${m.flash ? " is-new" : ""}">
      <span class="mem-t">${tx(m.text)}</span>
      <span class="mem-m">
        ${m.from ? ICON.task : ICON.hand}
        <span class="src">${m.from ? t().fromWhere(tx(m.from)) : t().toldDirectly}</span>
        <span class="used${m.used >= 10 ? " hot" : ""}">${m.fresh ? t().justTaught : t().usedTimes(m.used)}</span>
      </span>
    </div>`;

  function renderCompanyMem() {
    document.getElementById("companyMem").innerHTML =
      companyMemories.map(memCard).join("") + `<button class="mem-add" type="button" data-tellall>${ICON.plus}${t().tellCompany}</button>`;
    for (const m of companyMemories) m.flash = false;
    document.getElementById("nCompanyMem").textContent = companyMemories.length;
  }

  areas.render();
  roles.render();
  renderCompanyMem();

  const fresh = (memory) => ({ ...memory, used: 0, fresh: true, flash: true });
  document.getElementById("view-lists").addEventListener("click", (e) => {
    const pick = e.target.closest("[data-pick]");
    if (pick) {
      openTeach({
        to: null,
        area: pick.dataset.pick,
        areas: teachAreas(),
        onSave: ({ to, memory }) => {
          to.memories.unshift(fresh(memory));
          areas.render();
        },
      });
    }
  });
  document.getElementById("view-memory").addEventListener("click", (e) => {
    if (e.target.closest("[data-tellall]")) {
      openTeach({
        to: "company",
        areas: teachAreas(),
        carried: companyMemories.reduce((n, m) => n + tx(m.text).length, 0),
        onSave: ({ memory }) => {
          companyMemories.unshift(fresh(memory));
          renderCompanyMem();
        },
      });
    }
  });

  /* ── tabs ────────────────────────────────────────────────────── */
  // Each tab has an address, so teaching elsewhere can send the user to 분야·역할.
  const VIEWS = ["overview", "history", "lists", "memory"];
  function show(view) {
    for (const tab of document.querySelectorAll(".tab")) tab.setAttribute("aria-selected", String(tab.dataset.view === view));
    for (const v of document.querySelectorAll(".js-view")) v.toggleAttribute("hidden", v.id !== "view-" + view);
  }
  const fromHash = () => show(VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "overview");
  const go = (view) => { location.hash = view === "overview" ? "" : view; };
  document.getElementById("tabs").addEventListener("click", (e) => {
    const tab = e.target.closest(".tab");
    if (tab) go(tab.dataset.view);
  });
  document.querySelector("[data-go]").addEventListener("click", (e) => go(e.currentTarget.dataset.go));
  window.addEventListener("hashchange", fromHash);
  fromHash();
</script>
