<meta charset="utf-8" />
<title>Tiny Office · Plaza</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
/>
<link rel="stylesheet" href="system.css" />
<script src="system.js"></script>
<style>
  /* ═══ the plaza ═══ */

  .room { display: block; border-radius: 6px; image-rendering: pixelated; }

  .desk { position: absolute; padding: 0; background: none; border: 2px solid transparent; border-radius: 7px; cursor: pointer; }

  .desk:hover { border-color: rgb(255 255 255 / .9); }

  .desk[aria-expanded="true"] { border-color: #fff; background: rgb(255 255 255 / .18); }

  .plaza-scene .tag { max-width: 136px; overflow: hidden; text-overflow: ellipsis; padding: 1px 7px; border-radius: 6px; background: rgb(20 20 25 / .5); text-shadow: none; }

  .plaza-quiet { position: absolute; left: 50%; top: 58%; transform: translate(-50%, -50%); margin: 0; padding: 6px 12px; border-radius: 8px; background: rgb(255 255 255 / .92); font-size: 15px; color: var(--muted); white-space: nowrap; }

  .p-av canvas { border-radius: 9px; }

  .p-quote { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 15px; line-height: 1.45; margin: 2px 0 6px; }

  .p-kv { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); margin-top: 3px; }

  .p-kv b { color: var(--ink); font-weight: 600; }

  .board-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

  .board-tools .input { flex: 1; min-width: 220px; }

  .board-row { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }

  .board-row:last-child { border-bottom: none; }

  .board-row canvas { border-radius: 9px; }

  .board-tx { min-width: 0; display: flex; flex-direction: column; gap: 2px; }

  .board-tx b { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .board-tx span { font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .board-acts { display: flex; align-items: center; gap: 6px; }

  .board-note { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 14px; color: var(--muted); }

  @media (max-width: 960px) {
    .app { grid-template-columns: 1fr; }
    .side { border-bottom: 1px solid var(--line-2); }
  }
</style>

<div class="app">
  <!-- ═══ sidebar ═══ -->
  <nav class="side">
    <div class="side-head">
      <a class="side-top" href="company.html">
        <span class="logo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M2 6.5L8 2l6 4.5V13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/></svg></span>
        <span class="side-id">
          <span class="side-name">My Tiny Office</span>
          <span class="side-ver">v0.1.0</span>
        </span>
      </a>
      <button class="ibtn ibtn-sm side-switch" type="button" aria-haspopup="menu" aria-expanded="false"></button>
    </div>

    <div class="nav">
      <a href="office.html"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="2.5" y="3.5" width="13" height="11.5" rx="1.5"/><path d="M6 7.5h1.8M10.2 7.5H12M6 11h1.8M10.2 11H12"/></svg><span data-t="nav.office">사무실</span></a>
      <a href="projects.html"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M2.5 5.5h4.5L8.5 8h7v6.5h-13z"/></svg><span data-t="nav.projects">프로젝트</span></a>
      <a href="employees.html"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="6" r="2.8"/><path d="M3.5 15c0-3 2.5-5.5 5.5-5.5s5.5 2.5 5.5 5.5"/></svg><span data-t="nav.people">직원</span></a>
      <a href="company.html"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3.5 14.5v-3.5M9 14.5v-7M14.5 14.5v-10.5"/></svg><span data-t="nav.company">회사</span></a>
    </div>

    <div class="rule"></div>
    <div id="members"></div>

    <div class="side-foot">
      <div class="rule" style="margin:0 4px 10px"></div>
      <span class="side-cap" data-t="nav.outside">회사 밖</span>
      <div class="nav">
        <a href="#" aria-current="page"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 15.5h13"/><path d="M5.5 15.5v-5"/><circle cx="5.5" cy="7.3" r="2.6"/><path d="M9.5 12.5h5.5M10.5 12.5v3M14 12.5v3M9.5 10.6h5.5"/></svg><span data-t="nav.plaza">광장</span></a>
      </div>
      <div class="rule" style="margin:10px 4px"></div>
      <div class="nav">
        <a href="settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span data-t="nav.settings">설정</span></a>
      </div>
    </div>
  </nav>

  <!-- ═══ main ═══ -->
  <div class="main">
    <div class="head">
      <div class="head-row">
        <span>
          <h1 data-t="title">광장</h1>
          <span class="sub" id="headSub"></span>
        </span>
        <div class="head-right">
          <span class="ghost-note" id="headCount"></span>
        </div>
      </div>
    </div>

    <div class="body">
      <div class="notice notice-ok" id="arrived" hidden>
        <span class="n-ic"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 8.4l3 3 6.2-6.6"/></svg></span>
        <span class="n-tx"><b id="arrivedTitle"></b><span id="arrivedBody"></span></span>
        <span class="n-acts"><a class="btn btn-secondary btn-sm" id="arrivedGo" href="employees.html"></a></span>
      </div>
      <div class="stage">
        <div class="room-wrap plaza-scene">
          <canvas class="room" aria-hidden="true" id="plazaCanvas"></canvas>
          <div class="overlay" id="plazaOverlay"></div>
          <p class="plaza-quiet" id="plazaQuiet" hidden></p>
        </div>
      </div>
      <div class="panel">
        <div class="panel-hd"><h2 data-t="listTitle">구직자 명단</h2><p data-t="listSub">고용하기 전에는 아무것도 가져오지 않아요.</p></div>
        <div class="panel-bd">
          <div class="board-tools">
            <input class="input" type="search" id="find" autocomplete="off" />
            <div class="opts" role="radiogroup" id="filter"></div>
          </div>
          <div id="list"></div>
          <p class="board-note" id="note"></p>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="pop" id="pop" role="dialog"></div>

<script>
  /* ── i18n ────────────────────────────────────────────────────── */
  const TEXT = {
    ko: {
      ...WORDS.ko,
      title: "광장",
      sub: "회사 밖이에요. 이 컴퓨터의 Claude Code 세션이 구직자로 모여요.",
      count: (n) => "구직자 " + n + "명",
      quiet: "광장이 조용해요. 이 컴퓨터에서 Claude Code로 일하면 구직자가 찾아와요.",
      allAway: "구직자를 모두 보냈어요. 아래 명단에서 다시 부를 수 있어요.",
      listTitle: "구직자 명단", listSub: "고용하기 전에는 아무것도 가져오지 않아요.",
      cand: {
        free: "쉬는 중", busy: "작업 중", first: "첫 메시지", span: "기간", turns: "메시지", turnsN: (n) => n + "개", last: "마지막 활동",
        hire: "경력직으로 고용", busyWhy: "지금 터미널에서 쓰고 있는 세션이에요. 끝나면 고용할 수 있어요.", away: "광장에서 보내기",
        busyLine: "작업 중 · 끝나면 고용할 수 있어요",
        of: (f, first) => f + " 이력서 · “" + first + "”",
      },
      board: {
        search: "폴더나 첫 메시지로 찾기", all: "전체", hire: "경력직으로 고용", away: "보내기",
        meta: (c) => c.folder + " · " + c.span + " · 메시지 " + c.turns + "개",
        none: "찾는 구직자가 없어요.", allAway: "광장에 남은 구직자가 없어요.", sent: (n) => "보낸 구직자 " + n + "명", recall: "다시 부르기",
      },
      arrived: (name) => withParticle(name, "이", "가") + " 입사했어요",
      arrivedWith: (folder, n) => folder + " 세션에서 " + n + "개를 가져왔어요. 사무실에 책상이 생겼어요.",
      arrivedNew: "신입으로 들어왔어요. 사무실에 책상이 생겼어요.",
      arrivedGo: "직원 페이지 보기",
    },
    en: {
      ...WORDS.en,
      title: "Plaza",
      sub: "Outside the company. Claude Code sessions on this computer gather here as candidates.",
      count: (n) => n + (n === 1 ? " candidate" : " candidates"),
      quiet: "The plaza is quiet. Work with Claude Code on this computer and candidates turn up.",
      allAway: "Everyone was sent away. The list below can call them back.",
      listTitle: "Candidates", listSub: "Nothing is brought in until you hire.",
      cand: {
        free: "Free", busy: "In use", first: "First message", span: "Dates", turns: "Messages", turnsN: (n) => String(n), last: "Last active",
        hire: "Hire with experience", busyWhy: "This session is in use in a terminal. It can be hired once it is done.", away: "Send away",
        busyLine: "In use · can be hired once it is done",
        of: (f, first) => "Résumé of " + f + " · “" + first + "”",
      },
      board: {
        search: "Find by folder or first message", all: "All", hire: "Hire with experience", away: "Send away",
        meta: (c) => c.folder + " · " + c.span + " · " + c.turns + " messages",
        none: "No candidate matches.", allAway: "Nobody is left in the plaza.", sent: (n) => n + " sent away", recall: "Call them back",
      },
      arrived: (name) => name + " joined",
      arrivedWith: (folder, n) => "They brought " + n + " from a " + folder + " session, and have a desk in the office.",
      arrivedNew: "They joined new, and have a desk in the office.",
      arrivedGo: "See their page",
    },
  };

  const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "ko";
  const t = () => TEXT[lang];
  const tx = (v) => (v && typeof v === "object" ? v[lang] : v);
  const dig = (o, k) => k.split(".").reduce((a, x) => a?.[x], o);
  for (const el of document.querySelectorAll("[data-t]")) {
    const v = dig(t(), el.dataset.t);
    if (typeof v === "string") el.textContent = v;
  }
  document.getElementById("headSub").textContent = t().sub;
  mountRoster(document.getElementById("members"), (p) => { location.href = "employees.html" + (lang === "en" ? "?lang=en" : "") + "#" + p.id; });

  /* ── the scene ───────────────────────────────────────────────── */
  // The office's front wall with its door, the paving where candidates stand
  // in two lines, most recently active first, and the grass beyond.
  const S = 3, T = 48, W = 18, H = 6;
  const LINES = [2, 4];
  const SPACING = 3;
  const canvas = document.getElementById("plazaCanvas");
  const ctx = canvas.getContext("2d");
  const overlay = document.getElementById("plazaOverlay");
  const hired = new Set();
  const sentAway = new Set();
  const waiting = () => CANDIDATES.filter((c) => !hired.has(c.id) && !sentAway.has(c.id));
  const SLOTS = LINES.flatMap((row) => Array.from({ length: Math.floor((W - 2) / SPACING) + 1 }, (_, i) => ({ x: 1 + i * SPACING, row }))).filter((s) => s.x <= W - 2);

  function drawAvatar(el, species) {
    const c = el.getContext("2d");
    c.clearRect(0, 0, el.width, el.height);
    c.imageSmoothingEnabled = false;
    const sp = SPECIES.get(species);
    const scale = Math.max(1, Math.floor(el.width / 16));
    const pad = Math.floor((el.width - 16 * scale) / 2);
    paint(c, sp.sprite, scale, pad, pad, skin(sp));
  }

  function drawScene() {
    const door = Math.floor(W / 2);
    canvas.width = W * T;
    canvas.height = H * T;
    ctx.imageSmoothingEnabled = false;
    overlay.innerHTML = "";
    for (let x = 0; x < W; x++) {
      paint(ctx, TILES[x === door ? "door" : x % 4 === 1 ? "facadeWindow" : "facade"], S, x * T, 0);
      for (let y = 1; y < H - 1; y++) paint(ctx, TILES.pave, S, x * T, y * T);
      paint(ctx, TILES[x === 0 || x === W - 1 ? "tree" : "grass"], S, x * T, (H - 1) * T);
    }
    paint(ctx, TILES.lamp, S, 0, T);
    paint(ctx, TILES.lamp, S, (W - 1) * T, T);
    paint(ctx, TILES.bench, S, (door + 2) * T, T);

    const list = waiting();
    document.getElementById("headCount").textContent = t().count(list.length);
    const quiet = document.getElementById("plazaQuiet");
    quiet.textContent = sentAway.size ? t().allAway : t().quiet;
    quiet.hidden = list.length > 0;
    // anyone past the two lines is still in the list below
    list.slice(0, SLOTS.length).forEach((c, i) => {
      const { x, row } = SLOTS[i], sp = SPECIES.get(c.species);
      paint(ctx, sp.sprite, S, x * T, row * T, skin(sp));
      standing(c, x, row);
    });
  }

  function standing(c, x, row) {
    const btn = document.createElement("button");
    btn.className = "desk";
    btn.type = "button";
    btn.dataset.cand = c.id;
    btn.style.left = x * T - 4 + "px";
    btn.style.top = row * T - 4 + "px";
    btn.style.width = T + 8 + "px";
    btn.style.height = T + 8 + "px";
    btn.setAttribute("aria-label", t().cand.of(folderName(c.folder), tx(c.first)));
    btn.setAttribute("aria-haspopup", "dialog");
    btn.setAttribute("aria-expanded", "false");
    btn.title = tx(c.first) + " · " + tx(c.span);
    btn.addEventListener("click", (e) => openCandidate(c, btn, e.detail === 0));
    overlay.append(btn);

    const tag = document.createElement("span");
    tag.className = "tag";
    tag.style.left = x * T + T / 2 + "px";
    tag.style.top = (row + 1) * T + 4 + "px";
    tag.textContent = folderName(c.folder);
    overlay.append(tag);
    if (!c.live) return;
    const bub = document.createElement("span");
    bub.className = "bub";
    bub.style.left = x * T + T / 2 + "px";
    bub.style.top = row * T - 30 + "px";
    bub.innerHTML = '<span class="dot working"></span>' + t().cand.busy;
    overlay.append(bub);
  }

  /* ── the résumé ──────────────────────────────────────────────── */
  const ICON = {
    plus: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg>',
    away: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3.5l4.5 4.5-4.5 4.5M14 8H4.5"/></svg>',
  };
  const pop = document.getElementById("pop");
  let anchor = null;

  function openCandidate(c, el, viaKey) {
    if (anchor === el && pop.hasAttribute("data-open")) return close();
    close();
    el.setAttribute("aria-expanded", "true");
    const state = c.live ? "working" : "available";
    pop.innerHTML = `
      <div class="p-hd">
        <span class="p-av"><canvas aria-hidden="true" width="32" height="32"></canvas></span>
        <span style="flex:1;min-width:0">
          <span class="p-name">${folderName(c.folder)}</span>
          <span class="p-role" title="${c.folder}">${c.folder}</span>
        </span>
        <span class="chip ${state}"><span class="dot ${state}"></span>${c.live ? t().cand.busy : t().cand.free}</span>
      </div>
      <div class="p-rule"></div>
      <div class="p-state">
        <span class="c-k">${t().cand.first}</span>
        <span class="p-quote">“${tx(c.first)}”</span>
        <span class="p-kv"><span>${t().cand.span}</span><b>${tx(c.span)}</b></span>
        <span class="p-kv"><span>${t().cand.turns}</span><b>${t().cand.turnsN(c.turns)}</b></span>
        <span class="p-kv"><span>${t().cand.last}</span><b>${tx(c.last)}</b></span>
      </div>
      <div class="p-rule"></div>
      <div class="p-acts">
        <button class="mrow mrow-key" type="button" data-hire${c.live ? " disabled" : ""}>${ICON.plus}${t().cand.hire}</button>
        ${c.live ? `<p class="p-why">${t().cand.busyWhy}</p>` : ""}
        <button class="mrow" type="button" data-away>${ICON.away}${t().cand.away}</button>
      </div>`;
    pop.setAttribute("aria-label", t().cand.of(folderName(c.folder), tx(c.first)));
    drawAvatar(pop.querySelector("canvas"), c.species);
    pop.querySelector("[data-hire]").addEventListener("click", () => {
      close();
      hire(c);
    });
    pop.querySelector("[data-away]").addEventListener("click", () => {
      close();
      sendAway(c.id);
    });
    anchor = el;
    pop.setAttribute("data-open", "");
    place(el);
    if (viaKey) pop.querySelector(".mrow:not(:disabled)")?.focus({ preventScroll: true });
  }

  function place(el) {
    const r = el.getBoundingClientRect();
    const w = pop.offsetWidth, h = pop.offsetHeight, gap = 8, edge = 12;
    let left = r.right + gap;
    if (left + w > innerWidth - edge) left = r.left - w - gap;
    if (left < edge) left = Math.min(Math.max(edge, r.left), innerWidth - w - edge);
    pop.style.left = Math.round(left) + "px";
    pop.style.top = Math.round(Math.max(edge, Math.min(r.top, innerHeight - h - edge))) + "px";
  }

  function close() {
    pop.removeAttribute("data-open");
    document.querySelectorAll("[data-cand]").forEach((n) => n.setAttribute("aria-expanded", "false"));
    anchor = null;
  }

  document.addEventListener("pointerdown", (e) => {
    if (!anchor || pop.contains(e.target) || anchor.contains(e.target)) return;
    if (!e.target.closest("[data-cand]")) close();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || !anchor) return;
    const back = anchor;
    close();
    back.focus({ preventScroll: true });
  });
  addEventListener("resize", () => { if (anchor) place(anchor); });
  addEventListener("scroll", () => { if (anchor) place(anchor); }, true);

  /* ── the list ────────────────────────────────────────────────── */
  let filter = "all";
  const find = document.getElementById("find");
  find.placeholder = t().board.search;
  find.setAttribute("aria-label", t().board.search);
  find.addEventListener("input", () => fill());

  function fill() {
    const b = t().board;
    const all = waiting();
    const q = find.value.trim().toLowerCase();
    const counts = { all: all.length, free: all.filter((c) => !c.live).length, busy: all.filter((c) => c.live).length };
    const box = document.getElementById("filter");
    box.setAttribute("aria-label", b.all);
    box.innerHTML = ["all", "free", "busy"]
      .map((k) => `<button class="opt" type="button" role="radio" data-f="${k}" aria-checked="${filter === k}">${k === "all" ? b.all : t().cand[k]} ${counts[k]}</button>`)
      .join("");
    box.querySelectorAll("[data-f]").forEach((x) => x.addEventListener("click", () => ((filter = x.dataset.f), fill())));
    const shown = all
      .filter((c) => filter === "all" || (filter === "busy") === Boolean(c.live))
      .filter((c) => !q || c.folder.toLowerCase().includes(q) || tx(c.first).toLowerCase().includes(q));
    const list = document.getElementById("list");
    list.innerHTML = shown.length
      ? shown
          .map(
            (c) => `<div class="board-row"><canvas aria-hidden="true" width="36" height="36" data-av="${c.species}"></canvas>
              <span class="board-tx"><b>${tx(c.first)}</b><span>${c.live ? t().cand.busyLine + " · " : ""}${b.meta({ folder: c.folder, span: tx(c.span), turns: c.turns })}</span></span>
              <span class="board-acts"><button class="ibtn ibtn-sm" type="button" data-away="${c.id}" aria-label="${b.away}" title="${b.away}">${ICON.away}</button>
              <button class="btn btn-secondary btn-sm" type="button" data-hire="${c.id}"${c.live ? " disabled" : ""}>${b.hire}</button></span></div>`,
          )
          .join("")
      : `<p class="hint">${all.length === 0 ? b.allAway : b.none}</p>`;
    list.querySelectorAll("[data-av]").forEach((cv) => drawAvatar(cv, cv.dataset.av));
    list.querySelectorAll("[data-hire]").forEach((x) => x.addEventListener("click", () => hire(CANDIDATES.find((c) => c.id === x.dataset.hire))));
    list.querySelectorAll("[data-away]").forEach((x) => x.addEventListener("click", () => sendAway(x.dataset.away)));
    const note = document.getElementById("note");
    note.innerHTML = sentAway.size ? `${b.sent(sentAway.size)} · <button class="btn btn-ghost btn-sm" type="button" data-recall>${b.recall}</button>` : "";
    note.querySelector("[data-recall]")?.addEventListener("click", () => {
      sentAway.clear();
      render();
    });
  }

  function sendAway(id) {
    sentAway.add(id);
    render();
  }

  /* ── hiring ──────────────────────────────────────────────────── */
  // The candidate walks in: the hire dialog opens with their look and their
  // session, straight at summing it up. Only the session brought is used up.
  function hire(from) {
    openHire({
      from,
      career: (done, session) => openCareer(done, session, hired),
      onSave: ({ career: brought, ...h }) => {
        if (!brought || brought.session === from.id) hired.add(from.id);
        if (brought) hired.add(brought.session);
        STAFF.push({
          ...h, id: "p" + (STAFF.length + 1), status: "available", done: 0, reviews: 0, joined: "2026. 9. 26.",
          memories: brought?.memories ?? [], style: brought?.style ?? [],
        });
        mountRoster(document.getElementById("members"), () => undefined);
        document.getElementById("arrivedTitle").textContent = t().arrived(h.name);
        document.getElementById("arrivedBody").textContent = brought ? t().arrivedWith(brought.project, brought.memories.length + brought.style.length) : t().arrivedNew;
        const go = document.getElementById("arrivedGo");
        go.textContent = t().arrivedGo;
        go.href = "employees.html" + (lang === "en" ? "?lang=en" : "");
        document.getElementById("arrived").hidden = false;
        render();
      },
    });
  }

  function render() {
    drawScene();
    fill();
  }
  render();
</script>
